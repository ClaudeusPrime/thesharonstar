 This promise wasn’t just for the distant future, but for the present. Jesus was inviting Martha—and all of us—to trust in His power right now. Too often, like Martha, we tend to place God’s promises in the future, believing in His ultimate victory while doubting His power in the present. Yet, the same Christ who will one day wipe away every tear is here with us now, offering life and hope even in our current struggles. “Then Jesus, again groaning in Himself, came to the tomb. It was a cave, and a stone lay against it. Jesus said, ‘Take away the stone.’ Martha, the sister of him who was dead, said to Him, ‘Lord, by this time there is a stench, for he has been dead four days.’ Jesus said to her, ‘Did I not say to you that if you would believe you would see the glory of God?’ Then they took away the stone from the place where the dead man was lying. And Jesus lifted up His eyes and said, ‘Father, I thank You that You have heard Me. And I know that You always hear Me, but because of the people who are standing by I said this, that they may believe that You sent Me.’Now when He had said these things, He cried with a loud voice, ‘Lazarus, come forth!’ And he who had died came out bound hand and foot with graveclothes, and his face was wrapped with a cloth. Jesus said to them, ‘Loose him, and let him go’” (John 11:38-44, NKJV). When Jesus spoke to Martha, saying, “Did I not tell you that if you believed, you would see the glory of God?” He boldly declared His identity and authority. He wasn’t just a teacher or prophet— He was the very source of life. His words invite us to have faith that goes beyond our circumstances, a faith that sees past death to the power of His resurrection We should ask ourselves: When God speaks, will I believe? Do I truly trust that God can transform my life, even with all my weaknesses and failures? Many of us hear God’s call but dismiss it due to doubts or busyness. In our daily lives, even with all the good things we do, it’s easy to get caught up in a whirlwind of activities that distract us from truly hearing and believing God’s voice. The Christian life isn’t meant to be just a routine without divine power. When we recognize this and seek to align with God’s will, we open ourselves up to be transformed. Martha’s encounter with Jesus challenges us to reflect on our own faith. Do we really believe that Jesus is the resurrection and the life? Do we trust Him to bring life out of death, hope out of despair, and light out of darkness? These are not just theological ideas—they are the heart of our faith. They call us to trust Jesus more deeply, the One who holds authority over both life and death. To truly embrace and believe in the words of Jesus, we need to invite Him to cleanse our hearts. Just as He cleansed the temple in Jerusalem, driving out those who had turned His Father’s house into a marketplace, He declared, “My house shall be called a house of prayer, but you have made it a den of thieves” (Matthew 21:12-13, NKJV). In the same way, we need to ask Jesus to remove all distractions from our lives—anything that prevents us from fully trusting in Him. This cleansing is not a one-time event but a continual process of repentance and renewal. Has God been speaking to you, but you’ve been pushing Him away with busyness and doubt? Our walk lacks spiritual authority until we say, “Lord God, I believe. I won’t drown out Your voice or the Holy Spirit with worldly distractions. I will trust You to guide my steps every day. Thank You, Holy Spirit, for interceding for me. Bring me in line with God’s will. Not my will, but Yours be done, Lord Jesus!” When we allow Jesus to cleanse our hearts, our testimony becomes a living proof of a real, living God, and we can’t help but share with others the incredible things He has done for us. All things are possible—not just in the future, but right here, right now. The love of Jesus is not a passive sentiment. It’s a love that enters

into our suffering, carries our burdens, and transforms us. This love is most clearly displayed in the tears of Jesus at Lazarus’s tomb. His tears show His deep compassion and His love for us. This love moves Him to heal the sick, feed the hungry, and raise the dead. It is the same love that drove Him to the cross, where He took on our sins. It’s the love that conquered death and brought new life. We are called to live with the hope and certainty of what the resurrection of Jesus brings. We are to live with the assurance that His power is working in our lives, bringing new life. Our mission is to bring hope and healing to those around us, sharing the love and compassion of Jesus with a hurting world. This is the calling of the church—to be a living testimony to the resurrection power of Jesus Christ. The resurrection of Jesus points us to the ultimate hope of glory. It reminds us that death is not the end, but a passage to a new and glorious life. The hope of glory is a key theme in the New Testament. It is the hope that we will one day be fully united with Christ. This hope gives us the strength to endure life’s trials, knowing that our present suffering is nothing compared to the glory that will be revealed in us. “For I consider that the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us. For the earnest expectation of the creation eagerly waits for the revealing of the sons of God. For the creation was subjected to futility, not willingly, but because of Him who subjected it in hope; because the creation itself also will be delivered from the bondage of corruption into the glorious liberty of the children of God” (Romans 8:18, ESV). This also means that we are called to trust in God’s promises and live in obedience to His will. We are to “...seek first the kingdom of God and His righteousness, and all these things shall be added to you” (Matthew 6:33, NKJV). Faithfulness is not only about believing the right things but also about living in a way that reflects Christ within us. It involves being faithful in our relationships, our work, and our service to others. It means being people of integrity who live out our faith in every area of life and who love our neighbors as ourselves. The Holy Spirit plays a vital role in helping us live lives of faithfulness. He is the one who guides us in truth and transforms us into the image of Christ. The Holy Spirit is the presence of Jesus within us, and He intercedes for us, praying when we do not know how to pray. He is our helper, comforter, and advocate. This is not something we do on our own. We are called to walk alongside other believers. The church is the body of Christ, and we are each members of that body. We need one another for support, encouragement, and accountability. The church is crucial to our spiritual growth. It is through the church that we learn to love and serve one another, bear each other’s burdens, and deepen our faith. The church is where we experience the love and grace of God in practical ways. The church is also meant to be a witness to the resurrection power of Jesus Christ. This means we are to share the good news of Jesus’ death and resurrection, make disciples of all nations, and teach them to follow everything He has commanded us (Matthew 28:19-20). The resurrection of Jesus points us to the hope of the new creation. It is the promise that one day, God will make all things new. There will be a new heaven and a new earth, where there will be no more death or mourning or crying or pain. “Now I saw a new heaven and a new earth, for the first heaven and the first earth had passed away. Also there was no more sea. Then I, John, saw the holy city, New Jerusalem, coming down out of heaven from God, prepared as a bride adorned for her husband. And I heard a loud voice from heaven saying, “Behold, the tabernacle of God is with men, and He will dwell with them, and they shall be His people. God Himself will be with them and be their God. And God will wipe away every tear from their eyes; there shall be no more death, nor sorrow, nor crying. There shall be no more pain, for the former things have passed away” (Revelation 21:1-4, NKJV). The tears of Jesus at Lazarus’s tomb invite us to trust in His love for us and His promise to us. They offer an invitation to experience the transformation that comes from truly having a relationship with Him. The raising of Lazarus and the resurrection of Jesus were both powerful miracles, but they are not the same. When Jesus called Lazarus out of the tomb, Lazarus came back to life in his same physical body. He was still a mortal man who would one day die again. This was a temporary return to life—a sign of Jesus’ authority over death. But when Jesus rose from the dead, it was entirely different. His resurrection was permanent and victorious. He rose with a glorified body (Luke 24:6), never to die again (Romans 6:9). His resurrection broke the power of death and opened the door to eternal life for all who believe (1 Corinthians 15:20). Lazarus came back to this life, but Jesus rose into a new kind of life that will never end. “Lazarus, come forth” (John 11:43, ESV). These words, spoken so long ago, still resonate today, reaching beyond the tomb to speak to our hearts. Perhaps you feel overwhelmed by sin, shame, or spiritual emptiness, as though life has passed you by. But Jesus is still calling, still offering hope to what seems hopeless. He beckons you out of the darkness, offering the chance for a fresh beginning and a new life in Him. No matter how lost you may feel, it’s never too late to hear God’s call and start anew. In Christ, there is always the hope of transformation. As we reflect on this, let us be encouraged to believe in the power of Jesus. Let us open our hearts to His love and grace, allowing Him to cleanse and renew us. Let us be a people of faith, hope, and love, sharing the good news of Jesus with a world in need. Let us live in the promise of the resurrection, knowing that with God, all things are possible and the gift of eternal life is for us. He’s calling you today. Don’t stay buried in the tomb—step into life.

 Watch Therefore and Pray Markus Hansen “And as it was in the days of Noah, so it will be also in the days of the Son of Man: They ate, they drank, they married wives, they were given in marriage, until the day that Noah entered the ark, and the flood came and destroyed them all. Likewise as it was also in the days of Lot: They ate, they drank, they bought, they sold, they planted, they built; but on the day that Lot went out of Sodom it rained fire and brimstone from heaven and destroyed them all. Even so will it be in the day when the Son of Man is revealed” (Luke 17:26-30). This is what we witness today. We, along with our neighbours, are doing all the activities listed in this scripture. Is our focus on acquiring more possessions to keep up with our neighbours? Are we heavily involved in social causes and politics leaving little time to watch and pray? Are we anxiously waiting for the kingdom of God to come? Well, wait no longer, for Jesus said, “The kingdom of God does not come with observation; nor will they say, ‘See here!’or ‘See there!’For indeed, the kingdom of God is within you” (Luke 17:20-21). If the kingdom of God is within you and me, then it is in the body of Christ, the church. There is no future in any human political government or man-derived religious sectarian organization. The one and only hope for this dying world is the kingdom of God being established here on this earth! Consider a chicken egg. It is hidden from view for 21 days until a little chick appears. During this period, all vital organs are formed. Until it hatches, it is encased in the yolk surrounded by a white fluid called the albumen and further protected by the eggshell. In a sense, the egg is a type, a shadow of God’s church today. We are hidden from the world at large. Very few people know we exist. But while hidden, God is in the process of changing us into the likeness of Jesus. The eggshell, though hard, is porous, allowing oxygen and undesirable microorganisms to enter and toxins to exit. The albumen is designed specifically to keep microbes from destroying the yolk. Likewise, God’s church is covered and protected from the onslaughts of the enemy by fathers and mothers of the home and local and universal elders and deacons. During the embryonic period, from five weeks until a chick hatches, the fetus continues to develop, gaining weight and preparing for life outside its shell. This is where we are as God’s chosen people in this present hour. During this period of being hidden away from the world at large we are being changed into the likeness of Christ. “This is the covenant that I will make with them after those days, says the Lord: I will put My laws into their hearts, and in their minds I will write them” (Hebrews 10:16). Saints of God, there is a process of regeneration that is taking place in our lives as we yield to the will of the Holy Spirit. “But when the kindness and the love of God our Saviour toward man appeared, not by works of righteousness which we have done, but according to His mercy He saved us, through the washing of regeneration and renewing of the Holy Spirit” (Titus 3:4-5). When we conduct our lives in accordance with the teaching of Jesus and the revelation of this present move of the Holy Spirit, we are being changed into the likeness of Christ. “For if we have been united together in the likeness of His death, certainly we also shall be in the likeness of His resurrection” (Romans 6:5-6). “Behold what manner of love the Father has bestowed on us, that we should be called children of God! Therefore the world does not know us, because it did not know Him. Beloved, now we are children of God; and it has not yet been revealed what we shall be, but we know that when He is revealed, we shall be like Him, for we shall see Him as He is. And everyone who has this hope in Him purifies himself, just as He is pure” (1 John 3:1-3). Glory to God, hallelujah. The fully functioning, visible government of the kingdom of God is yet to come here on this earth. It will come into existence when Jesus returns. (Daniel 7,13-14,18, 27). Until Christ returns, let us continue to watch and pray allowing the Holy Spirit to remould us into the image and likeness of God’s Son, Jesus Christ.`, subtitle: 'Watch Therefore and Pray: Markus Hansen', author: 'DJ Olson', year: 2025, month: 'April/May', volume: 'Vol. LXXVIII, No. 04', title: 'The Tears and the Tomb', topics: ['Scripture','Salvation','Holy Spirit'], excerpt: "DJ Olson meditates on Jesus wept at the tomb of Lazarus, exploring the full humanity and divinity of Christ, the faith of Martha and Mary, and the call to believe in resurrection power today. Markus Hansen contributes Watch Therefore and Pray, comparing the church to an egg hidden from the world, being transformed by the Holy Spirit into the likeness of Christ until His return.", pdf: '04%20-%20Sharon%20Star%20-%20April-May%202025.pdf', fileName: '04_-_Sharon_Star_-_April_May_2025.pdf'  },
  { id: 5, articleText: `Volume LXXVIII | Issue 05 | June 2025 Faith is the foundation and root of Christianity. Salvation by faith alone in the complete work of Christ apart from any works of man is the truth that separates Christianity from all other religions which either all or in part depend on man’s human effort to make himself good. There is no phase of our Christian experience in which faith is not the critical component. In the way of introduction, following are a few scriptures that bear out this truth: “But without faith it is impossible to please Him (God), for he who comes to God must believe that He is, and that He is a rewarder of those who diligently seek Him” (Hebrews 11:6, NKJV). “But he who doubts is condemned if he eats, because he does not eat from faith; for whatever is not from faith is sin” (Romans 14:23, NKJV). “Now the just shall live by faith; but if anyone draws back, My soul has no pleasure in him” (Hebrews 10:38, NKJV). “I have been crucified with Christ; it is no longer I who live, but Christ lives in me; and the life which I now live in the flesh I live by faith in the Son of God, who loved me and gave Himself for me” (Galatians 2:20, NKJV). “For we walk by faith, not by sight” (2 Corinthians 5:7, NKJV). What is faith? Hebrews 11:1 gives us a definition of faith, and I would like to quote it from the Amplified Bible: “Now faith is the assurance (title deed, confirmation) of things hoped for (divinely guaranteed), and the evidence of things not seen [the conviction of their reality—faith comprehends as fact what cannot be experienced by the physical senses].” Faith is the divine guarantee from God that the things we hope for but which have not become reality are as real for us today as if they had already taken place. Faith also provides us with the ability to understand things in the spiritual realm which we cannot experience with our physical senses. The Greek word for faith is pistis which means to be persuaded, come to trust. For the believer, faith is God’s divine persuasion and therefore is different from human belief. Faith is always

received from God and is never generated through self-will. It cannot be worked up by our human effort. God has not created within our human natures the faith to believe for salvation (or any other spiritual truth for that matter). It is God’s gift to us which persuades us to believe in Christ for salvation. See Ephesians 2:8-9, “For by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, lest anyone should boast” (NKJV). “But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith, meekness, temperance: against such there is no law” (Galatians 5:22-23, NKJV). Faith, along with the other graces listed in this scripture, does not come from our own natural efforts to generate it but is developed in us by the work of the Holy Spirit. The Apostle Paul testified to God’s persuasion of him to believe in Romans 8:38-39, “For I am persuaded that neither death nor life, nor angels nor principalities nor powers, nor things present nor things to come, nor height nor depth, nor any other created thing, shall be able to separate us from the love of God which is in Christ Jesus our Lord” (NKJV). Paul is saying that God persuaded him, or imparted faith into his heart, to believe that nothing that one could imagine could ever separate him from God’s love for him which is in Christ Jesus. That truth became faith to him. Faith and human belief are really two different things although biblically they are sometimes used interchangeably in the Bible. Faith always precedes human belief. God births faith into our hearts, and our response is to believe. The word for “believes” is pisteuo (Gk) which is a combination of the word pistis (Gk) (faith) and peitho (Gk) which means to persuade oneself (believe) and which finally means faith-believing (from Strongs). It is like this, God gifts us with a measure of faith as we hear the word of God. As we intently meditate on the word and, so to speak, eat it, we become persuaded of the truth of it and the power in it. In other words, we believe it. I like the way Galatians 3:5 is stated in the Amplified Bible, ”So then, does He who supplies you with His [marvelous Holy] Spirit and works miracles among you, do it as a result of the works of the Law [which you perform], or because you [believe confidently in the message which you] heard with faith?” The following scripture is such a good companion for the one above, “So then faith comes by hearing, and the ear to hear by the word of God. (Romans 10:17, Jubilee). The faith necessary to believe comes by hearing the word of God as it is preached to us and as we read it from the Bible. And miraculously, the word of God itself provides us with the “spiritual ears” to hear it in such a way that it imparts faith to our hearts.As we meditate on that word, our belief in it becomes stronger and stronger. The faith that God gifts to us is firm and never wavers. It is our belief that is sometimes strong and sometimes weak. That is why it is so important for us to meditate on the truth that God speaks into our hearts through His word. “ Every good gift and every perfect gift is from above, and comes down from the Father of lights, with whom there is no variation or shadow of turning” (James 1:17, NKJV). Faith and God’s will are connected in Scripture. “And be not conformed to this world: but be ye transformed by the renewing of your mind, that you may prove what is that good, and acceptable, and perfect, will of God. For I say, through the grace given unto me, to every man that is among you, not to think of himself more highly than he ought to think; but to think soberly, according as God hath dealt to every man the measure of faith” (Romans 12:2-3, NKJV). We can and should pursue faith. “For the love of money is a root of all kinds of evil, for which some have strayed from the faith in their greediness and pierced themselves through with many sorrows. But you, O man of God, flee these things and pursue righteousness, godliness, faith, love, patience, gentleness. (1 Timothy 6:10-11, NKJV). Flee also youthful lusts; but pursue righteousness, faith, love, peace with those who call on the Lord out of a pure heart (2 Timothy 2:22, NKJV). God’s gift of faith is critically important in our coming to Christ. “ No one can come to Me unless the Father who sent Me draws him (or divinely persuades him, imparts to him the faith to believe); and I will raise him up at the last day” (John 6:44, NKJV). “For God so loved the world that He gave His only begotten Son, that whoever believes in Him should not perish but have everlasting life” (John 3:16, NKJV). The very basis of our justification before God comes through faith. “For all have sinned and fall short of the glory of God, being justified freely by His grace through the redemption that is in Christ Jesus. Therefore, we conclude that a man is justified by faith apart from the deeds of the law” (Romans 3:23-34, 28, NKJV). “Knowing that a man is not justified by the works of the law but by faith in Jesus Christ, even we have believed in Christ Jesus, that we might be justified by faith in Christ and not by the works of the law; for by the works of the law no flesh shall be justified” (Galatians 2:16, NKJV). Our sanctification which is our being transformed into the likeness of Jesus is also accomplished through faith in Christ. “O foolish Galatians! Who has bewitched you that you should not obey the truth, before whose eyes Jesus Christ was clearly portrayed among you as crucified? This only I want to learn from you: Did you receive the Spirit by the works of the law, or by the hearing of faith? Are you so foolish? Having begun in the Spirit, are you now being made perfect by the flesh” (Galatians 3:1-3, NKJV)? The process of our sanctification is often referred to as a walk, and we are instructed to walk by faith. “For we walk by faith, not by sight” (2 Corinthians 5:7, NKJV). In Galatians 2:20, the Apostle Paul makes this reassuring statement regarding his sanctification, “I am crucified with Christ, nevertheless I live, yet not I but Christ liveth in me, and the life I now live in the flesh, I live by the faith of the Son of God who loved me and gave himself for me” (KJV). Paul states that the faith that he lives by is actually the faith of Christ, the Son of God, Who indwells him in the Person of the Holy Spirit. It seems that we can conclude that the faith with which God gifts us comes by virtue of the very life of Christ that lives within us. We have heard many times that our faith is not in our faith but in the object and source of our faith, Jesus Christ. Our natural faith may sometimes feel strong and at other times seem very weak, but the faith of Christ who lives within us is always perfectly strong and

unfailing because His life within is always strong and unfailing. In a recent Global Missions podcast, Bro. Terry Zimmer reminded us that when we gave our heart to Jesus, He came in His fullness and His completeness. We did not receive a partial Jesus but the perfect, all-powerful and complete Jesus in the Person of His Holy Spirit and the One whose resources are inexhaustible for any challenge we may face. Watchman Nee, the Chinese theologian has stated, and I paraphrase, that it is not enough for us to just have this Life within us; there must be a demand or call upon this Life or it will not be manifested. The word manifest means to make clear or evident, show plainly. For our faith to be clear, evident and shown plainly, there must be a demand put upon it. In John 16:33, Jesus said, “These things I have spoken to you, that in Me you may have peace. In the world you will have tribulation; but be of good cheer, I have overcome the world” (NKJV). The following comes from Strong’s Lexicon 2347, “The term “thlipsis” (Gk - tribulation) is used in the New Testament to describe a state of severe distress or suffering, often due to external pressures or persecution. It conveys the idea of being under intense pressure or in a state of affliction, whether physical, emotional, or spiritual. In a biblical context, it often refers to the trials and hardships faced by believers as a result of their faith.” The life of Christ within us is able to meet every demand to which it is subjected, and without such demand, the totally sufficient power of the Lord in us might never be expressed through us. Jesus tells us even in the face of tribulation to be of good cheer because He has overcome everything the world and the prince of this world can throw at us. In James 1:2-6, we read, “My brethren, count it all joy when you fall into various trials, knowing that the testing of your faith produces patience. But let patience have its perfect work, that you may be perfect and complete, lacking nothing. If any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach, and it will be given to him. But let him ask in faith, with no doubting, for he who doubts is like a wave of the sea driven and tossed by the wind” (NKJV). During our walk of faith, the demands on the Christ-life within us will continuously increase. Jesus told us in His Sermon on the Mount as recorded in Matthew 7:13-14, (NKJV), “Enter by the narrow gate; for wide is the gate and broad is the way that leads to destruction, and there are many who go in by it. Because narrow is the gate and difficult is the way which leads to life, and there are few who find it.” The power of the Christ-life within us will always exceed the demand made upon it. However, it is too often the self-life that becomes an obstruction to the release of the Christ-life within. It is not just our mean self-life but also our so-called religious self-life, our attempts to be and do good in our natural strength and self-determination. Remember, “Blessed are the poor in spirit for theirs is the kingdom of heaven” (Matthew 5:3, NKJV). There may also be specific hindrances which obstruct the release of the Christ-life such as self-will, disobedience, thinking more highly of ourselves than we ought to think, etc. Surely we must confess and repent of these things, and this is what the cross of Christ is for. “For if we have been united together in the likeness of His death, certainly we also shall be in the likeness of His resurrection, knowing this, that our old man was crucified with Him, that the body of sin might be done away with, that we should no longer be slaves of sin. For he who has died has been freed from sin” (Romans 6:5-7, NKJV). Continued in the next issue. The King James Version is referenced unless indicated otherwise. We, young or old, need to be constantly searching for God throughout every moment of every day. God has placed in each man and woman, each boy and girl, a desire to know who God is. Some search for the Creator of all things in what they see around them. Some look for a force more powerful, and more wise than themselves, and even search for a spirit. Some feel the answers

 can be found only in their own reasoning. There are probably thousands of religions that try to answer the question of how to know who God is. How can we TRULY find Him the ONE, TRUE GOD? Jeremiah 29:13, “And ye shall seek me, and find me, when ye shall search for me with all your heart.” Are there any requirements for this? Hebrews 11:6, “But without faith it is impossible to please him: for he that cometh to God must believe that he is, and that he is a rewarder of them that diligently seek him.” The first requirement is that you and I must believe there is a God. Then we must search diligently for Him. Diligent means to make a steady, earnest, and energetic effort. One of the best cold case detectives, was originally an atheist. When he studied Jesus’ death and resurrection and everything written about Him in the Bible and history, he concluded that Jesus must be real and became a Christian. The whole creation actually speaks of God because He made it. Romans 1:20, “For the invisible things of Him from the creation of the world are clearly seen, being understood by the things that are made, even His eternal power and Godhead; so that they are without excuse:” The second requirement is John 4:24, “God is a Spirit: and they that worship Him must worship Him in spirit and in truth.” We must let the Holy Spirit guide us into all truth. This is a continual process, a little bit at a time. The third requirement is to recognize the living God through his Son Jesus. John 1:14, “And the Word was made flesh, and dwelt among us, (and we beheld His glory, the glory as of the only begotten of the Father,) full of grace and truth.” How do we search to actually find God? There are many ways, but here are a few. Read, study, and memorize the Bible, letting the Holy Spirit reveal its true meaning, intentions and applications to our real, everyday life. The Bible is also often referred to as the Scriptures, the Word, etc. In summary, it is the written Word of God. There is also the created Word of God which is basically all of creation. There is also the living Word of God which is Jesus. John 5:39 says, “Search the scriptures; for in them ye think you have eternal life: and they are they which testify of Me.” Another way of searching is recognizing our need for others who are Holy Spiritfilled and realizing they also need us. John 13:34 says, “A new commandment I give unto you, That ye love one another; as I have loved you, that ye also love one another.” 1 Corinthians 12:12, “For as the body is one, and hath many members, and all the members of that one body, being many, are one body: so also is Christ.” 1 Corinthians 12:27, “Now ye are the body of Christ, and members in particular.” Our need for one another cannot be stressed enough. Hebrews 10:25 says, “Not forsaking the assembling of ourselves together, as the manner of some is; but exhorting one another: and so much the more, as ye see the day approaching.” Another way of searching is talking to and listening to the Living God. It is done through prayer. Jesus taught us how to pray in Matthew 6:9-15. We can talk to Him about anything. We can tell Him how much we love, and adore Him. We can confess our sins and ask Him to forgive us and help us change. We can thank Him for as many things as possible including the hard things in life. We can ask Him to help us have a good attitude. In conclusion, Matthew 7:7 says, “Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you.”`, subtitle: 'Searching for God: Dan Levson', author: 'David Luff', year: 2025, month: 'June', volume: 'Vol. LXXVIII, No. 05', title: 'Faith and the Kingdom of God — Part One', topics: ['Scripture','Faith','Holy Spirit'], excerpt: "David Luff begins a two-part series on faith as the foundation of Christianity, examining faith as God's divine persuasion (pistis), the gift of the Holy Spirit, and how faith is received through hearing the Word. Dan Levson writes on Searching for God, outlining three requirements: believing God exists, worshipping in spirit and truth, and recognizing Jesus as the living Word through Scripture, community, and prayer.", pdf: '05%20-%20Sharon%20Star%20-%20June%202025.pdf', fileName: '05_-_Sharon_Star_-_June_2025.pdf'  },
  { id: 6, articleText: `Volume LXXVIII | Issue 06 | July 2025 Continued from the June 2025 issue In Matthew 13, Jesus described what the progression of the kingdom of heaven looks like from the outside looking in as it develops on the earth during this age. In almost every analogy describing what the kingdom was like, it was depicted as a mixture of good and evil; wheat and tares, leaven (type of sin) in a loaf, treasure in a field, good fish and bad fish, the wicked and the just. Is it not the same as the kingdom of heaven being developed in our lives? When we are born again we enter the kingdom of heaven. However, there is a difference in us being in the kingdom of heaven and the kingdom of heaven being in us. When we are born again the Holy Spirit comes to indwell us. Then there is a mixture of the Holy Spirit and our fleshly natures. It is by our submission to the work and leading of the Holy Spirit during our lifetimes that our flesh is put to death and the Holy Spirit gains full control. The power of the cross to deliver us from the bondage of sin is available for us every day. As is recorded in Romans 6:11, we are exhorted to “reckon ourselves to be dead unto sin but alive to God in Christ Jesus our Lord.” If we are to know and experience the power of His resurrection, we must also share in His sufferings (i.e. Philippians 3:10). This means having the same mind and attitude that was in Christ Jesus when he came into the world and as recorded in Philippians 2:5-8, (NKJV), “Let this mind be in you which was also in Christ Jesus, who, being in the form of God, did not consider it robbery to be equal with God, but made Himself of no reputation, taking the form of a bondservant, and coming in the likeness of men. And being found in appearance as a man, He humbled Himself and became obedient to the point of death, even the death of the cross.” If we want to experience the resurrection power of Christ in our lives and in the church, we must heed what John the Baptist said, “He must increase and I must decrease” (John 3:30, NKJV). It is not so much that we need more of Christ because we have Him in His fullness, but we do need less of self which inhibits the release of His Spirit within us. When Jesus began His public ministry, He announced, as is recorded in Matthew 4:17 (NKJV), “Repent, for the kingdom of heaven is at hand.” Many Christians are looking forward to a future kingdom with an environment as described in Isaiah 9:6-7, Isaiah 11:6-9 Isaiah 35:5-7, Amos9:13-14,andMicah4:2-4.Asimportantandwonderfulasthe environment of the kingdom will be, it cannot come into existence until the people of the kingdom come into being. “In my opinion whatever we may have to go through now is less than nothing compared with the magnificent future God has planned for us. The whole creation is on tiptoe to see the wonderful sight of the sons of God coming into their own. The world of creation cannot as yet see reality, not because it chooses to be blind, but because in God’s purpose it has been so limited—yet it has been given hope. And the hope is that in the end the whole of created life will be rescued from the tyranny of change and decay, and have its share in that magnificent liberty which can only belong to the children of God” (Romans 8:19-21, J.B. Phillips)! Immediately after announcing that we were at the threshold of

the kingdom of heaven, He gathered His disciples and preached the iconic Sermon on the Mount as recorded in Matthew 5-7. His opening statement was, “Blessed are the poor in spirit for theirs is the kingdom of heaven.” His emphasis was not on the environment of the kingdom but rather on the people of the kingdom and the character they would display. He said they would be poor in their own natural spirit, recognizing their own spiritual emptiness and their complete dependence upon God, relying totally by faith on His grace and mercy and the power of the Holy Spirit. The result would be that the kingdom of heaven would be theirs, not just to enter it but to inherit it. He then proceeded to more fully describe in this sermon the principles that would characterize this kingdom and even more importantly the character of the people who would compose the many-membered administrative body of the kingdom of heaven and what the Bible refers to as the overcomers. As one carefully reads this sermon, we see that Jesus not only reaffirms the commandments of the Mosaic law, but he extends its meaning to go beyond the overt acts directed in the law and expands (fills it up) to cover thoughts and motives as well (Note in Scofield Bible). The Sermon on the Mount may very well be the most familiar of all the passages in the New Testament and yet perhaps the least understood and even less obeyed. However, it is apparent that Jesus is very serious that those who would be sons of God will be conformed to the characteristics set forth in this important sermon. As we study this sermon we do not just gain knowledge of the governing principles of the kingdom but, more importantly, we learn what God expects in the way of the behavior of His sons and daughters. He is not waiting to observe this behavior in the millennial kingdom but in the kingdom which is at hand, which is in our midst today. It is arguably the most demanding set of expectations of human behavior ever written. When we sing the song, “It Is Time for the Saints to Take the Kingdom” we are really testifying, “It is time for our behavior to conform to that described in the Sermon on the Mount.” As we read and meditate on Matthew 5-7, we are inclined to have the same response as Jesus’ followers when He explained the reality of the communion, “Many therefore of his disciples, when they had heard this, said, ‘This is an hard saying; who can hear it’” (John 6:60, KJV)? Here again is where we come face-to-face with the fundamental truth of the Gospel for Christians. Jesus used His encounter with the rich young man to reinforce it. The young man, although he believed he was a law-follower, knew something was missing to obtain eternal life. Jesus told him to sell all that he had and follow Him. He went away sorrowful for he had great wealth. Jesus said, “And again I say to you, it is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God” (Matthew 19:24, NKJV). His disciples reacted by asking, “Who then can be saved” (Matthew 19:25b, NKJV)? What Jesus said next was as much for us today as it was for His disciples then, “With men this is impossible, but with God all things are possible” (Matthew 19:26, NKJV). It is true that we cannot meet the expectations of the Sermon on the Mount on our own, regardless of how strongly we are motivated to do so. Only the Christ-life within us in the person of the Holy Spirit can meet those expectations. However, there is a cooperation with the Holy Spirit that is required from us: 1. First, we must become motivated to “Seek first the kingdom of God and His righteousness” (Mathew. 6:33, NKJV). Even this intense desire must be imparted by God into our hearts. However, if we are struggling with having that desire, then we must cry out to God to give it to us. “Blessed are those who hunger and thirst for righteousness for they shall be filled” (Matthew 5:6, NKJV). 2. We must recognize our spiritual deficit and our total dependence on the power of the Holy Spirit to resist and overcome every sin in our lives. “Blessed are the poor in spirit for theirs is the kingdom of heaven” (Matthew 5:3, NKJV). We must ask God to give us the faith that persuades us to believe that with God it is possible for us to obey Him. 3. Fall in love with the Word of God and know its power. The Holy Spirit will use it to bolster our faith as we partake of it daily just like the manna from heaven. “So then faith comes by hearing, and the ear to hear by the word of God” (Romans 10:17, Jubilee). “All scripture is given by inspiration of God and is profitable for doctrine, for reproof, for correction, for instruction in righteousness, that the man of God may be perfect, thoroughly furnished unto all good works” (2 Timothy 3:16-17, NKJV). 4. Maintain an attitude (mindset) of unceasing prayer, acknowledging our continuous and momentary need for a constant connection with the Holy Spirit, calling upon His power at the earliest awareness of temptation to disobey God. It is easier to keep sin out than it is to expel it once it has gained entrance. “If you do well, will you not be accepted? And if you do not do well, sin lies at the door. And its desire is for you, but you should rule over it” (Genesis 4:17, NKJV). “For if you live according to the flesh you will die; but if by the Spirit you put to death the deeds of the body, you will live” (Romans 8:13, NKJV). 5. Be prepared for suffering of the flesh. The flesh does not give up its desires easily. The sinful nature wants what is contrary to God’s will. “For the flesh lusts against the Spirit, and the Spirit against the flesh; and these are contrary to one another, so that you do not do the things that you wish” (Galatians 5:17, NKJV). The Scripture says that Jesus learned obedience through the things that He suffered (ref. Hebrews 5:8). He suffered the full extent of obedience to God in the relinquishment of His own will to the will of God. Can we not expect some of the same suffering in laying down our own will to obey God? “For to this you were called, because Christ also suffered for us, leaving us an example, that you should follow His steps” (1 Peter 2:21, NKJV). “Therefore, since Christ suffered for us in the flesh, arm yourselves also with the same mind, for he who has suffered in the flesh has ceased from sin” (1 Peter 4:1, NKJV). When we observe what is going on in the world today we see men trying to reconstitute human governments, but their baseless efforts are totally devoid of a belief in Christ and His teachings of the kingdom of God. These efforts will only intensify with each passing year. One after another, each political solution will prove to be a failure because none of them will recognize or accept that sin is at the root of the problem. The only remedy is the kingdom of God, and the kingdom of God cannot come until the people of the kingdom are made ready. It remains that some must give all now, go by the narrow way, and enter by the small gate that leads to life (sonship). Just the thrill of knowing the way of the kingdom is not enough. We must walk it now. Are we willing? “Blessed is the man who remains steadfast under trial, for when he has stood the test he will receive the crown of life, which God has promised to those who love him” (James 1:12, ESV).

Loss. Just the word brings up negative images in the mind. We automatically associate bad things with the word “loss.” It means you had something valuable, but now you have lost it. I am not making light of loss. We have all, in many ways, suffered genuine loss. The loss of a loved one leaves an irreplaceable hole in one’s heart for the remainder of one’s years. And yet the truth from heaven often speaks in apparent contradictory terms. Jesus said, “He who finds his life will lose it, and he who loses his life for My sake will find it” (Matthew 10:39, NKJV). Just before this verse, Jesus said: “And he who does not take his cross and follow after Me is not worthy of Me” (Matthew 10:38). This kind of “loss” results in a great gain. Jesus said, “For what shall it profit a man if he gains the whole world, and loses his own soul” (Mark 8:36, NKJV). Truly, this would be an eternal loss. When we talk about gains and losses, or, put another way, look at one’s life like an accounting balance sheet with gains (assets) and losses (liabilities), things often move from gains to losses and from losses to gains. Some things we thought were gains were actually losses, and other things were just the opposite. Losses can often cause people to evaluate their eternal direction. Some people make good directional changes and some do not. • Lot’s wife could not let go of Sodom and looked back with a longing in her heart and lost her life • The rich young ruler could not let go of his riches to follow Christ and suffered significant loss. • King Saul could not let go of his bitterness. • King Solomon could not let go of his foreign wives. • Demas could not let go of the world, and suffered loss. Paul wrote a very personal letter to the Philippians about his gains and losses on his balance sheet, which he had kept track of for over thirty years. Paul was addressing a common problem that had descended on the church at Philippi, an issue that has corrupted many churches today. It is legalism. Paul preached the resurrected Christ, the gospel of grace, and clarified that, “It is we who are the circumcision, we who worship by the Spirit of God, who glory in Christ Jesus, and who put no confidence in the flesh” (Philippians 3:3, NIV). However, the assemblies were falling back into the traditional Jewish legalistic practices, thinking these would guarantee their salvation. Why is it that mankind struggles so much to accept something that is so very free by engaging in man-designed religious practices and ceremonies that have nothing to do with true salvation. Paul would further explain the steps of salvation to the Romans as follows: “That if you confess with your mouth the Lord Jesus and believe in your heart that God has raised Him from the dead, you will be saved. For with the heart one believes unto righteousness, and with the mouth confession is made unto salvation” (Romans 10:9-10, NKJV). To further Paul’s point, the aged apostle listed his natural and spiritual assets and his losses from his life’s balance sheet as follows: “Though I also might have confidence in the flesh. If anyone else thinks he may have confidence in the flesh, I more so: circumcised the eighth day, of the stock of Israel, of the tribe of Benjamin, a Hebrew of the Hebrews; concerning the law, a Pharisee; concerning zeal, persecuting the church; concerning the righteousness which is in the law, blameless” (Philippians 3:4-6, NKJV). It may sound like Paul is bragging, but he is about to make a sharp turn in his discourse. He is about to take all of the above “assets” and turn them into “losses” that bring “heavenly gains.” “Yet indeed I also count all things loss for the excellence of the knowledge of Christ Jesus my Lord, for whom I have suffered the loss of all things, and count them as rubbish, that I may gain Christ” (Philippians 3:8, NKJV). Interestingly, the word “loss” used above, which Paul uses, is the word zemian in Greek. It is used only two other times in the New Testament (Acts 27:10,21). It is in reference to the ship experience that Paul had in a storm with a cargo of human souls and valuables. All valuables were thrown overboard to lighten and save the ship. They were counted as “zemian” and as “loss” to save the souls on board from drowning. How impactful. That

 which seems so valuable in life could potentially stand in the way of heaven. Paul said that he suffered the loss of all things and counted all of these things that were at one time so important to him, i.e., his Judaistic zeal, his ancestry and his education, as rubbish. The Greek word for “rubbish” means either “bodily excrement,” or “food fit only for dogs.” Now, when I say food only fit for dogs, in the days of Paul, they did not have fancy tins of gourmet dog food prepared for dogs like we do today! Humans, in Paul’s day, would love to eat like our pets do today. Paul lost all he once was and became all Christ wanted him to be. His losses became great gains. His one-time gains became losses. His losses for Christ were great gains. The balance sheet was changing in Paul’s favor. Jesus talked about these eternal treasures when he said: “Do not lay up for yourselves treasures on earth, where moth and rust destroy and where thieves break in and steal; but lay up for yourselves treasures in heaven, where neither moth nor rust destroys and where thieves do not break in and steal. For where your treasure is, there your heart will be also” (Matthew 6:19-21, NKJV). Paul continues to explain to the Philippians what he is reaching out to gain: “And be found in Him, not having my own righteousness, which is from the law, but that which is through faith in Christ, the righteousness which is from God by faith; that I may know Him and the power of His resurrection, and the fellowship of His sufferings, being conformed to His death, if, by any means, I may attain to the resurrection from the dead” (Philippians 3:9-11, NKJV). “Not that I have already attained, or am already perfected; but I press on, that I may lay hold of that for which Christ Jesus has also laid hold of me. Brethren, I do not count myself to have apprehended; but one thing I do, forgetting those things which are behind and reaching forward to those things which are ahead, I press toward the goal for the prize of the upward call of God in Christ Jesus” (Philippians 3:12-14, NKJV). Peter, one of the more outspoken of the twelve, was direct enough to remind the Lord that they had given up everything to follow Him. He asked “Therefore, what shall we have?” Jesus replied: “Then Peter answered and said to Him, ‘See, we have left all and followed You. Therefore what shall we have?’So Jesus said to them, ‘Assuredly I say to you, that in the regeneration, when the Son of Man sits on the throne of His glory, you who have followed Me will also sit on twelve thrones, judging the twelve tribes of Israel. And everyone who has left houses or brothers or sisters or father or mother or wife or children or lands, for My name’s sake, shall receive a hundredfold, and inherit eternal life’” (Matthew 19:27-29, NKJV). We are blessed that when Jesus answered, He said, “And EVERYONE who has left houses or brothers or sisters or father or mother or wife or children or lands, for My name’s sake, shall receive a hundredfold, and inherit eternal life.” That includes not just Peter, but you and me also. Try to avoid being confused by this verse from a North American point of view and wonder why you would have to leave such things as father and mother for His name’s sake. Believe me, when I say that we have met very precious souls, young ladies who have come to Christ in foreign lands, who have been beaten by their fathers and kicked to the streets for leaving the dark pagan religion of their families. They chose to leave their homes, and their families for Christ, and for their safety. Persecution is happening today in the church in foreign lands. So, is loss a good thing, or a bad thing? It can be both.`, subtitle: 'Loss: Good Thing or Bad Thing?: Andy Snoke', author: 'David Luff', year: 2025, month: 'July', volume: 'Vol. LXXVIII, No. 06', title: 'Faith and the Kingdom of God — Part Two', topics: ['Scripture','Faith','Discipleship'], excerpt: "David Luff continues exploring faith and the kingdom, focusing on the Sermon on the Mount in Matthew 5-7 as the character blueprint for citizens of the kingdom. Discusses cooperation with the Holy Spirit: seeking righteousness, recognizing spiritual need, meditating on Scripture, unceasing prayer, and bearing suffering of the flesh. Andy Snoke reflects on spiritual gains and losses from Philippians 3, examining Paul's balance sheet of earthly achievements counted as rubbish for Christ.", pdf: '06%20-%20Sharon%20Star%20-%20July%202025.pdf', fileName: '06_-_Sharon_Star_-_July_2025.pdf'  },
  { id: 7, articleText: `Volume LXXVIII | Issue 07 | August 2025 “I will be a Father unto you, and ye shall be my sons and daughters” (2 Corinthians 6:18). (All scriptures are from the King James Version unless specified otherwise) It is the time for the church, the body of Christ, to believe that the Lord is faithful to fulfill the promises of His Word. It is not business as usual, where we walk merely hoping that God will fulfill His promises to us. Yes, we can and have and should pray unceasingly. However, are we ready to stand on His promises and have complete faith believing in Him and His Word? “For my thoughts are not your thoughts, neither are your ways my ways, saith the LORD. For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts. For as the rain cometh down, and the snow from heaven, and returneth not thither, but watereth the earth, and maketh it bring forth and bud, that it may give seed to the sower, and bread to the eater: So shall my word be that goeth forth out of my mouth: it shall not return unto me void, but it shall accomplish that which I please, and it shall prosper in the thing whereto I sent it” (Isaiah 55:8-11). When the Lord puts forth His Word, there is a purpose for it, and there will be a fulfillment of it. God’s Word will be fulfilled because it will not return unto Him void. The challenge we have is that when His Word is not fulfilled within our desired timeline, our minds begin to be filled with fear and doubt. I would like to premise your reading by highlighting specific focus points that will be emphasized throughout this article. God’s Promises: It is hoped that by highlighting the promises contained within the presented scriptures, it will inspire your reading of the Word to recognize the abundance of His promises to us. God’sFaithfulFulfillmentOfHisPromises:Godhasdemonstrated repeatedly, both in the Scriptures and in each of our lives, His faithfulness to fulfill His promises. I Will Be Their God And They Will Be My People: This specific promise, in one form or another, is found throughout the Scriptures. The fulfillment of this promise will change the words “will be” to “am” and “are.” I am God their Father, and they are my sons and daughters. Man’s Responsibility: God made mankind elemental to His plan.As such, mankind has a role within His plan. God’s plan was established before the foundations of the world. “And God said, Let us make man in our image, after our likeness: and let them have dominion (prevail against, reign, bear rule) over the fish of the sea, and over the fowl of the air, and over the cattle, and over all the earth, and over every creeping thing that creepeth upon the earth. So God created man in his own image, in the image of God created he him; male and female created he them” (Genesis 1:26-27). “Genesis” was a long time ago and as of yet mankind has not attained to the fulfillment of His Word. Have we entered into dominion and ruling and reigning spoken by God in this passage? No, we have not! However, that is the promised fulfillment that has been given to us through His Word. Let us believe Paul in his admonishment to the Philippians that God is faithful to fulfill His plan and purpose. “Being confident of this very thing, that he which hath begun a good work in you will perform it until the day of Jesus Christ” (Philippians 1:6). Paul speaks of God’s promises to the Church in Corinth. “For all the promises of God in him are yea, and in him Amen, unto the glory of God by us” (2 Corinthians 1:20). Though God has given us responsibility, the glory does not go to

us, but “by us” the glory goes to God. To enter into the fullness of sonship, the body of Christ must believe God is faithful to the fulfilling of His promises. It is not by our own strength, not by our own intellectual understanding, but with hope and by faith, believing His Word. Paul proclaims that all things can be done through Christ. “I can do all things through Christ which strengtheneth me” (Philippians 4:13). Did any glory go to Paul? No! All the glory went to Christ. God’s promises and plans will be fulfilled, from Genesis to Revelation. All His Word will be fulfilled. We, the Church, the body of Christ, must believe and come to know that every word in the Scriptures will be fulfilled by God. Why? Because that is His plan, and it will be fulfilled. In the Book of Romans, Paul confirms that man is made in the image of God and His Son. “For whom he did foreknow, he also did predestinate to be conformed to the image of his Son, (see Genesis 1:26-27) that he (Christ) might be the firstborn among many brethren” (Romans 8:29). This declaration will be accomplished. The glory belongs to God but will be manifested by us (see 2 Corinthians 1:20). There is an axiom that has been repeated many times: In the Old Testament, Christ concealed,in the New Testament, Christ revealed. The Old Testament has many types that in the New Testament are fulfilled. There will be four Old Testament types presented here. Their fulfillment in the New Testament will also be addressed later in this article. To focus on the principles presented earlier, I would like to begin with God’s promises to Abram/Abraham. (For context, please read Genesis 17:1-8) “And when Abram was ninety years old and nine, the LORD appeared to Abram, and said unto him, I am the Almighty God; walk before me, and be thou perfect” (Genesis 17:1). Perfect in this verse comes from the Hebrew “tāmîm” (taw-meemʹ), meaning: complete, whole, unimpaired, having integrity. Man’s Responsibility: Abram’s responsibility was to walk completely, with full integrity, and unimpaired before God. Theirs was to be a relationship, alike toAdam and Eve walking with God in the cool of the day in the Garden of Eden. (For context, please read Genesis 3:8.) Currently, we walk impaired and crippled by the baggage we carry from those things with which the spirit of the world encumbers us. This walk that God called Abram to was a walk of integrity and to be without impairment—not a call to be “without spot and blemish.” The future Mosaic law would prove that we, as mankind with our carnal nature, were incapable of accomplishing this “without spot and blemish” definition of perfection in our own strength and by our thinking with our own mind. God’s Promises: (See Genesis 17:2–8) God’s promises, translated here as a covenant, were abundant and everlasting. God would make Abram fruitful and multiply his descendants exceedingly, and give to them, as an everlasting inheritance, the land of Canaan. Most importantly, God promised He would be the God of Abram and his descendants. I would like to continue with the promises given to Moses and the children of Israel. (For context, please read Exodus 6:1–7.) The children of Israel had been in Egypt for 400 years and had been living under severe bondage for the latter portion of this time, and they had cried unto the God ofAbraham, Isaac, and Jacob for deliverance. God placed a calling on Moses to set God’s people free. They were God’s people through the promises given by God to Abram generations prior to Moses’time. God’s Faithful Fulfillment Of His Promises: “And I have also heard the groaning of the children of Israel, whom the Egyptians keep in bondage; and I have remembered my covenant” (Exodus 6:5). (See Genesis 17:1–8.) As a result of Moses’initial request to Pharaoh that he let the children of Israel go, Pharaoh instead increased their labors. God did not forget His promises to Abram, and He spoke to Abraham’s descendants through Moses. God’s Promises: (For context, please read Exodus 6:1, 4, 6–7.) God promises that He will deliver the children of Israel from Pharaoh and Egypt with a strong hand and rid them of their burdens and bondage. He establishes His covenant with them through Abraham. He claims them as His own and that He will be to them a God and will take them as His people. Then His people will know that it was their God that delivered them. “And I will take you to me for a people, and I will be to you a God: and ye shall know that I am the LORD your God, which bringeth you out from under the burdens of the Egyptians” (Exodus 6:7). Let us jump forward to Exodus chapter 19. (For context, please read Exodus 19:1-6) God’s Faithful Fulfillment Of His Promises: “Ye have seen what I did unto the Egyptians, and how I bare you on eagles’ wings, and brought you unto myself” (Exodus 19:4). God proves to Israel His love as their God by delivering them from bondage in Egypt and bringing them unto Himself. Man’s Responsibility: “Now therefore, if ye will obey my voice indeed, and keep my covenant” (Exodus 19:5). Israel’s responsibility was to obey His voice and keep His covenant. What covenant were they to keep? This was not the Mosaic Law, as the Law had not yet been given to Moses. So, what is God asking His people to keep? Let’s remember the covenant that was spoken to Abraham: “walk before me, and be thou perfect” (Genesis 17:1). How easily we can complicate what He has asked us to do and how He wants us to walk. The children of Israel were to have an intimate relationship with God—to walk completely and unimpaired before Him. This intimate relationship and walk are personified in the life of Enoch: “And Enoch lived sixty and five years, and begat Methuselah: And Enoch walked with God after he begat Methuselah three hundred years, and begat sons and daughters: And all the days of Enoch were three hundred sixty and five years: And Enoch walked with God: and he was not; for God took him” (Genesis 5:21–24). This is all we know of Enoch: He walked with God such that “God took him.” I envision that God did not take Enoch via the grave, but rather in similar glory to that of Elijah. My local elder, many times over the years, shared a memorable anecdote regarding Enoch: One day, as God and Enoch were fellowshipping together, God said, “Enoch, we are closer to my home than yours; come home with me.” That is a walk of perfection. Unimpaired! With integrity! Are we willing to walk and live in that way? What are we holding onto? What are we reserving? What are we stockpiling? God’s Promises: In God’s eyes, Israel would be a peculiar treasure, a kingdom of priests, a holy nation: “Now therefore, if ye will obey my voice indeed, and keep my covenant, then ye shall be a peculiar

treasure unto me above all people: for all the earth is mine:” (For further context, please read Psalm 24) “And ye shall be unto me a kingdom of priests, and an holy nation” (Exodus 19:5–6). There were promises given to the children of Israel by God for their building—according to the pattern instructed by God—of the Tabernacle in the wilderness. God’s desire was for a more intimate dwelling place with His people. (For context, please read Exodus 29:42–46.) God’s Promises: God promised to dwell among the children of Israel and meet with them and speak to them from the door of His sanctified abiding place. He reiterates His promise that He will be their God: “And I will dwell among the children of Israel, and will be their God” (Exodus 29:45). God’s Faithful Fulfillment Of His Promises: “And they shall know that I am the LORD their God, that brought them forth out of the land of Egypt, that I may dwell among them: I am the LORD their God” (Exodus 29:46). God continually brings to their remembrance: Look what I have done. You should have faith in Me because I promised this, and I fulfilled it. If you could endure for one more example: God promised the children of Israel many blessings if they walked in His righteous laws (Mosaic Law). (For context, please read Leviticus 26:1–12.) Man’s Responsibility: “Ye shall keep my sabbaths, and reverence my sanctuary: I am the LORD. If ye walk in my statutes, and keep my commandments, and do them” (Leviticus 26:2–3). The children of Israel’s responsibility would be to walk obediently in the doing of God’s righteous laws, statutes, and commandments. God’sPromises:ForIsrael’sobedience,Hewouldblessthemwithan abundance of promises. God here makes the demonstrative promise and avowal: I will be their God, and they will be My people. “And I will walk among you, and will be your God, and ye shall be my people” (Leviticus 26:12). This was a promise to the children of God by God. I can describe it as nothing else. His Word, His plan, and His promises will be fulfilled and are everlasting. After crossing the River Jordan and claiming their inheritance in the PromisedLand,thechildrenofIsrael,God’speople,walkedunderthe shepherdship of judges appointed and led by God. God was lovingly shepherding them, and they were living under the theocracy of God. Over time, the children of Israel grew dissatisfied and unfulfilled in their earthly, nation status. They desired a king “like all the nations” (1 Samuel 8:5) to rule over them. Their peculiarity, their calling as priests, their holiness as a nation, their being identified as God’s people, living under God’s theocracy, was no longer the desire of their heart. This appears to be where the rebellion of the children of Israel crossed the line. In the natural, the children of Israel had now rejected God and wanted to walk in the ways of the worldly kingdoms around them. They had abandoned God. But we know that God did not abandon the children of Israel. Why? Because of His covenant. (For context, please read Isaiah 45:18–23) “I have sworn by myself, the word is gone out of my mouth in righteousness, and shall not return” (remember Isaiah 55:11), “That unto me every knee shall bow, every tongue shall swear” (Isaiah 45:23). The author of Hebrews speaks to the covenant withAbraham, which is in confirmation of this same fact: “For when God made promise to Abraham, because he could swear by no greater, he sware by himself, Saying, Surely blessing I will bless thee, and multiplying I will multiply thee. And so, after he had patiently endured, he obtained the promise” (Hebrews 6:13–15). In Genesis chapter 15, you can read about the covenant ritual that was, according to their customs, performed by two parties to seal their covenant with each other. However, in the 17th verse you will see that God was the only party to this one-way covenant. God continued to be the God of His people in spite of their shortcomings—in spite of them choosing a king to rule over them ratherthanGod.GodchoseSaulfromthetribeofBenjaminasthefirst king of what has historically been called the unified nation of Israel. God also chose Saul’s successor, David, who was from the tribe of Judah. Israel prospered under the rule of David. Israel continued to prosper under Solomon, who inherited his father David’s kingdom. Solomon built the Temple of God in Jerusalem. At the end of Solomon’s reign, c. 1040 BC, the landmass occupied by the 12 tribes of Israel was at its zenith and fulfilled God’s promise to Abraham. (For further context, please read Genesis 12:7, 13:15–17, 15:7, 17:8.) This is where Israel’s succession planning under a king began to collapse. Solomon’s son Rehoboam, who had political sway over the tribe of Judah and the tribe of Benjamin, was a poor diplomat and was in conflict with Jeroboam of the tribe of Ephraim. Jeroboam was a strong leader, having significant political influence over the remaining ten tribes of Israel. When their differences could not be resolved, the unified kingdom split into two. The ten tribes controlled by Jeroboam to the north became the Kingdom of Israel, and the two southerly tribes ruled by Rehoboam became the Kingdom of Judah. The kingdoms of Israel and Judah are recorded in the biblical books of 1 & 2 Kings and 1 & 2 Chronicles. The Kingdom of Israel was conquered and assimilated by the Assyrians in c. 720 BC. The Kingdom of Judah was conquered by the Babylonians and the Temple in Jerusalem destroyed in c. 587 BC. During the reign of the kings of Israel and the kings of Judah, God never forgot His promise to Abram and His love for His people. God established prophets (men of God) in both Israel and Judah to admonish His people—through prophecy (the Word of God)— about the ramifications of living their lives according to their own thoughts and their own ways. Likewise, God, through these prophets of God, reminded His people of His continuing love for them and the promises that were their inheritance. I Will Be Their God And They Will Be My People This promise, in various forms, is recorded repeatedly throughout the Old Testament—in the Book of Hosea, the Book of Jeremiah, the Book of Ezekiel, and the Book of Zechariah. The Old Testament scriptures speak of God’s promises and workings with the descendants, through the bloodline—the DNA—of Abraham. Israel was called to be a peculiar treasure unto God, above all people, a kingdom of priests, a holy nation. (Remember Exodus 19:1–6). As a kingdom of priests, this calling—this responsibility—that God had placed upon them was theirs to fulfill. The history of Israel in the Scriptures documents the inability of Israel, by their own understanding, by their own strength, to fulfill this calling. However, God’s plan has no accommodation for anything less than complete fulfillment. Christ is the testator of a new and better covenant. (For context, please read Hebrews chapter 9.) I would like to bring to our attention the fact that, in the King James Version, the phrase “Heavenly Father” is only found in the New Testament. In the Old Testament, it is God and Lord and Lord God.

 Christ taught us to pray: “Our Father which art in heaven…” (Matthew 6:9–15).This will become relevant as we see the transitioning from I Will Be Their God And They Will Be My People, to the more intimate promise, I Will Be Their Father And They Will Be My Sons And Daughters. God’s purpose and plan will be fulfilled through Christ. “Think not that I (Jesus Christ) am come to destroy the law, or the prophets: I am not come to destroy, but to fulfil” (Matthew 5:17). Christ the only begotten Son of God, was sent as one who walked perfectly before God, His Father. Similar to promises given to Abraham for him and his heirs, through belief in Jesus Christ, we will be heirs of God’s promise of eternal life. The Old Testament foretells of the promise of the coming of Jesus Christ, God’s Son. “For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace.” (Isaiah 9:6). This will be fulfilled to the glory of God. By us! (remember 2 Corinthians 1:20) “And as Moses lifted up the serpent in the wilderness, (for context please read Numbers 21:8-9) even so must the Son of man be lifted up: That whosoever believeth in him (Christ) should not perish, but have eternal life. For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him (Christ) should not perish, but have everlasting life. For God sent not his Son into the world to condemn the world; but that the world through him (Christ) might be saved” (John 3:14-17) Man’s Responsibility: Believing in Christ, is the beginning of our calling, our walk. God’s Promises: The promise of everlasting life is for those who believe Christ was sent by our Heavenly Father to save the world. If Christ is the testator of a new covenant/ testament, (see Hebrews chapter 9) who is the other party? Again, this is a one-way covenant. We were not participants in this covenant but we are the inheritors of its promises. God will be faithful to fulfill His word of everlasting life. Old Testament type, God’s covenant with Abraham and his descendants. New Testament fulfillment, a new covenant through Christ. Peter speaks of those who believe in and follow Christ. “But ye are a chosen generation, a royal priesthood, an holy nation, a peculiar people; that ye should shew forth the praises of him (remember 2 Corinthians 1:20) who hath called you out of darkness into his marvellous light” (1 Peter 2:9). Man’s Responsibility: Similar to 2 Corinthians 1:20, “that ye should shew forth the praises of him.” God’s Faithful Fulfillment Of His promises: Peter declares the followers of Christ as a chosen generation, as a royal priesthood, as an holy nation, as a peculiar people—as a people called out of darkness into His (Christ’s) marvellous light. We have not yet reached the fullness of this declaration, but it will be fulfilled because God promised it. It will be fulfilled. Old Testament type: His people shall be a peculiar treasure, a kingdom of priests, an holy nation. NewTestament fulfillment: His people are a chosen generation, a royal priesthood, an holy nation, a peculiar people. We have been promised the indwelling Comforter, the Holy Spirit, by Christ. Paul speaks of believers being the temple of the living God. “Be ye not unequally yoked together with unbelievers: for what fellowship hath righteousness with unrighteousness? and what communion hath light with darkness? And what concord hath Christ with Belial? or what part hath he that believeth with an infidel? And what agreement hath the temple of God with idols? for ye are the temple of the living God; as God hath said, I will dwell in them, and walk in them; and I will be their God, and they shall be my people” (2 Corinthians 6:14–16) (see also Leviticus 26:12). This is different from the Old Testament type of the Tabernacle in the wilderness and the Temple in Jerusalem. We are the temple of the living God, His fulfillment being His Holy Spirit in His people—the Comforter, the Holy Spirit, as promised by Christ (for context, please read John 14:1–23). Continued in the next issue.`, author: 'Kelvin Martin', year: 2025, month: 'August', volume: 'Vol. LXXVIII, No. 07', title: "God's Promises — Part One", topics: ['Scripture','Faith','Prophecy'], excerpt: "Kelvin Martin begins a two-part study on God's faithfulness to fulfill His promises, tracing covenants from Abraham and Moses through the Old Testament. Examines the recurring promise I will be their God and they will be My people through Genesis, Exodus, Leviticus, and the prophets. Highlights man's responsibility to walk with integrity before God, as modeled by Enoch who walked so closely with God that He simply took him home.", pdf: '07%20-%20Sharon%20Star%20-%20August%202025.pdf', fileName: '07_-_Sharon_Star_-_August_2025.pdf'  },
  { id: 8, articleText: `Volume LXXVIII | Issue 08 | September 2025 Continued from the August 2025 issue. Man’s Responsibility: “If ye love me, keep my commandments” (John 14:15). God’s Promises: “And I will pray the Father, and he shall give you another Comforter, that he may abide with you for ever; even the Spirit of truth; whom the world cannot receive, because it seeth him not, neither knoweth him: but ye know him; for he dwelleth with you, and shall be in you. I will not leave you comfortless: I will come to you” (John 14:16–18). Verse 16 speaks of the promise of the abiding Holy Spirit as “for ever” with His people. In the same context, God promised to Abraham that His covenant with His descendants would be everlasting. Verse 17 affirms that “ye know him.” We have been taught through His Word and through prophecy that we need to know the still small voice of His Spirit. We have been filled with the Holy Spirit, but do we know Him? God’s Faithful Fulfillment Of His Promises: This promise of the indwelling of the Holy Spirit is fulfilled in Acts chapter 2. “And when the day of Pentecost was fully come, they were all with one accord in one place. And suddenly there came a sound from heaven as of a rushing mighty wind, and it filled all the house where they were sitting. And there appeared unto them cloven tongues like as of fire, and it sat upon each of them. And they were all filled with the Holy Ghost, and began to speak with other tongues, as the Spirit gave them utterance” (Acts 2:1–4). Man’s Responsibility: To get to know Him. This fulfillment will cause us to walk that perfect walk—that unimpaired walk of integrity with His Holy Spirit. Old Testament type—the tabernacle in the wilderness— the dwelling place of God amongst His people. New Testament fulfillment—God’s Holy Spirit dwelling in His people. The temple of the living God. Our walk has been established through the Word. James speaks of the necessity of doing those things instructed to us by the Word (for context, please read James 1:16–22). God’s Faithful Fulfillment of His Promises: “Of his own will begat he us with the word of truth …” (James 1:18) (remember Genesis 1:26–27). He made us in His own image. God’s Promises: “that we should be a kind of firstfruits of his creatures” (James 1:18). Man’s Responsibility: “Wherefore, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath: for the wrath of man worketh not the righteousness of God. Wherefore lay apart all filthiness and superfluity of naughtiness, and receive with meekness the engrafted word, which is able to save your souls. But be ye doers of the word, and not hearers only, deceiving your own selves” (James 1:19–22). Old Testament type – obedience to the Law. New Testament fulfillment – submission to the Word by the leading of the indwelling Spirit. Christ speaks of His spiritual bloodline that comes only by being born again. “There was a man of the Pharisees, named Nicodemus, a ruler of the Jews: the same came to Jesus by night, and said unto him, Rabbi, we know that thou art a teacher come from God:

for no man can do these miracles that thou doest, except God be with him. Jesus answered and said unto him, Verily, verily, I say unto thee, Except a man be born again, he cannot see the kingdom of God. Nicodemus saith unto him, How can a man be born when he is old? can he enter the second time into his mother’s womb, and be born?” (John 3:1–4) Nicodemus, thinking with his natural mind, could not get his head around how someone could be born again, yet Christ said that it is a requirement to enter the kingdom of God. “Jesus answered, Verily, verily, I say unto thee, Except a man be born of water and of the Spirit, he cannot enter into the kingdom of God. That which is born of the flesh is flesh; and that which is born of the Spirit is spirit. Marvel not that I said unto thee, Ye must be born again” (John 3:5–7). The promise of everlasting life is given to this “bloodline,” those who are born again of Christ the testator (see Hebrews chapter 9) of a new and better covenant. It no longer requires DNA, as through Abraham, but rather by being filled and led by the Holy Spirit and entering into the spiritual realm through Jesus Christ. Peter speaks of the life of holiness for those who are born again, into the family of God (spiritual “seed” not fleshly “seed”) (for context, please read 1 Peter 1:15–23). Man’s Responsibility: “But as he which hath called you is holy, so be ye holy in all manner of conversation; (manner of life, manner of conduct, manner of behaviour—not just what is spoken); Because it is written, Be ye holy; for I am holy. … 22 Seeing ye have purified your souls in obeying the truth through the Spirit unto unfeigned love of the brethren, see that ye love one another with a pure heart fervently:” (1 Peter 1:15–16 and 22). This is the unimpaired, unencumbered walk he has called us to. Anything short of unfeigned (meaning genuine, sincere) love is impaired. God’s Faithful Fulfillment Of His Promises: “Being born again, not of corruptible seed, but of incor
