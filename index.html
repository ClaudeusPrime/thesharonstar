  { id: 34, articleText: `All scriptures are from the KJV unless otherwise indicated.
This article will address the important subject of healing. As a
disclaimer, if you have not fully laid hold of healing, this writing
is not meant to bring any form of discomfort or condemnation. In
many ways, full healing is still an unfolding revelation.
This writing will cover some of the conditions that the Bible talks
about in preparation for healing.
We should not feel condemnation for where we have been or
where we are, but rather, how do we move forward?
Many in the body of Christ are seeking healing, and healing has
been bought and paid for by our Lord Jesus Christ as recorded
in the scripture, “by whose stripes ye were healed” and “I am
the Lord that healeth thee” (1 Peter 2:24 & Exodus 15:26,
respectively).
“But He was wounded for our transgressions, He was bruised
for our iniquities; The chastisement for our peace was upon Him,
And by His stripes we are healed. All we like sheep have gone
astray; We have turned, every one, to his own way; And the LORD
has laid on Him the iniquity of us all” (Isaiah 53:5-6, NKJV) .
“Who, when He was reviled, did not revile in return; when He
suffered, He did not threaten, but committed Himself to Him who
judges righteously; who Himself bore our sins in His own body on
the tree, that we, having died to sins, might live for righteousness
- by whose stripes you were healed” (1 Peter 2:23-24, NKJV).
“When the even was come, they brought unto Him many that were
Volume LXXVI | Issue 03 | March 2023
possessed with devils: and He cast out the spirits with His word,
and healed all that were sick: That it might be fulfilled which was
spoken by Esaias the prophet, saying, Himself took our infirmities,
and bare our sicknesses” (Matthew 8:16-17).
The Word of God also declares that we will not be affected by the
diseases of Egypt. There are three places in the Old Testament that
declare these promises to the children of Israel.
“And the LORD will take away from thee all sickness, and will
put none of the evil diseases of Egypt, which thou knowest,
upon thee; but will lay them upon all them that hate thee”
(Deuteronomy 7:15).
“But it shall come to pass, if thou wilt not hearken unto the voice
of the LORD thy God, to observe to do all his commandments and
his statutes which I command thee this day; that all these curses
shall come upon thee, and overtake thee” (Deuteronomy 28:15).
“Moreover he will bring upon thee all the diseases of Egypt,
which thou wast afraid of; and they shall cleave unto thee. Also
every sickness, and every plague, which is not written in the book
of this law, them will the LORD bring upon thee, until thou be
destroyed. And ye shall be left few in number, whereas ye were as
the stars of heaven for multitude; because thou wouldest not obey
the voice of the LORD thy God” (Deuteronomy 28:60-62).
From the Scriptures, we can read that the diseases of Egypt do
not belong to us, but if we will not hear the voice of the Lord, the
diseases of Egypt will come upon us.
What has the Lord been talking to us about?
The following five things come to mind:
1. Unforgiveness
2. Unity
3. Discerning the Lord‘s body
4. Reconciliation
5. Praise
Let us look at each of these topics and see what the Spirit has to say.
Unforgiveness.
Forgiveness is not optional, but it is a necessary action item that
every Christian must do. Not forgiving is an indication that we do
not recognize the need for that particular member to be a part of
the body of Christ.
Already we can see that forgiveness is connected with discerning
the Lord‘s body. If we do not forgive our brother, we do not love
him, and 1 Corinthians 13 tells us that without love, we are just
noisemakers. Without forgiveness, we will not be forgiven.
Jesus taught his disciples to pray and the prayer says to forgive us
our sins as we forgive others (Matthew 6:12-15).
If we are not prepared to forgive other people, we will not have
our sins forgiven either. Paul clearly said, “let not the sun go down
upon your wrath” (Ephesians 4:26). If we know and understand,
how can we partake of communion with unforgiveness in our
hearts? The Word declares that we will drink damnation to
ourselves. “For he that eateth and drinketh unworthily, eateth
and drinketh damnation to himself, not discerning the Lord’s
body” (1 Corinthians 11:29).
Damnation is a Greek word, krima. It is used twenty-eight times
in the New Testament and the same word is used in Matthew 7:2-
3, “For with what judgment (krima) ye judge, ye shall be judged:
and with what measure ye mete, it shall be measured to you again.
And why beholdest thou the mote that is in thy brother’s eye, but
considerest not the beam that is in thine own eye?”
Jesus gives us a comparison of what the kingdom of God will be
like, “Therefore is the kingdom of heaven likened unto a certain
king, which would take account of his servants. And when he had
begun to reckon, one was brought unto him, which owed him ten
thousand talents. But forasmuch as he had not to pay, his lord
commanded him to be sold, and his wife, and children, and all
that he had, and payment to be made.The servant therefore fell
down, and worshipped him, saying, Lord, have patience with me,
and I will pay thee all. Then the lord of that servant was moved
with compassion, and loosed him, and forgave him the debt. But
the same servant went out, and found one of his fellow servants,
which owed him an hundred pence: and he laid hands on him,
and took him by the throat, saying, Pay me that thou owest. And
his fellow servant fell down at his feet, and besought him, saying,
Have patience with me, and I will pay thee all. And he would not:
but went and cast him into prison, till he should pay the debt. So
when his fellow servants saw what was done, they were very sorry,
and came and told unto their lord all that was done. Then his lord,
after that he had called him, said unto him, O thou wicked servant,
I forgave thee all that debt, because thou desiredst me: Shouldest
not thou also have had compassion on thy fellow servant, even as
I had pity on thee? And his lord was wroth, and delivered him to
the tormentors, till he should pay all that was due unto him. So
likewise shall my heavenly Father do also unto you, if ye from
your hearts forgive not every one his brother their trespasses”
(Mathew 18:23-35).
100 pence was three months’ salary. One talent was twenty years
of salary. The first man, now in prison, at $12/hr, was forgiven
$4,800,000,000. This very same man, at the same hourly rate of $12/
hr, was owed $6,000 but he was not willing to write this debt off and
let the man who owed him go free. The net result was that the man
who was forgiven the large debt, was now back in prison and owing
the full amount. This, dear saints, is the price of unforgiveness.
Should this man, who would not forgive $6,000, partake of
communion? During communion, if anyone has anything against
another, it would be best to let the cup and the bread pass until
the situation has been forgiven. I can assure you that this will be
a step towards healing.
Unity
Unity is not being in one place but is being of one mind. We
must have unity within ourselves, within our home, within our
community, in our local assembly and in the family of God.
“Behold, how good and how pleasant it is for brethren to dwell
together in unity! It is like the precious ointment upon the head,
that ran down upon the beard, even Aaron’s beard: that went
down to the skirts of his garments; As the dew of Hermon, and
as the dew that descended upon the mountains of Zion: for there
the LORD commanded the blessing, even life for evermore”
(Psalms 133).
I am sure that we all want life evermore right here on this earth.
This life of unity will surpass the miraculous healings and
resurrections that we read about in God’s Word. Even Lazarus,
and those healed in Jesus’ ministry, died again. This unity, spoken
in the Psalms, will know no death.
Jesus healed the multitudes and raised some from the dead, but
these all died again. Life forevermore will be the end of sickness
and death. This brings us to the scripture that tells us that, “the
last enemy to be defeated is death” (1 Corinthians 15:26).
“Finally, be ye all of one mind, having compassion one of another,
love as brethren, be pitiful, be courteous: Not rendering evil for
evil, or railing for railing: but contrariwise blessing; knowing
that ye are thereunto called, that ye should inherit a blessing. For
he that will love life, and see good days, let him refrain his tongue
from evil, and his lips that they speak no guile” (1 Peter 3:8-10).
“Be of the same mind one toward another. Mind not high things,
but condescend to men of low estate. Be not wise in your own
conceits” (Romans 12:16).
“Now the God of patience and consolation grant you to be
likeminded one toward another according to Christ Jesus: That
ye may with one mind and one mouth glorify God, even the Father
of our Lord Jesus Christ” (Romans 15:5-6).
“Finally, brethren, farewell. Be perfect, be of good comfort, be of
one mind, live in peace; and the God of love and peace shall be
with you” (2 Corinthians 13:11).
“Finally, be ye all of one mind, having compassion one of another,
love as brethren, be pitiful, be courteous: Not rendering evil for
evil, or railing for railing: but contrariwise blessing; knowing
that ye are thereunto called, that ye should inherit a blessing.
For he that will love life, and see good days, let him refrain his
tongue from evil, and his lips that they speak no guile: Let him
eschew evil, and do good; let him seek peace, and ensue it”
(1 Peter 3:8-11).
“And when the day of Pentecost was fully come, they were all
with one accord in one place. And suddenly there came a sound
from heaven as of a rushing mighty wind, and it filled all the house
where they were sitting. And there appeared unto them cloven
tongues like as of fire, and it sat upon each of them. And they
were all filled with the Holy Ghost, and began to speak with other
tongues, as the Spirit gave them utterance” (Acts 2:1-4).
The Move of the Spirit in 1948 was a similar situation to the upper
room experience. Hungry hearts were in one place and in one accord
and were waiting upon the Lord for the moving of His Holy Spirit.
Even in the natural or carnal state, there is power in unity. At the
Tower of Babel, the people were of one mind to build a staircase
to God and the Word declares that He confused their language so
that they could not continue. This was a historic event, but God
wants to restore even languages. This is evident when the Holy
Spirit came and every man spoke with understanding.
“Again I say unto you, That if two of you shall agree on earth as
touching any thing that they shall ask, it shall be done for them
of my Father which is in heaven. For where two or three are
gathered together in my name, there am I in the midst of them”
(Matthew 18:19-20).
Discerning The Lord’s Body
Jesus is the head and we are the body. You are a member of the
body of Christ and a member in particular. When Jesus was here,
all the gifts of the Spirit were active within Him. When He died
on the cross, He divided Himself, or should we say, He divided
the gifts of the Spirit that we read about in 1 Corinthians 12,
and He distributed them among us. Jesus, the head, is presently
interceding before our Father on our behalf. Jesus distributed
Himself among us and we are now lively stones that constitute the
house of the Lord. A house that has missing stones is incomplete.
God is not going to come for an incomplete house. He is coming
for a church without spot, blemish or wrinkle (Ephesians 5:27).
We are the body of Christ, and we must work together in order
to get the results that we are looking for. This includes healing.
There have been faith healers and miracle workers such as Charles
Price and Andrew Murray and John G. Lake, etc., but when God
moved in 1948, He said that this was the coming together of the
body of Christ. When it comes to healing there may be a word
of knowledge, a word of wisdom, discerning of spirits or any
combination of gifts that will also be active. They all come into
play to receive healing. If one member has faith, another has gifts
of healing and the person that is sick needs both of these gifts to
be active in order to obtain healing. We need to work together in
order to accomplish what is before us.
It is vital for me to acknowledge my limitations and to understand
my need for my brother and my sister. None of us can accomplish
the things we are looking to accomplish without discerning the
gifts and ministries that are within our brothers and sisters. We are
not talking only about elders, deacons and the apostolic ministry.
No, we are looking to every single member of the body of Christ.
1 Corinthians 12 tells us how the body functions. It tells us that if
there is a member that doesn’t seem important, we need to place
more honour on that member.
“And those members of the body, which we think to be less
honourable, upon these we bestow more abundant honour;
and our uncomely parts have more abundant comeliness”
(1 Corinthians 12:23).
“And whether one member suffer, all the members suffer with
it; or one member be honoured, all the members rejoice with it”
(1 Corinthians 12:26).
In the same way, many did not discern who Jesus was. Neither
will they discern that you and I are members of the body of
Christ.
“Is not this the carpenter, the son of Mary, the brother of James,
and Joses, and of Juda, and Simon? and are not his sisters here
with us? And they were offended at him. But Jesus said unto
them, A prophet is not without honour, but in his own country,
and among his own kin, and in his own house. And he could
there do no mighty work, save that he laid his hands upon a few
sick folk, and healed them” (Mark 6:3-5).
We can see here how vital it is to discern the Christ within our
brother and sister. He didn’t do many mighty works, and He
only healed a few. Isn’t that what we are seeing today? We will
have to get more clarity on the Christ within one another and we
will need to work as flawlessly as our natural body works, where
there is no competition, there is just a wonderful flow and no one
member is competing for first place.
“For as the body is one, and hath many members, and all the
members of that one body, being many are one body: so also
is Christ. For by one Spirit are we all baptized into one body,
whether we be Jews or Gentiles, whether we be bond or free;
and have been all made to drink into one Spirit. For the body is
not one member, but many” (1 Corinthians 12:12-14).
“If a man say, I love God, and hateth his brother, he is a liar:
for he that loveth not his brother whom he hath seen, how can he
love God whom he hath not seen? And this commandment have
we from him, That he who loveth God love his brother also”
(1 John 4:20-21).
“Whosoever believeth that Jesus is the Christ is born of God:
and every one that loveth him that begat loveth him also that
is begotten of him. By this we know that we love the children of
God, when we love God, and keep his commandments” (1 John
5:1-2).
“He that receiveth you receiveth me, and he that receiveth me
receiveth him that sent me. He that receiveth a prophet in the
name of a prophet shall receive a prophet’s reward; and he that
receiveth a righteous man in the name of a righteous man shall
receive a righteous man’s reward” (Matthew 10:40-41).
Reconciliation
If we have a spirit of reconciliation, we will look at turning
every problem into an opportunity. We will build bridges instead
of fences.
If we look through the lens of reconciliation, we will see
negatives as opportunities. We will truly begin to see that, “all
things work together for good to them that love God and are the
called according to his purpose” (Romans 8:28).

  { id: 35, articleText: `The reality of the indwelling presence of the Holy
Spirit in the inner being of a regenerated person is the
essence of Christian life. Jesus testified of it in John
14:16-17, “And I will pray the Father, and He will
give you another Helper, that He may abide with you
forever— the Spirit of truth, whom the world cannot
receive, because it neither sees Him nor knows Him;
but you know Him, for He dwells with you and will
be in you” (NKJV). And again in verse 20, “At that
day you will know that I am in My Father, and you in
Me, and I in you” (NKJV). The apostle Peter testified
of it in his second epistle, “as His divine power has
given to us all things that pertain to life and godliness,
through the knowledge of Him who called us by glory
and virtue, by which have been given to us exceedingly
great and precious promises, that through these you
may be partakers of the divine nature, having escaped
the corruption that is in the world through lust”
(2 Peter 1:3-4, NKJV). The apostle Paul testified of it
in his epistle to the Church at Colosse, “To them God
willed to make known what are the riches of the glory
of this mystery among the Gentiles: which is Christ in
you, the hope of glory” (Colossians 1:27, NKJV).
Volume LXXVI | Issue 04 | April 2023
“Watchman Nee, the great Chinese Christian teacher
was adamant about the importance of living what he
simply called the ‘normal Christian life.’ Missionary
to China, Hudson Taylor’s term was the ‘exchanged
life’ wherein the believer’s life of defeat is exchanged
for the victorious life of Christ. Others have referred
to it as the ‘Christ-life.’ Hannah Whitehall Smith
referred to it as ‘the Christian’s secret of a happy life’”
Harrison, N. (1998). His Victorious Indwelling (p. 8).
Zondervan.
As we ponder the wonder of what Paul calls “this
mystery,” words fail us, however, his passage in
Ephesians, Chapter 3, verses 14-19 summarizes it
well, “For this reason I bow my knees to the Father of
our Lord Jesus Christ, from whom the whole family in
heaven and earth is named, that He would grant you,
according to the riches of His glory, to be strengthened
with might through His Spirit in the inner man, that
Christ may dwell in your hearts through faith; that
you, being rooted and grounded in love, may be able
to comprehend with all the saints what is the width
and length and depth and height— to know the love of
Christ which passes knowledge; that you may be filled
with all the fullness of God” (NKJV).
One of the basic tenets of this present move of the
Spirit, is the criticality of being led by the Spirit or
saying it in another way, living and walking in the
Spirit. For us, “upon whom the ends of the ages have
come” (1 Corinthains 10:11, NKJV), this mystery of
the indwelling presence of the Holy Spirit has now
been revealed in His holy Word. However, we can
now look back to the beginning of creation and see
that God had this in His mind all along. When God
created man, he breathed into him the breath of life
and man became a living soul. His breath gave him
human life or natural life but not that eternal life which
was the essence of Himself. However, He placed man
in the Garden of Eden in the midst of which He had
placed two special trees, the tree of knowledge and the
tree of life. God never intended that man would live
his life independently of Him. He didn’t design him
to do so. God wanted to lead Adam and Eve in their
lives. He gave them only one requirement for their
lives in the garden and that was to not partake of the
tree of knowledge of good and evil. He did not demand
that they never be late for their cool-of-the-evening
meetings. He did not threaten punishment if they were
late feeding the animals. He just said for them not to
eat the fruit of that one tree. However, the tree of life
was also in a prominent place in the garden. I believe
that tree was Christ and the fruit of that tree was the
unending, eternal life that the Godhead shared. “Then
the Lord God said, ‘Behold, the man has become like
one of Us, to know good and evil. And now, lest he put
out his hand and take also of the tree of life, and eat,
and live forever’” (Genesis 3:22, NKJV).
The problem for Adam and Eve became the problem
for all mankind, even to this day. The voices of self-
reliance are many and deceptive. They began in the
garden as the serpent told Eve she did not need God
because she could be like God, or, in other words, she
could be her own god. “Then the serpent said to the
woman, ‘You will not surely die. For God knows that
in the day you eat of it (tree of knowledge) your eyes
will be opened, and you will be like God, knowing
good and evil’” (Genesis 3:4-5, NKJV). And so, sin
entered the world. One way of thinking about sin is
self-reliance, independence of the need for God, and
an anti-God way of living.
Even in God’s giving of the law to Israel through
the mediator, Moses, it was given in preparation for
the coming of Christ, the true Mediator of the new
covenant between God and man, the Seed promised to
Abraham. “Why, then, was the law given? It was given
alongside the promise to show people their sins. But
the law was designed to last only until the coming of
the child who was promised. God gave his law through
angels to Moses, who was the mediator between God
and the people” (Galatians 3:19, NLT). God knew that
Israel would never be able to keep the law. That’s why
He instituted the practice of animal sacrifices which
also pointed ahead to the sacrifice of Jesus which
would bring an end to that practice. “Now we know
that whatever the law says, it says to those who are
under the law, that every mouth may be stopped, and
all the world may become guilty before God. Therefore
by the deeds of the law no flesh will be justified in
His sight, for by the law is the knowledge of sin”
(Romans 3:19-20, NKJV).
About 1500 years after the law was given, Jesus, the
Seed of promise, came to the earth. “Even so we, when
we were children, were in bondage under the elements
of the world. But when the fullness of the time had
come, God sent forth His Son, born of a woman, born
under the law, to redeem those who were under the law,
that we might receive the adoption as sons” (Galatians
4:3-5, NKJV). The things that Jesus has accomplished
for us through His life on earth, His death on the cross,
His resurrection from the dead, and His return to the
Father have made it possible for us to, as it were, enter
the garden again and have another opportunity to
partake of the Tree of Life. “...As His divine power has
given to us all things that pertain to life and godliness,
through the knowledge of Him who called us by glory
and virtue, by which have been given to us exceedingly
great and precious promises, that through these you
may be partakers of the divine nature, having escaped
the corruption that is in the world through lust”
(2 Peter 1:3-4, NKJV).
In His life on earth, Jesus showed us who the Father
is and what He is like. “Jesus said to him, “Have I
been with you so long, and yet you have not known Me,
Philip? He who has seen Me has seen the Father; so
how can you say, ‘Show us the Father’” (John 14:9,
NKJV). “In the beginning was the Word, and the
Word was with God, and the Word was God” (John
1:1, NKJV). In His death on the cross and the shedding
of His pure, precious, and sinless blood, He redeemed
us from our sins (plural). “But God demonstrates His
own love toward us, in that while we were still sinners,
Christ died for us. Much more then, having now been
justified by His blood, we shall be saved from wrath
through Him” (Romans 5:8-9, NKJV). When we first
came to Christ for the forgiveness of sins, we received
our justification and our judicial righteous standing
before God based on the work of Christ on our behalf.
However, the wonderful, matchless grace of Jesus
accomplished so much more for us. In the resurrection
of Jesus from the dead, because He has life again, we
too may have life, His life within us. “For if when we
were enemies we were reconciled to God through the
death of His Son, much more, having been reconciled,
we shall be saved by His life” (Romans 5:10, NKJV).
I feel it is critically important that we explore at some
depth what Christ has accomplished and is in the very
process of accomplishing for us and in us as a result
of His resurrection and ascension to heaven and return
to the Father. Romans 5:10 says that having been
reconciled to Christ through His death, Paul uses the
words “much more” to say “we shall be saved by His
life.” You see, we were saved from the penalty for our
“sins” through the work of Christ on the cross, but
much more we will be saved from the rule of the “sin
nature” by His life. The efficacy of the grace and mercy
of Jesus is sufficient for the salvation of the whole man,
spirit, soul, and body.
Here, we must say a word about the absolute importance
of the principle of “identification.” After we come
to Christ, God sees us in a totally different way than
He did before. He sees us as identified with Christ in
both His death and His resurrection. The realization of
this may take some time for us to fully grasp, but it
is an irrefutable fact in God’s mind. The Apostle Paul
grasped it and recorded it in Romans 6:3-6, NKJV, “Or
do you not know that as many of us as were baptized into
Christ Jesus were baptized into His death? Therefore
we were buried with Him through baptism into death,
that just as Christ was raised from the dead by the
glory of the Father, even so we also should walk in
newness of life. For if we have been united together in
the likeness of His death, certainly we also shall be in
the likeness of His resurrection, knowing this, that our
old man was crucified with Him, that the body of sin
might be done away with, that we should no longer be
slaves of sin.” This truth of being identified with Christ
continues in the Scripture in the expression, “in Christ.”
“But God, who is rich in mercy, because of His great
love with which He loved us, even when we were dead
in trespasses, made us alive together with Christ (by
grace you have been saved), and raised us up together,
and made us sit together in the heavenly places in
Christ Jesus” (Ephesians 2:4-6, NKJV). “But of Him
you are in Christ Jesus, who became for us wisdom
from God—and righteousness and sanctification and
redemption” (1 Corinthians 1:30, NKJV).
In order for God to complete His work in us, we must
know that our faith in Christ for salvation has given
us a secure position “in Christ.” God loves us with as
much everlasting love on the worst day of our lives
as He does on the best. “For I am persuaded that
neither death nor life, nor angels nor principalities
nor powers, nor things present nor things to come, nor
height nor depth, nor any other created thing, shall
be able to separate us from the love of God which is
in Christ Jesus our Lord” (Romans 8:38-39, NKJV).
Oh, the wonderful, matchless grace of Jesus!
When Jesus returned to heaven and took His place at
the right hand of the Father, He sent the Holy Spirit to
take His place not only among us but also within our
very hearts. “And I will pray the Father, and He will
give you another Helper, that He may abide with you
forever— the Spirit of truth, whom the world cannot
receive, because it neither sees Him nor knows Him;
but you know Him, for He dwells with you and will be
in you” (John 14:16-17, NKJV). Christ is in believers
by His Spirit, and believers are in Christ by faith in
the all-sufficient work of Christ.
What is the primary work of the Holy Spirit? Jesus told
us in John 16:12-14, NKJV, “I still have many things
to say to you, but you cannot bear them now. However,
when He, the Spirit of truth, has come, He will guide
you into all truth; for He will not speak on His own
authority, but whatever He hears He will speak; and
He will tell you things to come. He will glorify Me,
for He will take of what is Mine and declare it to
you.” There is no doubt that God’s purpose is that we
be conformed to the image of His Son. “For whom
He foreknew, He also predestined to be conformed to
the image of His Son, that He might be the firstborn
among many brethren” (Romans 8:29, NKJV). It is
also apparent that this is accomplished as we live in
the Spirit, walk in the Spirit and are led by the Spirit.
“If we live in the Spirit, let us also walk in the Spirit”
(Galatians 5:25, NKJV). “For as many as are
led by the Spirit of God, these are sons of God”
(Romans 8:14, NKJV).
What does it truly mean to live, walk, and be led by
the Holy Spirit? This may seem, to many, to be a moot
question. However, if we are not careful we can, through
misunderstanding, miss some very important truths.
In order to grasp the truth of how to be conformed to
the image of Christ, we must again come to an even
more clear understanding of the wonderful, matchless
grace of Jesus. With this in mind, let us walk carefully
through the process, for it is indeed a process. Our initial
salvation is immediate upon our acceptance of Christ
as our Savior. Our identification with Christ in His
death and resurrection is also immediate. Our position
“in Christ” is immediate. However, our conformance
to the image of Christ is a life-long process and not for
the faint of heart.
The process of our being conformed to the image of
Christ begins with our knowledge and acceptance of
the fact that we are no longer under any condemnation,
and that is because we are “in Christ.” “There is the
condemnation to those who are in Christ Jesus, wh

  { id: 36, articleText: `Continued from the April 2023 issue.
What does the term “law” mean to us today? It is
not just the Mosaic Law given to Moses by God
on Mt. Sinai.To summarize, it includes all behavior
consistent with the character of God and condemns
all behavior that is inconsistent with the character of
God. It can also include extra demands of conduct
that we place upon ourselves or that others may
place on us. Just like the law of Moses, these things
are good and righteous. Paul said in Romans 7:12,
“Therefore the law is holy and the commandment
holy, and just and good” (NKJV), and again, in
Romans 7:22, “For I delight in the law of God
according to the inward man” (NKJV). However,
even as saved believers with the best of intentions,
trying to conform to these righteous expectations is
living under the law, not under the grace and power
of Christ. The Apostle even goes so far as to say that
Volume LXXVI | Issue 05 | May 2023
the law invigorates sinful tendencies, “But sin, taking
opportunity by the commandment, produced in me all
manner of evil desire. For apart from the law sin was
dead” (Romans 7:8, NKJV). In Romans 8:3, Paul
says that the “law is weak through the flesh.” In other
words, the law is good in itself, but the only vehicle
or resource the natural man has to work through in
overcoming the sinful nature is the strength of the
sinful nature itself. The only powers it can call upon
are those which are already in rebellion to the Spirit.
The reason that the law was powerless to bring about
righteousness is because it was totally hindered by the
hold that sin had on the flesh (the old Adamic nature).
The death of Christ broke that hold. It was made to
cease in us as believers through the participation
of the believer in the death of Christ. “Or do
you not know that as many of us as were baptized
into Christ Jesus were baptized into His death”
(Romans 6:3, NKJV)?
“That the righteous requirement of the law might be
fulfilled in us who do not walk according to the flesh
but according to the Spirit (Romans 8:4, NKJV). I
think this verse has been misinterpreted by many. They
think that the righteousness spoken of here is again
the righteousness that is imputed to us when we were
justified by faith in Christ. But I think this is not totally

perversion of the truth. Those people have forgotten

law was our tutor to bring us to Christ, that we might
be justified by faith” (NKJV). No law has the power to
change us. However, it serves to show us what sin is
and then directs us to the One Who can save us.

What does the word “walk” mean in the Bible? It
means our daily life, moment-by-moment, even hour-
by-hour. The word “flesh” in the Bible refers to the old
human nature we inherited from Adam. The Scripture
reinforces this principle of walking or living by the

gospel of Christ, for it is the power of God to salvation
for everyone who believes, for the Jew first and also

not fulfill the lust of the flesh” (Galatians 5:16, NKJV).

not fulfill the lusts of the flesh (Galatians 5:16, NKJV),
implies that it is possible for a Christian to walk by
the influence of the old Adamic nature. Paul reminds
us in Romans 6:14, “For sin shall not have dominion

throne, but he still hangs around carrying out guerilla
warfare, using outside stimuli to appeal to the residue of
the sinful nature that still has not been fully eradicated

so we are not totally immune to temptation. Notice that
the scripture says that if we walk in the Spirit, we will
not fulfill the lust of the flesh. It does not say that we
will not feel the lust of the flesh.

with Christ; it is no longer I who live, but Christ lives
in me; and the life which I now live in the flesh I live

Jael was obedient, courageous, and displayed great wisdom. After Sisera fled
from his fallen army, she gave him a false place of safety and was able to
defeat him with wisdom from her Lord. This makes me ponder how God will
work with people hidden in the midst of evil to do His purpose. Jael needed
discretion on when to act on God’s plan for if she had openly made it known

how shall it be seasoned? It is then good for nothing
but to be thrown out and trampled underfoot by men”
(Matthew 5:13, NKJV).
Jesus spoke these words to His disciples as part of what is
referred to as, “The Sermon on the Mount.” This special
sermon is full of gold! It is full of precious truths covering a
variety of topics that are relative to us in this hour.
However, because the monetary value of salt is much
different in our times, we can easily misunderstand how
important these words that Jesus spoke are. As far as cost is
concerned, salt is relatively cheap and plentiful in our day.
But in Jesus’ day, it was somewhat rare and very costly.
Here is a list of some of the characteristics of salt, and a
little history of it.
1. Salt hinders the spread of corruption
(as Christians should).
2. Salt creates thirst. (Blessed are those
who thirst for righteousness).
3. Salt enhances flavor.
4. Salt preserves.

The History of Salt (taken from various sources)
“Salt comes from dead, dried-up seas, or living ones. It can
bubble to the surface as brine or crop out in the form of salt
licks and shallow caverns. Below the skin of the earth, it lies
in white veins, some of them thousands of feet deep. It can
be evaporated from salt “pans,” boiled down from brine, or
mined, as it often is today, from shafts extending half a mile
down.
The history of the world with regard to salt is simple:
animals wore paths to salt licks; men followed; trails became
roads, and settlements grew beside them.
When the human menu shifted from salt-rich game to
cereals, more salt was needed to supplement the diet. But
the underground deposits were beyond reach, and the salt
sprinkled over the surface was insufficient. Scarcity kept
the mineral precious.
As civilization spread, salt became one of the world’s
principal trading commodities. Salt routes crisscrossed
the globe. One of the most travelled led from Morocco
south across the Sahara to Timbuktu. Ships bearing salt
from Egypt to Greece traversed the Mediterranean and
the Aegean seas. Herodotus describes a caravan route that
united the salt oases of the Libyan desert.
Venice’s glittering wealth was attributable not so much
to exotic spices as to commonplace salt, which Venetians
exchanged in Constantinople for the spices of Asia. In 1295,
when he first returned from Cathay, Marco Polo delighted
the Doge with tales of the prodigious value of salt coins
bearing the seal of the great Khan.
As early as the 6th century, in the sub-Sahara, Moorish
merchants routinely traded salt for gold. In Abyssinia, slabs
of rock salt, called ‘amôlés,’ became the coin of the realm.
Each one was about ten inches long and two inches thick.
Cakes of salt were also used as money in other areas of
central Africa.
Not only did salt serve to flavor and preserve food, but it
also made a good antiseptic, which is why the Roman word
for these salubrious crystals (sal) is a first cousin to Salus,
the goddess of health.
Of all the roads that led to Rome, one of the busiest was
the Via Salaria, the salt route, over which Roman soldiers
marched and merchants drove oxcarts full of the precious
crystals up the Tiber from the salt pans at Ostia.
A soldier’s pay—consisting in part of salt—came to be
known as solarium argentum, from which we derive the
word salary. A soldier’s salary was cut if he “was not worth
his salt,” a phrase that came into being because the Greeks
and Romans often bought slaves with salt.”
We can appreciate how valuable salt was in Jesus’s day.

  { id: 39, articleText: `Note: All the scriptures are quoted from the NIV Bible
One of the fundamental responsibilities of a believer is
to give tithes to his or her local church. Tithing means
offering one-tenth of our income to the house of God. The
concept of tithing instructs us to participate in the ministry
of giving back to God what God has blessed us with. It is
also an expression of thanksgiving to God for his abundant
blessings in our households. The practice of tithing was in
vogue even before the institution of Mosaic law. This is a
financial order of God that came into existence during the
Old Testament period and has continued to the present time.
In the New Testament, Jesus reiterated the importance of
giving tithes in Matthew 23:23 and in Luke 11:42.
Hebrew 7:22 says, “Jesus has become the guarantee of a
better covenant.” Since Jesus Himself stands as a surety
of the New Covenant, we become more responsible in
adhering to the principles of the New Covenant. We live
Volume LXXVI | Issue 06 | August 2023
in a better covenant, consequently, our tithing should
exceed the standard of the Old Covenant. During the
early apostolic age, which is the first century A.D., people
sold everything and laid it at the feet of the apostles
(Acts 4:36-37). “They shared everything they had”
(Acts 4:32). “There were no needy persons among them.
For from time to time those who owned lands or houses
sold them, brought the money from the sales and put it at
the apostles’ feet and it was distributed to anyone as he
had need” (Acts 4:34-35).
First, we will turn to the Old Testament to understand how
this system evolved. In Genesis 14:20, “Abram gave him
(Melchizedek, king of Salem) a tenth of everything.” This
is further reiterated in Hebrews 7:1, “This Melchizedek
was the king of Salem and priest of God Most High. He
met Abraham returning from the defeat of the kings and
blessed him, and Abraham gave him a tenth of everything.”
There are three main questions to consider.
1. What were the things the Hebrews required to tithe?
The Mosaic law legislated that a tithe from everything
from the land, whether grain from the soil or fruit from
the trees, belonged to the Lord; it was holy to the Lord.
The entire tithe of the herd and flock belonged to the
Lord. The manner of tithing livestock was as follows; the
owner counted the animals as they passed out to pasture,
and every tenth animal that passed under the shepherd’s
rod would be holy to the Lord. In this way, there was no
possibility of selecting inferior animals for the tithing of
the flocks and herds (Leviticus. 27:31,33).
2. To whom were the tithes paid?
They were to be given to the Levites (Numbers 18:21,24).
The Levites, because of their nature and status and
functions in the community, had no means of income,
livelihood or inheritance. To ensure their support, and in
return for their service which they served in the “Tent of
Meeting,” they were to receive “the tithes of the people
of Israel.” The Levites had to give a tenth of the tithes
as the Lord’s offering; the best and holiest part (Numbers
18:26,29,31)
3. Where were the Hebrews to offer their tithes?
They were to bring them to “the place which the Lord your
God will choose out of all your tribes, to put his Name
there” (Deuteronomy 12:5-6,17-18, i.e. Jerusalem). At
the present time, the place where we bring our tithes and
offerings is our local assembly.
The Oath Of Jacob
Then Jacob made a vow, saying, “If God will be with
me and will watch over me on this journey I am taking
and will give me food to eat and clothes to wear so that
I return safely to my father’s house, then the Lord will be
my God and this stone that I have set up as a pillar will
be God’s house, and of all that you give me I will give
you a tenth” (Genesis 28:20-22). Jacob decided to give a
tenth of all that God would give him. No one commanded
him to do so, but his own thankful heart inspired by the
Spirit of God decided to make that commitment.
Method Of Tithing
“No one is to appear before God empty handed” (Exodus
23:15). “Empty handed” indicates one’s unthankful heart
towards God. It also shows one’s lackadaisical approach
towards God. It was required that all males must go to
Jerusalem thrice a year to worship God (Deuteronomy
16:16). God doesn’t want our resources, but this
commandment is to make people aware of the fact that
God gave everything to us and we should not go into the
presence of God with empty hands. It also reinforces the
fact that we should be prepared with a willing spirit to
give and worship God.
“Bring the best of the first fruits of your soil to the
house of the Lord your God” (Exodus 23:19). Moses
commanded the Israelites to bring the best of the first
fruits because it was primarily an agrarian economy. It
implies that in the modern industrial economy, giving
tithes must become the first priority in the order of our
business. Before we allocate our income for paying bills,
we must separate the tithes during each pay cycle.
In Deuteronomy 12:4-6 we read, “You must not worship
the Lord your God in their (Gentiles) way. But you are to
seek the place the Lord your God will choose from among
all your tribes to put his Name there for his dwelling. To
that place you must go; there bring your burnt offerings
and sacrifices, your tithes and special gifts, what you
have vowed to give and your freewill offerings, and the
firstborn of your herds and flocks.”
Moses draws a distinction between the Israelites and the
Gentiles. Israelites were not to follow the way of the
Gentiles. The Gentiles led a morally degraded life and
misled the people of God. They had no experience with a
living God. Their ways of worship and manner of giving
were completely unacceptable to God. “They will be a
snare among you” (Exodus 34:12). “Be careful not to
make a treaty with those who live in the land; for when
they prostitute themselves to their gods and sacrifice to
them, they will invite you and you will eat their sacrifices.
And when you choose some of their daughters as wives
for your sons and those daughters prostitute themselves
to their gods, they will lead your sons to do the same”
(Exodus 34:15-16). “Therefore come out from them and
be separate, says the Lord” (2 Corinthians 6:17). Moses
repeatedly admonishes the Israelites not to make any
compromises or accommodations with the Gentiles. “I see
a people who live apart and do not consider themselves
one of the nations” (Numbers 23:9). The people of God
have an order and distinctiveness in everything. In this
context, they go to a definite place of worship and offer
tithes in that place. We don’t keep changing the place of
worship and also don’t keep fluctuating where to pay our
tithes and offerings. This is a reminder for our consistent
dedication and faithfulness to our local assembly.
Administration
Deuteronomy 26:12, “When you have finished setting
aside a tenth of all your produce in the third year, the
year of the tithe, you shall give it to the Levite, the alien,
the fatherless and the widow, so that they may eat in your
towns and be satisfied.”
According to the needs of the situation, these funds
(tithes and offerings) were to be administered. In one of
the instances, in the New Testament period, the Grecian
widows were being overlooked in the daily distribution
of food. The apostles appointed seven men who were full
of the Spirit and wisdom to take care of the widows (Acts
6:1-4). The Apostle Paul also encouraged the ministry of
giving to the poor in Jerusalem (Galatians 2:10). James
1:27 says, “Religion that God our Father accepts as pure
and faultless is this: to look after orphans and widows in
their distress and to keep oneself from being polluted by
the world.” Jesus spoke in Matthew’s gospel of caring
for the hungry, thirsty, stranger, and sick and visiting
those in prison. “He will reply, “ I tell you the truth,
whatever you did not do for one of the least of these,
you did not do it for me” (Mathew 25:45). 2 Corinthians
8:1-4, “And now, brothers, we want you to know about
the grace that God has given the Macedonian churches.
Out of the most severe trial, their overflowing joy and
their extreme poverty welled up in rich generosity. For I
testify that they gave us much as they were able, and even
beyond their ability. Entirely on their own, they urgently
pleaded with us for the privilege of sharing this service to
the saints.” The Apostle Paul commends the Macedonian
churches for their contributions which they gave out of
their poverty. Philippians 4:14-16, “Yet it was good of
you to share in my troubles. Moreover, as you Philippians
know, in the early days of your acquaintance with the
gospel, when I set out from Macedonia, not one church
shared with me in the matter of giving and receiving
except you only; for even when I was in Thessalonica,
you sent me aid again and again when I was in need.”
The Church at Philippi was known for the ministry of
giving.
Tithe Is A Sacred Portion
Deuteronomy 26:13, “I have removed the sacred
portion from my house and given to the Levite, the
alien, the fatherless, and the widow according to all
you commanded.” The tithe is a holy portion of your
income. That portion belongs to God. Why is it sacred
or holy? It is sacred because you are separating or setting
apart a holy portion that belongs to God. Let’s remind
ourselves that tithes are not given to a person but to the
extension of the kingdom of God. When you offer your
tithes as a sacred portion of your income, God not only

  { id: 40, articleText: `Hebrews 8:5 tells us, “Who serve unto the example and shadow of
heavenly things, as Moses was admonished of God when he was about
to make the tabernacle: for, See, saith he, that thou make all things
according to the pattern shewed to thee in the mount.”
Many scriptures show that we are the living temple of God. What is the
pattern for us? Scripture states that God created all things through Jesus
Christ:
Ephesians 3:9, “And to make all men see what is the fellowship of the
mystery, which from the beginning of the world hath been hid in God,
who created all things by Jesus Christ.”

thrones, or dominions, or principalities, or powers: all things were
created by him, and for him: And he is before all things, and by him all
things consist. And he is the head of the body, the church: who is the
beginning, the firstborn from the dead; that in all things he might have
the preeminence. For it pleased the Father that in him should all fulness
dwell” (See also John 1:1-3, Hebrews 1:1-2, 1 Corinthians 8:6).
I would like you to think about this question. Why would God have
the one who was His beloved Son, and who made everything, sacrifice
Volume LXXVI | Issue 09 | September 2023
himself to redeem his own creation? If creation had turned away from
God, why not erase it and start over? The answer must be that this process
will create sons and daughters of God. Then, what is this process that
creates sons and daughters of God?
John 14:6 says, “Jesus saith unto him, ‘I am the way, the truth, and the
life: no man cometh unto the Father, but by me.’”
I believe that this passage is talking about more than just accepting Jesus

A pattern presented to us by Jesus Christ, and the only pattern and way
that will enable us to be in the presence of God. The apostle John is very
explicit in 1 John 2:6, “He that saith he abideth in him ought himself also
so to walk, even as he walked.”
You cannot live this life by human effort, for Scripture states that no man
can keep the law. No man can walk as Jesus walked. We, as Christians,
must submit ourselves completely to the Holy Spirit. He will direct,
guide and immerse us in Him. We will come to where we do not speak
our own words or do our own works.
Romans 5:10 says, “For if, when we were enemies, we were reconciled

He lives His life, His pattern, through our lives, as we walk in fellowship

Romans 12:1 states, “I beseech you therefore, brethren, by the mercies of

This is a joyful experience. We rest in the God that laid every day of our

the flow of life.
Jesus states that man must leave his own nature behind to follow Him,
in Luke 9:23-24, “And he said to them all, If any man will come after

The apostle Paul, who repeatedly encourages the church to walk

lively stones, are built up a spiritual house, an holy priesthood, to offer

This story has always been referred to as the “Prodigal Son.” But in
many ways, it could be called “The Loving Father.” The title “Father”
is referenced no less than twelve times.
It is the story of a lost, unthankful, wasteful, and rebellious son, just
like you and I are. And it is a story of a loving, patient, faithful praying
father who continued to love his son with all of his heart. We know a
Father like this, our heavenly Father, who seeks that which is lost and
never gives up on us despite our many failures.
There has been much disagreement as to what the term “prodigal”
in this parable really means. Many translations infer that “prodigal”
means reckless behavior, and it does. Some believe the word “prodigal”
means wayward, or rebellious, and certainly these words apply to this
son (and to us).
The “prodigal,” in this text, has a mixed, somewhat confusing,
meaning. I will quote from the writer David Jeremiah, “The noun
actually means a recklessly extravagant spendthrift. While the
younger son behaved this way, so did the father: he gave his sons
everything they asked for and showered them with gifts. God is in
a sense a ‘prodigal Father,’ spending His love extravagantly on his
children from start to finish.”
The unrighteous man or woman, he/she that does not know the love and
protection of the father, spends his/her life working for another master
as a hired servant, much as the prodigal son did.
All the while, family members, and the Saviour of our soul, long
remember their lost ones in prayer before God, praying that they would
come home.
When the prodigal left his home, his father, his land, and his protection
and went to the far country, he soon spent all that he had and longed
to eat the very food that he was feeding the pigs. As he thought of his
father at home, he realized that his father’s servants were fed better and
treated better than he was in this foreign land.
The prodigal son may have said to himself, “I made a big mistake, and I
will repent and go home. When I see my father, I will tell him the truth;
I am no longer worthy to be called his son. I wasted my life. I will beg
him for the privilege of just being his hired servant.”
When a man or woman comes to Christ, they follow similar steps.
Just as the prodigal, we must recognize and acknowledge that we are
sinners, repent (change our direction), confess that nothing of ourselves
is of value, and admit that we have made many mistakes. Then we
repent, go home and come to the Father.
Paul said it like this, “That if you confess with your mouth the
Lord Jesus and believe in your heart that God has raised Him from
the dead, you will be saved. For with the heart one believes unto
righteousness, and with the mouth confession is made unto salvation”
(Romans 10:9-10, NKJV).
The prodigal returned to his father and said, “I am no longer worthy to
be your son, treat me like one of your hired servants.”
Let’s pause a moment and think about what that statement meant: a
“hired servant.”
In Jewish households of that day there were three levels of servants.
Bondservants:
Bondservants were almost like family. They ate with the family, could
conduct business on behalf of the family and were included in many
family affairs.
Bondservants - Hired a Second Class of Servants:
These servants carried out the actual work of the home and of the
bondservants. They were loosely affiliated with the family and estate
owner.
Hired Servants:
This class of servants is what might be called today a “day worker” or
“per diem” worker. They were paid by the day for their labor, but had
no connection or affiliation with the family. They could be hired and
fired at will.
“Treat me like a hired servant,” the prodigal son said. He acknowledged
his sins and did not want to humiliate his father anymore as a member
of his family, but wanted the privilege of working as a day laborer, so
that he might be fed for a day. How humbling to come to this point in
your life. It would have been too bold of a statement for the prodigal to
ask his father to allow him to be part of his family again.
The loving father had other plans for the son. Your Father, my Father,
has plans for us. When we are “willing to be a servant,” God is willing
to make us sons.
John 1:11-12 (KJV), “He came unto his own, and his own received him
not. But as many as received him, to them gave he power to become the
sons of God, even to them that believe on his name.”
When the son made his long journey of travel and repentance back to
his father and home, the father saw him a long way off and ran to him,
embraced him and kissed him. This speaks to us that his loving father
must have been looking at the horizon every day, praying and hoping
that his son would return. The son had rehearsed his speech for his
father. It sounds as if the father had also rehearsed his speech as well.
I can almost hear the father of the prodigal praying to God every night
and day. It may have gone something like this:
“Dear Lord, I have not been the best father to my sons, please forgive
me and compensate for my failures. I pray for my lost son, I pray that
you bring him home. I hold no grudge for his wasteful living. I only
want him home, in my house, in my care. If you return him, dear Lord,
I will be the best father I can be. There will be no remembrance of my
son’s sins between us. It will be a new start. Dear Lord, please, let my
prayer be heard.”
I can also hear in my spirit our Heavenly Father speaking to us, saying,
“Come home. I have a place for you. All is forgiven because of the work
of Jesus on the cross. Come home. Be my Son. The door is open for you.”
“And he arose and came to his father. But when he was still a great

What was the significance of placing a ring on his son’s finger, and

  { id: 41, articleText: `It seems to be the heart of mankind to walk contrary to God’s order for
creation. As soon as children begin to exhibit their own will, they often display
a tendency to only do what they want to do. As adults, the undisciplined seek
to do their own will, in their own way, according to their opinions of what is
right and wrong. The Bible teaches us that, “knowing this first: that scoffers
will come in the last days, walking according to their own lusts” (2 Peter 3:3,
NKJV).
The Bible teaches an order for all of creation that requires voluntary obedience
to authority ordained by the Lord in many areas. This article will address some
key areas along with several scriptures that you may want to use and keep as
quick references.
It is clear that ultimate and all authority resides in our Creator, the only God
of His creation.
Authority Over All Creation Resides In God
Psalm 135:6 (NKJV), “Whatever the Lord pleases He does, in heaven and in
earth, in the seas and in all deep places.”
Isaiah 46:9-10 (NKJV), “Remember the former things of old, for I am God,
and there is no other; I am God, and there is none like Me, declaring the end
from the beginning, and from ancient times things that are not yet done, saying,
‘My counsel shall stand, and I will do all My pleasure.’”
Daniel 4:35 (NKJV), “All the inhabitants of the earth are reputed as nothing;
He does according to His will in the army of heaven and among the inhabitants
of the earth. No one can restrain His hand or say to Him, ‘What have You
Volume LXXVI | Issue 10 | October 2023
done?’”
Matthew 28:18 (NKJV), “And Jesus came and spoke to them, saying, ‘All
authority has been given to Me in heaven and on earth.’”
Ephesians 1:11 (NKJV), “In Him also we have obtained an inheritance, being
predestined according to the purpose of Him who works all things according
to the counsel of His will.”
Colossians 1:16-17 (NKJV), “For by Him all things were created that are
in heaven and that are on earth, visible and invisible, whether thrones or
dominions or principalities or powers. All things were created through Him
and for Him. And He is before all things, and in Him all things consist.”
Revelation 4:11 (NKJV), “You are worthy, O Lord, to receive glory and honor
and power; for You created all things, and by Your will they exist and were
created.”
Submission In The Home
The home is part of the foundation of the church. It was created with a purpose
according to a specific pattern. A pattern that we do not have the right or
authority to change.
Genesis 2:24 (NKJV), “Therefore a man shall leave his father and mother and
be joined to his wife, and they shall become one flesh.”
Within the home, are a husband and a wife, male and female. Both are equally
intelligent. Both are equally vital to the family. Both are uniquely gifted to do
many things. And yet, there are unique and absolute differences between a man
and a woman.
One obvious difference is that only women can produce babies! Here are a
handful of other differences between males and females:
1. Men typically have thicker skin - by about 25 percent. They also have
higher densities of the protein collagen.
2. The differences in density go beyond skin deep. Usually, men also have
denser, stronger bones, tendons, and ligaments than women.
3. On average, men typically have more muscle mass than women. And those
skeletal muscles are faster and more powerful. But women’s muscles more
readily resist fatigue and are faster to recover.
4. The second longest finger for most women is next to their thumb - the
index finger. But men are the opposite. They usually have ring fingers—
those next to their pinkie finger - that are longer than their index fingers.
5. There are differences in the way male and female brains are structured,
and how they process information and interact with chemical signals. For
example, men have more information-containing gray matter, but women
have more white matter, which connects different parts of the brain. Also,
women have bigger memory centers than men.
6. During exercise, women’s primary fuel is fat. For men, it’s carbohydrates.
7. Men have pronounced Adam’s apples. That’s because they have larger
voice boxes that make the surrounding cartilage stick out more.
8. The daily calorie requirement for men is higher than for women. There are
a few reasons for this; higher muscle mass, stature, and basal metabolic
rate. Pound for pound, muscles burn calories at more than double the rate
of fat.
9. Men and women carry different amounts of body fat. The higher body fat
in women - about 10 percent - mostly supports reproductive physiology.
Women typically carry their body fat in their hips and thighs. Fat tends to
deposit around men’s stomachs.
10. Men normally have more red blood cells (4.7-6.1 million cells per
microliter compared to 4.2-5.4 million cells per microliter for women).
11. Women typically have lower blood pressure than men - regardless of race
or ethnicity.
12. Men are less sensitive to cold temperatures.
13. Women have better senses of smell and taste. They have 50 more cells
(neurons) in their olfactory bulbs - the part of the brain responsible for
processing smells. Women also usually have more taste buds than men.
Here is where it gets interesting. Though husband and wife are created equal in
many ways, and physically they are quite different, the Lord asks the woman
to be willing to submit to her husband’s headship. This can be a difficult thing
to do and can only be properly accomplished by first believing in the Scriptures
and God’s plan, and by the help of the Holy Spirit.
God has asked that there be one head in a home, not two. However, the “one
head” should be a blending of both husband and wife’s wisdom in decision-
making. There is no room for “two heads” in a healthy home. In nature, a

  { id: 43, articleText: `Have you ever been left out of a group or even excluded by a single
person, not included, not felt warmly welcomed?
On our part, we should always try to include and warmly welcome
people, especially new people! The Lord tells us to love the stranger!
Deuteronomy 10:18-19, “He does execute the judgment of the fatherless
and widow, and loveth the stranger, in giving him food and raiment. Love
ye therefore the stranger: for ye were strangers in the land of Egypt”
(The King James Version will be used unless otherwise noted).
In Luke 10:33-35, the Samaritan (who was considered a stranger by
many of the Jews, and looked down upon) stopped to help a wounded
stranger by the side of the road. He did seven things for him:
1. Stopped to give of his time.
2. Bound up his wounds.
3. Poured in oil and wine for his wounds.
4. Put him on his donkey.
5. Took him to an inn where he could be cared for.
6. Paid for the man’s stay.
7. Promised to pay for more stay upon returning.
Jesus also talked to a Samaritan woman, a stranger to many of the Jews
(John 4:7-42).
Generally, in safe circumstances, we need to be a church and a people
who are warm, loving, and welcoming, and not cliquish. What does
it mean to be cliquish? The definition of a clique is a small group of
people, with shared interests or other features in common, who spend
time together and do not readily allow others to join them.
Cliques are groups that exclude other people, whether intentionally or
unintentionally. It can happen with children, young people, or adults at
any age or in any type of group. Exclusion can make people feel disliked,
unimportant, hurt and/or angry.
Volume LXXVI | Issue 12 | December 2023
Watch these situations and consider what the Lord really wants us to do:
1. Children and young people, as an example:
If you are a group playing soccer, or some other sport, and
someone comes along, stands nearby and you sense they want
to play, include them. Can you try to warmly welcome new
people? If you are playing, or visiting with a group of friends,
and someone wants to join, include them. Now wisdom is
always needed because the scripture also says to “Prove all
things: hold fast that which is good” (1 Thessalonians 5:21).
There is a saying that is often spoken to children, “Don’t talk to
strangers.” This is just a warning that some strangers can mean
harm. Your parents and others can give you guidance.
2. You are having a party or activity:
Do you leave out people who would normally be part of that
group? Could you invite people who aren’t even part of the
group? There is the parable in the Bible of invited guests to a
banquet not coming, so the hosts went into the highways and
byways to invite people (Matthew 22:1-14, Luke 14:16-24). As
an example, at birthday celebrations or Christmas parties, etc.
invite people who are lonely, or left out.
3. Including people who are not like us:
Do we have a tendency to leave out or look down on certain
types of people? If we do, let’s change that. Do we leave out
people who are older or younger than we are, or not in our age
group? All age groups need to appreciate all other age groups.
Remember, we are one body in Jesus! We can all learn from
one another! Does your family only talk to certain families and
not others? What does Jesus want? I believe he wants us to be
friendly to all.
4. Within the family, there can be rejection:
Think of Joseph (Genesis 37:3-11). Joseph was
hated by his own brothers. You see someone who is
alone, shut in, or needs a friend. What can you do?
You see people who are not of the same faith, race or culture, etc.
as you. Can you and I make an effort to make friends with them?
Warnings to help balance the above:
1. Proverbs 1:16-22 tells us to be careful of those that run to do
evil. Avoid scorners and others that are like that.
2. We are to prove all things (1 Thessalonians 5:21).
3. We must recognize that each person is unique. Respect those
differences. People can have a high wall (a major barrier in
relationships) or a low wall (easy to have relationships) in two
areas - their family (those close to them) and all people (not in
their family or those they don’t know as well).
4. We have been warned that running off to evangelize the
world and not look after our own family is a disorder
(2 Thessalonians 3:10).
5. Jesus was the perfect example. He could talk to everybody
and love them. However, he never neglected his family or his
disciples. I feel it is just outstanding that Jesus, even when He
had all that pain on the cross, took care of His mom by asking
John to take care of her and call her mother, and told his mother
to take John as her son (John 19:25-27).
What does it mean to be warm and welcoming? Romans 12:9-10, “Let
love be without dissimulation. Abhor that which is evil; cleave to that
which is good. Be kindly affectioned one to another with brotherly love;
in honour preferring one another.” The Phillips translation gives more
enlightenment, “Let us have no imitation Christian love. Let us have a
genuine break with evil and a real devotion to good. Let us have real
warm affection for one another as between brothers, and a willingness to
let the other man have the credit.”
We need to be a warm church because many people are suffering from
the cold within their hearts. Everyone needs to feel accepted and loved.
We have to remember we all sin, we’re not perfect and we are in all
different stages of spiritual growth. A warm, welcoming church includes

{ id: 44, articleText: `In this article, I would like to emphasize the significance of the spiritual legacy that can be passed on to our posterity. The Webster's Dictionary defines legacy as handed down from the past, as from an ancestor or predecessor. Joshua made a defying cry to the Israelites regarding the choice they would make for their generation (Joshua 24:14-15).

Joshua believed that his people would serve the Lord God, and he challenged them to make a commitment through his own example. Serving the Lord was the heritage that he passed on to his family.

Family Altar: The first and foremost spiritual legacy we can exemplify to our generation is family worship. A family that prays together stays together. The father of the family is also the priest of the family and has an obligation to call his wife and children for family prayer.

Family Table: The family dinner table provides a wonderful occasion for the members of the family to sit and talk to each other. A family that eats and communes together can share the experiences of the day.

Family Occupation: The father of the family must have an occupation. He should be willing to teach his children the ethical value of his trade.

Family Finances: Teaching financial principles or values is the key factor to the economic health of our generation. One of the effective ways of devoting our resources is tithing, which is a divine order.

Family Trait and Hospitality: A Christian, born-again family is uniquely different from the rest of the families in a locality. Punctuality, honesty, truthfulness, generosity, and hospitality are some of their traits.

Discipline: Christian discipline is one of the many legacies that can be passed on from family to family. A family that does not instill discipline at an early age will have to pay a great price for the consequences of indiscipline.

Inculcation of the Fruit of the Spirit: Another of the important legacies of a family is the exercise or demonstration of the fruit of the Spirit. The fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, and self-control (Galatians 5:22-23).

Encouragement: As parents, it is very easy to get angry at children and be unreasonable. Encouraging is better than criticizing. Every child is not born gifted. They need time and space to grow, just like a seedling needs sunlight and water.

The legacy that the earlier generation can pass on to the next is not primarily material things, but rather spiritual attributes. Therefore, my dear brothers, stand firm. Let nothing move you. Always give yourselves fully to the work of the Lord, because you know that your labor in the Lord is not in vain (1 Corinthians 15:58).`, author: 'PJ Mathew', year: 2022, month: 'January', volume: 'Vol. LXXV, No. 01', title: 'Spiritual Legacy', topics: ['Scripture','Marriage & Family','Discipleship'], excerpt: 'PJ Mathew outlines seven spiritual legacies families can pass to the next generation: family altar, family table, family occupation, family finances, family traits and hospitality, discipline, the fruit of the Spirit, and encouragement.', pdf: '01%20-%20Sharon%20Star%20-%20January%202022.pdf', fileName: '01_-_Sharon_Star_-_January_2022.pdf'  },
  { id: 45, articleText: `Godly Counsel: Bernard James

Godly counsel lines up with the truth of God's word. It is not carnal, nor selfish, nor deceitful. This type of counsel appeals to our spirit rather than our flesh. The wisdom that is from above is first pure, then peaceable, gentle, willing to yield, full of mercy and good fruits, without partiality and without hypocrisy (James 3:17, NKJV).

The first step in decision making for believers should be bringing our cares and concerns to the Lord in humble submission; seeking the Father's counsel on issues through prayer and spending time in His Word. We ought to involve Jesus, The Great Counselor, in our entire decision-making. Isaiah 9:6 says His name shall be called Wonderful, Counselor, Mighty God, Everlasting Father, Prince of Peace.

Throughout the course of our lives, we are constantly faced with the process of decision-making. Whatever decisions we make, however big or small, will have an effect on us and the people around us. In all your ways acknowledge Him and He shall direct your paths (Proverbs 3:6, NKJV).

God has provided godly men and women among us who we can go to for counsel. Moses' father-in-law Jethro offered wise counsel when he saw Moses bearing all responsibilities alone, and Moses humbled himself and heeded. When we heed godly counsel our lives become easier and better.

In Revelation, Jesus gave counsel to the lukewarm church at Laodicea, calling them to be pure and rich in Him. As members of the body of Christ, we should not despise the counsel of God given through the Apostolic Ministries.

We cannot rely on the ungodly to give us spiritual counsel. Blessed is the man who walks not in the counsel of the ungodly, nor stands in the path of sinners, nor sits in the seat of the scornful (Psalm 1:1, NKJV).

We must first learn to trust the Lord in whatever we are about to undertake. Trust in the Lord with all your heart, and lean not on your own understanding; in all your ways acknowledge Him, and He shall direct your paths (Proverbs 3:5-6, NKJV). As we heed God's counsel we gain wisdom.

A Letter to Young Fathers: Brian Hannigan

I write today to young fathers believing that they want to be the best dads possible for their children. Looking back at my own record I readily admit that I rarely knew what I was doing. I have no doubt that you, as fathers, want to create the kind of spiritual atmosphere in your homes that will give your children the best possible opportunity to serve the Lord.

Here are a few thoughts that I hope will encourage you as you raise your children:

1. Don't try to do the work of the Holy Spirit. Let the Holy Spirit do the Holy Spirit's work! Rest in the magnificence of the Holy Spirit's desire to lead your children. We as parents have one primary recourse; praying our hearts out for our sons and daughters.

2. Perhaps all Christian young people leave their Christian homes with enough wounds and bruises that they will need the Lord when they depart. God will see to it that our children will need to cry out to Him for help, despite our best efforts.

3. I wanted my boys to follow the same path I did, but they were totally different human beings from me. If there is one super mistake I made, it was trying to force them to be in my image. Instead, I wish I had celebrated their uniqueness more, and trusted the Lord to shape them in His image.

4. The Holey Umbrella: If I kept my holey umbrella under God's holy umbrella, it wouldn't matter how tattered my covering was, my family would be safe.

5. It is built into a young man to pull away from his dad. God can give you the wisdom to pull back from parenting him like he is still a child. Give your teen some space, more autonomy, more respect, accompanied by more responsibility.

6. Don't have to be right all the time. I went for counseling with a godly father in the church. He said, Don't be right all the time. The counseling didn't change the behavior of the son, but it changed mine.

7. Pray with your wife. Have that partnership in prayer with your wife. If we can unite in prayer and make use of the godly wisdom from our wives, we give God more room to move.

If you commit your family to the Lord, He will keep your commitment: I know whom I have believed, and I am persuaded, that He is the one who keeps what I commit to Him against that day (2 Timothy 1:12).`, subtitle: 'A Letter to Young Fathers: Brian Hannigan', author: 'Bernard James', year: 2022, month: 'February', volume: 'Vol. LXXV, No. 02', title: 'Godly Counsel', topics: ['Scripture','Discipleship','Marriage & Family'], excerpt: 'Bernard James examines the nature of godly counsel, drawing on Moses and Jethro, Jesus as the Great Counselor, and the Apostolic Ministries. Brian Hannigan writes a personal letter to young fathers with seven practical encouragements for raising children in the Lord.', pdf: '02%20-%20Sharon%20Star%20-%20February%202022.pdf', fileName: '02_-_Sharon_Star_-_February_2022.pdf'  },
  { id: 46, articleText: `Most of us have become very familiar with the term gospel of the kingdom. However, familiarity with something can sometimes prevent us from developing a true understanding and full appreciation of it. The gospel of the kingdom could be defined as the good news concerning all the aspects of the domain where God is king.

In the very first two chapters of Genesis, God created man in His own image and gave him dominion over the earth. God has great plans for what He wants to do in the earth, and He plans to delegate significant authority to man. Because of his rebellion, man proved himself unqualified to fulfill his part of God's plan.

God called Abram and through him chose Israel to be the flagship, the example to all nations of what God could accomplish through a people whose God is the Lord. Israel, through their disobedience, also proved themselves unqualified. Therefore God called One from Israel who alone, on the basis of a sinless life, would fulfill the vocation that Israel could not. He would also call the Gentiles into His light.

God had and remains to have great plans for the earth, but it begins with His Anointed One, Jesus. Before God could continue with His plans, He would have to deal with the problem of man's sin, which He accomplished through the cross. He disarmed those who once ruled over us and put them on display to the world to show His victory by means of the cross.

When Jesus began His public ministry, He announced that the kingdom of heaven was at hand. He stated clearly that His purpose for coming to earth was to preach the kingdom of God. The kingdom of God is not meant for the heavenlies only but also for the earth.

Not only have we been forgiven of our sins and guaranteed eternal life, but we have been translated out of Satan's kingdom of darkness and into the glorious kingdom of God's Son. We are now citizens of that new kingdom, and we are offered the privilege and the responsibility to participate in its building.

Unity is absolutely critical. The Holy Spirit is the Great Equalizer. May we not allow insignificant differences among us as members of the body of Christ to prevent us from entering the kingdom of God. Let us be willing to give up our little kingdom of one that we might be a contributing citizen of the kingdom of the Son of God's love.`, author: 'David Luff', year: 2022, month: 'March', volume: 'Vol. LXXV, No. 03', title: 'The Gospel of the Kingdom', topics: ['Scripture','Faith','Discipleship'], excerpt: 'David Luff traces the gospel of the kingdom from Genesis through Abraham, Israel, and Isaiah\'s suffering servant to Christ, arguing that salvation is not an escape from the world but a commission to participate in building God\'s kingdom on earth, united by the Holy Spirit.', pdf: '03%20-%20Sharon%20Star%20-%20March%202022.pdf', fileName: '03_-_Sharon_Star_-_March_2022.pdf'  },
  { id: 47, articleText: `For about 18 months, during our Wednesday night zoom Bible study, we have been covering the writings and journeys of the apostle Paul. Recently, we finished the last letter that the apostle Paul wrote in 2 Timothy. After having a better understanding of what was happening when Paul wrote his last book, before being executed, it brings the book alive in a new way.

Paul wrote about half of the books in the New Testament. He saw miracles and the hand of God displayed with might and power. And yet Paul also saw dark days: beaten, stoned, left for dead, shipwrecked, and at the end of his life feeling the pain of loneliness after being abandoned by many companions.

2 Timothy finds Paul in a prison in the center of Rome that was once a water cistern, perhaps eighteen feet in diameter. He was most likely lowered in from a hole in the ceiling. Paul wrote his last letter about 67 AD during the maniacal rulership of Nero, who was blaming Christians for Rome's crises. Many Christians were crucified and put to death. Paul was spared literally from the mouths of lions in the Colosseum (2 Timothy 4:17).

What is so profound about 2 Timothy is what Paul says and what Paul does not say. He does not rail against Nero and Rome, assert his civil rights, or complain about the politics of the hour. Instead he encourages prayer for all leaders and rulers.

Stir up the gift that is within you. Paul encourages Timothy to stir up the gift God had given him. Often our gifts can begin to go dormant, like neglected embers in a wood-burning stove. We can stir our gifts up through prayer, speaking in tongues, reading the Scriptures and spending time in the presence of the Lord.

The Pattern For The Church: Commit these to faithful men who will be able to teach others also (2 Timothy 2:2, NKJV). The simple order of apostolic ministry, setting elders and deacons in local assemblies from men of their own, is the pattern of the New Testament.

The Heart Of Mankind In The Last Days: In the last days perilous times will come: men will be lovers of themselves, lovers of money, boasters, proud, blasphemers, disobedient to parents, unthankful, unholy (2 Timothy 3:1-5, NKJV). Of such, turn away.
