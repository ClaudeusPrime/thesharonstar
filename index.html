6. Practice Rejoicing. "Rejoice in the Lord always; again I will say, rejoice" (Philippians 4:4). "The joy of the Lord is your strength" (Nehemiah 8:10). Christian joy must be contagious enough to fill your home and church alike. "Rejoice always, pray continually, give thanks in all circumstances; for this is God's will for you in Christ Jesus" (1 Thessalonians 5:16-18).

7. Learn To Be Flexible. The secret of the Christian life is accepting Jesus as our Potter and willing to become clay in His hands. "To obey is better than sacrifice, and to heed is better than the fat of rams" (1 Samuel 15:22-23). Be flexible and pliable in the hands of God so you can be used of Him.

8. Pace Yourself. The Christian life is not a sprint, but rather a marathon. Allow God to carry out His perfect plan for your life. "Be strong and courageous. Do not be afraid; do not be discouraged, for the Lord your God will be with you wherever you go" (Joshua 1:9). When the Israelites were in the wilderness for forty years they were led by the cloud — a type of the Holy Spirit.

9. Seek God Every Day. "Seek ye first the kingdom of God and all his righteousness and all these things shall be added unto you" (Matthew 6:33). "Seek and you shall find, ask and you shall receive and knock and it shall open" (Luke 11:9). Moses when he spent forty days on the Holy Mountain, his face shone with the glory of God.

10. Discover Your Spiritual Gift In The Body Of Christ. The church is the body of Christ and each person is a member in particular. "We have different gifts, according to the grace given to each of us" (Romans 12:6). Our spiritual life must be goal-oriented with a quiet time, prayer, fervor, forgiveness, being flexible, steadfastness, discovering our gifts in the body and being in total surrender to the plan of God.`, subtitle: '', author: 'PJ Mathew', year: 2018, month: 'April', volume: 'Vol. LXXI, No. 04', title: 'Principles of Practical Christian Living', topics: ['Discipleship','Prayer','Faith','Scripture'], excerpt: 'PJ Mathew presents ten principles of practical Christian living — daily quiet time with God, feeding the fire of zeal, resisting the devil through prayer and fasting, letting go of the past, forgiving others, practicing joy, being flexible as clay in God\'s hands, pacing yourself like a marathon runner, seeking God daily, and discovering your spiritual gift in the body of Christ.', pdf: '04%20-%20Sharon%20Star%20-%20April%202018.pdf', fileName: '04_-_Sharon_Star_-_April_2018.pdf' },
  { id: 95, articleText: `Perseverance: Andy Snoke

In this present hour of revelation to the Church, the Lord would remind us of the importance of perseverance. The definition of perseverance is: steadfastness in doing something despite difficulty or delay in achieving success. Charles Spurgeon said, "By perseverance the snail reached the ark." Perseverance is the ability to continue pressing forward in spite of our feelings of discouragement, or the difficulties that we encounter on the pathway of faith.

The Book of Job: The familiar story of Job reminds us how a believer can persevere in the face of great hardship hanging on to his faith and integrity. "You have heard of the perseverance of Job and seen the end intended by the Lord — that the Lord is very compassionate and merciful" (James 5:10-11).

The Book of the Prophet Jeremiah: His life was threatened (Jeremiah 37:17-21). He was cast into the dungeon (Jeremiah 38:1-6). He was placed in the stocks (Jeremiah 20:1). His people of Anathoth resisted him and sought his life (Jeremiah 11:21-22). When Jeremiah prophesied the word of God, the priests, the false prophets and all the people mistreated him. Nevertheless, Jeremiah persevered (Jeremiah 26:8-11).

The Widow in Luke 18 — often called the "Parable of Perseverance": The widow persistently begged for justice from an unrighteous judge who yielded to her persistent demand so as to stop her from pestering him. "And shall not God avenge his own elect, which cry day and night unto him, though he bear long with them? I tell you that he will avenge them speedily" (Luke 18:7-8).

The Apostle Paul: "We are troubled on every side, yet not distressed; we are perplexed, but not in despair; persecuted, but not forsaken; cast down, but not destroyed" (2 Corinthians 4:8-9). Paul describes his own difficulties: stripes above measure, prisons, stoned, three times shipwrecked, in perils of waters, robbers, countrymen, heathen, city, wilderness, sea, false brethren; hunger and thirst, cold and nakedness. At the end of life, Paul could confidently exclaim: "I have fought a good fight, I have finished my course, I have kept the faith: Henceforth there is laid up for me a crown of righteousness" (2 Timothy 4:6-8). The Bible encourages us: "Let us hold fast the confession of our hope without wavering, for He who promised is faithful" (Hebrews 10:23). "Let us not become weary in doing good, for at the proper time we will reap a harvest if we do not give up" (Galatians 6:9).

The church was privileged to experience the moving of the Spirit of God during the Feast of 2018 in North Battleford. It is the mind of the Lord for the universal church to participate in a time of prayer and fasting from June 4-8, 2018, the 70th anniversary of the outpouring of the Spirit of revelation in 1948. This revival was ushered in on the wings of prayer and fasting. Let us seek God for: the gifts of the Spirit functioning in the body; God's people walking in humility and submission; being true to the vision of Christ being fully formed within us; unity in the church; and walking in fervent intercessory prayer, reverence, repentance and forgiveness. "If My people who are called by My name will humble themselves and pray and seek My face, and turn from their wicked ways, then I will hear from heaven, and will forgive their sin and heal their land" (2 Chronicles 7:14).`, subtitle: '', author: 'Andy Snoke', year: 2018, month: 'May', volume: 'Vol. LXXI, No. 05', title: 'Perseverance', topics: ['Faith','Prayer','Scripture','Discipleship'], excerpt: 'Andy Snoke calls the church to perseverance through the examples of Job, Jeremiah, the persistent widow of Luke 18, and the Apostle Paul\'s catalogue of sufferings — then issues a universal call to prayer and fasting June 4-8, 2018, marking the 70th anniversary of the 1948 revival, with five specific petitions for the church.', pdf: '05%20-%20Sharon%20Star%20-%20May%202018.pdf', fileName: '05_-_Sharon_Star_-_May_2018.pdf' },
  { id: 96, articleText: `The Valley Experiences: Robert Persaud

The valleys are geological formations which are made by running rivers and shifting glaciers. Sometimes we experience severe discouragements in various shapes and forms — depression due to physical and emotional illnesses, financial difficulties and a plethora of uncertainties. These challenging times can be considered the valley experiences in life's journey. The Lord will never leave His people in the valley alone. He has promised to be with us at all times: "Lo, I am with you always, even unto the end of the world" (Matthew 28:20).

Our God Is Not Only The God Of the Mountains — He Is God Of The Valleys Too: The Syrians said, "The Lord is God of the hills, but he is not God of the valleys." God responded through a man of God: "therefore will I deliver all this great multitude into thine hand, and ye shall know that I am the Lord" (1 Kings 20:28). Our objective as God's people is to focus on Him and not on the surrounding circumstances. God allows the trials of life to strengthen our faith and build our confidence in Him. "And we know that all things work together for good to them that love God, to them who are called according to his purpose" (Romans 8:28).

The Valley Is A Place Where The Will Of God Takes Us And Where The Grace Of God Will Sustain Us: Our Lord proceeded to the Garden of Gethsemane via the Kidron Valley. His sweat were as drops of blood: "Abba, father, all things are possible unto thee; take away this cup from me: nevertheless, not what I will, but what thou wilt" (Mark 14:36).

Valleys Do Not Cause The Stream — It Is The Stream That Causes The Valleys: Baca means the place of weeping. "Who passing through the valley of Baca make it a well; the rain also filleth the pools. They go from strength to strength, every one of them in Zion appeareth before God" (Psalm 84:6-7).

God's Restoration Takes Place Within The Valleys Of Dry Bones: Ezekiel was very submissive to the knowledge of the holy One. Dead bones in the valley can no longer stand in the way of what the Spirit of God is accomplishing today (Ezekiel 37).

David painted a wonderful picture of the shepherd's psalm — no want, green pastures, still waters and the paths of righteousness (Psalm 23). "Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me" (Psalm 23:4).

Our valleys are permitted by the Lord. Joseph attended the "Pit to the Prison" university in Egypt. He never dithered in his tenure; he graduated to the palace and was given the highest honor in the kingdom of Pharaoh. "But as for you, ye thought evil against me; but God meant it unto good, to bring to pass, as it is this day, to save much people alive" (Genesis 50:20).

---

The Move of the Spirit Foretold in Prophecy: Dave Levson

It is my sincere desire that the reader will be able to understand the great treasures to the church that God gave as He moved by the Holy Spirit in 1948 at North Battleford. He was moving, He is moving, and He will always move by His Spirit. God often confirms His will through prophecy that foretells His plans and purposes. God gave our mom, Thelma Levson, a prophecy telling of the 1948 moving of the Holy Spirit in North Battleford two years before it even began! In the summer of 1946, they arrived in North Battleford with $5.00 for two rooms but no money for food. They entered a forced fast and much prayer. During a Sunday night service, the Spirit of God came upon mom in the form of rain, gently, then in a downpour. She could hardly stand through weakness as she started to prophesy. The prophecy went: "Behold, I will pour out my Spirit upon all flesh and your sons and daughters shall prophesy and on my servants and on my handmaidens I will pour out my Spirit and they shall prophesy. Behold, I will do a new thing in the earth and it shall spring forth speedily. There shall be such a mighty revival that the world has never seen, an outpouring of my Spirit, even the early and latter rain and it shall begin right here and it will never end!" She never forgot the prophecy. When they heard about the revival in North Battleford, she knew it was the fulfillment. This move of the Spirit continues to this day. God has restored the five-fold ministry (Ephesians 4:11), the nine gifts of the spirit (1 Corinthians 12:8-11), and is establishing His kingdom order in His church. In all things we need to be led by the anointing of the Holy Spirit and God's Word, the Bible.`, subtitle: 'The Move of the Spirit Foretold in Prophecy: Dave Levson', author: 'Robert Persaud', year: 2018, month: 'June', volume: 'Vol. LXXI, No. 06', title: 'The Valley Experiences', topics: ['Faith','Testimony','Holy Spirit','Scripture'], excerpt: 'Robert Persaud draws on the Syrians\' challenge, the Valley of Baca, Gethsemane, Ezekiel\'s dry bones, Psalm 23, and Joseph\'s pit-to-palace journey to show that God is as present in the valleys as on the mountains; then Dave Levson shares the family testimony of Thelma Levson\'s 1946 prophecy in North Battleford that foretold the 1948 revival in precise detail.', pdf: '06%20-%20Sharon%20Star%20-%20June%202018.pdf', fileName: '06_-_Sharon_Star_-_June_2018.pdf' },
  { id: 97, articleText: `Spirituals: Markus Hansen

Apostle Paul wrote in 1 Corinthians 12:1, "Now concerning spiritual gifts, brethren, I would not have you ignorant." It was through the operation of the nine gifts of the Holy Spirit that God made Jesus known to the world. Jesus possessed all nine gifts of the Holy Spirit as mentioned in 1 Corinthians 12:8-10, plus abilities not listed there. The Holy Spirit is the one that gives spiritual gifts (spirituals), and they are given by His sovereign will. "It is the same and only Holy Spirit who gives all these gifts and powers, deciding which each one of us should have" (1 Corinthians 12:11). God is the ultimate judge deciding if and when we are ready to receive our gift or gifts. We do not pick and choose our gift or gifts.

The North Battleford revival of 1948 was born on the wings of much prayer and fasting, leading to a new level of liberty in prophecy. Here is one of the early prophecies: "I will at this time restore to the Church the nine gifts of the Spirit and they shall be received by prophecy and the laying on of the hands of the presbytery." Looking back we realize that the impartation of the nine gifts of the Holy Spirit to God's church was the springboard that launched this present move of the Holy Spirit into existence. This principle truth distinguishes this present move from Christendom today and brought an end to the one-man ministry.

The reason that God restored spiritual gifts is so the saints of God can be established on the foundation of the kingdom of God and become functioning members of the body of Christ. Points to remember: when entering a meeting place in anticipation of Holy Spirit impartation, we must be very reverent; the recipient should not boast about what God has revealed to them; God gave clear instructions — gifts are to be given by prophecy and the laying on of the hands of a presbytery of elders (indicating a plurality); the Holy Spirit will indicate who is prepared and ready to receive.

The nine gifts of the Holy Spirit outlined in 1 Corinthians 12:8-10 differ from natural talents in that they do not depend on one's personal talents or abilities to operate them. They are Holy Spirit-inspired and rely on the anointing of God to function. We are not born with the nine gifts of the Holy Spirit; they are Holy Spirit-imparted. "The Holy Spirit displays God's power through each of us as a means of helping the entire church" (1 Corinthians 12:7). The Scriptures also mention various ministries necessary in the church: prayer and intercession, preaching and teaching, exhortation, giving, showing mercy, hospitality, helps, administration, and leading worship.

Serving For God's Glory: Paul encouraged Timothy not to neglect the gifts given to him by the presbytery (1 Timothy 4:14). Everyone who has received their gifts is responsible before God to yield their lives to the Holy Spirit. How do we stir up our gifts? Daily reading of the Bible, daily praying, daily speaking in spiritual tongues, attending church consistently (Hebrews 10:19-25), and fellowshipping with the saints of God.

Making Room for All to Minister: Local elders have the responsibility to make room for members to employ their gifts. Every single member has a place in the church and is critically important to every other member. Growth in maturity and in numbers will occur when every member of the body of Christ fulfills their responsibility.

A Word of Caution: To be of value to the body of Christ, one's ministry must function under the anointing of the Holy Spirit. Ministering under the anointing will always elevate Christ and bring glory to our heavenly Father, not MAN. Over-ministering and ministering too often can rob others of the opportunity to minister. "For you can all prophesy one by one, so that everyone may be instructed and everyone may be encouraged" (1 Corinthians 14:30-32).`, subtitle: '', author: 'Markus Hansen', year: 2018, month: 'July', volume: 'Vol. LXXI, No. 07', title: 'Spirituals', topics: ['Holy Spirit','Kingdom','Scripture','Discipleship'], excerpt: 'Markus Hansen gives a comprehensive teaching on the nine gifts of the Holy Spirit — their origin in the 1948 North Battleford revival prophecy, how they differ from natural talents, the proper presbytery pattern for their impartation, the ministries of the church not listed among the nine gifts, and practical guidance on stirring up, using, and making room for all to minister without over-ministering.', pdf: '07%20-%20Sharon%20Star%20-%20July%202018.pdf', fileName: '07_-_Sharon_Star_-_July_2018.pdf' },
  { id: 98, articleText: `Holy: Brian Hannigan

"Oh, magnify the Lord," declares the psalmist. In Christian life we often encounter the term 'holy.' When we think of God's holiness our minds imagine His purity, His perfect loveliness, a profound sense of awe and reverence. God is most Holy; the Holy One. What is profound is His whole statement: "Be ye holy as I am holy" (1 Peter 1:16). He expects us to be holy. The quality of that holiness is also clear: our holiness will be like God's holiness. How can a Holy God expect holiness in mankind? The notion staggers human reason. Yet there can be residing in the heart of believers in Jesus Christ a faith, imparted at salvation, that can embrace this expectation of God. God would not require such a thing if it were not achievable. Just as washing with clean water makes us clean, so it is the work of the Holy Spirit to make us holy. There is only one path into holiness. It is attained through the abiding relationship with Jesus Christ along with the accompanying work of His Holy Spirit. This was always God's plan. This is what was meant when God said, "Let us make man in Our image, and after Our likeness" (Genesis 1:26). Holiness will be more than the attainment of individuals — it will be the entering in of a corporate Body. Ephesians 4 describes a people coming to "the measure of the stature of the fulness of Christ" built on the apostolic foundation. So, it will not be human achievement, but the work of God. What will be your state when you are holy? You will be free of fear, of hatred, anger, temptation, confusion, compromise, failure, criticism, contempt, weakness, pride, selfishness, rebellion, sin, sickness, despair, loneliness, division, and death. You will operate in perpetual joy, hope, wisdom, faith, power, fellowship, unity, health, friendship, and love. "You will be transformed into the same likeness, from glory to glory, by the Spirit of God" (2 Corinthians 3:18).

---

The World's Pattern Is Not God's Pattern: Kurt Amundson

There are ever-present those who wish to adopt modern church vernacular — they are really saying they wish that the church would "conform to the pattern of this world." The pressures to conform are unceasing. The institution of marriage, the home, the church, our work ethic and personal integrity are constantly under pressure to deviate from the patterns established by God. This pressure has existed for thousands of years. God established an order for the social and religious life of His people, Israel, as recorded in the Old Testament. God set forth a pattern for temple worship and simply asked Israel to be obedient. The Levitical priesthood was God's pattern established for the benefit of His people. Following the death of King Solomon, Jeroboam became king over 10 of the 12 tribes of Israel. After becoming king, Jeroboam feared the people would abandon him. He reacted by changing the pattern God established: "Jeroboam built shrines on high places and appointed priests from all sorts of people, even though they were not Levites" (1 Kings 12:31). Jeroboam began to yield to the pattern of the world. He "loved praise from men more than praise from God" (John 12:43). "This was the sin of the house of Jeroboam that led to its downfall and to its destruction from the face of the earth" (1 Kings 13:34). Israel's downfall was a result of walking in all the sinful ways of Jeroboam, which included idolatry and deviating from the pattern God had set. In our present day, we must actively choose to uphold the pattern of the home, marriage, and church. God knows we will not be perfect as we are learning to walk according to His pattern, but He has promised to eventually perfect us. "Do not conform any longer to the pattern of this world, but be transformed by the renewing of your mind" (Romans 12:2).`, subtitle: 'The World\'s Pattern Is Not God\'s Pattern: Kurt Amundson', author: 'Brian Hannigan', year: 2018, month: 'August', volume: 'Vol. LXXI, No. 08', title: 'Holy', topics: ['Discipleship','Scripture','Holy Spirit','Kingdom'], excerpt: 'Brian Hannigan explores the divine command "Be ye holy as I am holy" — showing that holiness is not human achievement but the work of the Holy Spirit in a corporate body growing into the fullness of Christ; then Kurt Amundson traces the sin of Jeroboam who appointed non-Levite priests and changed God\'s established pattern, applying this as a warning against conforming the church, home, and marriage to the world\'s pattern.', pdf: '08%20-%20Sharon%20Star%20-%20August%202018.pdf', fileName: '08_-_Sharon_Star_-_August_2018.pdf' },
  { id: 99, articleText: `Spiritual House: Eldon Olson

Is this the house that Eldon built? No. Is this the house that Ralph built? No. Is this the house that Frank built? No. This is the house that Christ built. "And I also say to you that you are Peter, and on this rock I will build My church, and the gates of Hades shall not prevail against it" (Matthew 16:18). I am talking about the Move of the Spirit, The House That God Has Built. Although this is 2018, we are not interested in getting up with the times. What was written down by the unction of the Holy Spirit is what is preached today. This isn't a man's organization to be changed by every whim of the speaker or listener. When you and I accepted Jesus as our Lord and Saviour, the past in our lives was put at naught, set behind us. It is not a way of life where we pack everything we have been forgiven for in a bag and then down the road open the bag and haul out those lifestyle things and sins and continue on as if everything is just fine. Either He directs our lives, or we direct them. If we direct our lives, any thought, any idea, any buzzword, any controversy, any compromise, becomes validated in our own minds. We become judge and jury. We become lost in ourselves. That is not Christianity. Christianity is yielding to God, Christ and the Holy Spirit.

---

This Wonderful Move of God: Kenneth Wensley

It is wonderful to be part of this wonderful Move of God. There have been many wonderful things revealed and taught since this Move of the Spirit began and I dare say we need every one of them. We were admonished in the beginning to never put a name on it. For that reason, we have never called it anything but the Move of the Spirit. God separated us in the beginning of this move. It was a complete separation, and everything became new. It became the mind of the Spirit in control rather than the mind of man. Even the Bible became a new book as everything we read was raised to the level of the kingdom. What happened can be likened to the children of Israel coming out of Egypt — Egypt is a type of the world, and everything that functions by the mind of man is of the world. God is sovereign in every beginning. God sets the pattern. The anointing that pervaded the move in the beginning was very wonderful — it was called the anointing of feeling. That anointing is within the realm of God's sovereignty and is temporary, like the love and attraction that will bring two together in marriage. When that level of anointing began to fade, we became conscious of a stirring within — far more wonderful, far richer, far deeper. It no longer mattered how we felt, for we could say from the depths of our innermost being "I know, I know, I know whom I have believed." That level of anointing became known as the anointing of knowing. The third level of anointing is the anointing of being. Here it is no longer a matter of what we have received or of what we know, but of what we have become. It has been God's plan from the beginning — "That we should become the righteousness of God in Him" (2 Corinthians 5:21). The Scripture teaches us to speak the truth in love, to declare that Jesus is truth, and that the anointing is truth. God has been moving us on for which I am grateful. It is still "the move of the Spirit." That remains our desire. Thy Kingdom Come.`, subtitle: 'This Wonderful Move of God: Kenneth Wensley', author: 'Eldon Olson', year: 2018, month: 'September', volume: 'Vol. LXXI, No. 09', title: 'Spiritual House', topics: ['Kingdom','Holy Spirit','Discipleship','Scripture'], excerpt: 'Eldon Olson declares that the Move of the Spirit is the house Christ built, not man, and challenges believers to yield fully to the Holy Spirit rather than validating their own thoughts and compromises; then Kenneth Wensley describes three levels of anointing in the Move — the anointing of feeling, the anointing of knowing, and the anointing of being — tracing how God has progressively deepened His work toward making us the righteousness of God in Him.', pdf: '09%20-%20Sharon%20Star%20-%20September%202018.pdf', fileName: '09_-_Sharon_Star_-_September_2018.pdf' },
  { id: 100, articleText: `God's Process for Redemption: David Luff

Having an understanding of how God has made us as human beings can help us understand God's plan for the redemption of the whole man. Man has a visible part, his physical body, and an invisible part made up of two parts: spirit and soul. "Now may the God of peace Himself sanctify you completely; and may your whole spirit, soul, and body be preserved blameless at the coming of our Lord Jesus Christ" (1 Thessalonians 5:23). "And the Lord God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul" (Genesis 2:7). God formed man's body from the dust; he breathed man's spirit into him, and man became a living soul. In God's design, his spirit was to have the highest authority; his spirit would direct his soul; and his body would be in subjection to the direction of his soul. God communicates with man via his spirit. Man senses God intuitively through his spirit. The soul of man encompasses his intellect, emotions, and will.

After God created Adam and Eve, the fellowship with God was broken through man's disobedience. Their spirits died to God — their ability to commune with God through their spirits was gone. After the fall, man was ruled by his soul. From soul-ruled, man devolved to flesh-ruled. When the flesh becomes the ruling authority, the vilest of behaviors are produced. However, God had a plan to restore fellowship with man. For every man and woman who believes in Jesus Christ and His sacrificial death and subsequent resurrection, a new birth takes place. Our spirits that were dead to God are regenerated and mingled with His Holy Spirit. This is the first step in God's plan to redeem man to the "uttermost."

The Spirit Versus The Fleshly Nature: With the regeneration of our spirits, a wonderful change has taken place, but unfortunately, we are not instantaneously completely "spiritual" yet. Paul wrote that the flesh can never be re-educated, refined, transformed or rehabilitated. Its sentence from God is death by crucifixion. Blessedly this has already been accomplished by our identification with Christ's death on the cross. "I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me" (Galatians 2:20). "Reckon ye also yourselves to be dead indeed unto sin, but alive unto God through Jesus Christ our Lord" (Romans 6:11). Faith follows fact, and experience follows faith. It is the key principle of the entire Christian walk. "For we walk by faith, not by sight" (2 Corinthians 5:7).

The Spirit Versus the Soulish Nature: Now comes the matter of the soul, the second step in God's process of redemption. The problem is that the soul too has been corrupted by the fall and has a very well developed desire to govern the person. The soul must be broken rather than executed such that the spirit can come forth and have rulership over it and thereby the whole being. Just as the fragrance of the spikenard filled the whole room when the alabaster flask was broken (Mark 14:3), so when the spirit of man mingled with the Holy Spirit is released from us into the world, the eternal life of God flows forth to give life to others. It is the sword of the Spirit, the Word of God, which is the tool of the Holy Spirit by which God transforms us from within (Hebrews 4:12).

Redemption of the Body: "In a moment, in the twinkling of an eye, at the last trumpet, the dead will be raised incorruptible, and we shall be changed. For this corruptible must put on incorruption, and this mortal must put on immortality. Then shall be brought to pass the saying: Death is swallowed up in victory" (1 Corinthians 15:52-54).`, subtitle: '', author: 'David Luff', year: 2018, month: 'October', volume: 'Vol. LXXI, No. 10', title: 'God\'s Process for Redemption', topics: ['Scripture','Discipleship','Holy Spirit','Sonship'], excerpt: 'David Luff traces God\'s three-stage process for the redemption of the whole man — the instantaneous regeneration of the spirit at salvation, the progressive breaking of the soulish nature so the spirit can come forth (illustrated by the broken alabaster flask), and the final redemption of the body at the last trumpet — with co-crucifixion with Christ as the key to freedom from the power of both flesh and soul.', pdf: '10%20-%20Sharon%20Star%20-%20October%202018.pdf', fileName: '10_-_Sharon_Star_-_October_2018.pdf' },
  { id: 101, articleText: `The Word of the Lord: Markus Hansen

Throughout the Bible, "The Word of the Lord" and its many derivatives appear time and time again. In all of the derivatives, its origin is from the One and only God of heaven and earth. "My Word," "Thy Word," "The Word," "Your Word," "The Word of God" means God's Word, not the words of men! In the first example of the use of the 'word' in the Bible, God spoke to Abram in a vision: "Do not be afraid, Abram. I am your shield, your exceedingly great reward" (Genesis 15:1). As with Abram, God spoke directly to Moses and Aaron — Moses did not need to confer with anyone else. When Moses received the ten commandments, God spoke all these words, saying: "I am the Lord your God, who brought you out of the land of Egypt" (Exodus 20:1-3). Without a doubt, the ten commandments are God's words not a set of conditions created by man. "And the word of the Lord was rare in those days; there was no widespread revelation" until God called Samuel three times. King David in his psalms often wrote about the "Word of the Lord" — that it is pure, proven, right, true, and powerful to heal and deliver. Jeremiah wrote: "Then the Lord put forth His hand and touched my mouth, and the Lord said to me: 'Behold, I have put My words in your mouth'" (Jeremiah 1:9). Jesus told a story of a farmer who sowed seed on various types of ground. Later He explained: "Now the parable is this: The seed is the word of God" (Luke 8:11). In John 1:1: "In the beginning was the Word, and the Word was with God, and the Word was God." Then in verse 14: "And the Word became flesh and dwelt among us." Christ the Messiah embodies the very nature of God Himself; and the truths uttered from Christ's mouth while He walked on the earth were His Father's words, because Jesus is the "Word!" Jesus boldly stated: "I am the bread of life... I am the light of the world... I am the way, the truth, and the life. No one comes to the Father except through Me" (John 14:6).

How do we find the "Word of the Lord?" "The word is near you, even in your mouth and in your heart" (Romans 10:7). When we testify that Jesus is our Saviour we are speaking the Word of the Lord. "The testimony of Jesus is the spirit of prophecy" (Revelation 19:10). A truth made very real at the beginning of this present move of the Holy Spirit is that true revelation and the Word of God do not come from an exhaustive study of the scriptures or attending Bible school. True revelation is an anointed utterance, proclamation, writing or teaching that comes from God Himself through individuals inspired by the indwelling Holy Spirit. The apostle Paul stated: "The gospel which was preached by me is not according to man... it came through the revelation of Jesus Christ" (Galatians 1:11-12). In order to speak the Word of God, we have to be open and receptive to the Holy Spirit. Spirit to Spirit! "God is Spirit, and those who worship Him must worship in spirit and truth" (John 4:24). Looking to the scriptures the Holy Spirit revealed that: "By the mouth of two or three witnesses every word shall be established" (2 Corinthians 13:1) and "Let two or three prophets speak, and let the others judge" (1 Corinthians 14:29). This has been the practice since the beginning of this present move of the Holy Spirit. With sincere hearts let us daily seek God, read His Word and speak in the unknown language so that we can be in tune with the leading of the Holy Spirit. "Pursue love, and desire spiritual gifts, but especially that you may prophesy" (1 Corinthians 14:1).`, subtitle: '', author: 'Markus Hansen', year: 2018, month: 'November', volume: 'Vol. LXXI, No. 11', title: 'The Word of the Lord', topics: ['Scripture','Holy Spirit','Kingdom','Discipleship'], excerpt: 'Markus Hansen traces "The Word of the Lord" from God\'s first word to Abram through Moses, Samuel, David, Jeremiah, and Jesus as the Word made flesh — establishing that true revelation is not from exhaustive scripture study but an anointed utterance through the Holy Spirit, governed by the apostolic pattern of two or three witnesses, as practiced since the 1948 move of the Spirit.', pdf: '11%20-%20Sharon%20Star%20-%20November%202018.pdf', fileName: '11_-_Sharon_Star_-_November_2018.pdf' },
  { id: 102, articleText: `Grace: Andy Snoke

"For by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, lest anyone should boast" (Ephesians 2:9). "Grace" is defined as unmerited divine assistance given to humans for their regeneration or sanctification; a virtue coming from God; a state of sanctification enjoyed through divine assistance. Grace is simply stated as "unmerited favor." We don't merit or deserve God's favor. It is given as a free gift.

The Thief On The Cross: The "thief on the cross" received that Grace in a moment of time. Without the ability to fully describe his needs, he simply acknowledged that this Jesus was God. He acknowledged his sins internally. He simply asked, "Jesus, remember me when You come in Your kingdom!" And Jesus said to him, "Truly I say to you, today you shall be with Me in Paradise" (Luke 23:43). The thief could not recite the traditional sinner's prayer. He was so broken and humbled by his sin that he dared not even ask for forgiveness in his mind. Grace came as a Person to the thief.

The Woman At The Well: Grace in the form of Jesus Christ came to the woman at the well. Jesus purposely passed through Samaria for this display of Divine Grace. The Jews despised the Samaritans. Here Jesus comes to a Samaritan woman who had "five husbands" and was at that time living with another man. Jesus did not reach down incrementally to those who seemed most deserving. He went directly to those who needed it the most. Grace came to the woman at the well. "Everyone who drinks of this water will be thirsty again, but whoever drinks of the water that I will give him will never be thirsty again" (John 4:13-14).

The Good Samaritan: Jesus gave another example of how we as Christians should demonstrate grace — unmerited favor — to humanity. A certain man fell among thieves, beaten and left half dead. A priest and a Levite passed by without compassion. But a Samaritan had compassion and bandaged his wounds. "Go and do likewise" (Luke 10:37). Today when you hear the word "Samaritan" it is almost always associated with mercy, kindness, compassion, and grace. This is the result of the application of "Grace."

John Newton: After a long and arduous conversion, John Newton, who had made his living as a slave trader, finally found "Grace." In 1779 he published "Amazing Grace." Saul of Tarsus, the religious, legalistic, pious Pharisee, was on a mission to hunt down men and women of "The Way" when Grace found Paul on the road to Damascus. In a moment, in the blinding light of Truth, Saul found his life-transforming Grace. "Who are you, Lord?" — It is almost as if Saul is saying, "I thought I knew who you were. But who, really are you?" Like John Newton, Paul had many occasions to be depressed over his memories of his past life. Yet Paul listed a simple formula for overcoming the past: "Forgetting those things which are behind and reaching forward to those things which are ahead, I press toward the goal for the prize of the upward call of God in Christ Jesus" (Philippians 3:13-14). It is no wonder that Paul uses the word "grace" more than any other New Testament writer.

How can we describe with human words the magnitude of what grace really is? It is a Person. It is Jesus. It is clean. It is life changing. It is eternal. It is His favor. It is free. It is unmerited. It is available to all who ask. "For by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, lest anyone should boast. For we are His workmanship, created in Christ Jesus for good works, which God prepared beforehand that we should walk in them" (Ephesians 2:8-9). If you are in need of "Grace in your life," don't waste another moment. Jesus is very near. "Grace to you and peace from God our Father and the Lord Jesus Christ" (Ephesians 1:2).`, subtitle: '', author: 'Andy Snoke', year: 2018, month: 'December', volume: 'Vol. LXXI, No. 12', title: 'Grace', topics: ['Salvation','Scripture','Faith','Testimony'], excerpt: 'Andy Snoke meditates on grace as unmerited favor through four portraits — the thief on the cross who asked only to be remembered, the Samaritan woman at the well whom Jesus sought out, the Good Samaritan who demonstrated grace, and John Newton and the Apostle Paul whose dramatic conversions from darkness to light gave us "Amazing Grace" and the greatest writings on grace in the New Testament.', pdf: '12%20-%20Sharon%20Star%20-%20December%202018.pdf', fileName: '12_-_Sharon_Star_-_December_2018.pdf' }
,
  { id: 103, articleText: `Creation: Essentials and Nonessentials: Andy Snoke

The Word of God, as revealed to mankind in this hour, has what I like to call the "essentials" and "nonessentials." There are truths that are absolutely essential for us to accept and believe. And there are thoughts and concepts that have not been made clear yet, that often fall into the category of "nonessentials."

For ages, educated men have struggled with the age and origin of the universe. Even among the Christian world, there is strong disagreement related to the genesis of creation and the universe.

Regarding creation, I believe that the "essential truth" is revealed in the following scriptures: "Through faith we understand that the worlds were framed by the word of God, so that things which are seen were not made of things which do appear" (Hebrews 11:3, NKJV). "In the beginning God created the heaven and the earth" (Genesis 1:1). "For by him were all things created, that are in heaven, and that are in earth, visible and invisible, whether they be thrones, or dominions, or principalities, or powers: all things were created by him, and for him: And he is before all things, and by him all things consist" (Colossians 1:16-17).

The Age Of The Universe: Many have argued vehemently regarding the numerical age of the universe. Some say it is billions of years old. Some say that it is only 6,000 years old. The Bible does not give clarity as to the age of the universe. This is a "nonessential" question. What is "essential" is that we know that God created all of time, and matter, by the creative power of His voice. He spoke it into existence by His own authority, and He created the vast universe with purpose.

God\'s act of creating man and His purpose for this creation is shown in the following scriptures: "And the Lord God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul" (Genesis 2:7). "And God said, Let us make man in our image, after our likeness: and let them have dominion over the fish of the sea, and over the fowl of the air, and over the cattle, and over all the earth, and over every creeping thing that creepeth upon the earth. So God created man in his own image, in the image of God created he him; male and female created he them" (Genesis 1:26-28).

Who knows how long it will take to have mankind fully in His image and likeness? We could never guess. But ultimately, He will have a creation walking in fellowship, in His likeness and in His image. This is an "essential." The truth that God created all that we see and know is an "essential." The truth that God has called man to have fellowship with Him through the doorway of Jesus Christ is an "essential." The amount of time that God invested in the physical creation of the universe is not revealed and is a "nonessential."

Mankind was placed on this earth through an act of creation by God Himself. This is an "essential." We did not evolve over time. We were created with purpose. Our Creator held a conference in the heavenlies in ages past, and agreed to "Let us make man in our image." The phrase "Let us" most likely refers to the personhood of Jesus Christ, God the Father, and the power and presence of the Holy Spirit before time had its beginning.

By reading God\'s word we can see what is important for us to know and understand in this hour in which we live. In fact, there are 7 chapters and 243 verses in Exodus describing the "pattern" of worship in great detail. Do you know how many verses are dedicated to the description of the entire universe? There are only 31. I believe this comparison helps us to focus on the "essentials" of trusting in God, in believing that He created all that is, for His purpose. Our belief, is as simple as the song: "Jesus loves me, this I know, for the Bible tells me so." God said it, I believe it, that settles it.

---

The Power of Christ: Mark Rousseau

Unbelief can stop us from getting closer to God and fulfilling the very thing He has called us to. Unbelief, a tool of the enemy of our souls, as well as our carnal selves, keeps us from God\'s purpose. "For we wrestle not against flesh and blood, but against principalities, against powers, against the rulers of the darkness of this world, against spiritual wickedness in high places" (Ephesians 6:12).

God has a better plan for each one of us, and it is simply stated in Colossians 1:27, "To whom God would make known what is the riches of the glory of this mystery among the Gentiles; which is Christ in you, the hope of glory."

Very few things in this world are very dependable, but you can count on God\'s word. In Titus 1:2, it tells us that God cannot lie. It is impossible. So when God says something, you can absolutely depend on it because He is backing it up. God\'s word has power. In Hebrews 4:12, it is explained, "For the word of God is quick, and powerful, and sharper than any two-edged sword, piercing even to the dividing asunder of soul and spirit, and of the joints and marrow, and is a discerner of the thoughts and intents of the heart."

God gave Paul a wonderful gift, as we read in 2 Corinthians 12:7-11. God\'s answer was full of grace in verse 9, "My grace is sufficient for thee: for my strength is made perfect in weakness." The next thing Paul said was amazing. Through this experience he realized his weakness and said, "Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me."

Brothers and sisters, we need the power of Christ to rest upon us! Permit me to relate a personal experience. This week I really started to understand this and to put it to work. It started with unbelief and the moment I brought that to the Lord I felt the power of Christ resting upon me and the unbelief vanished. I have struggled with being critical through the years, but I brought that to the Lord, and His strength was made perfect in my weakness.

But this is not something that I do once and I\'m good. No, it is a daily, moment by moment walk with Him. Isaiah 28:10 "For precept must be upon precept, precept upon precept; line upon line, line upon line; here a little, and there a little."

This power of Christ is what we need in this hour. We are sons of God in the making, not by anything we have done or can do, but by His power we will come into maturity as Sons and glorify God. All of this is made possible because of the love God has for us as revealed in 1 John 3:1-3.`, subtitle: 'The Power of Christ: Mark Rousseau', author: 'Andy Snoke', year: 2017, month: 'January', volume: 'Vol. LXX, No. 01', title: 'Creation: Essentials and Nonessentials', topics: ['Creation','Scripture','Faith','Sonship'], excerpt: 'Andy Snoke distinguishes the "essentials" of Christian belief about creation — that God created all things by the power of His word — from "nonessentials" like the age of the universe, while Mark Rousseau explores how the power of Christ resting upon our weaknesses and infirmities is the source of strength for daily Christian living.', pdf: '01%20-%20Sharon%20Star%20-%20January%202017.pdf', fileName: '01_-_Sharon_Star_-_January_2017.pdf' },
  { id: 104, articleText: `Led by the Spirit (Part One): David Luff

Since the beginning of this present move of the Holy Spirit, we have heard it taught that spiritual maturity or coming into sonship is evidenced by our being led by the Spirit. "For as many as are led by the Spirit of God, they are the sons of God" (Romans 8:14, KJV). Many times when we have been faced with a dilemma or have been confused about something, someone will say to us, "Just be led by the Spirit." I know that many have asked, "What does it mean to be led by the Spirit? What does it look like in daily life?"

First, let us look into the Old Testament and see what God promised that he would covenant with His people in these last days. "For I will take you from among the heathen, and gather you out of all countries, and will bring you into your own land. Then will I sprinkle clean water upon you, and ye shall be clean: from all your filthiness, and from all your idols, will I cleanse you. A new heart also will I give you, and a new spirit will I put within you: and I will take away the stony heart out of your flesh, and I will give you an heart of flesh. And I will put my spirit within you, and cause you to walk in my statutes, and ye shall keep my judgments, and do them" (Ezekiel 36:24-27, KJV).

God has always wanted to reach and restore the world He created through a people for His name\'s sake. In this new covenant God provides the resources for both parts of the covenant. He said He would remove our stony heart and give us a heart of flesh. He said He would put His Spirit within us and cause us to walk in His statutes and keep His judgments.

In the Gospel of John, Jesus tells us how this promise will be fulfilled. "Jesus answered and said unto him, Verily, verily, I say unto thee, Except a man be born again, he cannot see the kingdom of God" (John 3:3, KJV). When we are born again God removes our stony heart which is dead to Him and gives us a heart of flesh which is alive to Him. He places His Holy Spirit within us who enables us to walk in His statutes and to keep His judgments. Our entire spiritual DNA is changed. "Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new" (2 Corinthians 5:17, KJV).

God has given us His secret wisdom that we may know the things that He has freely given to us of Himself. We even have the mind of Christ because Christ lives within us. The Holy Spirit enables us to see and know Jesus and all that we are and have in Him.

If you are like me, you know that the reality of this new life comes face-to-face with the reality of sin all around us, and our new life is confronted with temptation to deny its power more often that we would like. We must come to grips with the reality that although as Paul says in Romans 6, we are dead to sin, sin is not completely dead to us. We still have a carnal nature, and there is a struggle, a conflict, a war if you will that goes on in our daily lives. The good news is that we now have the Holy Spirit within us to enable us to do in our heart of hearts, in our new heart of flesh that God has put into us, what we really want to do.

How do we resist the temptation to sin that finds a welcome reception in our flesh (carnal nature)? We read in Galatians 5:25 "If we live in the Spirit, let us also walk in the Spirit." The answer is found in the moment-by-moment exercise of repentance and faith. We must realize that although repentance of past sins and faith in Christ were absolutely necessary for our conversion, they are also absolutely necessary to our daily moment-to-moment walking in the Spirit. We never outgrow our need for the Cross.

[To Be Continued In The March 2017 Issue]`, subtitle: '', author: 'David Luff', year: 2017, month: 'February', volume: 'Vol. LXX, No. 02', title: 'Led by the Spirit (Part One)', topics: ['Holy Spirit','Sonship','Scripture','Discipleship'], excerpt: 'David Luff explores what it means in daily life to be led by the Spirit, tracing God\'s covenant promises from Ezekiel through the new birth, examining how the indwelling Holy Spirit enables believers to walk in God\'s statutes, and concluding that moment-by-moment repentance and faith are the practical essence of Spirit-led living.', pdf: '02%20-%20Sharon%20Star%20-%20February%202017.pdf', fileName: '02_-_Sharon_Star_-_February_2017.pdf' },
  { id: 105, articleText: `Led by the Spirit (Part Two): David Luff

[Continued From The February 2017 Issue]

Even though we do not have to sin and John writes to us that we may not sin; nevertheless, if we do sin, Jesus advocates for us with the Father. The dictionary defines advocate as a person who pleads for or on behalf of another; intercessor. We can exclaim with John, "Behold (can you believe it?), what manner of love the Father hath bestowed upon us, that we should be called the sons (children) of God" (1 John 3:1a). Being led by the Spirit is the essence of the process of change in our lives.

I believe that God, through the establishment of the new covenant with us and in our salvation, gave us a new heart. However, it is a heart that we must present to Him daily in order that He may write His laws upon it. God is allowing us to decide if we will give Him our new heart through which He may direct our lives or if we will choose to hold it back from Him so that we may maintain control ourselves.

I believe that being led by the Spirit is allowing the Holy Spirit to help us examine our hearts. This is not always a pleasant process. In this process the question we must all ask ourselves is, "Who or what do we love more than God?" We must never be afraid to allow the Holy Spirit to search our hearts. We need to say like David in Psalm 139, "Search me, O God, and know my heart: try me, and know my thoughts; And see if there be any wicked way in me, and lead me in the way everlasting" (Psalm 139:23-24, NKJV).

The same grace by which God saved us is the same grace that He is willing and ready to apply to us on a moment-to-moment basis in our daily lives. The same grace that saved us is the grace that sanctifies us moment-by moment. If we sin, and likely we will along the way, we have a safe place to go. We must never run from God as Jonah did, but like the "Prodigal" we must run to our Father.

As we live out our daily lives, we experience many "thorns in the flesh" so to speak; physical suffering, discouragement, disappointment, failure, discomfort, ill treatment from friends, coworkers, and employers, fear, and trials of many kinds. The world is more than ready to come to our aid with its so-called comforts and solutions to our problems, to anesthetize us from our pain. God allows things to come into our lives to see if He truly has our heart.

It is hard for us to imagine being able to live a sin-free life even for a whole day much less the rest of our lives. However, we can believe for this current moment. Just as we believed for salvation in that particular moment of our life when our heart was changed forever, we can believe that we can turn from the temptation to sin by the power of the Holy Spirit in the current moment. Before we know it, the moments of faith and repentance will begin to flow together and the result is an ever-increasing obedient life.

For me being led by the Spirit is more than just receiving direction at various decision points of my life, although it is that too. It is allowing the Holy Spirit to ask me the hard and often uncomfortable questions about the affections of my heart, drilling down to uncover who or what I adore more than Him, what good things in my life have become gods or idols that I have placed ahead of Him, what attitudes underlie my non-Christ-like behavior?

Isn\'t this moment-by moment exercise of repentance and faith, this moment-by-moment allowing the grace of God to transform us what maturing into sonship is all about?

A few Sundays ago during our service my son who is a student of C.S. Lewis, shared this quote of his. I will close with it. "The real problem of the Christian life comes where people do not actually look for it. It comes the very moment you wake up each morning. All your wishes and hopes for the day rush at you like wild animals. And the first job each morning consists simply in shoving them all back; in listening to that other voice, taking that other point of view; letting that other larger, stronger, quieter, life come flowing in. And so on, all day. Standing back from all your natural fussings and frettings; coming in out of the wind. We can only do it for moments at first. But from those moments the new sort of life will be spreading through our system: because now we are letting Him work at the right part of us. It may be hard for an egg to turn into a bird. It would be a jolly sight harder for it to learn to fly while remaining an egg. We are like eggs at present. And you cannot go on indefinitely being just an ordinary, decent egg. We must be hatched or go bad." C.S. Lewis`, subtitle: '', author: 'David Luff', year: 2017, month: 'March', volume: 'Vol. LXX, No. 03', title: 'Led by the Spirit (Part Two)', topics: ['Holy Spirit','Sonship','Discipleship','Grace'], excerpt: 'In the conclusion of his series, David Luff examines how being led by the Spirit means allowing the Holy Spirit to search our hearts for hidden idols and the sin behind sin, practicing moment-by-moment repentance and faith as the practical path to maturity in sonship, closing with a C.S. Lewis quote on the daily discipline of Spirit-led transformation.', pdf: '03%20-%20Sharon%20Star%20-%20March%202017.pdf', fileName: '03_-_Sharon_Star_-_March_2017.pdf' },
  { id: 106, articleText: `As For Me and My House: Mervin Sundbo

In the 24th chapter of Joshua from the NKJV we read, "Then Joshua gathered all the tribes of Israel to Shechem, and called for the elders of Israel, for their heads, for their judges, and for their officers; and they presented themselves before God." Now Joshua proceeded to remind them concerning all that God had done for them. Verses 14 & 15, "Now therefore, fear the Lord, serve Him in sincerity and in truth, and put away the gods which your fathers served on the other side of the River and in Egypt. Serve the Lord! And if it seems evil to you to serve the Lord, choose for yourselves this day whom you will serve, whether the gods which your fathers served that were on the other side of the River, or the gods of the Amorites, in whose land you dwell. But as for me and my house, we will serve the Lord."

This scripture causes us to consider the many ways in which we can serve the Lord. We can serve the Lord in our kindness to others, in our families, through our children\'s obedience, in our workplaces as servants or as masters, wherever we live in our communities, in our churches through the gifts and ministries of the body of Christ, and with our tithe.

Jesus made a statement similar to that of Joshua when He said, "No one can serve two masters; for either he will hate the one and love the other, or else he will be loyal to one and despise the other. You cannot serve God and mammon (riches)." Idol worship is quite prevalent today, but in a different way than it was in Israel\'s day. Anything that is more important than our relationship with God has the potential for idol worship.

Where do we spend our time? We choose where we go on the Internet. We have control over what we watch on television. The enemy doesn\'t care what we are addicted to as long as it is something that takes plenty of time and corrupts our minds with the ways of the world. What worries the enemy is a people on their knees seeking God.

Where do we spend our money? "Why do you spend money for that which is not bread, and your wages for what does not satisfy? Listen carefully to Me, and eat what is good, and let your soul delight itself in abundance" (Isaiah 55:2, NKJV). It is only the spiritual that truly satisfies the inner longings of the human heart.

How pure are our thoughts? We live in a society where "sin is made to look normal and righteousness is made to look strange." We receive good instruction in Philippians 4:8, "Finally, brethren, whatever things are true, whatever things are noble (honest), whatever things are just, whatever things are pure, whatever things are lovely, whatever things are of good report, if there is any virtue and if there is anything praiseworthy — meditate on these things" (NKJV).

How materialistic are we? One of the best scriptures on this topic is found in 1 Timothy 6:10, "For the love of money is a root of all kinds of evil, for which some have strayed from the faith in their greediness and pierced themselves through with many sorrows" (NKJV). Note: it is not money that is at the root of evil; it is the love of money.

If we are to grow and mature spiritually, I believe we cannot forget about the basic principles of our walk with God. The way is growing ever narrower and as we mature, more is expected of us. God\'s expectation is full maturity, from the new birth experience to a complete transformation; from sons of men, to sons of God; from the natural to the spiritual; from the nature of Adam (the living soul), to the nature of Christ (the life-giving Spirit). This is the heritage of God\'s people. Let the same spirit be in us as was in Joshua as he declared before Israel, "As for me and my house we will serve the Lord."`, subtitle: '', author: 'Mervin Sundbo', year: 2017, month: 'April', volume: 'Vol. LXX, No. 04', title: 'As For Me and My House', topics: ['Discipleship','Family','Stewardship','Sonship'], excerpt: 'Drawing from Joshua\'s declaration to serve the Lord, Mervin Sundbo explores the many arenas of Christian service — family, workplace, community, and church — while challenging readers to examine where they spend their time, money, and thoughts, and calling all to the full maturity of sonship as the heritage of God\'s people.', pdf: '04%20-%20Sharon%20Star%20-%20April%202017.pdf', fileName: '04_-_Sharon_Star_-_April_2017.pdf' },
  { id: 107, articleText: `Women in Ministry: The Traveling Elders

As we begin this study we will attempt to carefully examine and include what the Holy Scriptures teach about the role of women in ministry. The Holy Scriptures will be our source. We will not lean upon present day trends and opinions but will try to stay true to what the Word of God says. In this modern day revival, we endeavor to be carefully led by the Spirit and we look to the Holy Spirit for wisdom.

God has a unique place, calling, and a role for men and women. One is not more important than the other. The value of men and the value of women are perfectly equal in the eyes of God. "There is neither Jew nor Greek, there is neither bond nor free, there is neither male nor female: for ye are all one in Christ Jesus" (Galatians 3:28). The spiritual standing of every human being, regardless of nationality, class, or gender, is the same. The ground at the foot of the cross is level — women matter as much as men.

In Jesus\'s day, women were not allowed to count change in their hands for fear of physical contact. And yet Jesus frequently touched women to heal them. A small group of women traveled with Jesus and the disciples, which was unheard of in those days. Amazingly, the first person to whom the resurrected Christ appeared was Mary Magdalene. Mary was commissioned to announce His resurrection to the disciples.

In the realm of earthly employment and leadership, women are just as capable as men to lead. However, when it comes to spiritual authority, the callings according to Scripture are different than the world. Particularly by the time we arrive in the New Testament, women are not allowed to exercise spiritual authority over men, or to lay a spiritual foundation.

"And I do not permit a woman to teach or to have authority over a man, but to be in silence. For Adam was formed first, then Eve. And Adam was not deceived, but the woman being deceived, fell into transgression" (1 Timothy 2:12, NKJV). Though women have been called to walk in more of a helping, submissive ministry, it is a blessing to see the high value that the Lord and the Scriptures place on women.

In our worship services, the local elders have authority and are a spiritual covering for the local assembly. Therefore, the elders may "authorize" members to share, testify, teach children, etc. Can women pray and prophesy in the services? Yes. However, they should be wearing a head covering. Can women share a testimony and give praise to God in the worship service? Yes. Can a woman lead the worship service? No. Can women lay hands on and pray and prophesy over individuals for their gifts and ministries? No. This was always done in the New Testament and is today by a group of elders (men).

This article has been directed more towards the role of women in ministry. However, we remind the readers, that God has an important role, a ministry, a calling, and gifts of the Spirit for all. There is a place in this wonderful body of Christ for the married, for the single, for men, for women, for all. Though God\'s gifted callings are unique to the individual, no one is more valuable to God than another. All are needed. All are important. All are valuable. We all stand equal in God\'s eyes at the foot of the Cross.

Let us all to be faithful to the gifts and calling that God has made known to us. "Do not neglect the gift that is in you, which was given to you by prophecy with the laying on of the hands of the eldership. Meditate on these things; give yourself entirely to them, that your progress may be evident to all" (1 Timothy 4:14-15, NKJV).`, subtitle: '', author: 'The Traveling Elders', year: 2017, month: 'May', volume: 'Vol. LXX, No. 05', title: 'Women in Ministry', topics: ['Scripture','Church','Discipleship','Holy Spirit'], excerpt: 'The Traveling Elders offer a thorough scriptural study of the role of women in ministry, affirming the equal spiritual standing of men and women before God while outlining the biblical distinctions in spiritual authority and calling, with practical guidance on what women may and may not do in worship services according to Scripture.', pdf: '05%20-%20Sharon%20Star%20-%20May%202017.pdf', fileName: '05_-_Sharon_Star_-_May_2017.pdf' },
  { id: 108, articleText: `Thirsty: Brian Hannigan

During a Sunday service an elder spoke about thirst. He said that when we first feel thirst we are likely already a bit dehydrated. He expounded to us about natural and spiritual thirst. As water quenches our thirsting body, so the Living Water, Jesus Christ, is the only One who can quench our thirsting spirit.

I wonder if spiritual thirst and natural thirst are similar in every way. Natural thirst occurs without conscious effort on our part. If we fail to drink water we will end up thirsting, and the thirst intensifies until we drink. Spiritual thirst seems different. There are times when I know that I am spiritually dry, but no craving for that Water of Life automatically ensues. In fact, the longer I ignore my need for Christ, the more the awareness of thirst diminishes. In yet another contrast, the more I drink of that One who is the Living Water, the more I want to drink and the more I can.

The Scriptures give a serious admonition; God speaks through the prophet that we can be kept very busy trying to satisfy our true spiritual needs with the wrong commodities and activities. "Ho, every one that thirsteth, come ye to the waters, and he that hath no money; come ye, buy, and eat; yea, come, buy wine and milk without money and without price. Wherefore do ye spend money for that which is not bread? and your labour for that which satisfieth not? Hearken diligently unto me, and eat ye that which is good, and let your soul delight itself in fatness" (Isaiah 55:1-2, KJV).

As followers of Jesus we must continually realign ourselves with what is important to God. Our society squeezes us into emphasizing income while neglecting outcome. This challenge requires prayer, reflection, devotion, repentance, realignment, study of the Word and change. These will reactivate our thirst for God.

When we made Jesus our Saviour He put the source of Living Water right inside us. He is that source. From now on there should never be a reason to thirst again. However, if we have been neglecting to drink of the indwelling Water, let us ask Him to restore our thirst. Set aside daily time with Jesus, drinking of Him and letting Him flow in us again.

---

Meekness: David Levson

First of all, we need to know why meekness is so important. "Blessed are the meek for they shall inherit the earth" (Matthew 5:5). Meekness is a fruit of the spirit. What does meekness really mean? Meekness does not mean weakness! One of the dictionary meanings of "Meek" says this: (Greek) "A warhorse prepared and bridled for battle (not weakness)." A wild horse can be very powerful, but if trained, at the slightest touch of your leg, hand or bridle to move in a certain way, that horse can be very useful. Meekness is strength in control. We can be very useful if we allow ourselves to be trained by the Holy Spirit to the slightest movement of the Spirit.

As I was seeking God about what made certain people in the Bible referred to as meek, His Holy Spirit seemed to show me that it was because they were really seeking God and His ways and then putting them into practice. Seek meekness. Seek God. Zephaniah 2:3 says, "Seek ye the Lord, all ye meek of the earth, which have wrought his judgment: seek righteousness, seek meekness." There are three very important interacting teaching resources we must seek in order to learn meekness. They are the word of God, the Spirit of God and the practice of what we have been taught in our daily lives.

Examples of meekness in the Bible include Jesus, Moses, David, Jeremiah, Stephen, and Paul. Meekness is essential in teaching, in hearing, and is related to gentleness, humility, and quietness. The balance to understand meekness is to be wise and sensitive to the Spirit so as to know what to do. Meekness does not mean weakness, to be stepped on like a doormat. My prayer for us all is that we will have a great love of the Scriptures, a great love of the Spirit, and be able to put the Word of God into practice in our lives more and more, little by little.

---

A Tribute to Bro. Ewald Wanagas

We all feel a sense of sadness and loss in the passing of Bro. Wanagas on January 16, 2017 at Edmonton, Alberta. He was a friend, colleague and brother in Christ; a person we could look to in times of need for wise counsel. He not only ministered the Word of God throughout the churches, but he practiced what he taught. As a young man, Bro. Wanagas attended the Bible School in North Battleford at the time of the 1948 revival. Throughout his life he walked faithfully in the light of the spiritual awakening that began at that time, and ministered these truths, which established and strengthened the church. After serving as an elder in both the local church in North Battleford and later in the local church in Edmonton, Alberta, he served the universal church for many years as an apostolic ministry. His dear wife, Zelma, predeceased him in 2012 after 62 years of marriage. Bro. Wanagas has joined that great cloud of witness spoken of in Hebrews chapter 12, knowing that he has fought the good fight, has finished the race, and has kept the faith.`, subtitle: 'Meekness: David Levson', author: 'Brian Hannigan', year: 2017, month: 'June', volume: 'Vol. LXX, No. 06', title: 'Thirsty', topics: ['Faith','Discipleship','Holy Spirit','Testimony'], excerpt: 'Brian Hannigan meditates on the contrasts between natural and spiritual thirst, urging believers to realign their lives to seek the Living Water of Christ rather than the empty satisfactions the world offers, while David Levson expounds on meekness as Spirit-trained strength in control — not weakness — drawing from biblical examples from Jesus to Paul.', pdf: '06%20-%20Sharon%20Star%20-%20June%202017.pdf', fileName: '06_-_Sharon_Star_-_June_2017.pdf' },
  { id: 109, articleText: `Love Thy Neighbour: W. Douglas Whitter

In an "every man for himself" world, such as we are living in today, the teachings of Jesus bring to light the deterioration and weakness of our present-day systems. The basic theory of today\'s methods is get to the top and advance yourself, regardless of who it hurts or crushes.

Jesus expounded these tremendous truths to a highly-educated lawyer in the crowd, who tempted Jesus by saying unto Him, "What shall I do to inherit eternal life?" Jesus had him answer his own question, right out of the law book: "Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind; and thy neighbour as thyself." The man then said to Jesus, "And who is my neighbour?" This was a good question and may the Holy Spirit enable us all to see and accept the answer by using a parable, which is an earthly story, with a heavenly meaning.

This parable — the Good Samaritan — brings out the difference between one being religious and being spiritual. The priest and the Levite were religious men, as they saw this fellow-human being in the ditch. They passed him by because they were all wrapped up in their theology, without understanding or being able to apply what they read and taught. The good Samaritan was not that way. It seemed to matter not who the man was or what he believed. He was in dire need, and therefore he was obligated to assist him in whatever way he could. The mercy of God is to the whosoever.

The good Samaritan gave three things in administering his ministry: he gave of himself, he gave of his time — a very precious commodity in this day and age — and he gave of his money (possessions). It is so easy to say, and it sounds so spiritual, "I will be praying for you," when we should be doing something practical about the situation at hand.

The establishing of the kingdom of God on the earth is this world\'s only hope. Jesus also taught, "And this gospel of the kingdom shall be preached in all the world for a witness unto all nations: and then shall the end come" (Matthew 24:14). Nothing is impossible with God.

We are further taught by the apostle Paul that love is the fulfilling of the law. "For, brethren, ye have been called unto liberty; only use not liberty for an occasion to the flesh, but by love serve one another. For all the law is fulfilled in one word, even in this; Thou shalt love thy neighbour as thyself. But if ye bite and devour one another, take heed that ye be not consumed one of another. This I say then, Walk in the Spirit, and ye shall not fulfill the lust of the flesh" (Galatians 5:13-16).

Who then is our neighbour? In the case of the man who fell among thieves, it was the one who gave practical sympathy or, in other words, ministered to his need; the one who, regardless of his religion or political beliefs or his racial origin, treated him as a fellow-human being. Who are your neighbours? Look around, I\'m sure you will find them.`, subtitle: '', author: 'W. Douglas Whitter', year: 2017, month: 'July', volume: 'Vol. LXX, No. 07', title: 'Love Thy Neighbour', topics: ['Scripture','Discipleship','Community','Faith'], excerpt: 'W. Douglas Whitter expounds on the parable of the Good Samaritan to show the difference between religious and spiritual living, arguing that true love of neighbour means giving practically of ourselves, our time, and our resources to any fellow human being in need, for love is the fulfilling of the law.', pdf: '07%20-%20Sharon%20Star%20-%20July%202017.pdf', fileName: '07_-_Sharon_Star_-_July_2017.pdf' },
  { id: 110, articleText: `Grudges: Andy Snoke

Grudges! What an ugly word. Grudges can sap the happiness and unity out of our lives, and relationships. Grudges are like an ever-present dark cloud, holding our emotions and happiness hostage.

"Holding a grudge" should not be part of the Christian experience, and yet it is. It is for one reason. We still struggle from the effects of sin. However, we are offered the opportunity to live beyond the dictates of our sinful nature by the use of a powerful force: a force that should be empowered by the Holy Spirit; a force that is within our reach. That "force" is the "power of choice." You see, we "choose" to be offended. We choose to allow the effects of offences to grow, shadowing and overpowering all that we do. We can also "choose" to let offences and grudges go!

The Apostle Paul provided a simple message regarding disagreements when he wrote, "I entreat Euodia and I entreat Syntyche to agree in the Lord" (Philippians 4:2 ESV). Paul never identifies what the disagreement was about. The specific disagreement issue was not important to Paul. He did not side with either one. In essence, the Apostle Paul, a man called and ordained by God, simply commands "GET OVER IT!" Simply "agree" in the Lord. That\'s it! The power of choice. Get over it! Forgive and move on. Don\'t hold a grudge. Agree in the Lord.

To be wronged is nothing, unless you choose to remember it. Someone said that "holding a grudge" is like drinking rat poison, and then waiting for the rat to die! Grudges only hurt one person, our self. I encourage all of our readers who struggle with these issues of holding grudges, or being offended, or harbouring unforgiveness. Choose to get over it! Now!

---

That They All May Be One: Mark Rousseau

There is something I find very challenging and certainly one of my top weaknesses. It happens when you see someone, or even a group of people, doing something that you know is "just not right." No matter, you know the thing is wrong; small offence or large.

Worse yet, the enemy spots opportunity and feeds us an endless stream of nasty thoughts. Being left unattended, a root of bitterness can begin to take hold and the result is found in Hebrews 12:15, "...lest any root of bitterness springing up trouble you, and thereby many be defiled." The enemy wants us to be divided from God and divided from each other as well. His aim is to divide the body of Christ and destroy it.

God, in His wisdom and mercy, has a better way for us. Matthew 7:3 says, "And why beholdest thou the mote that is in thy brother\'s eye, but considerest not the beam that is in thine own eye?" Through the offence, there is a good chance that the Lord is just trying to point out something in our lives that we need to deal with.

Consider the same struggle David had with Saul. Saul was busy chasing David with 300 chosen men of Israel, looking to kill him. But for the most part David was able to keep from letting his carnal nature get away on him. After he realized what he had done (touching God\'s anointed) he not only repented but threw himself at Saul\'s feet and asked forgiveness. He no longer put himself first (and what he wanted), but he put God first. Both men were blessed that day.

It starts with you and me today. Before an offence has a chance to fester, forgive it right away. Romans 13:14, "But put ye on the Lord Jesus Christ, and make not provision for the flesh, to fulfil the lusts thereof." Now is the time to avail ourselves of the power of Jesus Christ to forgive anyone in our lives that we may have ill feelings toward.

---

A Tribute to Bro. Albert Hannigan

A pervasive sense of loss permeated the church universal when, on May 7, 2017 Bro. Albert Hannigan passed from his earthly to his heavenly home. God granted him almost 93 years and in October of 2017, he and Marion would have been blessed with 70 years of marriage. Bro. Hannigan will be remembered for his fatherly ministry, which was evident in visitations to many who were alone or unable to attend church due to their particular circumstances. He was a man of humility, prayer, musical talent and knowledge of Scripture. He faithfully served the church, officiated at numerous funerals and ministered to residents in nursing homes. His accordion and voice of song were constant companions during those visits. During his time in the ministry, Bro. Hannigan traveled to churches in Canada, the United States, the Philippines, the Caribbean and South Korea. While we will miss his kind and encouraging words, we rejoice in knowing that "he fought a good fight, has finished the race, has kept the faith" (2 Timothy 4:7).`, subtitle: 'That They All May Be One: Mark Rousseau', author: 'Andy Snoke', year: 2017, month: 'August', volume: 'Vol. LXX, No. 08', title: 'Grudges', topics: ['Unity','Forgiveness','Discipleship','Faith'], excerpt: 'Andy Snoke confronts the ugliness of grudge-holding, calling believers to exercise the power of choice to forgive as Paul commanded Euodia and Syntyche to simply "agree in the Lord," while Mark Rousseau examines how offences left unattended become roots of bitterness that divide the body of Christ, urging us to remove the beam from our own eye first.', pdf: '08%20-%20Sharon%20Star%20-%20August%202017.pdf', fileName: '08_-_Sharon_Star_-_August_2017.pdf' },
  { id: 111, articleText: `Our Vision, Our Focus: Markus Hansen

In this day of unlimited communication of ideas, theories, opinions, philosophies and freedom of expression, the onus to stay focused on what God has called us to has never been more pressing. Insidiously, there are ever-present those who wish to adopt modern church vernacular. However, let it be known that what God began, He will finish. Therefore we must not let our anchor slip and fall back into what God called us out of. We must stay true to the course that has been set before us.

One of the principal truths revealed in the early part of this present move of the Holy Spirit was entering into sonship, culminating in the coming together of the body of Christ. It is this truth that this writing will address, for it is the coming together of the body of Christ that will restore all creation back to Himself.
