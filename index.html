  { id: 79, articleText: `The Power of Reconciliation: Mervin Sundbo

We see throughout Scripture that the very nature of God is one of reconciliation. This is evident in many ways, including the following: His relationship with Israel; His relationship with His creation and provision of salvation; His emphasis on forgiving; His desire that we might be ministers of reconciliation; His instruction to walk in unity.

His Relationship With Israel
When Israel walked in rebellion, He was always ready to forgive when they repented, and He restored them to a harmonious relationship. He is a God of peace, of mercy and of love. Some of their rebellious ways included wanting meat when God\'s daily provision of manna was all they needed. Desiring a king to rule over them, as was the case with all the other nations, when the will of God was that He would be their King. Taking wives of the heathen nations was forbidden because these unions would draw them away from the God of Israel. Yet, they did exactly what they were instructed not to do. That disobedience resulted in what we read in Psalm 106:35-38. They chose to reject the report of Caleb and Joshua after they had returned from spying out the land and hankered to return to Egypt, the land of oppression. This act of rebellion is summed up in the statement, "They entered not in because of their unbelief." Yet, in spite of all their disobedience and rebellion, God did not reject Israel as we see in 2 Chronicles 7:14-15. God is always interested in, and is always looking for, the restoring of relationships. The key to reconciliation is repentance and forgiveness.

His Relationship With His Creation
When sin entered into the world through the disobedience of Adam and Eve, we see the immediate result of that on the entire creation. The curse that God brought upon the earth (Genesis 3:14-24) remains to this day. The sign of reconciliation with man and God\'s entire creation is shown immediately after Adam and Eve are driven out of the Garden of Eden — the tree of life remained and angels were sent to guard it, indicating that God\'s divine plan was already in operation. There is one thing that we need to remember about the plan of God. It is comprehensive and all-inclusive. His restorative plan includes the entire creation, not just a part of it. Christ\'s sacrifice on Calvary was the remedy for man\'s sin and for the curse that followed. The tree of life, which was once forbidden so that man could not partake of it in his fallen state, is now made available through Christ\'s obedience and sacrifice. The curse that has blighted the creation since the time of the sin of Adam and Eve will be lifted as we read in Revelation 22:1-3.

His Emphasis On Forgiving
Jesus provided for us the perfect example of a forgiving heart. "Father, forgive them, for they do not know what they do" (Luke 23:34). We see the same intercessory prayer by Stephen for his executioners: "Lord do not charge them with this sin" (Acts 7:60). Forgiveness is a spiritual principle and is something we cannot just choose to ignore. Forgiveness is the very essence of God. If we want to enter into a place of complete surrender, as Jesus did and as Stephen did, we must become a forgiving people. It is a condition, not of the mind, but of the heart. Unforgiveness is an affliction that cuts across all levels of society. It knows no boundaries and leaves in its path heartache, resentment and destruction. The root cause of most fractured relationships is likely an unwillingness to forgive. God addresses the problem of the human heart in Ezekiel 36:26. The new creature has a new heart; a regenerated heart; a heart of forgiveness. Where once there was a heart of stone, there is now a heart of flesh. There are many scriptures that speak about forgiveness: Ephesians 4:32, Colossians 3:12-15, Matthew 6:14-15, Luke 6:37. We cannot miss steps in our spiritual development any more than in our natural growth. It begins with forgiveness, whereby we are reconciled to God.

His Desire That We Might Be Ministers Of Reconciliation
Reconciliation means "a change of relationship from enmity to peace." 2 Corinthians 5:17-20 tells us that God has reconciled us to Himself through Jesus Christ, and has given us the ministry of reconciliation. Salvation changes the entire relationship of man to God and God to man. The hostile relationship has changed to one of friendship. Where once there was alienation, there is now closeness and communion.

His Instruction To Walk In Unity
Unity is not something you muster up. It is not a state of the mind, but rather a condition of the heart. It is a spiritual principle, the lack of which causes division both in the natural and in the spiritual. The enemy works laboriously to divide God\'s people for he knows that a divided people are no threat to him and his kingdom. He also knows that a united people will gradually and progressively come to the place of maturity where his kingdom will fall and the kingdom of God will be established in all the earth. Paul speaks of how essential unity is in the body of Christ in Ephesians 4:1-6: "There is one body and one Spirit, just as you were called in one hope of your calling; one Lord, one faith, one baptism; one God and Father of all." Grudges can sap the happiness and unity out of our lives and relationships. We "choose" to be offended. We can also "choose" to let offences and grudges go. To be wronged is nothing, unless you choose to remember it. By respecting and loving the presence of Christ in one another, we can truly love and forgive one another.

---

Grudges: Andy Snoke

The Apostle Paul provided a simple message regarding disagreements. In his closing of Philippians, Paul throws in a simple statement: "I entreat Euodia and I entreat Syntyche to agree in the Lord" (Philippians 4:2 ESV). Euodia and Syntyche were two women in the local church. Paul never identifies what the disagreement was about. The specific disagreement issue was not important to Paul. He did not side with either one. In essence, Paul simply commands: get over it. Agree in the Lord. Don\'t hold a grudge. I find that of the many scriptures on unity, there is one passage that really helps with my weaknesses. Jesus taught us to receive and respect one another, by recognizing the "Christ" and ministry in one another. "Whoever receives you receives me, and whoever receives me receives him who sent me" (Matthew 10:40 ESV). Someone said that "holding a grudge" is like drinking rat poison, and then waiting for the rat to die! Grudges only hurt one person, our self. Choose to get over it! Scripture references on unity include Ephesians 4:1-6, Philippians 2:2-4, Romans 12:16-18, and Colossians 3:13.`, subtitle: 'Grudges: Andy Snoke', author: 'Mervin Sundbo', year: 2019, month: 'January', volume: 'Vol. LXXII, No. 01', title: 'The Power of Reconciliation', topics: ['Reconciliation','Unity','Forgiveness','Scripture'], excerpt: 'Mervin Sundbo traces the reconciling nature of God through Israel\'s history, the Calvary sacrifice, the forgiving heart of Christ and Stephen, and the call to be ministers of reconciliation — then Andy Snoke challenges readers to put down grudges and simply "agree in the Lord," using the example of Euodia and Syntyche in Philippians.', pdf: '01%20-%20Sharon%20Star%20-%20January%202019.pdf', fileName: '01_-_Sharon_Star_-_January_2019.pdf' },

  { id: 80, articleText: `Staying Focused: Mervin Sundbo

The Scripture in Proverbs 29:18 says, "Where there is no revelation, the people cast off restraint: but happy is he that keeps the law" (NKJV). In other words, there is happiness in staying focused on the revelation that God by His Spirit has made known to us, as His word has been enlightened to our hearts. Israel was a prime example of losing the focus that God had made known to them. They knew what the will of God was, but they often chose not to obey or were distracted and lost their way. Examples include: tiring of the manna and hankering for meat (which brought wasting disease into their soul); focusing on the nations governed by kings rather than on God as their perfect ruler; giving their sons and daughters in marriage to heathen nations until their hearts were turned from God; and listening to the evil report of the ten spies rather than the good report of Caleb and Joshua. Solomon began walking in the statutes of David his father, and God granted him the wisdom he requested. He was the wisest man that ever lived. But Solomon\'s heart turned from the Lord when he loved many foreign women and they turned his heart after their gods. He died at age 52. In the New Testament, Peter walked on the water so long as his focus was on the Lord. But when he lost focus and fixed his eyes on the storm, he became fearful, doubt set in and he began to sink. The church is the bride of Christ. He is not interested in a contaminated bride, but rather "that He might present her to Himself a glorious church, not having spot or wrinkle or any such thing, but that she should be holy and without blemish" (Ephesians 5:27). Romans 12:2 says, "Be not conformed to this world but be transformed by the renewing of your mind." There are many voices, but "My sheep hear My voice, and I know them, and they follow me" (John 10:27). May God help us to remain faithful to the calling unto which He has called us.

---

Soften Our Hearts Lord: David Cotcher

In our service we sang as a prayer the chorus: "Soften my heart, Lord, soften my heart. From all indifference set me apart. To feel your compassion, to weep with your tears, Come soften my heart, O Lord, soften my heart." Our hearts can be hardened by our daily lives in the world. We desire that God will soften our hearts as we walk with Him day by day. Then we can show forth God\'s love and compassion from our hearts. By the experiences we go through, God can plant His faith within our hearts and let it grow. We will walk in unity with one heart and one mind. Paul writing to the Ephesians exhorted them, "And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ\'s sake hath forgiven you" (Ephesians 4:32). God is giving us a new heart as we read in Ezekiel 36:26-27 and Ezekiel 11:19. Moses brought the Ten Commandments written on stone tablets, but now God is writing His law on our hearts. God does not give up on us, even as the potter didn\'t on the marred vessel, but He keeps on moulding and shaping our lives to be like Him, as we are yielded to His Holy Spirit. David was a man after God\'s own heart. He repented, and allowed God to soften his heart and renew a right Spirit as recorded in Psalm 51:10-12. The Bible compares our hearts to the soil that God can cultivate and in which He can plant His seed. "I said, \'Plant the good seeds of righteousness, and you will harvest a crop of love. Plow up the hard ground of your hearts, for now is the time to seek the Lord, that He may come and shower righteousness upon you\'" (Hosea 10:12). The parable of the sower in Matthew 13 teaches us that the seed of God\'s word needs prepared soil to bear fruit. The testings and trials will come, but if we allow God\'s Holy Spirit to work in our lives, our hearts can be cultivated. We read in Acts 4:32 of the early church having great unity: "the multitude of them that believed were of one heart and of one soul." Day by day, little by little He is changing us. Step by step He is changing our hearts by each of those experiences we go through, as we are yielded to His Spirit. Soften our hearts, O Lord, we pray. In Jesus Name. Amen.`, subtitle: 'Soften Our Hearts Lord: David Cotcher', author: 'Mervin Sundbo', year: 2019, month: 'February', volume: 'Vol. LXXII, No. 02', title: 'Staying Focused', topics: ['Faith','Discipleship','Scripture','Holy Spirit'], excerpt: 'Mervin Sundbo examines Israel\'s repeated failures to stay focused on God\'s revealed will — from craving meat in the wilderness to Solomon\'s fatal compromise — and calls the church not to let the world creep in; then David Cotcher pleads for softened hearts, tracing the potter-and-clay imagery of Ezekiel and the parable of the sower as pictures of the Holy Spirit\'s daily work in us.', pdf: '02%20-%20Sharon%20Star%20-%20February%202019.pdf', fileName: '02_-_Sharon_Star_-_February_2019.pdf' },

  { id: 81, articleText: `A Day to Rejoice: Albert Hannigan

At the time of the birth of Christ, the angel said to the shepherds, "Behold I bring you good tidings of great joy which shall be to all people." Later on, both John the Baptist and Jesus proclaimed the glad tidings of the kingdom of God. Today we rejoice, for the King of the kingdom has come, and He has come to dwell within us by His Spirit. Before Jesus was taken up into heaven, He instructed His disciples to tarry in Jerusalem and wait for the promise of the Father, the Holy Spirit, for they would receive power after that the Holy Spirit would come upon them. They were obedient to His command, and on that glorious day of Pentecost, the Holy Spirit descended upon them, and they were filled to overflowing. During the following centuries, there was a falling away and Christendom fell into disarray, disunity and sin. However, God always had a remnant who longed to be led by His Spirit and walk in His ways. As many took God\'s word to heart and sought after Him in fasting and prayer, God began to pour out His Spirit upon hungry hearts. Early in the 19th century, God poured out the gift of the Holy Spirit, accompanied with speaking in tongues, upon many hungry people. Then in 1948 God moved again in a wonderful way and restored to us the truths of the body of Christ and the ministries of apostles, prophets, evangelists, pastors and teachers. He has taught us that we are living stones in the house of God, a dwelling place for Him. We are told that each of His sons and daughters are unique, and play a very important role in His body. We fit together and flow together in unity in God\'s great plan. God is guiding His church through the ministry of apostles, prophets, evangelists, pastors and teachers today. In the New Testament, God spoke to individuals in prophesy through a presbytery, and this is happening in this very day in our midst. Each member of the body of Christ must be motivated by the love of God within him or her. Jesus said that the greatest commandment is to love the Lord our God with all our heart, with all our soul, with all our mind and all our strength, and to love our neighbour as ourselves. 1 Corinthians 13 speaks beautifully as to how true love will function in our hearts. May our hearts be filled with thanksgiving, and our mouths be filled with praise to our blessed God and Saviour, now and forever. Amen.

---

Advice for Teenagers: Andy Snoke

The teenage years are crucial years that prepare a boy or girl for life. Decisions made while we are young can have lifelong implications. MRI studies of the brain have shown that the area of the brain that incorporates "wisdom" is not really fired up until a person reaches 22 or 24. The teenage brain tends to be motivated by emotions and risk taking. William Galston, a University of Maryland Professor of Public Policy, found that following these steps gives you almost a 90% chance of avoiding long-term poverty: graduate from high school; get a job right away; do not have a baby until after being married; marry wisely; stay out of trouble. Education: How much education a person needs depends on what type of work a teenager is inspired to do for life. A teenager should begin seeking God about the direction their life should take while still young. Be encouraged to talk much to your parents, to your elders, to others that you respect. Employment: A teenager should find a way to enter the workforce as soon as possible. Work as unto the Lord, and the Lord will honor you. "Bondservants, obey in all things your masters according to the flesh... And whatever you do, do it heartily, as to the Lord and not to men" (Colossians 3:22-24). Regarding sexual purity: "Flee sexual immorality" (1 Corinthians 6:18). Marry wisely: marriage is for life. Look for a godly partner that shares your faith and values. "Do not be unequally yoked together with unbelievers" (2 Corinthians 6:14). Stay out of trouble: the best way to stay out of trouble is to stay away from the wrong people. "The righteous should choose his friends carefully, For the way of the wicked leads them astray" (Proverbs 12:26). Ten Things That Require Zero Talent: being on time, work ethic, effort, body language, energy, attitude, passion, being coachable, doing extra, being prepared. Additional principles for all: stop and think before you drink; don\'t let your parents down; be humble enough to obey; turn away from unclean thoughts; choose a date who would make a good mate; go to church faithfully; stand for something or you will fall for anything; give your all to Christ. The Psalmist summed up the walk of a righteous person in Psalm 1: "Blessed is the man who walks not in the counsel of the ungodly... But his delight is in the law of the Lord, and in His law he meditates day and night."`, subtitle: 'Advice for Teenagers: Andy Snoke', author: 'Albert Hannigan', year: 2019, month: 'March', volume: 'Vol. LXXII, No. 03', title: 'A Day to Rejoice', topics: ['Kingdom','Holy Spirit','Discipleship','Family'], excerpt: 'Albert Hannigan celebrates the restoration of the Holy Spirit, the body of Christ ministries, and the call to love and unity — then Andy Snoke offers grounded, scripture-rooted counsel to teenagers on education, employment, sexual purity, marriage, friendships, and the ten attributes that require zero talent but shape a life.', pdf: '03%20-%20Sharon%20Star%20-%20March%202019.pdf', fileName: '03_-_Sharon_Star_-_March_2019.pdf' },

  { id: 82, articleText: `Bringing Your Empty Earthen Vessels to Him: Robert Persaud

The account of the widow\'s need in the book of 2 Kings 4:1-7 is very touching. She was devastated by the loss of her husband, who was a faithful servant to the prophet Elisha. The burden of indebtedness became more severe and her two sons were at the risk of becoming slaves to the creditors. In her desperation, she went to the prophet Elisha and outlined her problem to him. The man of God asked her a simple question, "What can I do for you? What do you have in your house?" Her reply was most astounding, "All I have is a pot of oil." The little that we have is significant as long as God is recognized in our lives. She was advised to borrow as many vessels as she could from as many people as possible and to gather her children and shut the door. Then she began pouring out the oil from the one jar into the others. God supernaturally intervened and provided the excess oil to fill the jars that were empty in her house. The important lesson here is to bring our empty earthen vessels to the Lord; He will fill us to overflowing so we can minister to others. This miracle is a wonderful expression of simple faith and obedience. God made a way where there was no way. I appreciate the common phrase, "Little is much when God is in it." The widows and the orphans are very close to God\'s heart. Psalms 68:5 indicates, "A father of the fatherless and the judge of the widows is God in his holy habitation." One of the functions of the church is to support widows within the assembly. It is their families\' primary responsibility to take care of the widow. In 1 Timothy 5:16: "If any man or woman that believeth have widows, let them relieve them, and let not the church be charged." The book of James says, "Pure religion and undefiled before God and the Father is this, To visit the fatherless and widows in their affliction, and to keep himself unspotted from the world" (James 1:27). The churches are ever grateful for the many women, who stand in the gap like pillars, in their prayers and intercessions. The widows who are most often older women have a distinct advantage of imparting the pure doctrine and sound principles necessary in the home. Their experiences in life serve as a lifelong tool for young women, teenagers, and children. The Scriptures mention Lois and Eunice, who were the grandmother and mother of young Timothy. Such wonderful ministries of the widows can provide an illustrative picture of the pouring out of the oil from one specific jar to fill other jars.

---

Take Time to Be Holy: Steven Levson

This morning God reminded me of the song, "Take Time To Be Holy." The message of this song seems to be so appropriate for this day and for this hour. We think that we don\'t have time for devotions, but God confirms to me that we need to spend time with Him each and every day. When we don\'t spend time with God, we may do things that either waste time, don\'t have to be done, or have to be done over again. God\'s word is very clear about spending time with Him regularly. The four verses of this hymn speak volumes. Verse 1: "Take time to be holy, speak oft with thy Lord; Abide in Him always, and feed on His Word. Make friends with God\'s children, Help those who are weak; Forgetting in nothing His blessing to seek." We have a relationship with God and just as we would talk with a family member or a close friend, we should be in frequent contact with our heavenly Father. Scripture: "But seek ye first the kingdom of God, and his righteousness" (Matthew 6:33); "Abide in me, and I in you" (John 15:4). Verse 2: "Take time to be holy, the world rushes on; Spend much time in secret with Jesus alone. By looking to Jesus, like Him thou shalt be; Thy friends in thy conduct His likeness shall see." The words "the world rushes on" describe how the world seems to be spinning faster and faster, more and more out of control. We know that God has all things under His control. "See then that you walk circumspectly, not as fools but as wise, redeeming the time, because the days are evil" (Ephesians 5:15-16). Verse 3: "Take time to be holy, let Him be thy Guide; And run not before Him, whatever betide. In joy or in sorrow, still follow thy Lord, And looking to Jesus, still trust in His word." When we take time with Him, we can hear His voice, and we desire to follow His leading. "And when he putteth forth his own sheep, he goeth before them, and the sheep follow him: for they know his voice" (John 10:4). Verse 4: "Take time to be holy, be calm in thy soul; Each tho\'t and each motive beneath His control. Thus led by His Spirit to fountains of love; Thou soon shall be fitted for service above." If we take time with God, we receive peace in our soul. "Be careful for nothing; but in everything by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus" (Philippians 4:6-7). Take time to be holy, each and every day. In Jesus name, amen!`, subtitle: 'Take Time to Be Holy: Steven Levson', author: 'Robert Persaud', year: 2019, month: 'April', volume: 'Vol. LXXII, No. 04', title: 'Bringing Your Empty Earthen Vessels to Him', topics: ['Faith','Stewardship','Prayer','Scripture'], excerpt: 'Robert Persaud draws on the miracle of Elisha and the widow\'s oil to call believers to bring their empty vessels to God in simple faith and obedience, and celebrates the intercession and teaching ministry of widows in the church; then Steven Levson walks through all four verses of "Take Time to Be Holy," pairing each with scripture to show why daily time with God is the foundation of the Christian life.', pdf: '04%20-%20Sharon%20Star%20-%20April%202019.pdf', fileName: '04_-_Sharon_Star_-_April_2019.pdf' },

  { id: 83, articleText: `Renewing of Our Mind: David Luff

Recently I wrote an article in which I discussed how God created man as a three-part being: body, soul, and spirit. "And the Lord God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living being" (Genesis 2:7). Through his spirit, man could commune with God and receive revelation from God. With his mind, he could think about and reason through the things revealed to him through his spirit. God has a unique and wonderful plan to save man to the uttermost or completely. "Now may the God of peace Himself sanctify you completely; and may your whole spirit, soul, and body be preserved blameless at the coming of our Lord Jesus Christ" (1 Thessalonians 5:23). At the time of our salvation, our spirit that was dead to God because of sin was resurrected and came into a state of eternal life through the impartation of the Holy Spirit. The Book of Romans is often called the greatest treatise on the Christian life ever written. Romans 8:4 says, "that the righteousness of the law might be fulfilled in us who do not walk according to the flesh but according to the Spirit." God\'s objective for us is a total transformation. In Romans 12:1-2, Paul tells us how this transformation takes place: "do not be conformed to this world, but be transformed by the renewing of your mind." The Greek word for "mind" is phroneo. It essentially equates to personal opinion fleshing itself out in action. Our minds have an attitude, a bent, a frame, a mindset that we inherited from Adam. It is this mindset that must be renewed. "For to be carnally minded is death, but to be spiritually minded is life and peace" (Romans 8:6). Satan blinds the minds of unbelievers and can also deceive the minds of Christians if we are careless about our walk. "Lest Satan should take advantage of us; for we are not ignorant of his devices" (2 Corinthians 2:11). Paul prays in Ephesians 1:17-18 that God will give us the spirit of wisdom and revelation, and that the eyes of our understanding will be enlightened. In Ephesians 4:22-24, Paul teaches that between "put off" and "put on" is verse 23, "and be renewed in the spirit of your mind." The transformation is not something we can make happen; only the Holy Spirit can accomplish that work. How does this renewal occur? 2 Corinthians 4:16 says, "Even though our outward man is perishing, yet the inward man is being renewed day by day." Renewal comes by meditating on and becoming practitioners of the word of God. "The law of the Lord is perfect, converting the soul" (Psalm 19:7). One of the most direct scriptures concerning the mindset of Christ is Philippians 2:5-8: "Let this mind be in you which was also in Christ Jesus" — characterized by humility, obedience, and with no concern for His own reputation. The renewal process is like a computer into which a new operating system is installed. We must "put off the old man" and allow the Holy Spirit to load God\'s Word into our minds. Do we want to love what God loves and hate what God hates? Do we want to think with the mind of Christ? We will "put off" pride-filled opinions and "put on" the desire for unity. We will "put off" self-promotion and "put on" authentic humility. We will "put off" selfishness and "put on" the attitude of a servant. As the renewal process proceeds, we will experience more and more that indeed the old things are passed away and behold, all things have become new. "For as he thinketh in his heart, so is he" (Proverbs 23:7).`, subtitle: '', author: 'David Luff', year: 2019, month: 'May', volume: 'Vol. LXXII, No. 05', title: 'Renewing of Our Mind', topics: ['Scripture','Discipleship','Holy Spirit','Faith'], excerpt: 'David Luff explores the Greek concept of phroneo — the mindset, attitude, and bent inherited from Adam — and shows from Romans 8 and 12, Ephesians 4, and Philippians 2 why only the Holy Spirit can accomplish the true renewal of the mind: not merely replacing bad thoughts with good ones, but a metamorphosis from the carnal mindset to the mind of Christ through daily immersion in the Word of God.', pdf: '05%20-%20Sharon%20Star%20-%20May%202019.pdf', fileName: '05_-_Sharon_Star_-_May_2019.pdf' },

  { id: 84, articleText: `Condemnation or Conviction: Andy Snoke

"There is therefore now no condemnation to those who are in Christ Jesus, who do not walk according to the flesh, but according to the Spirit" (Romans 8:1). Are you experiencing condemnation or conviction? There is a difference. Conviction is clean and to the point. Conviction brings souls to the altar and causes them to lay their sins and burdens at the feet of Jesus. Conviction comes by the Holy Spirit. Condemnation is quite different. Condemnation comes from the enemy of our soul, the accuser of the brethren. Condemnation will keep us captive to our past and prevent a life of freedom in the Spirit. The Bible reminds us that Satan is the accuser of the brethren (Revelation 12:10). We find Satan accusing righteous Job (Job 1:1-11). The enemy of our soul stands before God bringing accusations against God\'s faithful. If he can trap a person in a feeling of overwhelming guilt, undeserving of God\'s love, he has accomplished his intentions. John 8 gives us the story of the woman caught in adultery. She was under condemnation from the law and was accused by her enemies. But Jesus presented a higher truth, the truth of complete forgiveness: "Neither do I condemn you; but go and sin no more." On the day of Pentecost, Peter preached the first full gospel message in all of history. The Holy Spirit sent conviction, not condemnation. The process for deliverance was simple: Repent! The Lord does not forgive incrementally, but completely. Our sins are like a giant chalkboard with every sin written in chalk. When Jesus comes, they are all erased, completely. The apostle Paul had many reasons to condemn himself — he was the influence behind the persecution of the church. Yet after his conversion, Paul chose to leave his past covered by the blood of Jesus. "Brethren, I do not count myself to have apprehended; but one thing I do, forgetting those things which are behind and reaching forward to those things which are ahead, I press toward the goal for the prize of the upward call of God in Christ Jesus" (Philippians 3:13-14). Paul\'s recipe for recovery from past trauma: forget those things which are behind; reach forth to those things which are ahead; press towards the goal for the prize. "For I know the thoughts that I think toward you, says the Lord, thoughts of peace and not of evil, to give you a future and a hope" (Jeremiah 29:11).

---

A Lamp unto My Feet: Brandon Snoke

Psalm 119:105 — "Thy word is a lamp unto my feet and a light unto my path." My son Joel and I hiked the Flat Tops Wilderness, Colorado. Much of the trail was very narrow, rarely marked and often not visible. I frequently checked the map and GPS to be sure we were on the right trail. Joel soon proved an aptitude for deciphering the GPS and the map; he was always able to get us back on the trail. On the latter part of our hike I was very fatigued and just walked behind Joel. Psalm 119:105 came to my mind: "Thy word is a lamp unto my feet and a light unto my path." King David had a long, tough struggle during his life — from shepherd boy to being anointed king, killing Goliath, fleeing from Saul, and eventually fleeing from his own son Absalom. David learned through years of struggle that it was easier to just follow the path of the Lord. David also knew the safety in following the Word of God. He boldly challenged the giant Goliath, trusting in the God who had delivered him from the lion and the bear. We may never come face to face with a giant like Goliath, but we do come against giants in other forms — personal battles against temptation, lack of faith, depression, or any number of things that seem insurmountable. But our God who has preserved us up to this day is fully able to deliver us now. I received a call from a lady named Toni whose son had committed suicide. She told me she sometimes doesn\'t want to live. I told Toni that I was a firm believer in the resurrection, and that was a hope we all can hold on to. She agreed that was the only thing keeping her going. God will not always light the whole room or the full length of the road, but He is faithful to illuminate our feet, and lead us one step at a time. When David killed Goliath with a sling and a stone, he had no sword in his hand. His God improvised and gave David victory without a sword. Sharing our praise reports and testimonies in church is every bit like David holding up the head of Goliath. When David held up the head of Goliath, it gave Israel courage and faith that they too could defeat their enemy — and they did.`, subtitle: 'A Lamp unto My Feet: Brandon Snoke', author: 'Andy Snoke', year: 2019, month: 'June', volume: 'Vol. LXXII, No. 06', title: 'Condemnation or Conviction', topics: ['Salvation','Faith','Scripture','Testimony'], excerpt: 'Andy Snoke distinguishes the Holy Spirit\'s clean conviction that leads to repentance from Satan\'s condemnation that holds believers captive to the past, drawing on Job, the woman caught in adultery, Paul\'s testimony, and Jeremiah 29:11; then Brandon Snoke meditates on Psalm 119:105 through the lens of a wilderness hike, the story of David and Goliath, and a conversation with a grieving mother to show that God lights our path one step at a time.', pdf: '06%20-%20Sharon%20Star%20-%20June%202019.pdf', fileName: '06_-_Sharon_Star_-_June_2019.pdf' },

  { id: 85, articleText: `God Gave His All by Sending Jesus: Mike Greif

(All scriptures are from the New American Version, NASB.) Jesus gave His all to God by agreeing to come down to earth to fulfill the calling and ministry God had for Him. He gave His all by walking with God and abiding in Him each day here on this earth, being led by God\'s Spirit throughout His entire lifetime, one day at a time. God also wants us to give our all to Him. If we\'re going to bear fruit for God we\'re going to have to deny ourselves, take up our crosses daily, and follow Jesus, as it says in Luke 9:23. Just as Jesus was led by the Spirit, we need to be led by the Spirit. We won\'t take anything with us into heaven if we live for ourselves. If we accept Jesus as our savior we will receive salvation. God not only wants us to receive salvation but to bear fruit for Him. "Abide in Me, and I in you. As the branch cannot bear fruit of itself unless it abides in the vine, so neither can you unless you abide in Me. I am the vine, you are the branches; he who abides in Me and I in him, he bears much fruit, for apart from Me you can do nothing" (John 15:4-5). To abide means to be in close fellowship with Him and to be in tune with His Holy Spirit. "My sheep hear My voice, and I know them, and they follow Me" (John 10:27). John 12:24-26 says, "unless a grain of wheat falls into the earth and dies it remains by itself alone; but if it dies, it bears much fruit." The word "hates" in verse 25 comes from the Greek word "miseo" which means choosing or elevating one value over another. It is like when you go outside and the birds are singing but you don\'t hear them because your mind is so focused on the jobs and things you\'re doing. It\'s the same with listening to the Holy Spirit. There\'s a scripture made into a song that says, "If you want to be great in God\'s kingdom learn to be the servant of all." Jesus was the servant of all! He commands us to be filled with the Spirit (Ephesians 5:18). "The very power that God used to raise Jesus from the dead is working in us, living and abiding in us, daily" (Ephesians 1:19-23). God gave His all to and for us. Jesus His Son gave His all by coming to earth and dying on the cross for us. Let us also choose to give our all to God as we daily walk this earthly sod for Him.

---

Redemption: Paul Amundson

(All scriptures are from the New King James Version.) The definition of redemption is "the act of saving or being saved from sin, error, or evil" and "the action of regaining or gaining possession of something in exchange for payment or clearing a debt." Romans is Paul\'s greatest work — more than a book of theology, it is also a book of practical exhortation. The good news of Jesus Christ is more than facts to be believed; it is a life to be lived. "All have sinned and fall short of the glory of God, being justified freely by His grace through the redemption that is in Christ Jesus" (Romans 3:23-24). Romans 8:18-30 declares that "the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us," and that the creation itself waits for the revealing of the sons of God. "All things work together for good to those who love God, to those who are the called according to His purpose." God placed His hand on us before we were born, led us, blessed us, empowered us, and will fulfill His complete plan for mankind in us as we walk faithfully with Him. "God has chosen the foolish things of the world to put to shame the wise" (1 Corinthians 1:27). Christ entered the Most Holy Place once for all with His own blood, "having obtained eternal redemption" (Hebrews 9:12). We must realize that we have that redemptive power abiding in our bodies and that we can reclaim it simply by repenting. Even though we have responsibilities on this earth we are pilgrims. We must look past this world and set our eyes upon the heavenly calling of being kings and priests in the Kingdom of our Lord. Ephesians speaks of those who are rich beyond measure in Jesus Christ, yet living as beggars, only because they are ignorant of their wealth — adoption, acceptance, redemption, forgiveness, wisdom, inheritance, the seal of the Holy Spirit, life, grace, citizenship. "And do not grieve the Holy Spirit of God, by whom you were sealed for the day of redemption" (Ephesians 4:30). In closing, let the realization of these scriptures burn in your heart with the plan that God has for you in the Body of Christ, His Church. If we will be faithful, the victory has been won, so let\'s enjoy the race knowing he walks beside us each step of the way.`, subtitle: 'Redemption: Paul Amundson', author: 'Mike Greif', year: 2019, month: 'July', volume: 'Vol. LXXII, No. 07', title: 'God Gave His All by Sending Jesus', topics: ['Salvation','Scripture','Kingdom','Holy Spirit'], excerpt: 'Mike Greif calls believers to give their all to God as Jesus gave His all — abiding in the Vine, bearing fruit, dying to self, and walking in the Spirit that raised Christ from the dead; then Paul Amundson expounds redemption through Romans, Hebrews, and Ephesians, reminding believers they are rich beyond measure in Christ and sealed by the Holy Spirit for the day of redemption.', pdf: '07%20-%20Sharon%20Star%20-%20July%202019.pdf', fileName: '07_-_Sharon_Star_-_July_2019.pdf' },

  { id: 86, articleText: `Culture (Part One): Kelvin Martin

(The biblical translation used throughout this article is the King James Version unless otherwise stated.) Mankind lives in fear; fear of death, fear of the unknown, fear of misery through poverty, fear of disappointment or failure, fear of physical or emotional pain, fear of loneliness, fear of shame and ridicule, and fear of rejection. Our fears are experienced through our interaction with the world. This article differentiates the culture of the world which induces fear, from God\'s culture originated in His commandments, statutes, and judgments which leads to peace and everlasting life. "There is no fear in love; but perfect love casteth out fear: because fear hath torment. He that feareth is not made perfect in love" (1 John 4:17-18). Paul speaks of being "not conformed to this world" but rather to be "transformed by the renewing of your mind" (Romans 12:1-2). The Greek word for "transformed" is the origin of the English word metamorphosis — a true change into another form. Culture is defined as shared customs, beliefs, attitudes, values, goals, practices, behaviors, conventions, social norms, institutions, and achievements of a nation or people. Jesus speaks of the culture of the world being opposed to those who follow Him: "If ye were of the world, the world would love his own: but because ye are not of the world, but I have chosen you out of the world, therefore the world hateth you" (John 15:19). God\'s Culture: In Deuteronomy 4, Moses implores the children of Israel to "hearken unto the statutes and unto the judgments" given by the Lord God. Over 40 years since being delivered from Egypt, God had through Moses cultivated His people in His ways. These God-given statutes and judgments are foundational beliefs, values, and practices that the Lord God desired to have common with the children of Israel. Their ways were to be His ways, their culture was to be His culture. They were not to add one word to His culture and they were not to subtract anything from it. God\'s people were to be viewed as peculiar, different from all other nations. Other Nations\' Cultures Are Not God\'s Culture: "When thou art come into the land which the LORD thy God giveth thee, thou shalt not learn to do after the abominations of those nations" (Deuteronomy 18:9). The customs, beliefs, attitudes, values, goals, practices, and behaviors of these nations were "not to be found among" the children of Israel. They were to "be perfect with the LORD thy God." Adherence to Man\'s Culture Puts Men Into Bondage: Jesus rebukes the Pharisees and scribes who placed their traditions derived by the minds of men in direct opposition to the commandments of God (Mark 7:1-13). Their religious acts, protecting assets as Corban, were justified by their cultural traditions — but those acts were, in fact, breaking God\'s commandment to honour father and mother. The Parable of the Labourers (Matthew 20:1-16): This parable begins "For the kingdom of heaven is like" — meaning it is similar in character, in nature, or in culture. The householder hired labourers throughout the day, promising each a fair reward. Those called at the third hour were promised "whatsoever is right" if they toiled in the vineyard — this required a measure of faith, belief, and trust. Finally, in the eleventh hour, the householder goes out again: "Why stand ye here all the day idle?" — they replied, "Because no man hath hired us." The parable of the labourers parallels the parable of the great supper (Luke 14:16-24) — it was those who were not immersed in the culture of the marketplace, those standing idle and outcast, who ultimately partook of the supper. Returning to the parable of the laborers: "the harvest truly is plenteous, but the labourers are few." God didn\'t burden us with being "observers of times." He is teaching us to work in the vineyard until the end of the day. [To Be Continued In The September 2019 Issue]`, subtitle: '', author: 'Kelvin Martin', year: 2019, month: 'August', volume: 'Vol. LXXII, No. 08', title: 'Culture (Part One)', topics: ['Scripture','Discipleship','Kingdom','Faith'], excerpt: 'Kelvin Martin contrasts the fear-inducing culture of the world with God\'s culture of commandments, statutes, and judgments that leads to peace — drawing on Deuteronomy, the Pharisees\' tradition-over-law hypocrisy, and the parable of the labourers to show that God\'s kingdom is not relative, and that believers are called to labour in His vineyard rather than observe the times.', pdf: '08%20-%20Sharon%20Star%20-%20August%202019.pdf', fileName: '08_-_Sharon_Star_-_August_2019.pdf' },

  { id: 87, articleText: `Culture (Part Two): Kelvin Martin

[Continued From The August 2019 Issue] The Parable of the Labourers — Continued: Continuing in Matthew 20:8, "So when even was come, the lord of the vineyard saith unto his steward, Call the labourers, and give them their hire, beginning from the last unto the first." Those hired in the eleventh hour were paid a penny, the amount promised. However, there arose considerable murmuring when those hired first received the same amount. Their culture had established a set of values that had received acceptance as fair, and this payment distribution was contrary to those cultural beliefs. What were the labourers really questioning? The rightness or righteousness of "the goodman of the house." The response of the householder is to assure them, "I do thee no wrong." The righteousness of the omnipotent God cannot be questioned through the eyes of a culture derived from man\'s mind because man\'s mind is "evil" and He is "good." "The carnal mind is enmity against God: for it is not subject to the law of God, neither indeed can be" (Romans 8:7). The kingdom of heaven is not relative. You either enter in, obtain eternal life, find His rest, receive the reward, or you refuse and you don\'t. The labourers had to labour to the end of the day. You labour in the vineyard until the end of the day and receive the agreed-upon reward or you walk away believing the value of your current condition is greater than the promised reward of eternal life. Jesus Encounters The Rich Man (Matthew 19:16-26): A man came to Jesus asking, "what good thing shall I do, that I may have eternal life?" Jesus responded, "keep the commandments." The man claimed to have kept them all. Jesus then said, "If thou wilt be perfect, go and sell that thou hast, and give to the poor, and thou shalt have treasure in heaven: and come and follow me." Having great wealth, this man walked away sorrowful, believing the security of his current life was greater than the promised eternal life. Jesus taught His disciples that earthly wealth could be an almost impossible barrier to entering the kingdom. "With men this is impossible; but with God all things are possible." What Do We Really Seek? The rich man with his lips was seeking eternal life but in the end, his culture was his abiding place. After the feeding of the multitude, the crowd wanted Jesus to be their king — but this was their cultural response, not God\'s plan. Jesus teaches, "Labour not for the meat which perisheth, but for that meat which endureth unto everlasting life." Even Peter asked Jesus, "we have forsaken all, and followed thee; what shall we have therefore?" He was evaluating his cost-versus-reward equation. Jesus promises, "every one that hath forsaken houses, or brethren, or sisters, or father, or mother, or wife, or children, or lands, for my name\'s sake, shall receive an hundredfold, and shall inherit everlasting life." The Account Of Jonah: Jonah was called by God to minister to Nineveh, the capital of Israel\'s feared enemy Assyria. Jonah fled from the presence of the LORD. God sent a great fish to save Jonah and after three days of "submission training" in its belly, Jonah was vomited upon dry land. God called Jonah the second time. Jonah obeyed and entered Nineveh, crying, "YET FORTY DAYS, AND NINEVEH SHALL BE OVERTHROWN." The people of Nineveh believed God, proclaimed a fast, and put on sackcloth. Even the king repented. God saw their works and repented of the evil He had planned against them. Now Jonah had a real problem — he wasn\'t rejoicing that over 120,000 people were saved from God\'s wrath. Jonah was so despondent he pleaded to die. The real issue Jonah had is rooted in his Israeli culture derived from Deuteronomy 18:20-22: a prophet whose prophecy did not come true was a false prophet. Jonah now saw himself shamed by his culture. He was more afraid of the consequences of being judged by his own people\'s culture than to minister God\'s mercy to the inhabitants of Nineveh. Jonah\'s culture might condemn him but his obedience to God\'s calling will receive its reward.`, subtitle: '', author: 'Kelvin Martin', year: 2019, month: 'September', volume: 'Vol. LXXII, No. 09', title: 'Culture (Part Two)', topics: ['Scripture','Discipleship','Kingdom','Faith'], excerpt: 'Kelvin Martin concludes his two-part series on culture by examining the murmuring of the labourers, the rich young ruler who chose his culture over eternal life, Peter\'s cost-versus-reward question, and the account of Jonah — showing that Jonah\'s real problem was not a lack of compassion but fear of being condemned as a false prophet by his own culture, while God\'s mercy reached 120,000 souls.', pdf: '09%20-%20Sharon%20Star%20-%20September%202019.pdf', fileName: '09_-_Sharon_Star_-_September_2019.pdf' },

  { id: 88, articleText: `Break Up Your Fallow Ground: Mervin Sundbo

The field of agriculture is often used in Scripture to portray a spiritual truth and such is the case in the "Parable of the Sower" in Matthew chapter 13 and references to fallow ground found in Jeremiah 4:3 and Hosea 10:12. Jeremiah 4:3 says, "Break up your fallow ground and do not sow among thorns" (NKJV). Fallow ground is untilled ground that has not been prepared for seeding. It typically will be ground that is infested with weeds and therefore sowing good seed in such ground would be unprofitable. Note that fallow ground is not necessarily poor or infertile soil, but rather it is soil that has not been prepared to accept the seed. Fallow ground has growth potential, but that potential is only realized if the ground is prepared for planting and thus productivity. Therefore, in like manner, we need to break up the fallow ground of our hearts in preparation for the planting of the Lord — fertile ground to receive all that the Lord has for us. Hosea 10:12 speaks to sowing and reaping: "Sow for yourselves righteousness; reap in mercy; break up the fallow ground, for it is time to seek the Lord til He comes and rains righteousness upon you" (NKJV). The result of the spiritual rain to the tilled soil of our hearts is spiritual growth. Righteous living reaps a harvest of compassion toward those with whom we interact on a daily basis. Seeking involves persistence or perseverance. God requires humility, seeking Him in prayer, and turning from our own ways. He will hear us, forgive our sin, and heal our land. Galatians 6:8 says, "he who sows to the Spirit will of the Spirit reap everlasting life." The works of the flesh and the fruit of the Spirit are contrasted in Galatians 5:19-24. The inheritors of the kingdom of God are those who manifest the fruit of the Spirit. If a farmer has stones on his farmland, they have to be removed from time to time. God says He will remove the stones from our hearts. In place of the stony heart, He will give a heart of flesh — tender, malleable, forgiving, compassionate and receptive to His moving. It is a heart of love (Ezekiel 11:19). So, break up the fallow ground of thine heart and prepare it for the planting of the Lord that He may come and rain righteousness upon thee, that thou mayest reap a harvest of mercy.

---

Worshipping under the Anointing: PJ Mathew

Anoint means to set someone apart, to authorize and equip him or her for a task of spiritual ministry. Jesus Christ was set apart for His ministry of preaching, healing, and deliverance (Luke 4:18-19). The Holy Spirit sets us apart with heavenly power for the ministry of Christ. On the Pentecost Day, the Holy Spirit descended on the people and they were filled by the Spirit of God and spoke in tongues (Acts 2:1-4). In the Old Testament, the Holy Spirit descended on individuals for specific tasks. The anointing of the Holy Spirit in the New Testament is the fulfillment of the prophecy of Joel 2:28. Salient tasks of the anointing include: making us aware of the Messiah; setting us apart from the world; breaking the yoke and destroying bondage; healing our physical and spiritual diseases; binding us with the Holy Spirit; empowering us to minister; building us in faith; enabling us to live in the realm of the Spirit; making us holy; teaching us the truth; setting us free; opening our spiritual eyes to see Christ in everyone; and uniting us. John the apostle was on the island of Patmos by order of Roman Emperor Domitian. On the Lord\'s Day, he was in the Spirit, and he saw the glorified Christ among the seven golden lampstands (Revelation 1:9-17). John fell at His feet as dead. When we are under the anointing, we see and hear the things of the Spirit. Paul was transported to the third heaven and heard inexpressible things (2 Corinthians 12:2). Through that experience, He heard the voice of God: "My grace is sufficient for you, for my power is made perfect in weakness." When Job saw God in His glory at the end of his trials, he said, "My ears had heard of you, but now my eyes have seen you. Therefore, I despise myself and repent in dust and ashes" (Job 42:5-6). In 1 John 3:2-3: "when he appears, we shall be like him, for we shall see him as he is. Everyone who has this hope in him purifies himself, just as he is pure." It is not a one-time baptism of the Holy Spirit, but a continuous infilling experience is vitally important to reflect the Christ in us. Our cup must be always full with the anointing. A Spirit-filled person is a challenge for the devil. "Be self-controlled and alert. Your enemy the devil prowls around like a roaring lion looking for someone to devour. Resist him, standing firm in the faith" (1 Peter 5:8-9).`, subtitle: 'Worshipping under the Anointing: PJ Mathew', author: 'Mervin Sundbo', year: 2019, month: 'October', volume: 'Vol. LXXII, No. 10', title: 'Break Up Your Fallow Ground', topics: ['Scripture','Holy Spirit','Faith','Discipleship'], excerpt: 'Mervin Sundbo uses the agricultural images of fallow ground, sowing, and reaping from Jeremiah, Hosea, and Galatians to call believers to prepare their hearts for the planting of God\'s Word; then PJ Mathew traces the anointing of the Holy Spirit from Pentecost through the visions of John on Patmos, Paul in the third heaven, and Job\'s encounter with God, showing that continuous infilling is essential to reflect Christ in us.', pdf: '10%20-%20Sharon%20Star%20-%20October%202019.pdf', fileName: '10_-_Sharon_Star_-_October_2019.pdf' },

  { id: 89, articleText: `Returning to God: Andy Snoke

We find the sad account of the "original sin" in the third chapter of Genesis. This was the beginning of mankind\'s journey into depravity and sin. After disobedience entered the picture, the voice of God became weaker and weaker between man and God. There were specific steps that were taken by Eve that caused this journey away from God. I find it interesting to examine Genesis chapter 3. In many ways, the way back to God is to do the opposite of what Eve did in the garden. Satan did not start with an outright lie when he spoke to Eve. He started with a question: "Did God really say, \'You must not eat from any tree in the garden?\'" All temptation starts with questioning God. All around us, in academia, in governments, men and women question the Word of God for its relevance. The next step of the great temptation was to offer a half-truth over a full lie. "You will not certainly die" — a lie; "your eyes will be opened" — true; "you will be like God" — a lie; "knowing good and evil" — true, but Eve did not know that from the moment of disobedience it would be difficult to follow good and easy to follow evil. Half-truths can be more dangerous than full lies. The same three categories of temptation found in Genesis 3 appear again in 1 John 2:16: the lust of the flesh, the lust of the eyes, and the pride of life. Eve\'s self-deception and sin was more than merely eating the forbidden fruit. It was: disobeying the revealed Word of God; believing the lie of Satan; and placing their own wills above God\'s will for them. Because of this disobedience, Adam and Eve quickly felt something they had never experienced in their lives — a keen sense of guilt. Adam blamed Eve. Eve blamed the serpent. After a long pronouncement of judgment, the Lord made garments of skins and clothed them — signifying that a sacrifice of blood was immediately necessary. The slain Lamb of God would ultimately be slain for the payment for sin and a covering for all of mankind. Let us examine the same steps in reverse as we make our journey back to God. It Begins With A Sacrifice: Our return back to God now starts with a sacrifice — the precious blood of Christ, a lamb without blemish (1 Peter 1:18-21). Our salvation was purchased in full by the only begotten Son of God. We cannot earn it. We cannot buy it. It is a free gift that comes from God. Placing God\'s Will Above Our Own: When faced with temptation, Eve placed her will above God\'s. We must learn and consciously choose to place God\'s will above our own. The greatest example is Jesus in the garden of Gethsemane: "Father, if it is Your will, take this cup away from Me; nevertheless not My will, but Yours, be done" (Luke 22:42). We Must Not Believe The Lies Of Satan: Satan is the father of lies (John 8:44). We are inundated today with lies all prefaced with the question, "Did God really say?" Obeying The Revealed Word of God: Eve disobeyed the revealed word of God. We are responsible for walking in what God has revealed to us in this hour in which we live. It takes a conscious choice and decision to obey. "For this reason I will not be negligent to remind you always of these things, though you know and are established in the present truth" (2 Peter 1:12). "He who says he abides in Him ought himself also to walk just as He walked" (1 John 2:6).`, subtitle: '', author: 'Andy Snoke', year: 2019, month: 'November', volume: 'Vol. LXXII, No. 11', title: 'Returning to God', topics: ['Scripture','Salvation','Faith','Discipleship'], excerpt: 'Andy Snoke traces the fall of Eve step by step — Satan\'s questioning of God\'s word, the half-truth that was more dangerous than a full lie, the lust of flesh, eyes, and pride of life — then reverses the sequence to show the way back to God: the sacrifice of Christ\'s blood, placing God\'s will above our own (as Jesus did in Gethsemane), refusing Satan\'s lies, and walking in obedience to the revealed word of the present truth.', pdf: '11%20-%20Sharon%20Star%20-%20November%202019.pdf', fileName: '11_-_Sharon_Star_-_November_2019.pdf' },

  { id: 90, articleText: `Matthew the Tax Collector: Andy Snoke

I have often been intrigued with the story of Matthew the apostle. Before he was Matthew the apostle, he was Levi, the tax collector. There are only two times that the word "church" is used in the four gospels. Both occurrences were penned only by Matthew. Matthew must have had a comprehensive glimpse of the formation of the church that was to come after Pentecost. Matthew\'s parents named their new baby boy Levi — a holy, regal name; the name of the father and patriarch of the tribe of Levi, the beginning of the Levitical tribe of priests. "Therefore Levi has no portion or inheritance with his brothers. The Lord is his inheritance" (Deuteronomy 10:9). Somewhere in the life of Levi, he chose the life of a tax collector. Tax collectors, in the days of Jesus, were a disreputable lot. Their job required that they collect the heavy tax of Rome imposed on the people of Israel. Many were greedy and dishonest. Tax collectors were not allowed to enter the Holy temple and were cut off from their own brothers, their own religion. One will never know how Levi became a tax collector — it may have been for the most basic reason of all, to simply make a living. I can only imagine the loneliness that Matthew felt day in and day out with no fellowship of his brethren and no right to enter the temple and worship God. Levi must have heard the story of a fellow tax collector named Zacchaeus. Zacchaeus had heard of this man called Jesus and climbed a sycamore tree just to catch a glimpse of Him as He passed. When Jesus reached the spot, He looked up and called Zacchaeus by name: "Zacchaeus, hurry and come down, for I must stay at your house today." Zacchaeus\' life was forever changed in that brief encounter. Matthew must have heard this wonderful testimony of his friend Zacchaeus. His heart must have swelled with hope. Matthew went to work as he had always done. Levi sat at his little table collecting taxes from unhappy Jews in the name of Rome. There was an anointing in the air — a Presence that Matthew could sense in every cell of his body. He turned and saw Him. Jesus peered at Matthew, straight in the eye. Jesus then spoke a two-word sermon. "As Jesus passed on from there, he saw a man called Matthew sitting at the tax booth, and he said to him, \'Follow me.\' And he rose and followed him" (Matthew 9:9). Jesus did not explain where He would lead him, did not reveal that Matthew\'s name would be named as one of the twelve, did not reveal the violent death Matthew would experience because of his witness. "Today, if you hear his voice, do not harden your hearts as in the rebellion" (Hebrews 3:15). Matthew immediately got up and left all. The world\'s goods no longer had influence over his decisions. Much later, when Matthew wrote the gospel that bears his name, he had the opportunity to replace the infamous title "tax collector" with the noble title of "apostle." But as Matthew recorded the names of the twelve apostles, he reminded his readers of who he once was: "Matthew the tax collector" (Matthew 10:3). Matthew reminds us all that no matter who we are, no matter who we were, no matter what we have done, grace, mercy, truth and forgiveness are available freely by the one who calls, "Follow me." The story of Matthew is the story of us today. Jesus calls to us all, "Follow me." In the beginning of the 1948 revival, God moved mightily on many men and women and prepared their hearts for the ushering in of something wonderful — a calling to "sonship," a calling to His kingdom. Just as Matthew answered His call, God has called His children in every dispensation to leave all and to follow Him. Jesus is the way to heaven — not just one "way" to heaven, He is the only way (John 14:6).`, subtitle: '', author: 'Andy Snoke', year: 2019, month: 'December', volume: 'Vol. LXXII, No. 12', title: 'Matthew the Tax Collector', topics: ['Scripture','Testimony','Salvation','Kingdom'], excerpt: 'Andy Snoke tells the story of Levi the tax collector — the loneliness of a man cut off from his temple and his people, the hope kindled by Zacchaeus\'s encounter with Jesus, and the moment Jesus said only "Follow me" and Matthew rose and left everything — drawing the parallel to all who are called in every dispensation, and to the 1948 revival\'s call to sonship and the kingdom of God.', pdf: '12%20-%20Sharon%20Star%20-%20December%202019.pdf', fileName: '12_-_Sharon_Star_-_December_2019.pdf' }

  { id: 91, articleText: `This Move of the Spirit — A New Beginning: Andy Snoke

A beginning. Everything has its own beginning. Our birth. The dawning of a new day. All of creation itself started with "In the beginning, God created the heavens and the earth" (Genesis 1:1 ESV). New beginnings are also true of the spiritual revivals that have descended from heaven to move mankind closer towards God's ultimate goal of Genesis 1:26.

The beginning of what is often referred to as "The Move of the Spirit" is more commonly recorded as February 11, 1948, at the Sharon Bible School in North Battleford, Saskatchewan, Canada, some 70 years ago. About 70 students gathered at the school for their Bible classes, spiritually prepared for by days and weeks of prayer and fasting. There was a great spiritual hunger residing within the hearts of the faculty and students in that hour. Through prophecy God said, "Behold I have placed before you an open door. Enter ye in and if you fail to do so now, this door will be closed to you forever." A prophecy followed: "This door is the doorway into your gifts, callings and ministries. Long has it been closed by doubts, fears, and unbelief, but now through fasting and prayer this door has been opened unto you." A great time of rejoicing and praising God followed.

Like a mighty wind the Holy Spirit swept over that student body. Then a holy hush came over the people, and a hallowed presence filled the room. The silence was broken when the Spirit of prophecy came upon one of the teachers: "Take the shoes from off thy feet, for the ground on which thou standest is Holy ground. For behold I am about to do a new thing in thy midst. I will at this time restore to the church the nine gifts of the Spirit, and they shall be received by prophecy and the laying on of the hands of the presbytery." Gifts, ministries, and callings were prophesied. Faith was exercised, prophecy flowed mightily and sick were healed. God taught them that He is meticulous, a God of order. It is a serious matter to give personal prophecy. God has not entrusted that responsibility to one individual, but instead, to a plurality of ministries, apostles and prophets. In the days that followed many were called, and gifts of the Spirit were prophesied. Languages were spoken and interpreted correctly. By the laying on of hands people received the baptism of the Holy Spirit.

Through the years, I have enjoyed visiting with many of the students (all now very senior citizens, or have since passed away) of that day and hour. As the different ones would begin to tell their eyewitness accounts of those early days, usually it would be given with much tears and emotion. The passing years had done little to dampen the tremendous emotions remembered by those early-day students.

Prayer and fasting opened that door some 70 years ago. This is a familiar pattern found in the Scriptures. Before the great revival under Nehemiah (445 B.C.) Nehemiah spent much time in fasting and in prayers (Nehemiah 1:4-11). Daniel, the prophet, received many absolutely astounding, detailed prophecies from God. In almost all cases, Daniel's revelations came after a period of prayer and fasting.

As the 70th anniversary of this present Move of the Spirit approaches us in February 2018, let us be mindful of the doors that were opened for the church through the faithful prayers and fasting of that early hour. Let us fervently petition the Lord, for a great "moving forward" of His Spirit in His church in 2018. Let us confess the sins that so easily beset us (Hebrews 12:1). "Being confident of this very thing, that he which began a good work in you will perfect it until the day of Jesus Christ" (Philippians 1:6 ESV). "Therefore we also, since we are surrounded by so great a cloud of witnesses, let us lay aside every weight, and the sin which so easily ensnares us, and let us run with endurance the race that is set before us, looking unto Jesus, the author and finisher of our faith" (Hebrews 12:1-2 NKJV).`, subtitle: '', author: 'Andy Snoke', year: 2018, month: 'January', volume: 'Vol. LXXI, No. 01', title: 'This Move of the Spirit — A New Beginning', topics: ['Holy Spirit','Prayer','Kingdom','Scripture'], excerpt: 'Andy Snoke marks the 70th anniversary of the February 11, 1948 revival at the Sharon Bible School in North Battleford — recounting the open door prophecy, the holy hush that fell on students and faculty, the restoration of the nine gifts of the Spirit by presbytery and laying on of hands, and the call to return to the same prayer and fasting that opened that door.', pdf: '01%20-%20Sharon%20Star%20-%20January%202018.pdf', fileName: '01_-_Sharon_Star_-_January_2018.pdf' },
  { id: 92, articleText: `Faith: Crafton Lewis

The Bible gives us the meaning of the word faith in Hebrews 11:1, "Now faith is the substance of things hoped for, the evidence of things not seen." Faith is: confidence or trust in a person or thing; belief that is not based on proof; belief in God or in the doctrines or teachings of religion; and the trust in God and His promises as made through Christ and the scriptures by which man is justified or saved. In Hebrews 11:1, faith is described as substance. These definitions seem to be describing opposites, since faith is not something you can physically lay hold of, whereas substance is tangible. Yet we are told that faith is substance. I would like to think of faith similarly to wind — we do not see it, but the evidence is seen everywhere. Looking from the realm of the Spirit: "By faith we understand that the worlds were framed by the word of God, so that the things which are seen were not made of things which are visible" (Hebrews 11:3). Visible things originated from the invisible. That's just the way it was, and this is exactly what faith is about. We should not be like Thomas who said, "Unless I see in His hands the print of the nails I will not believe." Jesus said to him, "Thomas, because you have seen Me, you have believed. Blessed are those who have not seen and yet have believed" (John 20:29). God is not partial; to everyone He has given a measure of faith. "Without faith it is impossible to please Him, for he who comes to God must believe that He is, and that He is a rewarder of those who diligently seek Him" (Hebrews 11:6). When a person says "I don't have faith" that really is not the truth. What He has given is sufficient to be drawn to, and to receive Jesus Christ as one's Lord and Savior. After receiving Him one can say as the disciples did, "Increase our faith" (Luke 17:5). The Lord went on to make a serious point: "If you have faith as a mustard seed, you can say to this mulberry tree, 'Be pulled up by the roots and be planted in the sea,' and it would obey you" (Luke 17:6). Plant the seed — it will then grow and develop into a tree with many branches and lots of leaves and fruits. Faith is also listed as one of the nine gifts of the Spirit in 1 Corinthians 12:9. This faith operates as a special part of one's ministry — the tool God puts in one's hand to do the task when there is need. Fear has torment: "There is no fear in love; but perfect love casts out fear" (1 John 4:18). Faith will always overcome fear. Abraham's unwavering faith meant that he obeyed when he was called to go out to a place he did not know, not knowing where he was going (Hebrews 11:8-10). He even prepared to offer Isaac, expressing faith that both he and Isaac would return. Other heroes of faith in Hebrews 11 died in faith, not having received the promises, "but having seen them afar off were assured of them, embraced them and confessed that they were strangers and pilgrims on the earth." God is not ashamed to be called their God, for He has prepared a city for them. "Without faith it is impossible to please God" (Hebrews 11:6).

---

Discerning the Work of the Holy Spirit: Robert Persaud

The Holy Spirit is omnipresent, moving like the gentle winds; The evidence of life in the forest, by the rustling of the leaves; The breath of fresh air from the foothills to the mountains. As I gaze across the land from the hills to the lonesome valleys, I listen deep within my soul; I can hear the sweep of angels' wings, As they bow humbly, in their worship of celestial praise, The zenith of reverence uttered to the Creator of all things. He is the immortal, invisible and magnificent as the Ancient of Days. The Holy Spirit flows gracefully, like a brook from the start; The fountains of life, satisfying the hungry, quenching each thirst. Oh, how I long for a place in the deep recesses of my heart. In search for answers as pilgrims, I look for the oasis in the desert And the streams of life, flooding my innermost being To the overflow, extending beyond the banks of many rivers; Immutable, immeasurable, unstoppable and all encompassing, Reaching the destitute, the thirsty, all dying within its borders. The Holy Spirit is the comforter, pouring out the oil of healing, Precious balm of Gilead, for the afflicted and the suffering; Power to heal and to strengthen, by His ever-rich anointing, From the ashes of bondage, to the realms of rejoicing. The hurts of the past, to the forgiveness of the present, The plains of the carnal, to the mountains of the spiritual, A soul that was famished, masked by pride and conceit, Can now be enriched from the outpouring of heaven eternal.`, subtitle: 'Discerning the Work of the Holy Spirit: Robert Persaud', author: 'Crafton Lewis', year: 2018, month: 'February', volume: 'Vol. LXXI, No. 02', title: 'Faith', topics: ['Faith','Scripture','Holy Spirit'], excerpt: 'Crafton Lewis unpacks the paradox of faith as substance — drawing on Hebrews 11, the mustard seed, the stories of Abraham and the heroes of faith, and the distinction between the measure of faith given to every believer and the gift of faith as one of the nine gifts of the Spirit; then Robert Persaud offers a poem meditating on the omnipresence and anointing of the Holy Spirit.', pdf: '02%20-%20Sharon%20Star%20-%20February%202018.pdf', fileName: '02_-_Sharon_Star_-_February_2018.pdf' },
  { id: 93, articleText: `Seven Complaints — A Study from Malachi: Andy Snoke

There are many lessons that can be drawn from the short book of Malachi. Malachi is the last book and prophetic voice in the Old Testament. It would be 400 years after Malachi before the voice of God would be heard from again. It had been about 100 years since the second temple had been rebuilt. The revival under Nehemiah was almost a century past. God's people had forgotten the past revival and had fallen into a "mechanical" form of worship. Malachi essentially lists seven complaints from God as the reasons why the Lord was dissatisfied with them. As we approach 70 years from the 1948 revival, our "hour" parallels Malachi's "hour."

Complaint One: Not Giving God Our Best (Malachi 1:6-14). God's people were offering polluted sacrifices and gifts to the Lord. The best of what was available for sacrifice was always kept for themselves. Because of this, the Lord offered the stinging rebuke, "I have no pleasure in you!" There are many areas of life that we must be cautious of and to remember to always give to God our very best — our time, our worship, the first fruits of our income, our devotion.

Complaint Two: Disobedience To God's Commands (Malachi 2:1-9). The people decided that many commands were irrelevant to their generation. The Lord pronounced: "If you will not listen, if you will not take it to heart to give honor to my name says the Lord of hosts, then I will send the curse upon you" (Malachi 2:2). "Do not be conformed to this world, but be transformed by the renewal of your mind" (Romans 12:1-2).

Complaint Three: Spiritually Mixed Marriages (Malachi 2:10-12). A spiritually-mixed marriage would always weaken the connection that God had with them. "Do not be unequally yoked with unbelievers" (2 Corinthians 6:14-18). When a man and woman enter the dating/courting phase of life, it is important to not become unequally yoked from the very beginning.

Complaint Four: Divorce (Malachi 2:13-16). This article is not intended to inflict any judgement or pain on members that have suffered through a divorce. Jesus said, "What therefore God has joined together, let not man separate" (Mark 10:9). The Biblical definition of marriage may seem uncomfortably "narrow" in terms of the standards of the world, but we are called to walk a "narrow" way (Matthew 7:13-18). Malachi's rebuke was directed at the man who had abandoned the wife of his youth: "So guard yourselves in your spirit, and do not be faithless" (Malachi 2:16).

Complaint Five: Disrespect And Lack Of Reverence (Malachi 2:17). "You have wearied the Lord with your words... By saying, 'Everyone who does evil is good in the sight of the Lord.'" There is a tendency for man to change his interpretation of God's words and commands to fit into the present worldly system. We must respect the authority God has placed in the home (Ephesians 5:22-33), in government (Romans 13:1-2), and in the church (Hebrews 13:17).

Complaint Six: Robbery! By Withholding Their Tithes (Malachi 3:7-12). The children of God were accused of robbery because they did not return God that which was lawfully His. A tithe is a tenth of our income — it belongs to the Lord. "Bring the full tithe into the storehouse... I will open the windows of heaven for you and pour down for you a blessing until there is no more need" (Malachi 3:8-12).

Complaint Seven: Pride And Arrogance (Malachi 3:13-15). "God opposes the proud but gives grace to the humble" (James 4:6). Chapter 3 ends with a wonderful promise: "They shall be mine, says the Lord of hosts, in the day when I make up my treasured possession." Malachi's prophecy stretches forward to the days of John the Baptist and into the thousand-year kingdom age. As we move forward, let us allow the Lord to search our hearts: "Search me, O God, and know my heart! Try me and know my thoughts! And see if there be any grievous way in me, and lead me in the way everlasting" (Psalms 139:23-24).`, subtitle: '', author: 'Andy Snoke', year: 2018, month: 'March', volume: 'Vol. LXXI, No. 03', title: 'Seven Complaints — A Study from Malachi', topics: ['Scripture','Stewardship','Marriage & Family','Discipleship'], excerpt: 'Andy Snoke parallels the 70-year silence after Malachi with the approaching 70th anniversary of the 1948 revival, examining each of Malachi\'s seven complaints against Israel — polluted offerings, disobedience, mixed marriages, divorce, lack of reverence, robbing God of tithes, and pride — and applying each to the church today with supporting New Testament passages.', pdf: '03%20-%20Sharon%20Star%20-%20March%202018.pdf', fileName: '03_-_Sharon_Star_-_March_2018.pdf' },
  { id: 94, articleText: `Principles of Practical Christian Living: PJ Mathew

The purpose of this article is to emphasize the principles of practical Christian living. It is an absolute truth that no building can survive against the weather or the natural catastrophes without a strong foundation. Christian living also has to be built on the solid foundation of the Holy Bible. It is not just a pattern that one should fall into, but rather a Christian discipline and values that we should embrace in our pilgrim journey to weather the storms of life.

1. Have Devotion Or Quiet Time In Your Personal Life. Throughout the Bible, we read about many great men and women who made prayer and supplication an integral part of their lives. Daniel prayed three times a day (Daniel 6:10). King David consistently praised God through the Psalms. "And pray in the Spirit on all occasions with all kinds of prayers and requests" (Ephesians 6:18). It is very important to begin the day with prayer and end the day with prayer.

2. Feed The Fire. Keeping the zeal for God is imperative in our Christian life. Always look for opportunities to feed the fire that is in you, and do not associate with people who will dampen your spirit. "Do not quench the Spirit" (1 Thessalonians 5:19). We have to encourage each other in prophecy, singing and giving testimonies. In Leviticus 6:12 we read, "The fire on the altar must be kept burning; it must not go out."

3. Resist The Devil. Jesus Himself had to resist the devil when he was tested after fasting (Matthew 4:8-11). "Resist the devil, and he will flee from you" (James 4:7). We cannot resist the devil by using any earthly weapons. The family that prays and attends church together will stay together. "This kind can come out only by prayer and fasting" (Mark 9:29).

4. Let Go Of The Past. If we hold on to the unpleasant past it is not going to help our journey. "Therefore, if anyone is in Christ, the new creation has come: The old has gone, the new is here!" (2 Corinthians 5:17). "Forget the former things; do not dwell in the past. See, I am doing a new thing!" (Isaiah 43:18-19).

5. Forgive Others. Forgiveness is a quality we must have in order to go on to "sonship." "For if you forgive other people when they sin against you, your heavenly Father will also forgive you" (Matthew 6:14-15). An unforgiving nature is like a festering, unhealed wound. "His divine power has given us everything we need for a godly life" (2 Peter 1:3-9).
