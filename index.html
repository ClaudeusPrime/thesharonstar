It is intriguing that Jesus preached only general statements about this "church" or "called out" while with His disciples. After the disciples were filled with the Holy Spirit they were able to receive the revelation of the order of the church. "I still have many things to say to you, but you cannot bear them now. However, when He, the Spirit of truth, has come, He will guide you into all truth" (John 16:12-13, NKJV).

Your becoming part of the church begins with a saving relationship with Jesus, the only begotten Son of God. You are "saved by grace." Salvation comes to all who ask, given freely with no reservation, not based on your works. "For by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, lest anyone should boast" (Ephesians 2:8-9, NKJV).

Christ is the foundation, and His apostles continue to be identified with that foundation. "Having been built on the foundation of the apostles and prophets, Jesus Christ Himself being the chief cornerstone" (Ephesians 2:20, NKJV). Christ has gifted each individual in the church with spiritual gifts, and the five-fold ministry gifts are given to the church in general: apostles, prophets, evangelists, pastors and teachers, for the equipping of the saints for the work of ministry.

Kingdom truths from Acts chapters 1 and 2 include: the promise of the infilling and empowerment of the Holy Spirit for the believer, the grand second return of Christ, the importance of prayer and unity in preparation for the moving of God\'s Spirit, the availability of baptism of the Holy Spirit to all of humanity, salvation available to all people, the gospel of the kingdom including prophecy, repentance, and water baptism.

The New Testament church continued steadfastly in the apostles\' doctrine and fellowship, in the breaking of bread, and in prayers. The communion, the Lord\'s Supper, remains an important part of the church: "For as often as you eat this bread and drink this cup, you proclaim the Lord\'s death till He comes" (1 Corinthians 11:26, NKJV).

Let us endeavor to follow closely the pattern of His church, as revealed in the New Testament. It is a new day, a new hour! Let us resist the temptation of complacency, and reach out for all that the Lord has said would be included in this glorious kingdom message of His church.`, subtitle: '', author: 'Andy Snoke', year: 2020, month: 'February', volume: 'Vol. LXXIII, No. 02', title: 'His Church', topics: ['Church','Scripture','Holy Spirit','Kingdom'], excerpt: 'Andy Snoke explores Christ\'s declaration "I will build My church," unpacking the Greek distinction between Petros and Petra to show that the church is built on Christ alone — not Peter. Drawing from Acts 1 and 2, he outlines the foundational truths of the New Testament church: salvation by grace, spiritual gifts, the five-fold ministry, the baptism of the Holy Spirit, communion, and apostolic doctrine.', pdf: '02%20-%20Sharon%20Star%20-%20February%202020.pdf', fileName: '02_-_Sharon_Star_-_February_2020.pdf'  },
  { id: 69, articleText: `How to Treat Your Wife: Mike Greif

Every aspect of our spiritual walk, including the marriage relationship, is a growing and maturing experience. God is making real to us not what we are, but what we can become in the strength and power of the Holy Spirit. Philippians 1:6 says, "Being confident of this very thing, that He who has begun a good work in you will complete it until the day of Jesus Christ." It is through God\'s love shed abroad in our hearts that we can manifest the nature of Christ in our marriages.

As husbands, marriage provides one of the best environments available to implement the principles of Christian living and the opportunity to be Christ\'s representatives on the earth. The following points are things that God has spoken to me over a long period of time — written in the back of my Bible over the last 40 years concerning how to treat my wife.

Husbands Love Your Wives and Treat Them as Equals: "Husbands, love your wives, just as Christ also loved the church and gave Himself up for her" (Ephesians 5:25). God wants us to die to self and love our wives with all of our heart. In essence, a husband is called to lay down his life for his wife. Husbands and wives are both equally important in God\'s eyes — like a house where the husband functions as the roof and the wife functions as the walls; both of equal value and importance. Bear the fruit of the Spirit toward her: love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, self-control (Galatians 5:22-26).

Your Wife is a Very Special Gift of God to You: Your wife is a gift from God, so treat her as a precious jewel, a queen, an equal to you. "He who finds a wife finds a good thing and obtains favor from the Lord" (Proverbs 18:22). Be a servant to your wife and in your home. You\'re not called to be served but to serve (Philippians 2:3-8).

Treat Your Wife with Good Manners: Always be a gentleman. When I was young, I witnessed a very wealthy man treat my mother with extraordinary courtesy — opening doors, seating her, never sitting until she did. In that one evening, I saw how to treat a lady and I never forgot it.

Seek to Please Your Wife and Make her Feel Secure: Always be looking for ways to make her happy. Take care of your finances so money won\'t be a problem. Make a point to spend personal time in prayer and in the Word of God each day. Build your personal relationship with God and be led by His Spirit daily.

Practice Good Communication: Spend lots of time just talking with one another. Be open and totally honest. Don\'t play guessing games. Don\'t hide your feelings. Be transparent. "Be angry yet do not sin. Do not let the sun go down on your anger" (Ephesians 4:26). Go on walks together. Have daily devotions with your wife. It is almost impossible to pray together and be angry with each other at the same time.

Be Understanding with Your Wife: "You husbands, likewise, live with your wives in an understanding way, as with a weaker vessel, since she is a woman; and grant her honor as a fellow heir of the grace of life, so that your prayers may not be hindered" (1 Peter 3:7-9). God puts added emphasis on husbands, explaining that if they don\'t live with their wives in an understanding way, He isn\'t going to answer their prayers. "Let no unwholesome word proceed from your mouth, but only such a word as is good for edification according to the need of the moment" (Ephesians 4:29-32). "Husbands, love your wives, and do not be embittered against them" (Colossians 3:19).

Closing Comments: When we made those wedding vows at our marriage, we were making those vows before God. I believe we, as husbands, will bear the greater responsibility before God for the success and well-being of our marriage, and for the spiritual success of our children. "Be on the alert, stand firm in the faith, act like men, be strong. Let all that you do be done in love" (1 Corinthians 16:13-14). The Holy Spirit is still in the process of changing us into the likeness of Christ, so we all need to be patient with one another. Oh Lord, give us ears to hear and hearts to understand how You want us to choose to live, care for, and love our wives. May we honor You by our lives.`, subtitle: '', author: 'Mike Greif', year: 2020, month: 'March', volume: 'Vol. LXXIII, No. 03', title: 'How to Treat Your Wife', topics: ['Marriage','Discipleship','Scripture','Family'], excerpt: 'Mike Greif draws on 40 years of notes written in the back of his Bible to challenge husbands to love their wives as Christ loved the church. He covers six practical areas: treating wives as equals, honoring them as God\'s gift, good manners, making them feel secure, communication, and understanding — grounding each in scripture and personal experience.', pdf: '03%20-%20Sharon%20Star%20-%20March%202020.pdf', fileName: '03_-_Sharon_Star_-_March_2020.pdf'  },
  { id: 70, articleText: `My Sheep Hear My Voice: Calvin James

Much of the plan of God is reflected in Genesis 1:26-28 — God creating man in His image and giving him dominion over the earth. This dominion was to be under God. God is going to rule through man, and for this to happen it is important that we are able to hear God\'s voice.

The Principle of Hearing God\'s Voice: If one were to trace God\'s interaction with man after his rebellion, the way God dealt with man evolved after every dispensation. There are seven dispensations in Scripture: Innocence, Conscience, Human Government, Promise, Law, Grace, and the Millennial kingdom. In the Dispensation of Promise, God governed through Patriarchs such as Abraham, Isaac, and Jacob. In the Dispensation of Law, God dealt with Israel as a collective nation with a temple and priests. In the Dispensation of Grace, the proclamation of the gospel of the kingdom requires an individual response. Yet, despite these differences, one prevailing requirement remained: that man would hear the voice of God.

Hearing God\'s Voice in the Dispensations of Promise and Law: Abraham heard the voice of God and obeyed the Abrahamic Covenant (Genesis 12:1-4). Throughout Israel\'s journey, God trained them in the path to victory and every time they obeyed His voice, His blessing was upon them. Exodus 19:3-6 records God\'s call to Israel: if they would obey His voice and keep His covenant, they would be His peculiar treasure, a kingdom of priests, a holy nation. In Jeremiah 7:21-23, God summarized the principal thing: "Listen to and obey My voice, and I will be your God and you will be My people."

Hearing God\'s Voice in the Dispensation of Grace: In John 10:3-15, Jesus echoes the prophecy of Jeremiah — real relationship with God has everything to do with being able to hear His voice. "And other sheep I have which are not of this fold; them also I must bring, and they will hear My voice; and there will be one flock and one shepherd" (John 10:16). The essential requirement is summed up in John 10:27 — true believers hear His voice, He knows them, and they follow Him.

Three Distinctive Features to Hearing God\'s Voice: (1) It is Personal — every voice is unique; the heart of the believer only opens to the Lord Himself. (2) It is Intimate — hearing God requires a personal and intimate relationship. God\'s voice is most often still and small (1 Kings 19:8-13). (3) It is Present — God\'s voice is always present. When Moses asked God His name, God\'s response was "I AM" — present, not past, not future.

The Application — Logos and Rhema: The Scriptures tell us that hearing God\'s voice produces faith (Romans 10:17). In the New Testament, two Greek words become "word" in English: logos (the total counsel and mind of God, summed up in the person of Jesus and in all Scripture) and rhema (the Holy Spirit quickening the logos to a specific person for a specific situation — the spoken word). Logos is the whole counsel of God; the Holy Spirit measures it out to us in rhema. As kingdom citizens, if we are not able to hear God\'s voice our faith is weak.

The Lifestyle That Results from Hearing God\'s Voice: Jesus compared rhema with bread (Matthew 4:4) — just as natural bread feeds the natural body, the present personal word of God feeds man\'s spirit. Rhema only comes through the Holy Spirit. Romans 8:14 tells us that if we are led by the Spirit of God we are sons of God. It is only when we are led by the Spirit — an ongoing lifestyle, not just a Sunday morning experience — that we grow into maturity and sonship.

Our Daily Life Is Where Our Ministry Functions: Bro. A. Hinchliff wrote, "The Kingdom of God is to restore order to His creation." God\'s plan is to use His mature sons to rule the earth by hearing and obeying His voice. Ministry is not confined to meetings; it gets up every morning and goes to bed at night. "Don\'t always be looking for the big things, but be looking for those things that are all around us, that the Spirit of God leads you to, and your ministry will be effective... This is the road into Sonship."`, subtitle: '', author: 'Calvin James', year: 2020, month: 'April', volume: 'Vol. LXXIII, No. 04', title: 'My Sheep Hear My Voice', topics: ['Scripture','Holy Spirit','Sonship','Kingdom','Faith'], excerpt: 'Calvin James traces the principle of hearing God\'s voice across the dispensations — Promise, Law, and Grace — and examines the Greek distinction between logos (the total counsel of God) and rhema (the Holy Spirit\'s personal spoken word). He shows that hearing and obeying God\'s voice is the essential requirement for all believers in every age, the source of faith, and the road into Sonship.', pdf: '04%20-%20Sharon%20Star%20-%20April%202020.pdf', fileName: '04_-_Sharon_Star_-_April_2020.pdf'  },
  { id: 71, articleText: `Be Still & Know That I Am God (Part One): Steve Haney

While living in this time of darkness and uncertainty around the world, we listen to the news, and we remember the words of Jesus, who said the time would come when men\'s hearts would fail them for fear (Luke 21:26). Prayer should not be our last resort. Prayer ought to be our first line of defense! We who are called by the name of the Lord should be earnest about our personal prayer life. In fact, we are the ones who should actually be defined by our prayer life.

Make An Appointment: The first thing we should do is make a daily appointment for that special time of prayer and intercession before the Lord. This appointment is usually best in the wee hours of the morning. The psalmist David said, "Early will I seek thee" (Psalm 63:1). In Lamentations 3:22-23, Jeremiah wrote, "It is of the Lord\'s mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness." God\'s faithfulness, mercies, and compassions towards us are fresh and new every morning.

Be Still Before The Lord: The second thing we should do is BE STILL! We shouldn\'t carelessly or irreverently rush into the presence of the Lord with our list of petitions. The main thrust of our prayers should not be about ourselves — ultimately this life is not about you or me. It\'s about God. Our lives should be all about glorifying His Name. Jesus taught us to pray: "Our Father, which art in heaven, Hallowed be thy name. Thy kingdom come. Thy will be done in earth, as it is in heaven" (Matthew 6:9-10).

Being still before God is so hard, especially in these serious days with so many distractions. We are bombarded nearly every hour with phone calls, texts, emails, social media. Without taking the time to be still before the Lord and quietly communing with Him at the beginning of the day, many times we perform the duties of our stressful days irrationally and emotionally. We must stop, retreat from all the cares of life, take a deep breath, close our eyes, and listen to God\'s voice, who is calmly saying to us, "Listen to me, my child." "But they that wait upon the Lord shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint" (Isaiah 40:31).

What Happens During Those Still Moments: In the stillness and quietness of those appointments with Him, the manna of God\'s word begins to sprinkle into our consciousness. Little by little, we begin to gain more insight and revelation into God\'s word. Little by little, our narrow human perspective falls away, and our vision expands to see ourselves and the world around us through the lens of His larger, divine perspective. He begins to unlock the mysteries of what He is doing at this present moment. Out of that stillness should come our personal worship.

There are times when God allows us longer seasons of time for spiritual self-examination and reflection — asking where we stand with our God. We can ask the Lord to bring things to our attention that need to be changed, and the strength to do His will. The Lord may even impress upon our hearts to fast. These principles of making an early appointment with God every day, being still before the Lord, praying, fasting, and reading His word, apply not only to individuals, but to whole families.

Cry Out To God: After making an appointment and waiting in silence before God, then you can make your petition, "Give us this day our daily bread." God has made wonderful promises to those who cry out to Him: "Call upon me in the day of trouble; I will deliver you, and you will honor me" (Psalm 50:15). "Call unto me, and I will answer thee, and shew thee great and mighty things, which thou knowest not" (Jeremiah 33:3). In Psalm 91, there are amazing promises of protection given to those who dwell in "the secret place of the Most High."

Paul\'s Experience In Asia: From the Apostle Paul\'s writings, he experienced a danger so horrific that he described it as having "the sentence of death" in himself and that he "despaired even of life" (2 Corinthians 1:8-9). Yet upon reflection, Paul acknowledged that this fearful experience was a very good thing for him — it pricked his pride and made him live his life completely dependent upon the Lord. He said God put him through this experience so "that he should not trust in himself, but in God which raiseth the dead: Who delivered us from so great a death, and doth deliver: in whom we trust that he will yet deliver us" (2 Corinthians 1:9-10). God deals with us in the same way, allowing adverse conditions to come into our lives so we will willingly abandon our will to Christ and make him our king and Lord.`, subtitle: '', author: 'Steve Haney', year: 2020, month: 'May', volume: 'Vol. LXXIII, No. 05', title: 'Be Still & Know That I Am God (Part One)', topics: ['Prayer','Scripture','Faith','Discipleship'], excerpt: 'Steve Haney calls believers to make daily appointments with God — beginning with stillness before the Lord rather than a rush of petitions. Drawing on Psalm 46:10, Isaiah 40:31, and Paul\'s experience of despair in Asia (2 Corinthians 1), he shows that it is in quiet surrender and waiting on God that we hear His voice, find His rest, and discover the strength to cry out to Him in times of darkness and uncertainty.', pdf: '05%20-%20Sharon%20Star%20-%20May%202020.pdf', fileName: '05_-_Sharon_Star_-_May_2020.pdf'  },
  { id: 72, articleText: `Be Still & Know That I Am God (Part Two): Steve Haney

The Glory of God Shining Through Broken Vessels: The material that God will use for His kingdom will be composed of a people that have come to this place in their walk with Him where they have been humbled, emptied of self, and laid bare before Him. When we come to this place of total surrender and abandonment, that is when God has us right where He wants us.

When we come face-to-face with our human weakness, and instead of hardening our hearts and resisting the will of God in our foolish pride, we choose instead to soften our hearts and become a willing, pliable lump of clay in our heavenly Father\'s hands, God will be honored. If we cry out to Him from the depths of our hearts during those quiet, still moments, then Christ is able to rush in and fill that void with all the fullness of Himself. Jesus says to us, as He said to Paul, "My strength is made perfect in weakness" (2 Corinthians 12:9).

Jesus said, "Come unto me, all ye that labor and are heavy laden, and I will give you rest" (Matthew 11:28-30). We were not created to carry these burdens by ourselves. When we finally come to the conclusion that we can\'t "fix" them, we must completely surrender our vessels unto Him. He says, "Take my yoke upon you" — give Him our heavy yoke, and in exchange He will give us His yoke, which is much lighter. Then He says, "Learn of Me" — sit still and wait before Him, because when you do, you will learn that He is "meek and lowly in heart," and we shall find rest for our souls.

When we let go in complete surrender to Christ, the glory of Christ can begin to shine out to the world through all of our brokenness and tears. A fountain of joy and peace bubbles up; a rush of power surges through us that is no longer us, but Christ. If our lives are broken and surrendered to Him, and we feel the burning of the anointing of God for those in the body of Christ who are sad, lonely, fearful, or discouraged, and we call or write to or visit them and pray for them, then they will sense the presence of Jesus within us.

The Light of the City: No one has to tell you about the spiritual condition of our world today. Socially, we are witnessing the fabric of the Christian family unraveling at an unprecedented rate. On the national and world scene, we are witnessing corrupt human governments crumbling. The issues underlying the broken condition of our world today go far deeper than politics, economics, or religion. It is the souls of men all around the world that are spiritually sick and dying. The world\'s only hope is in a Person, the Lord Jesus Christ, who must shine through God\'s people.

God is looking for a people who are being changed into the image and likeness of Christ as they wait in silence before the Lord daily — a people who have been humbled through trials, proven and matured through testings, strengthened and perfected through sufferings, and transformed in mind, heart, and nature. Then God\'s glory will arise upon this people, and they will become this glorious City of God set high upon the holy hill of the Lord!

Let His Light Shine Out From You: The light of Christ will be a source of healing for the sick, freedom for those in spiritual bondage, bread for the hungry, comfort for those in mourning, peace for the fearful, strength for the weak, and encouragement for those who have no hope. The prophet Isaiah encourages God\'s people, "Arise, shine; for thy light is come, and the glory of the Lord is risen upon thee. For behold, the darkness shall cover the earth, and gross darkness the people: but the Lord shall arise upon thee, and his glory shall be seen upon thee" (Isaiah 60:1-2).

Final Encouragements: Dear saints, if in the midst of our weaknesses and inability to "fix" things, we abandon ourselves before the Lord in those daily, still moments that we spend with Him, He will infuse us with His strength, and He will be glorified. In that place of deep intimacy with Him, our fears shall flee away. Our sorrows shall be turned into joy. He is forming a NEW MAN within us. Our strength shall be renewed as the eagle, and our soul shall be restored. Satan will have no power over our lives because of the God that we CRY OUT to in our private, quiet, daily appointments with Him. "BE STILL, AND KNOW THAT I AM GOD: I WILL BE EXALTED AMONG THE HEATHEN, I WILL BE EXALTED IN THE EARTH" (Psalm 46:10).`, subtitle: '', author: 'Steve Haney', year: 2020, month: 'June', volume: 'Vol. LXXIII, No. 06', title: 'Be Still & Know That I Am God (Part Two)', topics: ['Prayer','Discipleship','Holy Spirit','Faith'], excerpt: 'Steve Haney concludes his two-part series by calling God\'s people to become broken vessels through which His glory can shine. Drawing on Matthew 11:28-30, Isaiah 60:1-2, and 2 Corinthians 12:9, he describes the City of God as a people humbled through trials, surrendered to Christ, and transformed by daily stillness before the Lord — so that in a world groping in darkness, His light can shine through them.', pdf: '06%20-%20Sharon%20Star%20-%20June%202020.pdf', fileName: '06_-_Sharon_Star_-_June_2020.pdf'  },
  { id: 73, articleText: `Spirit, Soul and Body: Markus Hansen

In closing the fifth chapter of 1 Thessalonians, the Apostle Paul prayed, "may the God of peace Himself sanctify you completely; and may your whole spirit, soul, and body be preserved blameless at the coming of our Lord Jesus Christ" (1 Thessalonians 5:23). One thing the whole world is especially seeking in this age of worldwide turmoil is peace. Jesus is the Messiah that Isaiah prophesied about — the Prince of Peace. When Jesus is given His rightful place in the hearts of men, peace will result.

The word sanctify in this verse is hagiasai (Gk) meaning, "may-He-be-holyizing," or "may God be making holy." What Paul is saying is, may God, the God of Peace, be in the process of making us holy — completely, not just a little holy, but completely holy! "But as He who called you is holy, you also be holy in all your conduct, because it is written, \'Be holy, for I am holy\'" (1 Peter 1:15-16).

This is a high calling, but let us not be discouraged. The Lord said to Abraham, "Is anything too hard for the Lord?" (Genesis 18:14). Jesus paved the way — "though He was a Son, yet He learned obedience by the things which He suffered. And having been perfected, He became the author of eternal salvation to all who obey Him" (Hebrews 5:8-9). "But we all, with unveiled face, beholding as in a mirror the glory of the Lord, are being transformed into the same image from glory to glory, just as by the Spirit of the Lord" (2 Corinthians 3:18).

The Scripture describes who we are as human beings: we are composed of three distinct natures — spirit, soul, and body. Note that Paul begins by asking that God would first sanctify the spirit of believers, next the soul, then the body. This is just the opposite of what we see in the world today. The world\'s dominating focus is on the body — clothing, food, cars, cosmetics, medical products, and housing. Our soul nature is developed through music, TV programs, books, nature, and relationships with family and friends. But what about our spiritual nature?

When we submit our life to Jesus and ask Him to forgive us our sins, our spiritual nature is awakened. When filled with the Holy Spirit, He comes in power to help our human spirit become more in tune with God who is Spirit. "For he who speaks in a tongue does not speak to men but to God, for no one understands him; however, in the spirit he speaks mysteries. He who speaks in a tongue edifies himself" (1 Corinthians 14:2,4). What a beautiful gift — to speak to our Creator in His language, spirit-to-Spirit.

Our soul — what we reveal to the world through our character, personality, emotions, likes, and dislikes — is the real us. When we die, our soul continues to live. Jesus said, "For what profit is it to a man if he gains the whole world, and loses his own soul?" (Matthew 16:26). If during our waking hours we allow our soul to be constantly bombarded with worldly images and music, then little room is left for our spiritual nature to respond to the Holy Spirit\'s influence. However, the more we focus on the realm of the spirit, the more the Holy Spirit can become the dominant factor in our lives.

During our worship services, God is looking for us to be sensitive to the moving of the Holy Spirit — to yield our souls and spirits to the Spirit of God. What God desires is for our spirit nature to be influenced and directed by the Holy Spirit and not by our human nature. Let us totally surrender our whole body and soul to the Holy Spirit and then delight in the joy of the Lord as He affects our emotions.

In closing, when we set time aside for personal devotions and converse in tongues — that wonderful heavenly language that allows us to communicate directly with God, spirit-to-Spirit — we will become more sensitive to the moving of the Holy Spirit. We will more readily recognize how the Holy Spirit is moving in our local assembly when we meet together. Then we will be able to worship the Lord in spirit and in truth, which will result in being able to minister according to the gifts God has given us. Following this admonition will bring about the needed balance in our lives between spirit, soul, and body leading us to become more and more like Christ. Glory to God.`, subtitle: '', author: 'Markus Hansen', year: 2020, month: 'July', volume: 'Vol. LXXIII, No. 07', title: 'Spirit, Soul and Body', topics: ['Holy Spirit','Prayer','Scripture','Discipleship'], excerpt: 'Markus Hansen unpacks Paul\'s prayer in 1 Thessalonians 5:23 — that the God of peace would sanctify believers completely in spirit, soul, and body. He explores the three distinct natures of the human being, examining how we feed each one, how the soul is exposed to worldly influences that crowd out the Spirit, and how daily devotions in tongues and worship help believers become sensitive to the Holy Spirit\'s moving.', pdf: '07%20-%20Sharon%20Star%20-%20July%202020.pdf', fileName: '07_-_Sharon_Star_-_July_2020.pdf'  },
  { id: 74, articleText: `You in Christ & Christ in You: David Luff

Two of the most astounding truths in the New Testament are the miraculous realities of "being in Christ" and "Christ being in you." If you and I could grasp the many realities encompassed in these two amazing truths, our lives would be infused with more of a sense of security and joy. The terms "in Christ, in Him, in the Lord, in God" are mentioned well over 160 times in Paul\'s letters while the term "Christian" appears only three times.

To really appreciate the blessings and benefits of being "in Christ" we must understand and accept what God means regarding the reality of "identification." Identification, in this context, is ascribing to oneself the qualities, characteristics, and even the experiences of another person. To be "in Christ" — God is ascribing to us the qualities, characteristics, and even some of the actual experiences of Christ. If we are "in Christ," God views us exactly the same way He views His Son, Jesus.

When we read scripture we often unconsciously interpret it through the lens of our own experiences and limitations rather than just focusing on the explicit words of God. We allow our natural minds to adjust the meaning of a particular scripture to make it fit into an interpretation that makes it reasonable to us. Our rationalized interpretation only keeps us from experiencing the life-changing blessing of such a truth in our lives.

"But of Him (God) you are in Christ Jesus, who became for us wisdom from God — and righteousness and sanctification and redemption" (1 Corinthians 1:30). How do we get "in Christ Jesus?" First, even our initial acceptance of Christ as our Savior is of God the Father. "No one can come to Me unless the Father who sent Me draws him" (John 6:44). Being in Christ is being united to Him like a branch is united to and part of a tree, or like a husband and wife having become one flesh. "But God, who is rich in mercy, because of His great love with which He loved us, even when we were dead in trespasses, made us alive together with Christ and raised us up together, and made us sit together in the heavenly places in Christ Jesus" (Ephesians 2:4-6).

The benefits we have "in Christ" include: wisdom from God (1 Corinthians 1:30), sanctification (1 Corinthians 1:2), redemption (Romans 3:24), unity (Romans 12:5, Galatians 3:28), eternal life (Romans 6:23), triumph (2 Corinthians 2:14), peace (1 Peter 5:14), and much more. "For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord" (Romans 8:38-39, KJV).

All the benefits we have "in Christ" are ours after we are saved, but God is far from finished with us at that point. Romans 8 shows us the intersection of being "in Christ" and having "Christ in us" by the Holy Spirit. God puts "Christ in you" through the indwelling presence of His Holy Spirit, who will take you from not just being "in Christ" with all the characteristics of Christ ascribed to you, but will transform you such that the characteristics of Christ will actually be formed in you. "To them God willed to make known what are the riches of the glory of this mystery among the Gentiles: which is Christ in you, the hope of glory" (Colossians 1:27).

Being placed "in Christ" happens immediately upon salvation. However, having Christ completely formed in us is a process that takes place over a lifetime. "My little children, for whom I labor in birth again until Christ is formed in you" (Galatians 4:19). Even the apostle Paul admitted the process was not over yet: "Not that I have already attained, or am already perfected; but I press on, that I may lay hold of that for which Christ Jesus has also laid hold of me" (Philippians 3:12).

In conclusion, may we be reminded that through our belief and acceptance of the finished work of Christ, God has forgiven our sins and placed us "in Christ." May the Holy Spirit help us to see ourselves as God sees us. May we know undoubtedly that there is no condemnation for us who are "in Christ Jesus" (Romans 8:1). Now by the working of the indwelling Holy Spirit, the person of Christ is being formed in us, "Christ in you the hope of glory" (Colossians 1:27). "Being confident of this very thing, that He who has begun a good work in you will complete it until the day of Jesus Christ" (Philippians 1:6).`, subtitle: '', author: 'David Luff', year: 2020, month: 'August', volume: 'Vol. LXXIII, No. 08', title: 'You in Christ & Christ in You', topics: ['Scripture','Discipleship','Holy Spirit','Sonship'], excerpt: 'David Luff explores the two great New Testament realities of being "in Christ" and having "Christ in you," showing that identification with Christ means God ascribes to us His Son\'s qualities and experiences. Drawing on Romans 6, 8, Colossians 1 and 3, and Philippians 3, he traces the lifelong process by which the Holy Spirit forms Christ in the believer — moving from imputed righteousness to the fullness of Christ actually formed within us.', pdf: '08%20-%20Sharon%20Star%20-%20August%202020.pdf', fileName: '08_-_Sharon_Star_-_August_2020.pdf'  },
  { id: 75, articleText: `Jesus Is Our Life: Meggan Levson

As many of you know, the Lord has allowed me to experience significant health concerns in recent years. From 2012-2016, I had four surgeries in four years. In 2012, I was diagnosed with invasive breast cancer. In 2014, my ulcerative colitis became unresponsive to medical management and my entire colon was removed in a life-saving surgery, followed by reconstructive surgeries in 2015 and 2016. In 2015 metastatic cancer was found throughout my abdomen and I was given only a couple of months to live. The enemy was a roaring lion seeking to devour, but I thank God for His amazing design of the church and for His love and care for me. The body of Christ travailed in intercession on my behalf and the Lord was, and is, so faithful! As a result of these experiences, it has become so real in my spirit that Jesus is Our Life.

During my health struggles, I found the voices of the world trying to persuade me to seek knowledge, whereas the Word of God directed me to keep my eyes on Jesus. "But everything that was a gain to me, I have considered to be a loss because of Christ. More than that, I also consider everything to be a loss in view of the surpassing value of knowing Christ Jesus my Lord... My goal is to know Him and the power of His resurrection" (Philippians 3:7-10, CSB).

Jesus Is Our Life: As it was in the garden of Eden, so it is today — we are deceived into partaking of the tree of the knowledge of good and evil when the Tree of Life is at hand. We live in a culture obsessed with knowledge. God\'s plan for the complete redemption and transformation of His people requires our mind to come under the direction and submission of the Holy Spirit. "For to be carnally minded is death; but to be spiritually minded is life and peace" (Romans 8:5, KJV).

Instead of seeking knowledge, I have learned I need to seek Jesus. Knowledge works at the level of the soul; it deals directly with our mind, our intellect. The problem with seeking knowledge is that it diverts my attention away from God and has no power to change me. If I listen to the voices in the world there is confusion and conflicting advice. The lesson for me is to listen to and follow the voice of our Shepherd, Jesus Christ, in all matters: "the sheep hear his voice; and he calls his own sheep by name and leads them out... and the sheep follow him, for they know his voice" (John 10:3-5).

I have learned that I need to walk in submission to all of the teachings of the Bible whether they make sense to me or not. "And be not conformed to this world; but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God" (Romans 12:1-2, KJV).

We all have sickness in our bodies. I am very appreciative of all the wisdom and help I have received from the medical community. However, I can attest that doctors and medicine have limitations. Medical treatments often have side effects and trade-offs. I am not suggesting that we shouldn\'t get medical attention, but I am suggesting that we earnestly need to seek JESUS as He is our Life. Only Jesus can bring true healing and life. "Then great multitudes came to Him, having with them the lame, blind, mute, maimed, and many others; and they laid them down at Jesus\' feet, and He healed them" (Matthew 15:30, NKJV).

Many times throughout history, God\'s people are offered a choice. "I call heaven and earth as witnesses against you today that I have set before you life and death, blessing and curse. Choose life so that you and your descendants may live, love the Lord your God, obey him, and remain faithful to him. For he is your life" (Deuteronomy 30:19-20, CSB). God offers eternal life through Jesus. We choose whether we will believe God\'s Word or not. I am fixing my eyes on Jesus, the Author and Finisher of my faith, and say as Peter said, "Lord, to whom shall we go? Thou hast the words of eternal life. And we believe and are sure that thou art that Christ, the Son of the living God" (John 6:68-69, KJV).`, subtitle: '', author: 'Meggan Levson', year: 2020, month: 'September', volume: 'Vol. LXXIII, No. 09', title: 'Jesus Is Our Life', topics: ['Faith','Scripture','Testimony','Discipleship'], excerpt: 'Meggan Levson shares her testimony of facing breast cancer, the removal of her colon, and a terminal metastatic cancer diagnosis — and the spiritual lesson she drew from it: that seeking knowledge is the tree of the garden we must not eat from, while Jesus is the Tree of Life. Drawing on Philippians 3, Romans 8 and 12, and John 10, she calls believers to choose Jesus as their life in all things, especially in sickness and uncertainty.', pdf: '09%20-%20Sharon%20Star%20-%20September%202020.pdf', fileName: '09_-_Sharon_Star_-_September_2020.pdf'  },
  { id: 76, articleText: `Advice on Administration (Part One): A.M. Hinchliff

The things I am going to write about administration are not intended to be law, but advice to help in the governing of our affairs that pertain to the natural realm. For a spiritual person, it is impossible to separate the natural from the spiritual. When handled in the proper way, the natural becomes spiritual — the same as when something was placed on the altar in the tabernacle in the wilderness; it became holy. All our affairs should become holy.

Reading through the book of Proverbs, I listed all the subjects dealt with in separate columns. The subject most spoken of is wisdom. "The fear of the Lord is the beginning of wisdom" (Proverbs 9:10) — not being scared of God, but being reverent before the Lord. "Wisdom is the principal thing; therefore get wisdom" (Proverbs 4:7). Wisdom is the ability to use knowledge in a prudent manner; it is good judgement. The subject that made the next longest list had to do with the words we speak. The third most frequently spoken of thing in Proverbs involved the acquisition and use of money or material things — and that will be the theme of my writing.

Never has there been a day when so many people are having financial problems. People with these kinds of problems need more than prayer; they need teaching on their methods of administration, and then the will to follow the instruction given. There is nothing wrong with having riches, but in the acquisition of riches we must keep our priorities right. "But seek ye first the kingdom of God, and His righteousness; and all these things shall be added unto you" (Matthew 6:33).

The important thing is how we use that with which God has blessed us. "He becometh poor who dealeth with a slack hand: but the hand of the diligent maketh rich" (Proverbs 10:4). "He that gathereth in summer is a wise son: but he that sleepeth in harvest is a son that causeth shame" (Proverbs 10:5). God is teaching us to lay up for the future.

If the church is to administer the affairs and finances of the kingdom, we must learn to administer in the personal realm now. Our experience is much the same as the parable of the talents (Matthew 25:14-30): two servants profited and were rewarded, but the third hid his talent in the earth and consequently lost it. Jesus was teaching administration, and it applies whether in the spiritual realm or the temporal.

Concerning credit: "The rich ruleth over the poor, and the borrower is servant to the lender" (Proverbs 22:7). Credit is very tempting, but it is a trap and a snare. A person should never buy consumer goods or depreciable assets on credit. We should always save for such purchases until we have enough. There may be times when a person has to buy a car on credit for business or transportation to work — in that case the car will be contributing to your income. When purchasing any non-essential item on credit, consider carefully not only the purchase price but also the interest charges over the life of the loan.

A house is an investment that will hold its value and is not like a toy set or new car which depreciates quickly. In buying a house, a person should never go beyond his ability to pay. It is a good idea to start small and when that is paid for, sell and buy better. Many financial experts will tell you that your best investment is to pay off your house mortgage. We must all be warned about the use of credit cards. Always pay off the balance each month to avoid interest charges.

I believe that God wants us to be very careful in our administration. There is a lot of instruction in the book of Proverbs on how to use your money. If we can\'t administer the things of the natural and material realm, how can we administer the spiritual?`, subtitle: '', author: 'A.M. Hinchliff', year: 2020, month: 'October', volume: 'Vol. LXXIII, No. 10', title: 'Advice on Administration (Part One)', topics: ['Stewardship','Scripture','Discipleship','Kingdom'], excerpt: 'A.M. Hinchliff surveys the book of Proverbs to offer practical, scripturally-grounded advice on financial administration — covering the proper pursuit of riches, the danger of credit and debt, wise use of savings, and the purchasing of houses and business assets. He argues that faithful stewardship of natural and material affairs is inseparable from spiritual maturity and kingdom administration.', pdf: '10%20-%20Sharon%20Star%20-%20October%202020.pdf', fileName: '10_-_Sharon_Star_-_October_2020.pdf'  },
  { id: 77, articleText: `Advice on Administration (Part Two): A.M. Hinchliff

The Scripture gives instruction about caring for our own. "But if any provide not for his own, and specially for those of his own house, he hath denied the faith, and is worse than an infidel" (1 Timothy 5:8). We are responsible for providing for our family while we are alive. What happens in the event that we get sick and die, or get killed in an accident? When a young man gets married, he should invest in some life insurance in case the worst happens. Term insurance is the best investment — you can get enough to care for your family at a fairly reasonable price, and it can be adjusted year by year according to your family\'s needs.

Concerning taxes: In Matthew 17:24-27, the tax collector asked Peter if Jesus paid taxes. Jesus instructed Peter to pay the tax so they wouldn\'t offend the government. In Matthew 22:15-22, Jesus answered the Pharisees\' question about tribute to Caesar with "Render therefore unto Caesar the things which are Caesar\'s; and unto God the things that are God\'s." As much as we hate to do it, we must pay taxes. Romans 13:1-7 makes clear that we are to be subject to the higher powers ordained by God, and that paying tribute is part of that obedience. We should be absolutely honest in compiling our income tax return — not only to avoid the wrath of the tax collector, but so we can live with a clear conscience.

"Dearly beloved, I beseech you as strangers and pilgrims, abstain from fleshly lusts, which war against the soul; having your conversation honest among the Gentiles" (1 Peter 2:11-12). Our business dealings should be absolutely honest. There is no place in the church for any shady business. "Submit yourselves to every ordinance of man for the Lord\'s sake" (1 Peter 2:13).

The greatest cause for divorce is disagreement over money. Money problems break up more homes than anything else. Sometimes the problem is with the husband — he is either a spendthrift or extremely stingy. "Do not love the world or anything in the world" (1 John 2:15-17, NIV). The tightwad thinks only of how large his bank account is. The best cure for the stingy person is for him to start giving to those in need. "There is that scattereth, and yet increaseth; and there is that withholdeth more than is meet, but it tendeth to poverty. The liberal soul shall be made fat; and he that watereth shall be watered also himself" (Proverbs 11:24,25).

A husband and wife should work together in both saving and spending. The husband must make the final decision concerning these things, but should always give careful consideration to the wishes and feelings of his wife. Husbands have a great responsibility in asking God for guidance in the direction of their families. "Every wise woman buildeth her house; but the foolish plucketh it down with her hands" (Proverbs 14:1). Couples should work together concerning their finances. Even regular visits to the coffee shop or restaurants can eat away at finances if indulged excessively.

A family should keep books — an accurate record of all their spending. This way we know what we have done with our money and have a means of controlling expenditures. Husband and wife can look at the accounts together, see where mistakes have been made, and agree on how to remedy the situation in the future.

"The hand of the diligent shall bear rule: but the slothful shall be under tribute" (Proverbs 12:24). We like to think of sitting with Christ in His throne in His kingdom. But it is the one who is diligent who will sit in that place. The one who is careless in all his affairs, whether in the material realm or the spiritual, is the person who will be ruled over. Talking of these things does not bring a great deal of rejoicing in the realm of the Spirit, but I am sure it is part of being spiritual to look after the material things in a way that is pleasing to God.`, subtitle: '', author: 'A.M. Hinchliff', year: 2020, month: 'November', volume: 'Vol. LXXIII, No. 11', title: 'Advice on Administration (Part Two)', topics: ['Stewardship','Scripture','Family','Discipleship'], excerpt: 'A.M. Hinchliff continues his practical series on administration, covering life insurance and the responsibility to provide for one\'s family, the scriptural obligation to pay taxes honestly, the danger of money disputes in marriage, and the importance of keeping household financial records. He grounds every point in scripture and closes with the reminder that diligence in material affairs is part of spiritual maturity.', pdf: '11%20-%20Sharon%20Star%20-%20November%202020.pdf', fileName: '11_-_Sharon_Star_-_November_2020.pdf'  },
  { id: 78, articleText: `The Christmas Story: Andy Snoke

How is it possible to tell this glorious story, filled with twists and turns, with both tragedy and ultimate victory of the birth of the Son of God?

The Shepherds: One cannot imagine what the shepherds felt as they watched their sheep on the rounding hills of Bethlehem that glorious night over 20 centuries ago. Many of the shepherds worked in this part of the country and sold their sheep for the required sacrifices in the temple. None of them had any idea that the true Lamb of God would soon become the very last sacrificial lamb for the sins of the world. Suddenly, an angel of the Lord appeared to them. They must have been absolutely terrified as the glory of the Lord shone around them as they listened to the announcement of the ages! "Then the angel said to them, \'Do not be afraid, for behold, I bring you good tidings of great joy which will be to all people. For there is born to you this day in the city of David a Savior, who is Christ the Lord\'" (Luke 2:10-11, NKJV). This very night, the Dispensation of Law would soon make way for the Dispensation of Grace, which would be followed by the age of the kingdom. The Lord often hides Himself from the arrogant and reveals Himself to those of His choosing who walk humbly. "God has chosen the foolish things of the world to put to shame the wise" (1 Corinthians 1:27).

Mary and Joseph: One cannot begin to comprehend the solemn task of being the parents of the Son of God. Mary and Joseph were certainly gracious souls — very humble, very poor, very quiet, very faithful, and obedient. As a single teenager, Mary received a frightening announcement from the angel Gabriel. The angel said to her, "Do not be afraid, Mary, for you have found favor with God. And behold, you will conceive in your womb and bring forth a Son, and shall call His name JESUS. He will be great, and will be called the Son of the Highest" (Luke 1:30-32, NKJV). The Scriptures are very clear: "For there is one God and one Mediator between God and men, the Man Christ Jesus" (1 Timothy 2:5, NKJV).

Let\'s give some thought to Joseph, who is rarely spoken about. Joseph was a just man — when he found Mary with child of the Holy Spirit, an angel of the Lord appeared to him in a dream saying, "Joseph, son of David, do not be afraid to take to you Mary your wife, for that which is conceived in her is of the Holy Spirit. And she will bring forth a Son, and you shall call His name JESUS, for He will save His people from their sins" (Matthew 1:20-21, NKJV). By purpose, God called Joseph to be a faithful father to Jesus and husband to Mary. Joseph protected the life of Jesus and Mary and obeyed the command of the angels to find temporary safety in Egypt. The gold brought by the Magi provided the funds for the journey — God always makes timely provisions for His purposes. The three gifts — gold (His Kingship), frankincense (His deity), myrrh (His death) — endorsed the Kingship of this child.

A Child Is Born, A Son Is Given: 2,700 years ago Isaiah the prophet prophesied mightily and accurately when he said, "For unto us a Child is born, unto us a Son is given" (Isaiah 9:6). The King of kings made His entrance to the earth most likely in the lodging of a cave as there was no room in the inns that night. He was born in obscurity, with the knowledge of His birth revealed to very few. Contained within that short verse is a comma that connects two monumental events. Yes, a Child was born. But also that night, a Son was given — the Son of God.

There will be a second coming of Christ. When Jesus made His first appearance He came obscurely as a baby in a manger. When He returns every eye shall see Him. "Behold, He is coming with clouds, and every eye will see Him, even they who pierced Him" (Revelation 1:7, NKJV). At that time He will establish the government of His kingdom. "Of the increase of His government and peace there will be no end, Upon the throne of David and over His kingdom, To order it and establish it with judgment and justice from that time forward, even forever" (Isaiah 9:6-7, NKJV). Christ is in charge of running the universe — from galaxies to governments, no name and no power will be exempt from His rule. Every knee shall bow and every tongue shall one day confess that Jesus is Lord, because a Child was born, and a Son was given.

In closing, One Solitary Life: He was born in an obscure village, the child of a peasant woman. He never wrote a book. He never held an office. He never had a family or owned a home. He was only thirty-three when public opinion turned against him. He was nailed to the cross between two thieves. When he was dead he was laid in a borrowed grave through the pity of a friend. Twenty centuries have come and gone and today he is the central figure of the human race, the leader of mankind\'s progress. All the armies that ever marched, all the navies that ever sailed, all the parliaments that ever sat, all the kings that ever reigned, put together, have not affected the life of man on earth as much as that One Solitary Life. (Adapted from Dr. James Allen Francis, 1926). A blessed Christmas to you!`, subtitle: '', author: 'Andy Snoke', year: 2020, month: 'December', volume: 'Vol. LXXIII, No. 12', title: 'The Christmas Story', topics: ['Scripture','Kingdom','Faith','Christmas'], excerpt: 'Andy Snoke retells the Christmas story through the eyes of the shepherds, Mary, Joseph, and the Magi — tracing the birth of Jesus as the hinge moment between the Dispensation of Law and the Dispensation of Grace. He reflects on Isaiah\'s prophecy ("a Child is born, a Son is given"), the kingship gifts of gold, frankincense and myrrh, and closes with the essay "One Solitary Life" as a meditation on the eternal impact of Christ\'s birth.', pdf: '12%20-%20Sharon%20Star%20-%20December%202020.pdf', fileName: '12_-_Sharon_Star_-_December_2020.pdf'  }
