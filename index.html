  { id: 27, articleText: `The definition of a steward is a person who manages another’s
property or financial affairs; one who administers anything as
the agent of another or others. In other words, someone who
manages someone else’s goods or property.
If I were to give you 100 dollars and ask you to manage it for
me, the $100 would not be yours, it would always be mine. You
would simply be the manager or the steward.
If the Lord were to give you riches, or properties, or wealth, or
just enough daily bread for the day, it is not yours, it is the Lord’s
and you are the steward of what God has entrusted to you.
Paul in writing to Titus reminded the church that its leaders were
to be good “stewards” of God’s charge over their lives:
“For an overseer, as God’s steward, must be above reproach.
He must not be arrogant or quick-tempered or a drunkard or
violent or greedy for gain, but hospitable, a lover of good, self-
controlled, upright, holy, and disciplined” (Titus 1:7-8, ESV).
Volume LXXVII | Issue 06 | June 2024
Jesus Shared An Interesting Story In Luke
“And He said to them, “Take heed and beware of covetousness,
for one’s life does not consist in the abundance of the things he
possesses.” Then He spoke a parable to them, saying: “The
ground of a certain rich man yielded plentifully. And he thought
within himself, saying, ‘What shall I do, since I have no room
to store my crops?’ So he said, ‘I will do this: I will pull down
my barns and build greater, and there I will store all my crops
and my goods. And I will say to my soul, “Soul, you have many
goods laid up for many years; take your ease; eat, drink, and be
merry.” ’ But God said to him, ‘Fool! This night your soul will be
required of you; then whose will those things be which you have
provided?’ “So is he who lays up treasure for himself, and is not
rich toward God” (Luke 12:15-21, NKJV).
Let’s unpack this short parable for the golden nuggets of truth
presented at its core. The rich fool had sin in his life, but what was
it? He did not gain his wealth in an immoral or illegal manner.
Certainly, he was a diligent worker, not lazy in the least. His sin
was that he was pursuing wealth for the sake of his ease, security,
and longevity, with no thought toward the kingdom of God. The
universe of his mind was centered around only himself, his
comfort, ease, accomplishments, and wealth, and not that of the
greater kingdom of God.
The rich fool uses 11 personal pronouns, the dreaded “I”
six times and “my” five times, to speak of “his” possessions,
(i.e. my crops, my barns, my grain, my goods, my soul). He
does not acknowledge that these things belong to God in the first
place.
If only the rich fool had realized that all that he had was the
Lord’s to begin with, including his work ethic and his investment
strategy. His health, the very breath in his lungs belonged to the
Lord. The rich fool was only a steward, an unwise steward of
what was allotted him temporarily. How life could have been
drastically different for the rich fool if he had followed the
advice of James 4:13-16, “Come now, you who say, “Today or
tomorrow we will go to such and such a city, spend a year there,
buy and sell, and make a profit”; whereas you do not know what
will happen tomorrow. For what is your life? It is even a vapor
that appears for a little time and then vanishes away. Instead
you ought to say, “If the Lord wills, we shall live and do this or
that.” But now you boast in your arrogance. All such boasting
is evil” (NKJV).
I mentioned earlier the sin of the rich fool was in using 11
personal pronouns, accrediting his glory and success to himself
instead of giving glory to God. He used the words “I” and “my”
for his own glory. The Word of God tells us about another being
who had sinned with the use of his personal pronouns that got
him, and all of us, in trouble!
The Fall of Lucifer
“How you are fallen from heaven, O Lucifer, son of the morning!
How you are cut down to the round, You who weakened the
nations! For you have said in your heart: I will ascend into
heaven,
I will exalt my throne above the stars of God; I will also sit on
the mount of the congregation. On the farthest sides of the north;
I will ascend above the heights of the clouds, I will be like the
Most High.’
Yet you shall be brought down to Sheol, To the lowest depths of
the Pit” (Isaiah 14:12-15, NKJV).
Lucifer had problems using the personal pronoun “I.” He loved
to give credit to himself. The created angelic being stole all glory
from the One that created him. Satan enjoyed exalting himself,
taking false credit to himself, and basking in self-exalted
arrogance.
In our society today, it is no secret that men and women are in
love with themselves. “I, I, I, I will exalt my throne,” Lucifer
said. The Word of God has warned us that men would be lovers
of themselves.
Perilous Times and Perilous Men
“But know this, that in the last days perilous times will come:
For men will be lovers of themselves, lovers of money, boasters,
proud, blasphemers, disobedient to parents, unthankful, unholy,
unloving, unforgiving, slanderers, without self-control, brutal,
despisers of good, traitors, headstrong, haughty, lovers of
pleasure rather than lovers of God” (2 Timothy 3:1-4, NKJV).
To accommodate our self-love, camera phones have been
redesigned to have front-facing lenses to take selfies, and
pictures of ourselves. If you walk any popular beach in the
world, you will trip over young people infatuated and lost in the
glamor of their next great Instagram selfie for their little universe
of admirers to love. “I will exalt my throne” Lucifer said. Are we
saying the same today?
King Nebuchadnezzar of Babylon had problems with the
personal pronoun use of “I” when he failed to acknowledge
ownership of Babylon to God and gave glory and credit to
himself. He was stricken in the likeness of a beast for seven
years as his punishment for his arrogance. Nebuchadnezzar had
forgotten that he was not so much a king, but simply a steward of
a kingdom that God had placed into his hands. The Lord raises
kings, and the Lord removes kings.
“The king spoke, saying, “Is not this great Babylon, that I have
built for a royal dwelling by my mighty power and for the honor
of my majesty?” While the word was still in the king’s mouth,
a voice fell from heaven: “King Nebuchadnezzar, to you it is
spoken: the kingdom has departed from you! And they shall drive
you from men, and your dwelling shall be with the beasts of the
field. They shall make you eat grass like oxen; and seven times
shall pass over you, until you know that the Most High rules
in the kingdom of men, and gives it to whomever He chooses”
(Daniel 4:30-32, NKJV).
I find it ironic that today when filling out medical forms, in our
lost society, we are now asked to check from multiple boxes
(more than two) what our gender is and what pronouns to use
when addressing us in person. People are now sued, in some
cases, because of the use of the wrong pronouns. I am reminded
that Satan, the enemy of our soul, also had problems with
personal pronouns. The rich fool may have lost his soul because
of his love of his pronouns. Let us readily acknowledge who we
are and who God is. Let us acknowledge God as our Creator
and provider of all that we have and enjoy. Let us be his humble
stewards and servants.
The Parable of the Talents is a classic example of our lives being
stewards of what God has entrusted to us. Pause for a moment
and realize that everything that we have is from the Lord and it
has been loaned to us for a short time while travelling the earth.
The Lord has entrusted to us breath, time, and opportunity for
the sake of the kingdom of God. In the final analysis, our lives
do not belong to us, they are the Lord’s and ultimately there will
be a reckoning of what we did with our time and talents. No man
or woman lives or dies to themselves.
In the following parable, the term “talents,” according to several
commentators, appears to mean not money but “abilities, talents,
opportunities, gifts.” In other words, this parable is a picture of
the Lord as He made His way to heaven distributing to you and
me different measures of spiritual and natural talents for us to use
for His kingdom as stewards. But He plans on returning to see
how we have used those “talents.” Have we multiplied them, or
squandered them? We will need to answer for our stewardship.
You will find in Matthew 25:20-23 that two of the men received
the same reward, which indicates that what the Lord is looking
for is simply faithfulness in relationship to the amount of the
gift or ability that he gives. To him that is given much, much is
required (Luke 12:48). The third is condemned for his sloth and
indifference (Matthew 25:24-26).
The Parable of the Talents
“For the kingdom of heaven is like a man traveling to a far
country, who called his own servants and delivered his goods
to them. And to one he gave five talents, to another two, and
to another one, to each according to his own ability; and
immediately he went on a journey. Then he who had received
the five talents went and traded with them, and made another
five talents. And likewise he who had received two gained two
more also. But he who had received one went and dug in the
ground, and hid his lord’s money. After a long time the lord of
those servants came and settled accounts with them.
“So he who had received five talents came and brought five
other talents, saying, ‘Lord, you delivered to me five talents;
look, I have gained five more talents besides them.’ His lord said
to him, ‘Well done, good and faithful servant; you were faithful
over a few things, I will make you ruler over many things. Enter
into the joy of your lord.’ He also who had received two talents
came and said, ‘Lord, you delivered to me two talents; look, I
have gained two more talents besides them.’ His lord said to him,
Well done, good and faithful servant; you have been faithful over
a few things, I will make you ruler over many things. Enter into
the joy of your lord.’
“Then he who had received the one talent came and said, ‘Lord,
I knew you to be a hard man, reaping where you have not sown,
and gathering where you have not scattered seed. And I was
afraid, and went and hid your talent in the ground. Look, there
you have what is yours.’
“But his lord answered and said to him, ‘You wicked and lazy
servant, you knew that I reap where I have not sown, and gather
where I have not scattered seed. So you ought to have deposited
my money with the bankers, and at my coming I would have
received back my own with interest. So take the talent from him,
and give it to him who has ten talents.
For to everyone who has, more will be given, and he will have
abundance; but from him who does not have, even what he has
will be taken away. And cast the unprofitable servant into the
outer darkness. There will be weeping and gnashing of teeth’”
(Matthew 25:14-30, NKJV). See also Luke 19:11-27.
We can see from these scriptures that there appears to be a price
to be paid for spiritual apathy, for spiritual laziness. In this last
great move of the Spirit, we have been blessed to be prayed and
prophesied over for the impartation of our spiritual gifts and
ministries. What a great blessing this is to see and understand
more clearly the specific calling that God has bestowed on a
believer’s life.
“Do not neglect the gift that is in you, which was given
to you by prophecy with the laying on of the hands of
the eldership. Meditate on these things; give yourself
entirely to them, that your progress may be evident to all.”
(1 Timothy 4:14-15 (NKJV)
Yet, as blessed as this experience is, it would be far better to not
know what the believer’s gifts and callings are if the believer is
not going to walk in them and practice them. It would be like
the unprofitable servant placing his master’s talent in a hole in
the ground.
Let us pray and ask the Lord to help us be faithful stewards.
Here are some attributes that can be found in good stewards. I
have borrowed some of these thoughts from others:
• Those who recognize that God owns everything.
• Those who practice the spiritual gifts that have been prayed
over them.
• Those who faithfully manage resources according to
biblical principles.
• Those who intentionally multiply resources and use them
for God’s glory.
• Those who give cheerfully, save consistently, invest wisely,
and avoid debt.
• Those who work as unto the Lord.
• Those who tithe regularly.
• Those who pray consistently, and frequently for guidance
and wisdom.
• Those who pattern their daily life, family life, married life,
and personal life after the pattern of the scriptures.
• Those who are not wasteful in the limited resources that
God has given them.
• Those who look for opportunities to share with others the
love and Word of God as ambassadors.
• Those who are mindful of ways to help the less fortunate.`, author: 'Andy Snoke', year: 2024, month: 'June', volume: 'Vol. LXXVII, No. 06', title: 'Being a Good Steward', topics: ['Stewardship','Scripture','Faith'], excerpt: "Andy Snoke examines Christian stewardship — all we have belongs to God and we are managers of His gifts. Unpacks the Parable of the Rich Fool, Lucifer's 'I will' statements, Nebuchadnezzar's pride, and the Parable of the Talents. Lists twelve attributes of a faithful steward.", pdf: '06%20-%20Sharon%20Star%20-%20June%202024.pdf', fileName: '06_-_Sharon_Star_-_June_2024.pdf'  }

  { id: 28, articleText: `“He that hath an ear, let him hear what the Spirit saith unto the
churches” (Revelation 2:17, KJV).
Even though this verse addresses the seven churches described
in the book of Revelation chapters 2 and 3, God is speaking
clearly in this hour to all who will have ears to hear. He gives us
a concise roadmap of what we ought to long for and earnestly
pursue in our day-to-day living.

to prophesy, and forbid not to speak with tongues”
(1 Corinthians 14:1 & 39, KJV).
At the 2019 North Battleford Feast, the following prophecy
was given:

Volume LXXVII | Issue 07 | July 2024
things must be left along the way, thrown as it were into the
ditches beside the road. For they cannot, you cannot carry

things of the world. All of these things, my little ones, that
have been inherited from Adam must be laid aside. They must

The Lord’s call is clear: Lay aside all of your worldly chains
and enter His kingdom unencumbered and unrestrained. We
are told to relinquish and submit ourselves completely to the
Spirit of God. Only by leaving behind the trappings of this
world can we fully embrace the promises and blessings of the
kingdom.
The Holy Spirit often speaks to us through the gift of
prophecy. Recently, in an ordinary Sunday morning church
service, around 5 or 6 different church members spoke
forth the message detailed in the following content through
prophecy.
The prophecies included direction on “opinions” and it was
felt that there should be some clarification on this word. We all
have opinions or preferences on various things and many times
it makes for interesting conversations. However, opinions
become problematic when they create divisions in the body
of Christ. Often opinions have a spirit of control which means
that one or both parties are standing firm on a position and
trying to convince the opposing party of their opinion and this
often ends in separation.
“For ye are yet carnal: for whereas there is among you envying,
and strife, and divisions, are ye not carnal, and walk as men?”
(1 Corinthians 3:3, KJV).
“Every way of a man is right in his own eyes: but the LORD
pondereth the hearts” (Proverbs 21:2, KJV)
God is interested in unity. The opinions that God is warning us
about are the viewpoints that cause division.
We have the mind of Christ within us (1 Corinthians 2:16) but
we also have a carnal nature that wars against the Spirit. If we
operate with the mind of Christ, we will enjoy the same unity
that exists between the Father, Son and the Holy Spirit.
Vaccinations and politics are a few examples of opinions that
have caused significant division.
Researching online for information about the word “opinion”
revealed the following synonyms: disagreement, dissension,
dissent, friction, altercation, argument, bone of contention,
conflict, debate, dispute, irreconcilable difference, run-in, and
strife.
Other common synonyms of opinion are: belief, conviction,
persuasion, sentiment, and view. While all these words mean
“a judgment one holds as true,” opinion implies a conclusion
thought out yet open to dispute. Each expert seemed to have a
different opinion.
Antonyms for “opinion” include agreement, peace, approval,
ratification, authorization, and concurrence. One of the
definitions found for “opinion” is as follows: “An opinion is
a judgment, viewpoint, or a statement that is not conclusive,
rather than facts, which are true statements.”
Another search on the difference between truth and opinion:
Truth is neither an opinion or a fact. It is universal, undisputed,
verified through facts, and even transcendent, beyond
reasonable doubt. In other words, the truth will always be true
no matter what a person thinks or says. Truth does not change;
an opinion, however, usually changes through time.
The word “opinion” is mentioned three times in the KJV Bible,
all occurrences are found in the book of Job. The plural form
“opinions” appears once in 1 Kings 18:21, where the Hebrew
word “saiph” is used, meaning “divided (in mind).”

  { id: 29, articleText: `Nehemiah was born more than a thousand miles away from
Jerusalem to a captive people. He had never seen the land of his
ancestors though he had heard countless stories of its former
beauty, glory and fame. Before Nehemiah’s birth, the first group
of Jews had left Persia and returned to Jerusalem to rebuild the
temple under the leadership of Zerubbabel in 538 B.C. A second
group had returned under the leadership of Ezra in 458 B.C.,
13 years before Act One of Nehemiah.
Nehemiah was not a priest, but a trusted administrator,
a cupbearer, one who was a trusted confidante of the king,
who would ask permission to be sent to Jerusalem to help
rebuild the crumbling walls of Jerusalem in a record-setting
pace of 52 days.
The first half of Nehemiah describes the miraculous task of
constructing the walls of stone and mortar against great peril
and all odds. The second half of Nehemiah describes the
miracle of the transformation of hearts when Nehemiah helps
the people’s hearts be transformed by a willingness to conform
to God’s covenants and promises. A commitment to the Word
of God does this. The internal transformation of hearts and
attitudes toward their God is as miraculous as the outward task
of building walls in the presence of enemies.
Volume LXXVII | Issue 08 | August 2024
For this study, we will examine the steps of renewal towards
the last half of Nehemiah that resulted in the new presence of
Israel in Jerusalem as they apply to our renewal and presence
in the kingdom of God.
Steps towards Spiritual Renewal
1. Returning To The Word Of God
Ezra Reads the Law:
“And all the people gathered as one man into the square before
the Water Gate. And they told Ezra the scribe to bring the Book
of the Law of Moses that the LORD had commanded Israel. So
Ezra the priest brought the Law before the assembly, both men
and women and all who could understand what they heard, on
the first day of the seventh month. And he read from it facing the
square before the Water Gate from early morning until midday,
in the presence of the men and the women and those who could
understand. And the ears of all the people were attentive to
the Book of the Law. And Ezra the scribe stood on a wooden
platform that they had made for the purpose. And beside
him stood Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and
Maaseiah on his right hand, and Pedaiah, Mishael, Malchijah,
Hashum, Hashbaddanah, Zechariah, and Meshullam on his
left hand. And Ezra opened the book in the sight of all the
people, for he was above all the people, and as he opened it
all the people stood. And Ezra blessed the LORD, the great
God, and all the people answered, ‘Amen, Amen,’ lifting
up their hands. And they bowed their heads and worshiped
the LORD with their faces to the ground. Also Jeshua, Bani,
Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah,
Kelita, Azariah, Jozabad, Hanan, Pelaiah, the Levites, helped
the people to understand the Law, while the people remained
in their places. They read from the book, from the Law of God,
clearly, and they gave the sense, so that the people understood
the reading” (Nehemiah 8:1-8, ESV).
Everything begins and ends with the Word of God! Every
renewal, every revival, every new birth is born in the Word of
God. We need to fall in love with the Word of God. I appreciate
many of the word picture phrases that seem to leap out at us
from these scriptures such as:
1. Understand what they heard.
2. The ears of all the people were attentive.
3. All the people answered, “Amen, Amen,” lifting up their
hands.”
4. And bowed their heads and worshiped the Lord with
their faces to the ground.
5. The Levites helped the people understand.
6. Clearly, they gave the sense so that the people understood
the reading.
These descriptive phrases give the impression that these souls
were taking the Word of God seriously. The Word of God was
taking root in their souls, which was the beginning of our
renewal and revival.
2. Commitment To Obedience To The Word Of God
After hearing the Word of God read and proclaimed publically,
it became evident that they had not obeyed the command
to practice the Old Testament Feast of Booths, which they
immediately made provisions for. The important fact to note
for us today is that when the Lord begins to reveal to us in
“our hour” His requirements we should be mindful to “obey”
as well.
When reading Nehemiah 8:13-18 there are action verbs
included such as, “came, study, found, proclaim, publish,
brought, made, lived, read.” Words that reinforce the idea that
the people after hearing the Word of God proclaimed had great
“intent” to follow through and obey. When God speaks to us
in our present hour, let us be intent to obey with the same zeal.
“On the second day the heads of fathers’ houses of all the
people, with the priests and the Levites, came together to Ezra
the scribe in order to study the words of the Law. And they
found it written in the Law that the LORD had commanded by
Moses that the people of Israel should dwell in booths during
the feast of the seventh month, and that they should proclaim
it and publish it in all their towns and in Jerusalem, ‘Go out
to the hills and bring branches of olive, wild olive, myrtle,
palm, and other leafy trees to make booths, as it is written.’
So the people went out and brought them and made booths for
themselves, each on his roof, and in their courts and in the
courts of the house of God, and in the square at the Water Gate
and in the square at the Gate of Ephraim. And all the assembly
of those who had returned from the captivity made booths and
lived in the booths, for from the days of Jeshua the son of Nun
to that day the people of Israel had not done so. And there was
very great rejoicing. And day by day, from the first day to the
last day, he read from the Book of the Law of God. They kept
the feast seven days, and on the eighth day there was a solemn
assembly, according to the rule” (Nehemiah 8:13-18, ESV).
3. Convicted And Confessed Their Sins
The reading and application of the Word of God, caused the
people to confess their sins and repent. This is so very important
for personal revival, for personal salvation, for personal
renewal. We must not become too comfortable with our sins.
We need to call our sins, a sin. There is a new buzz word in the
hour we live in that disguises our sins. It is called “our truth.”
Often someone will live in sin and just call it “my truth.” I am
living in “my truth.” I have news for you my friend, there is
only one truth, and that is Jesus Christ, the way the truth, and
the life. We need to live in His truth.
“And the Israelites separated themselves from all foreigners
and stood and confessed their sins and the iniquities of their
fathers” (Nehemiah 9:2, ESV).
“If we say we have no sin, we deceive ourselves, and the truth
is not in us. If we confess our sins, he is faithful and just to
forgive us our sins and to cleanse us from all unrighteousness”
(1 John 1:8-9, ESV).
4. They Learned To Give Great And Continuous Worship
And Praise To God
Intertwined with their confession of sin, God’s people learned

all that He shall do. Praise opens the door to the heavens and

In their praises to God, the saints reminded the Lord as part of

You gave them bread from heaven for their hunger and brought

“But the hour is coming, and is now here when the true

“Through him then let us continually offer up a sacrifice of
praise to God, that is, the fruit of lips that acknowledge his
name” (Hebrews 13:15, ESV).
5. Commitment To The Lord In Conduct And Finances
Talk is cheap! This is a common saying often expressed when

through to about 10:39, you will find that God’s people signed a
covenant with God to follow the Lord and to observe His laws.
Also to pay their tithes for the service to the house of the Lord.
God asks all of us to make a covenant with Him and to fulfill

The Obligations of the Covenant
“The rest of the people, the priests, the Levites, the gatekeepers,

“And if it is evil in your eyes to serve the LORD, choose this

“Will man rob God? Yet you are robbing me. But you say, ‘How

6. They Offered Their Lives For Service To The Lord
At this point in history, not many lived in Jerusalem. They were

Therefore, they repopulated the city of Jerusalem by drawing

  { id: 30, articleText: `The last book that the apostle Paul wrote was 2 Timothy. He
penned this short book from the dark prison cell called the
Mamertine prison in Rome. This prison was the “last stop”
for many prisoners waiting for execution. Paul was waiting
for his execution date and did not waste his last days, but
filled them with prayer and writing.
Paul wrote 2 Timothy, one of the Pastoral Epistles, along
with 1 Timothy and Titus, to give quick instructions to the
“shepherds” of the flock, or the “pastors” as he knew he was
about to be removed from the scene. These three books are
unique (1 Timothy, 2 Timothy, Titus) and should be read
and treasured by all shepherds, elders, and deacons and all
everywhere.
Paul must have had a great deal of physical difficulty writing
this book. My wife and I visited this prison in Rome twice!
It is hard to find. It is not one of the top ten tourist attractions
of Rome. Most tourists flock to the crowded places of
historical splendor that represent the past glory of Rome.
But we were intent on finding the hard-to-reach prison cell
where Paul spent his last days and where he wrote possibly
three of the New Testament books. Peter also spent time in
this infamous cell.
Volume LXXVII | Issue 09 | September/October 2024
As we stood there in the cell’s emptiness and ugliness, with
no adornment, we had an indescribable feeling wash over
us, as we were in the presence of greatness. Paul and Peter
were ordinary men, but they were apostles, chosen by God.
They were here in this cell before leaving this earth.
For a brief moment, I was reminded of the great relay race
through the ages that all we saints are in, each running our
race or course in time and passing the baton on to the next
generation. Paul ran his race and finished it mostly from
this prison. Now, we must run and hand off to the next
generation.
“And all these, having obtained a good testimony through
faith, did not receive the promise, God having provided
something better for us, that they should not be made perfect
apart from us” (Hebrews 11:39-40, NKJV).
The Mamertine Prison, in antiquity the Tullianum, was a
prison with a dungeon located in the Comitium in ancient
Rome. It is said to have been built in the 7th century BC
and was situated on the northeastern slope of the Capitoline
Hill, facing the Curia and the imperial forums of Nerva,
Vespasian, and Augustus. (Wikipedia 2024. “Mamertine
Prison” Wikimedia Foundation. Last modified March 4,
2024, 13:55.
https://en.wikipedia.org/wiki/Mamertine_Prison.)
This prison cell or dungeon is a large abandoned cylinder-
shaped water cistern, with only one large hole at the top
for lowering the prisoners into it.. There is now a stairway
for tourists, but in Paul’s day, there was only a hole at the
top by which he was lowered into the cell, along with his
provisions, and for the removal of waste. This was the only
source of light and ventilation. One can imagine the smell.
The cold. The claustrophobic environment. There was no
escape.
Many scholars believe that the apostle Paul had poor
eyesight based on many hints from his writings. I can only
imagine the aged apostle, sitting on the cold floor of the
cell (in 2 Timothy 4:13, he asked Timothy to bring the coat
that he had left behind), with only, at most, candlelight, a
quill, ink, and parchment, writing with large letters his last
epistle.
The book of 2 Timothy is a beautiful, abbreviated book,
full of quick, short, powerful instructions to the “pastor” of
today, and for all of the saints of this hour. Paul did not have
the luxury of time to “expound” in detail on many of his
finer points and would close with statements such as, “think
over what I say for the Lord will give you understanding in
everything” (2 Timothy 2:7). Is there a better way to leave a
spiritual truth than to leave it in the Lord’s authority to “give
understanding?” To physically write at length was difficult
with the cramped, cold quarters, the lack of light, and no
reading glasses.
This book should be read slowly and thoughtfully. Each
verse should be given time to be digested into the soul,
heart, and mind. These are the most important truths that
the great apostle Paul felt to write to young Timothy before
his promotion to heaven. He knew these were most likely
his last words. He had to make them count.
Paul’s intended audience was Timothy, who today would be
called a “traveling deacon” or “apostolic deacon.” Timothy’s
mother Eunice and grandmother Lois were believers and
had passed their faith on to Timothy. Timothy’s father was a
Greek and most likely was not a believer. His name is never
mentioned, and Paul became Timothy’s spiritual father. Let
me pause a moment and say thank you to Eunice, to Lois,
and to all the godly mothers and grandmothers who helped
change the world with their faith.
Paul’s intended audience was Timothy. However, with God,
things are never as we often intend. Paul’s letter has been
read by countless billions of believers worldwide through
the ages. Paul’s intended audience was one beloved son.
God’s intended audience was countless beloved sons and
daughters through the millennia!
For this miniature study, we will look at the expectations
and characteristics that should be found in the life of
Timothy, and for all those who follow “in this way.” These
truths and characteristics that Paul briefly touches on were
a preparation for the growth and development of the church
through the ministry of Timothy and countless others as
Timothy would “commit these truths to faithful men who
will be able to teach others also” (2 Tim. 2:2).
The truths that Paul spoke, recorded in the second chapter
of Second Timothy, are timeless and relevant today. These
truths recorded in isolation in the dark Mamertine Prison
shine as a beacon of kingdom light to all who will read Paul’s
admonitions. Here are just a few of Paul’s admonitions and
expectations for the believer.
Characteristics Of A Teacher - Sharing The Truth,
Passing On The Revelation
“And the things that you have heard from me among many
witnesses, commit these to faithful men who will be able to
teach others also” (2 Timothy 2:2, NKJV).
One of the hallmarks of the church is the setting of elders in
local assemblies to carry the load that the church may grow.
It is the basis of church growth and transition through time.
“And when they (apostles Paul and Barnabas) had preached
the gospel to that city and made many disciples, they
returned to Lystra, Iconium, and Antioch, strengthening
the souls of the disciples, exhorting them to continue in
the faith, and saying, ‘We must through many tribulations
enter the kingdom of God.’ So when they had appointed
elders in every church, and prayed with fasting, they
commended them to the Lord in whom they had believed”
(Acts 14:21-23, NKJV).
“For this reason I (Paul) left you (Titus) in Crete, that you
should set in order the things that are lacking, and appoint
elders in every city as I commanded you” (Titus 1:5, NKJV).
However, there is a place where all believers should have
a working knowledge of the Scriptures and be ready to
answer those who ask about the peace that is in their lives.
“But sanctify the Lord God in your hearts, and always
be ready to give a defense to everyone who asks you a
reason for the hope that is in you, with meekness and fear”
(1 Peter 3:15, NKJV).
The believer teaches using words as well as with the
example of a life properly lived.
Characteristics Of A Soldier
“You therefore must endure hardship as a good soldier of
Jesus Christ. No one engaged in warfare entangles himself
with the affairs of this life, that he may please those who
enlisted him as a soldier” (2 Timothy 2:3-4. NKJV).
Paul was very familiar with the concept of a soldier. All
he had to do was look up at the trap door and see and talk
to the soldiers who stood guard over him. Soldiers were
required to leave the comforts of home and follow the
orders of their commanding officers. Life was not always
easy for soldiers, and often their lives would be required.
They learned to lay down their wants, desires, and selfish
wills for the sake of their command, though in their case it
was an earthly one.
“Then Jesus said to His disciples, ‘If anyone desires to
come after Me, let him deny himself, and take up his cross,
and follow Me. For whoever desires to save his life will
lose it, but whoever loses his life for My sake will find it’”
(Matthew 16:24-25, NKJV).
Paul, like a good soldier, was about to lay down his life for
his King, for his Lord. Walking with the Lord is not always
easy, but it is always right. The road is narrow.
“Enter by the narrow gate; for wide is the gate and broad
is the way that leads to destruction, and there are many
who go in by it. Because narrow is the gate and difficult is
the way which leads to life, and there are few who find it”
(Matthew 7:13-14, NKJV).
It takes effort and a great commitment to be a soldier. It
takes effort, and great commitment to be a child of God.
The great outspoken Billy Sunday said, “Going to church
doesn’t make you a Christian any more than going to a
garage makes you an automobile.”
Jesus said that we must be born again. There is only one
way into heaven. No matter what the world says, there is
only one way, one door, one Savior, one God, and one Son
of God whereby we must be saved and His name is Jesus.
“Jesus answered and said to him, ‘Most assuredly, I say to
you, unless one is born again, he cannot see the kingdom of
God’” (John 3:3, NKJV).
“That if you confess with your mouth the Lord Jesus and
believe in your heart that God has raised Him from the
dead, you will be saved. For with the heart one believes
unto righteousness, and with the mouth confession is made
unto salvation” (Romans 10:9-10, NKJV).
Characteristics Of An Athlete
“And also if anyone competes in athletics, he is not
crowned unless he competes according to the rules”
(2 Timothy 2:5, NKJV).
An athlete learns to submit to the rules that he might win. An
athlete learns to live a disciplined life; a life of temperance,
not extremes. An athlete is disciplined in his training, in his
diet, in his habits, and with his time as he competes. These
are all important metaphors for our walk with the Lord.
Saints need to learn discipline with their habits and with
their time. Most of all, we “compete according to the rules.”
By that I mean there are things that the Lord requires of us
and has revealed for us to do. There are things that God
has told us to stay away from. We need to be obedient. An
athlete cannot make up his own rules in the middle of the
game, and yet many Christians are guilty of making up their
own rules of the game to suit their lifestyles or desires. Let
us compete according to God’s rules!
For this exhortation, I have shied away from listing the
“rules” that we should follow and the “rules” of this spiritual
game that we are asked to not break. The unbeliever, the
skeptic, will argue that they don’t understand the rules,
or that they disagree with God’s rules. Forgive me for
quoting Billy Sunday again but I love his choice of words
as follows”.
“The Bible will always be full of things you cannot
understand, as long as you will not live according to those
you can understand.” - Billy Sunday
Characteristics Of A Farmer
“The hardworking farmer must be first to partake of the
crops. Consider what I say, and may the Lord give you
understanding in all things” (2 Timothy 2:6-7, NKJV).
My Bible commentary says this about this verse:
Hardworking is from a Greek verb meaning “to labor to the
point of exhaustion.” Ancient farmers worked long hours of
backbreaking labor under all kinds of conditions, with the hope
that their physical effort would be rewarded by a good harvest.
Paul is urging Timothy not to be lazy, but to labor intensely.
There is another truth in this scripture. The farmer is the first
to partake of his crop. This also means that the man who
teaches a particular truth, must be the first one to practice
it. For instance, the man who preaches “love your wife as
Christ loves the Church” better be the one who loves his
wife very much! The man who teaches tithing better be the
man who is tithing every week! We must all “practice what
we preach,” and be “first partakers of the fruit.”
Characteristics Of An Approved Worker
“Be diligent to present yourself approved to God, a worker

This phrase “ rightly dividing” the word of truth, is a

  { id: 31, articleText: `When the brethren (ministries) at the beginning of the
“Move of the Spirit” began to function in oneness and unity
and in submission to one another, it was a revelation that
kept the church on a firm foundation. There was no longer
any tolerance for anyone, locally or universally, going off
on a tangent and ministering what seemed to be right in his
own eyes. A plurality of many brethren who walk in unity
with one another cannot be accomplished in the flesh. I
submit to you that if this principle had not been adhered to
at the very beginning, the “Move of the Spirit” may have
been blown to the four winds today.
We have witnessed many prominent men in the religious
field who have gone astray largely because they were a law
unto themselves and did not have anyone to balance them or
anyone who was viewed as an equal to consult with them.
Thus, they were determined to go in their own misguided
direction. Proverbs 21:4 says, “Every way of man is
right in his own eyes: but the Lord ponders (weighs) the
hearts.” While there are examples of God having anointed
the one-man ministry and they have had their place in the
plan of God, I believe that the emphasis in this present
Volume LXXVII | Issue 10 | November / December 2024
day is a plurality of ministries walking in submission and
ultimately fulfilling the will and plan of God. Ephesians
4:11–16 outlines the plan of God in bringing the body of
Christ to maturity. This is in no way a singular effort, but
rather a plurality of ministries that will result in the many-
membered body of Christ coming “to the measure of the
stature of the fullness of Christ” (v. 13). “And He Himself
gave some to be apostles, some prophets, some evangelists,
and some pastors and teachers, for the equipping of the
saints for the work of the ministry, for the edifying of the
body of Christ, till we all come to the unity of the faith and
of the knowledge of the Son of God, to a perfect man, to
the measure of the stature of the fullness of Christ; that we
should no longer be children, tossed to and fro and carried
about with every wind of doctrine, by the trickery of men,
in the cunning craftiness of deceitful plotting, but, speaking
the truth in love, may grow up in all things into Him who
is the head – Christ – from whom the whole body, joined
and knit together by what every joint supplies, according
to the effective working by which every part does its share,
causes growth of the body for the edifying of itself in love”
(NKJV).
I was reading in the booklet titled, “The Move of the Spirit
of God” and I will quote a portion from it. “There have been
some very prominent brethren who were mightily used of
God in the beginning of the move, who have since missed
the way and departed from it, but nevertheless God has
moved on, building His temple and preparing that body for
Christ. God is not building on men. Paul also realized that
the thing that was important to God was not him, but the
ministry that came down from heaven; that was abiding
within him – and his yielding to that ministry. That is why
he said in 1 Corinthians 9:26 & 27, “I therefore so run, not
as uncertainly, so fight I, not as one that beateth the air, but I
keep my body under and bring it in to subjection lest that by
any means when I have preached to others, I myself should
be a castaway.” May we all realize today that we stand by
the grace of God, and not by any merit of our own, and
this that God has called us into, is a move of God’s Spirit,
preparing us for the kingdom of God. God is still moving by
His Holy Spirit, leading us ever on” (pp. 20 & 21).
God introduced the truth or principle of plurality early in the
scriptures. In Genesis 1:26, we read, “Then God said, ‘Let
Us make man in Our image, according to Our likeness; let
them have dominion over the fish of the sea, over the birds
of the air, and over the cattle, over all the earth and over
every creeping thing that creeps on the earth’” (NKJV).
The existence of Father, Son, and Holy Spirit conferring
together in the creation of man demonstrates plurality and
perfect unity in the Godhead. Also, in Genesis 2:18, we see
plurality in God’s plan for marriage. “It is not good that the
man should be alone; I will make him an help meet for him”
(KJV). The woman (Adam’s wife) would not be inferior to
him or superior to him, but rather equal with him. She would
have a different office than he had; she would be a suitable
help meet to him (his counterpart); she would be submissive
to his headship, but not inferior or of lesser importance. She
would be deserving of his love as her provider, protector
and spiritual head. His love would be sacrificial, and her
respect would be for him. Obviously, companionship and
communication are very important aspects of the marriage
relationship. Eve made a fundamental error when she took
of the fruit and ate it. The scripture says nothing about
discussing this decision with Adam. She did not ask his
advice, but rather chose, on Satan’s prompting to act on
what God had forbidden. The scripture says in Proverbs
11:14, “Where no counsel is, the people fall: but in the
multitude of counsellors there is safety” (KJV).
It seems that when a truth is made real to you, you begin
to see it in many places in the Bible. For example, the
Lord chose twelve disciples who were ordinary men with
different personalities, drawn from diverse backgrounds
and possessing the same human weaknesses that we
all have. However, the Lord saw beyond their flaws
and shortcomings to what they could become through
submission and obedience to the will of God. While the
disciples had their disagreements, the Lord always pointed
them in the direction of kingdom of God, love for each
other, and unity of mind and purpose. He is doing the
same today. “These twelve Jesus sent out and commanded
them saying, ‘… go to the lost sheep of the house of Israel.
And as you go, preach, saying, the kingdom of God is at
hand. Heal the sick, cleanse the lepers, raise the dead,
cast out demons. Freely you have received, freely give”’
(Matthew 10:5–8, NKJV). Then again, in Mark 16:14–18,
“Later He appeared to the eleven as they sat at the table;
and He rebuked their unbelief and hardness of heart,
because they did not believe those who had seen Him after
He had risen. And He said to them, ‘Go into all the world
and preach the gospel to every creature. He who believes
and is baptized will be saved; but he who does not believe
will be condemned. And these signs will follow those who
believe: In My name they will cast out demons; they will
speak with new tongues; they will take up serpents; and if
they drink anything deadly, it will by no means hurt them;
they will lay hands on the sick, and they will recover”’
(NKJV). There is a plurality here in the disciples that Jesus
used to work the works of Christ in the earth. It was not
about how great or how talented they were, but rather it
was about the Spirit of God working through them to
accomplish what God desired to fulfill in the lives of men
and women. God does not anoint the flesh, for in the flesh
there is no good thing. Similarly, in Luke 10:1, 17-20, we
see the following plurality put in place once again, “After
these things the Lord appointed 70 others also, and sent
them two by two before His face into every city and place
where He Himself was about to go” (v.1) “Then the seventy
returned with joy, saying, ‘Lord, even the demons are subject
to us in Your name’” (v. 17). “And He said to them, ‘I saw
Satan fall like lightning from heaven. Behold, I give you the
authority to trample on serpents and scorpions, and over
all the powers of the enemy, and nothing shall by any means
hurt you. Nevertheless do not rejoice in this, that the spirits
are subject to you, but rather rejoice because your names
are written in heaven”’ (vs. 18-20). Jesus puts everything
in perspective. While these 70 that He had sent out gloried
in the evidence of the authority imparted to them, Jesus
said that much more important is that they had made their
“calling and election sure” (2 Peter 1:10, KJV).
There is no room for pride, selfishness or human ambition
in what God is building; the flesh will have no part in it.
“Flesh and blood cannot inherit the kingdom of God”
(1 Corinthians 15:50). The hymn writer penned these
prophetic words of unity in the song:
For I’m building a people of power
And I’m making a people of praise
That will move through this land by My Spirit
And will glorify My precious name.
Build your church, Lord
Make it strong, Lord
Join our hearts, Lord, to Your Son
Make us one, Lord, in Your body
In the kingdom of Your Son.
In the building of the tabernacle, God instructed Moses
to do everything according to the pattern that he had been
divinely shown on the mountain. In other words, there was
no room for Moses to adjust or change anything. It had to be
done just as God had directed and planned. This is a serious
hour. Today we must build according to the pattern that God
has laid down for the church. There is no place for the mind
of man in it, for if we build on the theories and ideologies
of man we surely build on sinking sand. But rather we are
built on the rock: “on the foundation of the apostles and
prophets, Jesus Christ Himself being the chief cornerstone”
(Ephesians 2:20, NKJV). In 2 Timothy 2:19, we read, “The
solid foundation of God stands, having this seal: ‘The Lord
knows those who are His,’ and, ‘Let everyone who names
the name of Christ depart from iniquity”’ (NKJV).
Let us have a look at the circumstances that Moses faced in
Numbers chapter 11. The people complained because they
had grown tired of the manna that they gathered daily and
they remembered the fish, the cucumbers, the melons, the
leeks, the onions and the garlic they had in Egypt and they
hankered for these things, even though the manna was a
complete food in itself. They demanded that Moses provide
them with meat. “So Moses said to the Lord, ‘Why have You
afflicted your servant? And why have I not found favor in
Your sight, that You have laid the burden of all these people
on me? Did I conceive all these people? Did I begat them,
that You should say to me, ‘carry them in Your bosom, as
a guardian carries a nursing child,’ to the land which You
swore to their fathers? Where am I to get meat to give to all
these people? For they weep all over me saying, ‘Give us
meat that we may eat.’ I am not able to bear all these people
alone, because the burden is too heavy for me”’ (Numbers
11:11-14, NKJV). So what was the Lord’s response to the
predicament that Moses was in? It was quite simply to add
a plurality of brethren to him, as we see, beginning at verse
16, “So the Lord said to Moses, ‘Gather to Me seventy men
of the elders of Israel, whom you know to be elders of the
people and officers over them; bring them to the tabernacle
of meeting, that they may stand there with you. Then I will
come down and talk with you there. I will take of the Spirit
that is upon you and will put the same upon them; and they
shall bear the burden of the people with you, that you may
not bear it yourself alone”’ (vs. 16 & 17, NKJV).
There are many instances in scripture where there are
references to elders (plural) rather than elder (singular).
Let us look at a few of those. James 5:14, “Is any among
you sick? Let him call for the elders of the church, and let
them pray over him…” (NJKV). Paul and Barnabas when
traveling to Lystra, Iconium and Antioch, “appointed
elders in every church, and prayed with fasting, they
commended them to the Lord in whom they had believed”
(Acts 14:23, NKJV). Paul speaking to Titus says, “For this
reason I left you in Crete, that you should set in order the
things that are lacking and appoint elders in every city as I
commanded you…” (Titus 1:5, NKJV).
The truth of plurality is plain in both the Old and New
Testaments as revealed in the examples that have been
noted here. God wants brethren to walk in unity. It is not
sufficient to just have plurality of leadership in the church.
There must also be unity in the Spirit among all who make
up the plurality. God has warned us against yielding to
our human nature, which is too often convinced that our
own way is the best and only way. “There is a way that
seems right to a man, but its end is the way of death”
(Proverbs 14:12, 16:25, NKJV). Unity in the Spirit is not
always easy to achieve within a plurality. Regardless of a
person’s maturity in the Spirit, God has created us to need
the counsel and input from others to know His mind and
will regarding issues we face. “For by wise counsel you
will wage your own war, and in a multitude of counsellors
there is safety” (Proverbs 24:6, NKJV). A man at any
level of the church who cannot receive the counsel of his
brethren and who cannot yield to the correction given by
them disqualifies himself from headship. The only way
that unity can prevail among a plurality of brethren is by
the Spirit of God. In the flesh there is no unity. In carnality
there is only division. Romans 8:5-8 from the Phillips
translation, in speaking of carnality, puts it this way, “The
carnal attitude sees no further than natural things. But the
spiritual attitude reaches out after the things of the Spirit.
The former attitude means, bluntly, death: the latter means
life and inward peace. And this is only to be expected, for
the carnal attitude is inevitably opposed to the purpose of
God, and neither can nor will follow His laws for living.
Men who hold this attitude cannot possibly please God.”
Down through history in the various moves of God there
has been divine revelation, even unto this present day.
Our responsibility is to walk and be established in present
truth. “The secret things belong unto the Lord our God:
but those things which are revealed belong unto us and to
our children for ever, that we may do all the words of this
law” (Deuteronomy 29:29, KJV). The Lord has revealed
much to His people over these many years. I often wonder
how long it will be before He will trust us with our full
inheritance. What a day it will be when the sons of God
will come forth in the image and likeness of Christ,
possessing His nature and His attributes. It will never
happen by human effort or by the ambitions and plans of
man, but rather by the transforming power of the Spirit of
Christ working in our lives on a daily basis. “Not by might
nor by power, but by My Spirit, says the Lord of hosts”
(Zechariah 4:6, NKJV).
There is always consistency with God. Headship,
submission and plurality are distinctive features of God’s

it in the local church with elders and deacons. We see it
in the universal church with travelling elders and travelling
deacons. A church office at every level carries with it a God-
given authority and the accompanying privilege of serving,
but in no way does it make one person superior to another.
Superior – subordinate relationships and power vested in
one man or one woman are for the world, not the church.
Even in a church office, a man can easily go astray if
brethren who hold the same office as he does do not balance
and sometimes correct him. In addition, all who hold that
office must be equal. There is no room for chief elders or

  { id: 32, articleText: `We are familiar with the phrase “the battle is not ours, the
battle is the Lord’s” – we sing about it, we talk about it and
we have heard teaching on it from time to time.
Certainly, we understand this truth from an intellectual
or conceptual point of view, but do we walk in it? Do we
demonstrate this truth in our day-to-day lives? In looking at
my own life, I believe my answer to this question would be,
“I don’t think so.” With the help of the Holy Spirit, I pray
that the remainder of this article will help us understand this
truth in a greater measure and help us to put it into practice
in our lives.
Listed below are four additional portions of scripture if you
are inclined to do a little bit more study on this topic.
• 2 Chronicles 32:1-22 - Hezekiah
• 1 Samuel 17:1-50 - David & Goliath
• 2 Chronicles 20:1-24 - Jehoshaphat
• Matthew 26:36-43 - Christ in Gethsemane
Volume LXXVI | Issue 01 | January 2023
I would suggest that this article is not complete without also
reading “How to Hear the Voice of God” by Andy Snoke in
the May/June 2015  .
We will be reviewing the account of Gideon in Judges 6 and
7 looking through the filter of “the battle is not mine, the
battle is the Lord’s. I suppose that we all have battles that
we are facing. They may be health-related, work-related,
financial, family, relationships, spiritual, fear, anxiety and
probably numerous other types of battles. Please consider
the battles that you are facing as we work through the
account of Gideon.
Step 1 – We Need To Recognize Or Acknowledge
That It Is Not Our Battle
The Lord our God will help us and fight our battles. Our
difficulty, our challenge, our mountain, our fiery furnace,
our valley – are not ours to fight. We still go through them,
but they are not our fight. This is not easy for us to grasp.
We still go through the experience (whatever it is), but the
battle itself is not ours to fight. I don’t think our natural
minds can easily grasp this.
Your challenges and difficulties are different from mine,
and whether your battle is big or small, this truth remains
the same. The Lord our God is not limited in his love, in his
power or in his authority.
“When you go out to battle against your enemies, and see
horses and chariots and people more numerous than you,
do not be afraid of them; for the Lord your God is with you,
who brought you up from the land of Egypt. So it shall be,
when you are on the verge of battle, that the priest shall
approach and speak to the people. And he shall say to them,
‘Hear, O Israel: Today you are on the verge of battle with
your enemies. Do not let your heart faint, do not be afraid,
and do not tremble or be terrified because of them; for the
Lord your God is He who goes with you, to fight for you
against your enemies, to save you’” (Deuteronomy 20:1-4).
This is a general statement about what is to come. The
children of Israel are not facing a battle at that point in time,
but whenever they are faced with a battle at any time in the
future it is God that will go with them and fight for them
against their enemies to save them. The same promise holds
true for us today!
“With him is an arm of flesh; but with us is the Lord our
God, to help us and to fight our battles.” And the people
were strengthened by the words of Hezekiah king of Judah”
(2 Chronicles 32:8).
“What then shall we say to these things? If God is for us,
who can be against us?” (Romans 8:31).
“I can do all things through Christ who strengthens me”
(Philippians 4:13).
Step 2 – God Wants To Hear Our Sincere Plea,
Request Or Cry For Help
“Then the children of Israel did evil in the sight of the
Lord. So the Lord delivered them into the hand of Midian
for seven years, and the hand of Midian prevailed against
Israel. Because of the Midianites, the children of Israel
made for themselves the dens, the caves, and the strongholds
which are in the mountains. So it was, whenever Israel had
sown, Midianites would come up; also Amalekites and
the people of the East would come up against them. Then
they would encamp against them and destroy the produce of
the earth as far as Gaza, and leave no sustenance for Israel,
neither sheep nor ox nor donkey. For they would come up
with their livestock and their tents, coming in as numerous
as locusts; both they and their camels were without number;
and they would enter the land to destroy it. So Israel was
greatly impoverished because of the Midianites, and the
children of Israel cried out to the Lord. And it came to pass,
when the children of Israel cried out to the Lord because of
the Midianites, that the Lord sent a prophet to the children
of Israel, who said to them, “Thus says the Lord God of
Israel: ‘I brought you up from Egypt and brought you out of
the house of [b]bondage; and I delivered you out of the hand
of the Egyptians and out of the hand of all who oppressed
you, and drove them out before you and gave you their land.
Also I said to you, “I am the Lord your God; do not fear the
gods of the Amorites, in whose land you dwell.” But you
have not obeyed My voice’” (Judges 6:1-10).
The children of Israel cried out to the Lord and the Lord
responded. God heard their cry, sent a prophet to let them
know he heard their cry and set in motion their deliverance.
This is similar to the account we read in Exodus 2:23-25
when the children of Israel cried out unto the Lord because
of their bondage in Egypt.
In this example of Midianite domination, the children of
Israel battled on their own for seven years until they had
nowhere else to turn. When the best thinking from the minds
of men and women failed, they cried to the Lord. Perhaps
when we look over our lives, we too have battled on our
own for far too long before turning to the Lord.
If the battle is not ours, God expects us to cry out to Him
with a sincere heart.
Step 3 – Humility (God Needs To See A Measure Of
Humility In Us)
“Now the Angel of the Lord came and sat under the
terebinth tree which was in Ophrah, which belonged to
Joash the Abiezrite, while his son Gideon threshed wheat
in the winepress, in order to hide it from the Midianites.
And the Angel of the Lord appeared to him, and said to him,
“The Lord is with you, you mighty man of valor!”
Gideon said to Him, “O my lord, if the Lord is with us,
why then has all this happened to us? And where are all

Then the Lord turned to him and said, “Go in this might

And the Lord said to him, “Surely I will be with you, and

Then he said to Him, “If now I have found favor in Your

Do not depart from here, I pray, until I come to You and

And He said, “I will wait until you come back.”
So Gideon went in and prepared a young goat, and

in a basket, and he put the broth in a pot; and he brought
them out to Him under the terebinth tree and presented
them. The Angel of God said to him, “Take the meat and the
unleavened bread and lay them on this rock, and pour out
the broth.” And he did so.
Then the Angel of the Lord put out the end of the staff that
was in His hand, and touched the meat and the unleavened
bread; and fire rose out of the rock and consumed the
meat and the unleavened bread. And the Angel of the Lord
departed out of his sight.
Now Gideon perceived that He was the Angel of the Lord.
So Gideon said, “Alas, O Lord GOD! For I have seen the
Angel of the Lord face to face” (Judges 6:11-22).
After the children of Israel cry out unto the Lord for
deliverance, what is the first thing God does? God goes
searching for someone he can work with. Why does he
choose Gideon? At least one of the reasons Gideon is
chosen is because of the humility he demonstrates in verse
15. “How can I save Israel? My clan is the weakest in
Manasseh, I am the least in my father’s house.” We see
a similar demonstration of humility from Jehoshaphat in
2 Chronicles 20:12 as he calls out onto God on behalf of
Judah, “For we have no power against this great multitude
that is coming against us; nor do we know what to do, but
our eyes are upon You.”
Somehow, we must come to the same place as Gideon and
Jehoshaphat. We must let the Lord know that we don’t know
what to do, we don’t know what to say, we can’t do it on our
own – we need His help.
God’s plan is now set in motion. How many people does God
need to start with? One person – not hundreds or thousands.
One person that he can work with. Let that person be me
and let it be you!
If it is the Lord’s battle, the minds of men and women have
no place in it. The arm of flesh and the thinking and reasoning
of our natural minds have no place. The Lord’s battle must be
handled by the Lord. The Lord will fight, not us.
Confirmation
We see in verses 17 to 22 that after Gideon hears the Angel
of the Lord, he looks for confirmation. Gideon wants to
make sure that it really is God’s voice. For the purposes
of this article, the key point is not how Gideon received
confirmation – the key point is that he wanted confirmation
because he needed to make sure that this was the voice of
God. This is also applicable to us today. When we believe
that we have heard the voice of God, we also should be
looking for confirmation that it really is God’s voice. The
article, “How to Hear the Voice of God” by Andy Snoke
in the May/June 2015 provides excellent
instruction in this area.
Step 4 – Remove That Which Is Not Pleasing
In God’s Sight
“Now it came to pass the same night that the Lord said
to him, “Take your father’s young bull, the second bull of
seven years old, and tear down the altar of Baal that your
father has, and cut down the wooden image that is beside it;
and build an altar to the Lord your God on top of this rock
in the proper arrangement, and take the second bull and
offer a burnt sacrifice with the wood of the image which you
shall cut down.” So Gideon took ten men from among his
servants and did as the Lord had said to him. But because
he feared his father’s household and the men of the city too
much to do it by day, he did it by night” (Judges 6:25-27).
God needed to destroy the evil altar, to remove that which
was not pleasing in His sight. God will not compete with
evil or that which represents evil. At times, the Holy Spirit
may also put his finger on items in our lives that are not
pleasing in His sight that have to be dealt with. When this
happens in our lives, I pray that we are quick to take action.
At this point, perhaps God is thinking – okay, Israel has
cried out to me, Gideon is someone I can work with, and

destroyed – will Gideon be obedient to me? It seems that
this a test for Gideon, a test which Gideon passes.
Confirmation
Again, in Judges 6:36-40 we see Gideon looking for
confirmation that he is hearing the voice of the Lord and
that the Lord will save them. As mentioned earlier, it is not
the fleece or “laying down a fleece” that is important – the
key point is Gideon’s desire to get confirmation to know
that he is following the Lord’s direction.

Step 6 – God Is The Decision Maker
If these are not our battles then we are not the decision makers. If
the battle is the Lord’s then He is the decision maker.
On a personal note, God is saying to me – Trevor, you are not the
decision maker – this is my battle, I make the decisions. Your job
is to rest in my peace and follow my instructions.
Our objective is to surrender the battle to the Lord, step back, hear
His voice, obey His voice and watch His hand move.
“And so it was, when Gideon heard the telling of the dream and
its interpretation, that he worshiped. He returned to the camp
of Israel, and said, “Arise, for the Lord has delivered the camp
of Midian into your hand.” Then he divided the three hundred
men into three companies, and he put a trumpet into every man’s
hand, with empty pitchers, and torches inside the pitchers. And
he said to them, “Look at me and do likewise; watch, and when I
come to the edge of the camp you shall do as I do: When I blow
the trumpet, I and all who are with me, then you also blow the
trumpets on every side of the whole camp, and say, ‘The sword
of the Lord and of Gideon!’ ”
Volume LXXVI | Issue 02 | February 2023
So Gideon and the hundred men who were with him came to
the outpost of the camp at the beginning of the middle watch,
just as they had posted the watch; and they blew the trumpets
and broke the pitchers that were in their hands. Then the three
companies blew the trumpets and broke the pitchers—they held
the torches in their left hands and the trumpets in their right
hands for blowing—and they cried, “The sword of the Lord and
of Gideon!” And every man stood in his place all around the
camp; and the whole army ran and cried out and fled. 22 When the
three hundred blew the trumpets, the Lord set every man’s sword
against his companion throughout the whole camp; and the army
fled to Beth Acacia, toward Zererah, as far as the border of Abel
Meholah, by Tabbath” (Judges 7:15-22).
When we look at the example of Gideon, we don’t see him at
any point trying to make his own decisions, yet he has plenty of
opportunity. He looks for the Lord’s decision, step by step until
the victory is achieved. The victory in our battles will be achieved
in a similar manner. When the Lord is in control of the battle,
when He is the decision maker, can there be any outcome but
victory?
If this is not our battle, we are required to surrender it, not try to
fight, not try to make our own decisions. Essentially, the Lord
steps in and says, “Stand down, I will take it from here.” We are
still participants in the battle, but we are not decision-makers.
This is the area I personally struggle with the most – truly
surrendering the decision-making to the Lord, getting out of the
way and simply standing ready to follow His next instruction.
The Most Important Questions
How do we know what to do? How do we know what our next
step is? How do we know what the Lord’s mind is in our particular
situation? How do we make sure that we have the Lord’s mind in
the battle, not our own? How do we make sure that we are simply
a vessel taking instruction from the Lord and not making our own
decisions with our natural minds? As mentioned earlier, there is
no room for the thinking of men and women in the Lord’s battle.
If it truly is the Lord’s battle, He makes the decisions.
How did Gideon know?
How did Gideon know what to do next? His instruction was to
divide into three companies, each with a trumpet, an empty pitcher
and a torch. This wouldn’t be a chapter in the army playbook.
What happened between Gideon and his servant sneaking down to
the camp of the enemy and getting confirmation that the opposing
army would be delivered into their hands – and the decision to
divide into 3 companies? The only insight we get in the Scripture
is in Judges 7:15 – “that he worshiped.”
Certainly, there was a great deal happening between Gideon and
the Lord in that phrase “that he worshiped.” Perhaps Gideon was
seeking the Lord with everything he had to know what the next
step was, knowing that he did not want to make his own decision,
knowing that it had to be from the Lord.
Once again, I will direct the reader to the May/June 2015 Sharon
Star article – How to Hear the Voice of God by Andy Snoke. A
few points from the article are presented below:
“The intent of this article is to look at a few ways in which God
speaks to us in this hour. If you believe that God is speaking
to you, I encourage you as a reader to be sure that God is also
Can a man or a woman hear God? If so, how does He speak? How
can we know that we are genuinely hearing from the Lord and
not from our own hearts? The answer is “yes.” God does speak to
His family. And there are ways in which we can learn to discern
His voice, over our own thoughts. God does want to speak to His
people. When the Lord does speak to us as individuals, it is most
often in more than one way. The Lord has a way of “confirming”
speaking in more than one method that will be outlined below.
Confirmation is important. Don’t look for just one avenue; look
for more than one.”
• God speaks through scripture
• God speaks directly to our heart and mind
• God speaks through godly counsel
• We can hear the voice of the Lord through the prophecies
that went before us as individuals
• God speaks through confirmation
• God speaks through circumstances and timing
• God speaks through His peace
• God speaks through the gifts of the Spirit
(and related ministries) operating in the body of Christ
As you read this article, please consider the battles that you
are facing with the desire to hear from the Lord as to what His
instruction is for you in your situation.
Our battles are many and it occurs to me that the Lord gives us a
choice. We can fight the battle on our own with our own thinking
and our own experience and our own decision-making ability, or
we can surrender the battle to the Lord and follow his instruction.
The Lord wants to fight our battles, will we let him? Will we step
aside, will we stand down and follow his instruction and obey
his voice? Will we decide to invest the time and energy to really
hear His voice to know what the Lord’s instruction is in this battle
each step of the way? We are very good at bringing our needs to
the Lord in prayer and to the local assembly for prayer – which
is exactly right. How good are we at really seeking the Lord to
determine what His decision is, what his instruction is, in our
individual circumstances?
Brothers and sisters, we want to get good at this. The path we are
on – the path God has for the many-membered body of Christ has
many battles to be fought and many enemies to be defeated. Each
one of these battles will be won and each enemy will yield to the
church of the living God. All of these things are within our grasp
if the battle is the Lord’s.
His Word and His ways through more than one avenue.

early in the morning and dread going to work if it is an inconvenient

“And thine ears shall hear a word behind thee, saying, This is the

I am sure that God has spoken to us on many occasions, but we

This comes with time and experience. “For every one that useth

by the door is the shepherd of the sheep. To him the porter openeth;

The Lord called young Samuel three times before he recognized that
it was the Lord speaking. “And ere the lamp of God went out in the

and went to Eli, and said, Here am I; for thou didst call me. And

unto him. And the Lord called Samuel again the third time. And
he arose and went to Eli, and said, Here am I; for thou didst call

that thou shalt say, Speak, Lord; for thy servant heareth. So Samuel
went and lay down in his place. And the Lord came, and stood, and
called as at other times, Samuel, Samuel. Then Samuel answered,

Let us all pray that the Lord will give us a greater sensitivity to hear
and discern His voice.
We can hear the voice of the Lord through the prophecies that went
