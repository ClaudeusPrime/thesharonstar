  { id: 1, articleText: `Volume LXXVIII | Issue 01 | January 2025 Donna and I spent a recent weekend in Ouray, Colorado, a charming little mountain town. Our room overlooked a stream that ran non stop. After coming from the hot desert it was refreshing to see endless fresh waters and cool weather. As we lay side by side taking a short rest after some hiking, I listened to the rushing stream and gave God thanks for this precious moment with my most beloved wife. It occurred to me that this stream has always been here, I just needed to come to it. As we have heard and know, there is a river of life flowing from the throne of God, but I would like to explore one of the sources of this life-giving river. The source is instruction by the Holy Spirit. Years ago, I ran a particularly awesome crane (Donna named it Towanda) for eight years straight. It was German-made with translated load charts in English and an operator’s manual that explained in detail every capability of the crane, and the operation of its very complex computer. I learned just enough to operate the crane safely and then just put my head down and went to work, 60 to 100 hours per week for 8 years. When I moved to a different job another operator began using Towanda and showed me how the computer will calculate the percentage of your load at the push of a button. There was much in the computer that would have made my hours less stressful and more enjoyable if I had taken the time to “follow all of the instructions” instead of just getting on with the basics. God gave us the gift of marriage and He sent that gift with an operator’s manual. We can just wing it and get by with the basics or we can apply God’s instructions and get the most out of our marriage. “Submit to one another out of reverence for Christ. Wives, submit yourselves to your own husbands as you do to the Lord. For the husband is the head of the wife as Christ is the head of the church, his body, of which he is the Savior. Now as the church submits to Christ, so also wives should submit to their husbands in everything. Husbands, love your wives, just as Christ loved the church and gave himself up for her to make her holy, cleansing her by the washing with water through the word, and to present her to himself as a radiant church, without stain or wrinkle or any other blemish, but holy and blameless. In this same way, husbands ought to love their wives as their own bodies. He who loves his wife loves himself. After all, no one ever hated his own body, but he feeds and cares for it, just as Christ does the church— for we are members of his body. ‘For this reason a man will leave his father and mother and be united to his wife, and the two

will become one flesh.’ This is a profound mystery—but I am talking about Christ and the church. However, each one of you also must love his wife as he loves himself, and the wife must respect her husband” (Ephesians 5:21-33, NIV). When we do something as simple as live life in the order God wrote in His operator’s manual, it pleases God. When husbands love their wives, it pleases God. When wives submit to and respect their husbands, it pleases God. Then there is verse 32, “This is a profound mystery—but I am talking about Christ and the church” (Ephesians 5:32, NIV). I think we all know this, but it is good to ponder it at times. When we exercise the proper order at home and in a marriage, we are practicing the order of the kingdom; the relationship between Christ and His church. What are some of those characteristics? • Fidelity, faithfulness: Honor and serve only one God and Savior. • Love, sacrifice: Christ already showed and has continued to show sacrificial love to his church. We need to practice the same love towards one another and towards Christ • Submission: To one another and to God and Christ. In a home there must be a head, in the church Christ must be the Head. • Become one: There is a time when a man leaves his mother and father and joins with his wife and they become one. They blend almost into one person. I think God recognizes them almost as one person. We must become like Christ, let Him mold us into His likeness, and then God will recognize us as one person, in Christ. “Husbands, in the same way be considerate as you live with your wives, and treat them with respect as the weaker partner and as heirs with you of the gracious gift of life, so that nothing will hinder your prayers” (1 Peter 3:7, NIV). God’s ways are always worth seeking out and following. Lewis and Clark, the leaders of the Corps of Discovery, set out in 1804 with a party of 45 souls to search out a navigable route across the western United States to the Pacific Ocean. At one stop they sent out a young man alone to hunt game to feed the group. The young man got lost and after searching for him for 3 days the group thought he had died and proceeded up the Missouri River. The young man eventually found his way back to the river bank, but the party was gone. He followed the river bank for 16 days looking for the boat until he was near starvation and sat on the bank hoping a boat would come by. He didn’t stop looking. He eventually found the group and helped them make history. This young man was diligently seeking out his salvation, which in his case was a boat and his group. It was worth giving his last ounce of energy for, and so are the ways of God to the believer. So what are some of these instructions or ways of God? First of all, I am not laying out anything new, just a few things God has instructed us in, to help us make the most of our lives. I would like to talk briefly on topics of: Marriage, Stewardship, Tithing, Work, and Prayer Marriage Between one man and one woman. It is a holy union. We have already read Ephesians 5:21-33. God has this particular order for marriage. The husband as a loving head is willing to sacrifice his life for his wife. He loves his wife as if she is his own flesh. The wife honors, respects, and submits to her husband. Some may disagree with this arrangement and some may choose to do it differently. That is every couple’s choice, but to make the most of a marriage, we must follow God’s instructions and order our home as God intended. Otherwise we are missing out. Stewardship “Each of you should use whatever gift you have received to serve others, as faithful stewards of God’s grace in its various forms” (1 Peter 4:10, NIV). “Let a man so account of us, as of the ministers of Christ, and stewards of the mysteries of God. Moreover it is required in stewards, that a man be found faithful” (1 Corinthians 4:1-2, KJV). God gives us many blessings. This is an abbreviated list of what God has given me, as an example. He has given me: a wife, children, home, job, car, spiritual gifts, health, finances, etc. and I am to take care of each of these things, and be faithful to what God has blessed me with. I think one of the evils or dangers of this world is the enticement to always be purchasing something more, better, newer, bigger. The world’s financial system thrives on people spending their finances on many non essential things. Banks pile up wealth off of credit card fees, especially late fees and high interest rates. We need to be good stewards of our finances. Just because a bank tells you that you can afford a new car or bigger house doesn’t mean it is wise to do so. Keep in mind that banks make money on financially enslaving you. Tithing Tithing is not an area to cut back on in your budget. We have learned and scripture bears it out, that tithing is entering into a business arrangement with God. It is far better than any stock on Wall Street. It usually doesn’t show up on your bank statement so it’s also tax free. Tithing works in different ways. Sometimes your refrigerator lasts for 40 years or maybe your car just won’t wear out. Your paycheck somehow goes farther, or your employer gives you lots of work or overtime. Many times these things work together with being obedient

in more than one discipline, like being a good steward and working those extra hours that your boss entrusts you with. “Will a man rob God? Yet ye have robbed me. But ye say, Wherein have we robbed thee? In tithes and offerings. Ye are cursed with a curse: for ye have robbed me, even this whole nation. Bring ye all the tithes into the storehouse, that there may be meat in mine house, and prove me now herewith, saith the LORD of hosts, if I will not open you the windows of heaven, and pour you out a blessing, that there shall not be room enough to receive it. And I will rebuke the devourer for your sakes, and he shall not destroy the fruits of your ground; neither shall your vine cast her fruit before the time in the field, saith the LORD of hosts. And all nations shall call you blessed: for ye shall be a delightsome land, saith the LORD of hosts” (Malachi 3:8-12, KJV). Work “Now we command you, brethren, in the name of our Lord Jesus Christ, that ye withdraw yourselves from every brother that walketh disorderly, and not after the tradition which he received of us. For yourselves know how ye ought to follow us: for we behaved not ourselves disorderly among you; neither did we eat any man’s bread for nought; but wrought with labour and travail night and day, that we might not be chargeable to any of you: not because we have not power, but to make ourselves an ensample unto you to follow us. For even when we were with you, this we commanded you, that if any would not work, neither should he eat. For we hear that there are some which walk among you disorderly, working not at all, but are busybodies. Now them that are such we command and exhort by our Lord Jesus Christ, that with quietness they work, and eat their own bread” (2 Thessalonians 3:6-12, KJV). “Whatever you do, work at it with all your heart, as working for the Lord, not for human masters” (Colossians 3:23, NIV). Solomon tried every pleasure under the sun to seek satisfaction and finally determined, “Behold that which I have seen: it is good and comely for one to eat and to drink, and to enjoy the good of all his labour that he taketh under the sun all the days of his life, which God giveth him: for it is his portion. Every man also to whom God hath given riches and wealth, and hath given him power to eat thereof, and to take his portion, and to rejoice in his labour; this is the gift of God. For he shall not much remember the days of his life; because God answereth him in the joy of his heart” (Ecclesiastes 5:18-20, KJV). “I denied myself nothing my eyes desired; I refused my heart no pleasure. My heart took delight in all my labor, and this was the reward for all my toil” (Ecclesiastes 2:10, NIV). Work or labor is a gift from God. If you have the health and ability to work, you are missing out if you don’t do it. George Washington Carver grew up a slave and lived through the abolition of slavery. During this period, labor was looked at as shameful by whites and blacks because it reminded them of the days of slavery. Only slaves labored. George Washington Carver opened schools to teach black communities labor skills that would make them employable, but the first obstacle was to change their mindset on the idea of physical labor. He taught that labor was not shameful but honorable. He was a scholar and teacher who was an advisor of numerous presidents, and the thing he took the most pride in was the fact that his son became an excellent brick maker. Prayer “And he spake a parable unto them to this end, that men ought always to pray, and not to faint; saying, There was in a city a judge, which feared not God, neither regarded man: and there was a widow in that city; and she came unto him, saying, Avenge me of mine adversary. And he would not for a while: but afterward he said within himself, Though I fear not God, nor regard man; yet because this widow troubleth me, I will avenge her, lest by her continual coming she weary me. And the Lord said, Hear what the unjust judge saith. And shall not God avenge his own elect, which cry day and night unto him, though he bear long with them? I tell you that he will avenge them speedily. Nevertheless when the Son of man cometh, shall he find faith on the earth” (Luke 18:1-8, KJV)? In my life, I have experienced different types of prayer. I have prayed urgently when I or a loved one was in immediate danger of health or injury. I have prayed under the anointing when I felt that I was speaking to God face to face. And I have prayed for the safety of my family and coworkers on a daily basis as a routine when I felt like it and when I didn’t. I have found that God is faithful in every instance. My daily prayer, after years and years would seem dry to any of you, and I am sure seems dry to Donna sometimes, but God is faithful in the dry season and in the rainy season, wet with his anointing. I see the effects of this daily prayer over time and can only compare it to a steady gentle breeze against the sail of a ship, not lurching, but continually moving the vessel in the desired direction. Don’t drop your sails; don’t give up on prayer. As a good Father, God does not leave his children unprepared. He gives us everything we need for a full and victorious life. “The thief cometh not, but for to steal, and to kill, and to destroy: I am come that they might have life, and that they might have it more abundantly” (John 10:10, KJV). Amen.

The Sharon Star is a monthly publication and mailed as a free-will offering plan. The articles within are intended for inspiration and information to those who are interested in the unfolding revelation of the Word of God. Published by: Global Missions Inc. in North Battleford, Saskatchewan, Canada. The Sharon Star is found online at: www.globalmissionsinc.org/sharon-star Publications Mail Agreement 40012206 Subscribe by mail or online. GLOBAL MISSIONS INC. Global Missions Inc. was founded in 1944, as a Christian mission to promote and encourage the preaching of the gospel to every creature. Global Missions reaches into many countries in Africa, India, the Caribbean, the United States of America, South America and the Philippines. These local churches are established on the foundational truths revealed in God’s word and through His unfolding revelation. Local churches are governed by local residents who are referred to as elders. Global Missions is a nondenominational Christian church. Headquarters: 802 Airport Road North Battleford, SK S9A 2Z3 Canada Mailing Address: P.O. Box 934 North Battleford, SK S9A 2Z3 Canada Telephone: (306) 445-2733 Email: info@globalmissionsinc.org Online: www.globalmissionsinc.org Traveling Ministry Contact List: www.globalmissionsinc.org/about Dickson Julius Olan’g - Our Good Brother Though we trust in the Lord’s perfect timing, saying goodbye to our dear brother weighs heavily on our hearts. He was cherished by all who had the privilege of knowing him and sharing in his company. Truly one of a kind, he had a way of captivating everyone around him with his warm smile and delightful sense of humor. His life was a reflection of Christ’s love. “Let your light shine before others, that they may see your good deeds and glorify your Father in heaven” (Matthew 5:16). Dickson Julius Olan’g (69) served faithfully as a Travelling Elder in Africa, ministering across East Africa (Kenya, Tanzania, and Uganda), Central Africa (DR Congo), and West Africa (Ghana), all while firmly rooted in his beloved Tanzania. Bro. Dickson made his home in Bunda, a picturesque town just a few miles from the Serengeti National Park and the shores of Lake Victoria. Under his devoted guidance, churches across Africa flourished. Though he suffered a serious injury many years ago that made walking difficult, he never hesitated to serve faithfully, travelling far and wide to visit local churches in each country. He often joked that he was “local wherever he went”—a Kenyan in Kenya, a Ugandan in Uganda. And, truth be told, he certainly made himself right at home, feeling like a member of each family he met along the way. We know the days ahead will be profoundly challenging, not only for his dear family, whom he loved so much, but also for the local churches across Africa, which he served with unwavering dedication. We humbly ask God to bless and look after his wife, Margareth, his children, and his grandchildren. Bro. Dickson loved the Lord, and the Lord loved him. He has now received his heavenly reward. We look forward to meeting him again in those Elysian fields, but until that day, he will be greatly missed. “Lakini Bwana alisimama pamoja nami na kunitia nguvu, ili kupitia kazi yangu, ujumbe wake utangazwe kikamilifu na kusikika na Mataifa yote; nami nikaokolewa katika kinywa cha simba. Bwana ataniokoa kutoka kwa kila neno baya na kunihifadhi hadi nifike katika ufalme wake wa mbinguni. Utukufu una Yeye milele na milele. Amina” (2 Timotheo 4:17-18). “But the Lord stood with me and strengthened me, so that through my work, His message might be fully proclaimed, and all the nations might hear it; and I was rescued from the lion’s mouth. The Lord will rescue me from every evil deed and bring me safely into His heavenly kingdom. To Him be the glory forever and ever. Amen” (2 Timothy 4:17-18). Tunakupenda ndugu mpendwa. Bwana asifiwe. ~ The Brethren`, subtitle: "In Memoriam: Dickson Julius Olan'g", author: 'Brandon Snoke', year: 2025, month: 'January', volume: 'Vol. LXXVIII, No. 01', title: 'Practical Advice from the Bible', topics: ['Marriage & Family','Scripture','Prayer'], excerpt: "Brandon Snoke draws on a weekend in Ouray, Colorado to reflect on marriage as a gift from God with an operator's manual in Ephesians 5. The issue covers biblical instruction on marriage, stewardship, tithing, work, and prayer. Also features a tribute to Travelling Elder Dickson Julius Olan'g of Tanzania, who served faithfully across East, Central, and West Africa until his passing.", pdf: '01%20-%20Sharon%20Star%20-%20January%202025.pdf', fileName: '01_-_Sharon_Star_-_January_2025.pdf'  },
  { id: 2, articleText: `Volume LXXVIII | Issue 02 | Februray 2025 “For our citizenship is in heaven, from which we also eagerly wait for the Savior, the Lord Jesus Christ” (Philippians 3:20, NKJV). Dr. Ryrie comments as follows regarding the verse above: “Paul wants the church in Philippi to beware of “enemies of the cross of Christ” (Philippians 3:17-19), whose end is final judgment. By contrast, “our citizenship is in heaven” (v. 20). Philippi, a city in Macedonia, many miles from Rome, enjoyed the status of a Roman colony, including privileges of Roman citizenship. Even as the Philippians, far from Rome, had Roman citizenship, so believers, far from heaven, hold citizenship there.” I appreciate this short commentary on this verse. Philippi, located in Greece, was made up of a Roman colony, and many now believed in Christ. They enjoyed the benefits of Roman citizenship as they were a colony of Rome, although Rome was far, far away. They politically belonged to a country that they did not live in—that is, Rome. They lived in Philippi, but they were citizens of Rome. They lived and died by the laws of Rome. They followed the laws and traditions of Rome. They lived on the “bread” of Rome, though Rome was far away. It was appropriate for Paul to remind the Philippians that they had citizenship from “another country,” from heaven. They were familiar with the concept of belonging to a country and the government of a land they did not live in. When Paul mentioned that their citizenship was in heaven, it must have made immediate sense to them. It was not a foreign concept. They lived and breathed in Philippi, but they learned that they lived and died according to the truths, norms, and life that come from heaven. Their life came from Jesus Christ, not the bread of Rome, but the bread of heaven. Their salvation and forgiveness came from the blood of the cross. They had a new citizenship—an eternal citizenship that could not be ended by death.They were not part of this world, for their citizenship was in heaven. Before this verse, Paul warns Philippi about false teachers. It is believed that Paul is most likely speaking against a false teaching noted as “Libertine,” which was essentially the: 1. Discarding moral laws. 2. Trusting their human wisdom. 3. Denying the transforming power of the Gospel. 4. Saving themselves by following their own laws (legalism). Theseinsidious,cancerousdoctrineshavecreptintothechurchthroughout the ages in one form or another. As with the church in Philippi, we must stand on guard today against these dangers. Paul notes that, “whose end is destruction, whose god is their belly, and whose glory is in their shame—who set their mind on earthly things” (Philippians 3:19, NKJV). This reference is for those whose lives have become completely earthly and sensual. Their happiness is based on what they can see, eat, taste, do, and possess. Those “whose god is their belly” are those who have made the “world” their citizenship, who have set their minds on earthly things.

Let me print the entire text for reference, “Brethren, join in following my example, and note those who so walk, as you have us for a pattern. For many walk, of whom I have told you often, and now tell you even weeping, that they are the enemies of the cross of Christ: whose end is destruction, whose god is their belly, and whose glory is in their shame—who set their mind on earthly things. For our citizenship is in heaven, from which we also eagerly wait for the Savior, the Lord Jesus Christ, who will transform our lowly body that it may be conformed to His glorious body, according to the working by which He is able even to subdue all things to Himself” (Philippians 3:17-21, NKJV). By contrast, we are to place our affections and thoughts on our new citizenship in heaven, not on earth. “If then you were raised with Christ, seek those things which are above, where Christ is, sitting at the right hand of God. 2 Set your mind on things above, not on things on the earth” (Colossians 3:1-2, NKJV). Paul does not leave us “hanging” but gives us good practical advice on how people that are “citizens of heaven” should spend their time thinking and acting.That is one of the things I appreciate about the Scriptures; it gives much practical advice on how to live. “Rejoice in the Lord always. Again I will say, rejoice! Let your gentleness be known to all men. The Lord is at hand. Be anxious for nothing, but in everything by prayer and supplication, with thanksgiving, let your requests be made known to God; and the peace of God, which surpasses all understanding, will guard your hearts and minds through Christ Jesus. Meditate on These Things. Finally, brethren, whatever things are true, whatever things are noble, whatever things are just, whatever things are pure, whatever things are lovely, whatever things are of good report, if there is any virtue and if there is anything praiseworthy—meditate on these things” (Philippians 4:4-8, NKJV). In writing to the Colossians, Paul also offers much practical advice on thinking and living. We would do well to take our time, read these slowly, and apply them to our daily lives. “If then you were raised with Christ, seek those things which are above, where Christ is, sitting at the right hand of God. Set your mind on things above, not on things on the earth. For you died, and your life is hidden with Christ in God. When Christ who is our life appears, then you also will appear with Him in glory. Therefore put to death your members which are on the earth: fornication, uncleanness, passion, evil desire, and covetousness, which is idolatry. Because of these things the wrath of God is coming upon the sons of disobedience, in which you yourselves once walked when you lived in them. But now you yourselves are to put off all these: anger, wrath, malice, blasphemy, filthy language out of your mouth. Do not lie to one another, since you have put off the old man with his deeds, and have put on the new man who is renewed in knowledge according to the image of Him who created him, where there is neither Greek nor Jew, circumcised nor uncircumcised, barbarian, Scythian, slave nor free, but Christ is all and in all. Character of the New Man. Therefore, as the elect of God, holy and beloved, put on tender mercies, kindness, humility, meekness, longsuffering; bearing with one another, and forgiving one another, if anyone has a complaint against another; even as Christ forgave you, so you also must do. But above all these things put on love, which is the bond of perfection. And let the peace of God rule in your hearts, to which also you were called in one body; and be thankful. Let the word of Christ dwell in you richly in all wisdom, teaching and admonishing one another in psalms and hymns and spiritual songs, singing with grace in your hearts to the Lord. And whatever you do in word or deed, do all in the name of the Lord Jesus, giving thanks to God the Father through Him” (Colossians 3:1-17, NKJV). Letter to Diognetus The pages of history tell us that the early Christians indeed left a testimony of living their lives as if citizens of heaven, as Paul exhorts. This famous work of literature, dated about the 2nd or 3rd century, was written by an unknown author to a person named Diognetus. Diognetus, most likely a pagan dignitary, appeared to want to know more about the peculiar life habits of these so-called “Christians” as they were so unique. This fascinating piece of literature by this unknown author captured how these early Christians lived in the world but not of the world. This manuscript survived until it was destroyed in a fire in 1870 in Strasbourg. Remember, the following writing is from the second century and discusses the life of Christians. “Christians are indistinguishable from other men, neither by nationality, language, or customs. They do not inhabit separate cities of their own or speak a strange dialect, or follow some outlandish way of life. Their teaching is not based upon reveries inspired by the curiosity of men. Unlike some other people, they champion no purely human doctrine. About dress, food and manner of life in general, they follow the customs of whatever city they happen to be living in, whether it is Greek or foreign. And yet, there is something extraordinary about their lives. They live in their own countries as though they are only passing through. They play their full role as citizens but labor under all the disabilities of aliens. Any country can be their homeland, but their homeland, wherever it may be, is a foreign country. Like others, they marry and have children, but they do not expose them. They share meals, but not their wives. They live in the flesh, but they are not governed by the desires of the flesh. They pass their days upon earth, but they are citizens of heaven. Obedient to the laws, yet they live on a level that transcends the law. Christians love all men, but all men persecute them; condemned because they are not understood, they are put to death but raised to life again. They live in poverty but enrich many; they are totally destitute but possess an abundance of everything. They suffer dishonor, but that is their glory. They are defamed but vindicated. A blessing is their answer to abuse, and deference is their response to insult. For the good they do they receive the punishment of malefactors, but even then, they rejoice, as though receiving the gift of life. They are attacked by the Jews as aliens, they are persecuted by the Greeks, yet no one can explain the reason for the hatred. To speak in general terms, we may say that the Christian is to the world what the soul is to the body. As the soul is present in every part of the body, while remaining distinct from it, so Christians are found in all the cities of the world, but cannot be identified with the world. As the visible body contained the invisible soul, so Christians are seen living in the world, but their religious life remains unseen. The body hates the soul and wars against it, not because of any injury the soul has done it, but because of the restriction the soul places on its pleasures. Similarly, the world hates the Christians, not because they have done it any wrong, but because they are opposed to its enjoyment. Christians love those who hate them just as the soul loves the body and all its members despite the body’s hatred. The soul, though immortal, has a mortal dwelling place; and Christians also live for a time amidst perishable things, while awaiting the freedoms from change and decay that will be theirs in heaven.” We would all do well as a society if we shared the same testimony that this second-century eyewitness recorded in his letter to Diognetus. The Bible is full of admonitions that we should not fall in love with the world, which simply means the cosmos or the world system. We must fall in love with heaven and live as citizens of heaven.

“Do not love the world or the things in the world. If anyone loves the world, the love of the Father is not in him. For all that is in the world—the lust of the flesh, the lust of the eyes, and the pride of life—is not of the Father but is of the world. And the world is passing away, and the lust of it; but he who does the will of God abides forever” (1 John 2:15-17, NKJV). A soul needs to be careful about opening the door to sin. Don’t open the door of lust, even a crack! I like the lyrics of a well-known song, Sin Will Take You Farther by The Cathedrals, the chorus warns, “Sin will take you farther than you want to go, Slowly, but wholly, taking control, Sin will leave you longer than you want to stay, Sin will cost you far more than you want to pay.” What can we do to avoid sin? The answer is as simple as the lyrics of a child’s song: Oh, be careful little eyes what you see, Oh, be careful little eyes what you see, For the Father up above is looking down in love, So be careful little eyes what you see. Oh, be careful little ears what you hear. Oh, be careful little tongue what you say. Oh, be careful little hands what you do. Oh, be careful little feet where you go. Oh, be careful little heart whom you trust. Oh, be careful little mind what you think. — Unknown Let us all strive to live as citizens of heaven! “Break me and melt me till I’m nothing. Mold me and shape me till I’m something. Then take me and use me for your glory, Until all that I am is YOU.” I wish to use a term that businesses seem to have adopted over the last few years. It has become a guiding factor in their hiring processes: ‘Fit for purpose.’ According to the English dictionary, it means that one is wellequipped or well-suited for its designated role or purpose. Today, companies are using this term more and more, perhaps because in the past they hired persons who may have seemed to have the right qualifications but did not necessarily have the right skills or attitude for the job. Many companies have grappled with this issue and have decided to not necessarily ask much about one’s work experience. Instead, when conducting interviews for recruiting new personnel they want to know more about you as a person; who you are, and what you represent. You would be amazed to learn some of the reasons why certain people were not selected for a job, even though they were fully qualified academically. Before I continue, I wish to clearly state that God does not make mistakes. Once you are called of God, we are ‘fit for purpose.’ Romans 8:30, “Moreover whom He did predestinate, them He also called: and whom He called: them He also justified: and whom He justified, them He also glorified” (KJV). I wish to add another caveat here: Romans 11:29, “For God’s gifts and His call are irrevocable” (NIV). John 17:22, “I have given them the glory that You gave Me, that they may be one as We are one” (NIV). What Jesus Christ did through His death and resurrection is to put us in right standing with God. Hallelujah! However, we can disqualify ourselves from being ‘fit for purpose’ when we allow other spirits to influence our hearts instead of just the Holy Spirit. I take notice of the fact that companies are now making a full turnaround, coming back to the basic tenets of employees having a heart in what they are doing, and not just making it a job. We, ourselves, can become slaves to church—just making sure that we attend all the Sunday morning services, but not truly recognizing the full extent of where God wants to take us. We may not fully let go and let God. “Having a form of godliness, but denying the power thereof” (2 Timothy 3:5, KJV). When the apostle Paul wrote in 1 Corinthians 11:29 of people not discerning the Lord’s body as it relates to partaking in communion, he was indicating that when we partake unworthily, we do not fully understand why Jesus Christ was crucified, and that can be another message in itself. Glory be to God! Romans 14:17, “For the kingdom of God is not meat and drink; but righteousness, peace, and joy in the Holy Ghost” (KJV). I thank God that in His kingdom we are no longer under the law which means we must work to gain God’s approval and acceptance by keeping all the points of the law. Rather we are under grace which means God has put His laws in our heart through the indwelling of His Holy Spirit who enables us by His grace to fulfil the righteous requirements of the law as we walk by His leading. In Romans 12:1-2, our brother Paul appeals to our sense of spiritual reasoning: “I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service. And be not conformed to this world: but be ye

The Sharon Star is a monthly publication and mailed as a free-will offering plan. The articles within are intended for inspiration and information to those who are interested in the unfolding revelation of the Word of God. Published by: Global Missions Inc. in North Battleford, Saskatchewan, Canada. The Sharon Star is found online at: www.globalmissionsinc.org/sharon-star Publications Mail Agreement 40012206 Subscribe by mail or online. GLOBAL MISSIONS INC. Global Missions Inc. was founded in 1944, as a Christian mission to promote and encourage the preaching of the gospel to every creature. Global Missions reaches into many countries in Africa, India, the Caribbean, the United States of America, South America and the Philippines. These local churches are established on the foundational truths revealed in God’s word and through His unfolding revelation. Local churches are governed by local residents who are referred to as elders. Global Missions is a nondenominational Christian church. Headquarters: 802 Airport Road North Battleford, SK S9A 2Z3 Canada Mailing Address: P.O. Box 934 North Battleford, SK S9A 2Z3 Canada Telephone: (306) 445-2733 Email: info@globalmissionsinc.org Online: www.globalmissionsinc.org Traveling Ministry Contact List: www.globalmissionsinc.org/about transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect will of God” (KJV). You see, saints, God is the one who calls His elect. Matthew 22:14 says, “For many are called, but few are chosen.” (KJV). You, me, and the many others whom God has called are the chosen of God. Once we are called of God and citizens of the kingdom, we are living stones. 1 Peter 2:5 (KJV), “Ye also, as lively stones, are built up a spiritual house, an holy priesthood, to offer up spiritual sacrifices, acceptable to God by Jesus Christ” (approved by Jesus Christ). “There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit” (Romans 8:1). Over the years, many of us have had hands laid upon us by the presbytery and various ministries, confirming and sometimes highlighting our gifts and ministries. 1 Corinthians 12 provides us with an understanding of our spiritual gifts and highlights that there are diversities of gifts. In 2 Timothy 1:6, we are encouraged to stir up the gift of God within us. 1 Timothy 4:14, “Neglect not the gift that is in thee, which was given thee by prophecy, with the laying on of hands of the presbytery” (KJV). All of these gifts make up the whole spiritual being that God wants to use in tremendous ways to perform His works here on earth. So the phrase ‘fit for purpose’ came about as a new approach taken by companies to have the right person on board to contribute to the development of the goals of that particular company. However, it is very important to note that the company must first decide what its long-term goals are and how they plan to achieve them. In the kingdom of God, we already know our goal: to walk by God’s Holy Spirit at all times—in other words, to walk softly and circumspectly with God. Romans 8:14 says, “For as many as are led by the Spirit of God, they are the sons of God” (KJV). So I thank Almighty God that we are a people led by His Holy Spirit, and as we develop our gifts and ministries, we are then fitted by God into the place where He desires us to contribute to His kingdom. Proverbs 18:16 tells us, “A man’s gift makes room for him, and brings him before great men” (NKJV). Although this is not our aim, the wonderful God we serve allows us to achieve earthly accomplishments that can only be possible through heavenly intervention. In other words, once we remain under the grace of God and allow our gifts and ministries to develop, we too will be amazed at where God takes us. And it’s not because this is our focus, but like our brother Paul, we continue to “press toward the mark for the prize of the high calling of God in Christ Jesus” (Philippians 3:14, KJV). Our focus is not on worldly things; it is on God. There’s a part of a song that says, “Of things I’ve had my fill, but yet I hunger still for more of You.” Yes, brethren, there must always be a yearning and a hunger for more of God. We must continue to strive for the excellency that is in Christ Jesus. Philippians 3:8, “Yea doubtless, and I count all things but loss for the excellency of the knowledge of Christ Jesus my Lord: for whom I have suffered the loss of all things, and do count them but dung, that I may win Christ” (KJV). In conclusion: Being ‘fit for purpose’ simply means walking by God’s Holy Spirit, which is also by faith. We are all a part of that wonderful building built without hands. To use a line from a song our brother Crafton Lewis sang: “Every stone is fitted in its proper place, not determined by you or me, but fitted by His grace.” My Lord! What a wonderful place to be, knowing that we are making ourselves available to God, with the help of His Holy Spirit, so that He can make us all individually and collectively ‘fit for purpose’. God is so good. God bless you all.`, subtitle: 'Fit for Purpose: Junior Thompson', author: 'Andy Snoke', year: 2025, month: 'February', volume: 'Vol. LXXVIII, No. 02', title: 'Citizens of Heaven', topics: ['Scripture','Discipleship','Holy Spirit'], excerpt: "Andy Snoke explores Philippians 3:20 — our citizenship is in heaven — drawing on the Roman colony of Philippi as a model for living as heavenly citizens on earth. Junior Thompson adds a message on being Fit for Purpose, examining how God calls and equips believers through the Holy Spirit, spiritual gifts, and grace. Includes the Letter to Diognetus from the 2nd century describing early Christian life.", pdf: '02%20-%20Sharon%20Star%20-%20February%202025.pdf', fileName: '02_-_Sharon_Star_-_February_2025.pdf'  },
  { id: 3, articleText: `Volume LXXVIII | Issue 03 | March 2025 All scriptures are derived from the King James Version of the Bible unless otherwise noted. Young people, my heart goes out to each one of you in love. Your friends or even your own reasoning may tell you, “There is no God!” Some say, “There are many gods.” Some question whether the Bible is just another storybook and not reliable. Further, how can someone die and then come back to life, as is claimed of Jesus in the Bible? Or you might presume that all religions have equally valid proofs or that Satan and the Holy Spirit are not real entities. Please consider what I am writing: there are many convincing proofs for the God of the Bible. Why is it important to have proof of God’s existence? 1. Surveys have shown that in recent times, many young people across all Christian churches have fallen away from their belief in God and Jesus and are not living a Christ-like life. These young people often don’t believe Jesus is the Son of the one true God, believe all faiths teach equally valid truths, don’t believe Jesus rose from the dead, and do not believe that Satan or the Holy Spirit are real entities. The surveys found that the reasons young people (those in school, university, and careers) stopped believing in God and Jesus— though varied—mostly hinged on rationalizing that the Bible was just another story like Santa Claus or the Easter Bunny. They also questioned how a dead person could come back to life. Other reasons included being offended by another believer or having a disagreement with a doctrine. Sadly, one consequence of some young Christians falling away has been a loss of distinction between professing Christians and non-Christians in basic conduct, such as lying, stealing, or cheating (e.g., on tests). I referred to the following books for my information: The Last Christian Generation by Josh McDowell and David H. Bellis and So the Next Generation Will Know by Sean McDowell and J. Warner Wallace. 2. Knowing there is proof of God’s existence can help us when Satan tries to use every trick possible to take us away from God. The enemy wants to blind us to God’s love, truth, grace, righteousness, forgiveness of sin as we forgive others, His goodness, wisdom, and everything else that God is. The enemy will try to lure us into any sin, whether small or big, when we rely on our own natural reasoning, opinions, fleshly desires, or worldly attitudes. This is often called worldliness. What we need is godliness. We need to trust Him. We need voluntary obedience and the reasoning that comes from God. 3. Knowing that God exists can help you realize that the use of recreational drugs, alcohol, smoking, premarital sex, and pornography will harm you physically, mentally, and spiritually. Without God, one may even come to the point of considering suicide. 1 Corinthians 6:19-20, “What? Know ye not that your body is the temple of the Holy Ghost which is in you, which ye have of God, and ye are not your own? For ye are bought with a price: therefore, glorify God in your body, and in your spirit, which are God’s.” 1 Thessalonians 4:3 (NIV), “It is God’s will that you be sanctified: that you should avoid sexual immorality.” If anyone has done wrong, they should repent and ask God’s forgiveness and make changes with the help of the Holy Spirit. Leaders of the young people and, in fact, all leaders must be good examples; this is critical. I am so very, very thankful to God that we have been taught these things in the church, a place where every young person needs to be. 4. Knowing God exists helps in everything. In this world that we live

in, judges others, criticizes others, and is always trying to persuade others to adopt worldly opinions. There is one important way to tell the difference between right and wrong, which includes knowing the qualities we should have and the ones we shouldn’t and to know how to think, speak and what to do. We learn to discern between right and wrong by the guidance of the Holy Spirit. The Holy Spirit helps us with every possible work and life situation. This is very important. We should be very thankful for the Holy Spirit. The older I get, the more I see how the Holy Spirit helps and how we need Him more and more. 5. Knowing God exists helps us to examine ourselves. Psalm 26:2, “Examine me, O Lord, and prove me; try my reins and my heart.” 1 Corinthians 11:28, “But let a man examine himself, and so let him eat of that bread, and drink of that cup.” 6. Knowing God exists is wonderful, but whenever doubts come, think of the many convincing proofs that can help you restore your faith. What follows are some of the convincing proofs Witnesses to the resurrection of Jesus Christ: Acts 1:3 “To whom also he shewed himself alive after his passion by many infallible proofs, being seen of them forty days, and speaking of the things pertaining to the kingdom of God:” The NIV version of the Bible says, “many convincing proofs.” Read Acts chapters 1 and 2 to get the context of the number of people involved. 1 Corinthians 15:5-8 “And he was seen of Cephas, then of the twelve. After that he was seen of above 500 brethren at once; of whom the greater part remain until this present, but some are fallen asleep (have died). After that he was seen of James; then of all the apostles. And last of all he was seen of me also, as of one born out of due time.” I find it absolutely amazing that Luke, in Acts 1:3, explains about these convincing proofs and then this is verified by Paul as he explains in 1 Corinthians 15:6 about the 500 plus people who saw Jesus again after His resurrection. This should help us see the reality that Jesus did rise from the dead and that God exists. 1 Corinthians 15:1 “Now if Christ be preached that he rose from the dead, how say some among you that there is no resurrection of the dead?” Paul teaches that a person can die and be resurrected because of Jesus. He teaches that this is the crux of the matter. Many young people do not understand how a person who is truly dead can come back to life. Paul fully explains this, so please read all the rest of chapter 15. Isaiah 46:9 When you are convinced that God exists and that He inspired the Bible, then know what God says about Himself in Isaiah 46:9, “Remember the former things of old, for I am God, and there is none else; I am God, and there is none like me.” Based on this, we know there is only one God and not hundreds as in some religions. God’s Crime Scene by J. Warner Wallace I taught forensic science in middle school. Forensics includes investigating a crime, such as solving who committed a murder. I brought a detective into my class to explain how these cases are solved. She gave an example of one of many methods—how even a tiny fragment of a person’s clothing found on a wall can help identify the criminal.   J. Warner Wallace is one of the best cold-case detectives in the U.S.A cold-case detective investigates crimes where the perpetrator has not been found for many years, and the case has gone cold. For example, in our area near the Canadian city of Calgary, a murderer was recently identified after 47 years!   J. Warner Wallace was an atheist, as was his father. However, his mother died when he was young, and his father remarried a Mormon woman with six children. They tried to convince him of their faith, but he decided to read the Bible for himself. He examined the death of Jesus as a crime scene and the record of Jesus’ resurrection. He was about to change his mind completely.   J. Warner Wallace analyzed the evidence in all four Gospels (Matthew, Mark, Luke, and John). He also studied the lives of Paul and others, as well as historical records documenting Jesus’ death. As an expert in cross-examining suspects, he applied his detective skills to the case of Jesus’ resurrection. When he concluded that Jesus did rise from the dead, he became a Christian.   J. Warner Wallace explains his detective work in a clear, step-by-step manner. Of all the facts he discovered, he highlights one in particular that proves Jesus rose from the dead. John 19:34, “But one of the soldiers with a spear pierced his side, and forthwith came there out blood and water.” The reference to “water” puzzled him at first, but as a detective with extensive experience examining dead bodies, he recognized this as medical confirmation of death. He concluded that, while others may have good reasons for believing in Jesus, he accepts it as true based on his understanding of the facts as described by eyewitnesses. This evidence proves Jesus was dead when placed in the tomb, and the testimony of over 500 eyewitnesses to His being alive days later provides compelling proof of His resurrection. Convincing evidence from my own heart and life When I read the Scriptures as a young boy about 11 years old, I felt Jesus has to be true because of His great wisdom. When people tried to trap Him so that He could be in big trouble if He took one side or another, He had a perfectly wise answer. For example, in Luke 20:22 (NIV), Jesus was asked “Is it right to pay taxes to Caesar or not?” Since many Jews hated the Romans but the Romans made the law, depending on how Jesus answered, He could be hated and be in trouble with either the Jewish leaders or the Romans. He answered, after being shown a coin of Caesar’s, in verse 25, “Then give back to Caesar what is Caesar’s, and to God what is God’s.” When I see any part of God’s creation, I know God is real. I sense His role in how with specific and incredible detail He has designed creation from the microscopic to the stars. Man studies many aspects of the creation and has only begun to understand how incredible it is. Romans 1:20 speaks of the creation as proof of God’s existence. “For the invisible things of him from the creation of the world are clearly seen, being understood by the things that are made, even his eternal power and Godhead; so they are without excuse.” John 15:13-14 states, “Greater love hath no man than this, that a man lay down his life for his friends. You are my friends, if you do whatsoever I command you.” To me it is incredible that someone would die for me. For me, this is convincing proof. When I try to think honestly, if I would die for someone else, I might die for someone I love very much or who is close to me, or possibly some very good person; but I would find it hard to die for someone who is evil. However, Jesus, incredibly, died for everyone who has lived or ever will live. Jesus died for my sins and for the sins of each person in the world. Our response should be to love Jesus and serve Him and love others because of all he has done for us. A summary would be Luke 10:27, “... love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind; and thy neighbour as thyself.” To top it off, he offers us everlasting life. John 3:16, “For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.” I heard of two mountain climbers at the top of a mountain who ended up in a situation where after the next step they knew only one would live. One person gave up his life for the other. Paul in Romans 5:7-8, explains this. “For scarcely for a righteous man will one die: yet peradventure for a good man some would even dare to die. But God commendeth his love towards us, in that, while we were yet sinners, Christ died for us.” We need to trust and believe in this loving God who gave us His Son to die for our sins and who can forgive our sins in this life and who gives us hope for the life to come. It is okay to talk to God about our sinful condition. Isaiah 1:18, “Come now, and let us reason together, saith the Lord: though your sins be as scarlet, they shall be as white as snow; though they be red like crimson, they shall be as wool.” Other Proofs 1. There are over 300 scriptures from the Old Testament prophesying about Jesus that were fulfilled in the New Testament. (Refer to All the Messianic Prophecies of the Bible by Herbert Lockyer

and New Testament Fulfilment of Old Testament Prophecies by Abram Abraham). These include prophecies of His pre-existence, His having a forerunner, about his lineage, birth, character (as a judge, prophet, priest, king and more), His ministry, dual nature, His entrance to the temple, entrance to Jerusalem, His death, resurrection, ascension, and exaltation. 2. An outstanding fact distinguishing Christ from all others is that He is the one man in the history of the world of whom explicit details of His birth, life, death, and resurrection were given centuries beforehand! 3. An incredible mathematical probability occurs that can build our faith. (Reference is Evidence That Demands a Verdict by Josh and Sean McDowell, 2017). If only eight prophecies of the Old Testament were fulfilled in the New Testament (born in Bethlehem; preceded by a messenger (John, the Baptist); entered Jerusalem on a donkey; betrayed by a friend; hands and feet pierced; betrayed by 30 pieces of silver with the money thrown into the house of God and used to buy a potter’s field; silent before his accusers; He would die accounted among criminals) are examined, that probability of being wrong would be the fraction with a numerator of 1 over a denominator of 10 to the power of 17, which is 1 with 17 zeros after! Only an omniscient (all knowing) God could inspire the writing of these prophecies! 4. If only 48 of the over 300 prophecies were chosen, the probability of it being wrong would be 1 over 10 to the power of 157, which is 1 with 157 zeroes after! Only God could inspire the writing of these prophecies! Conclusion I have only provided a small portion of the evidence for the existence of God, His love for us, the death and resurrection of His Son to purchase our redemption and to provide hope for the future. Taking time to be alone and quiet, reading the Bible and praying, is very valuable to get to know who God really is. Lord, I pray that all young people everywhere will know that you, God, are real, that You are the only true God, that they will know that the Bible is true and reliable. I pray that they will know that Jesus did die and came alive again, forgiving our sins if we turn to Him with all of our heart, asking forgiveness, and that they purpose to walk in His ways. May each person know that Jesus wants a loving, close relationship with each one of us, wants us to have His truth, and wants us to live a life like Jesus. May the truths of the Bible and the Holy Spirit lead each of us. In the precious name of Jesus, Amen. Like the words on page 39 in the Songs We Love songbook:   “God will take care of you,   Thru ev’ry day,   O’er all the way;   He will take care of you.   God will take care of you” — Civilla D. Martin These words have been impressed on my heart for years. Growing up, I don’t remember singing this song, but much later in my life, this song has become very real to me.   My family and I moved from Toronto to London, Ontario, so I could start a new job. We enjoyed Toronto, but we were ready for the next phase in our lives. We had two young kids, and we bought a house in our new city.   My work in London started off well but was a little bumpy as I transitioned to assist on a new project. After five months in my new job, I was “let go” unexpectedly. This shocked me.   Thankfully, this news was tempered by the words the Lord spoke to me that day. As I sat on our couch in the living room, He said, “I will take care of you.” That was almost 15 years ago now, and God has certainly taken care of my family and me!   Just recently, I was reminded of this promise that God made to us and how He has been faithful in fulfilling it. I know that this promise is for all of God’s people.   There are many scriptures that confirm His promise to take care of us. I will share some of them below. Instead of adding my commentary, I hope and pray that the Holy Spirit will minister to you as you read them. I recommend reading each passage slowly and then reflecting on it before proceeding to the next passage of scripture. I have learned that I often get much more out of scriptures when I take more time to read and think about them.   Psalm 121:1-8: “I will lift up my eyes to the hills—   From whence comes my help?   My help comes from the LORD,   Who made heaven and earth.   He will not allow your foot to be moved;   He who keeps you will not slumber.   Behold, He who keeps Israel   Shall neither slumber nor sleep.   The LORD is your keeper;   The LORD is your shade at your right hand.   The sun shall not strike you by day,   Nor the moon by night.   The LORD shall preserve you from all evil;   He shall preserve your soul.   The LORD shall preserve your going out and your coming in   From this time forth, and even forevermore.” Psalm 91:1-6: “He who dwells in the secret place of the Most High  

The Sharon Star is a monthly publication and mailed as a free-will offering plan. The articles within are intended for inspiration and information to those who are interested in the unfolding revelation of the Word of God. Published by: Global Missions Inc. in North Battleford, Saskatchewan, Canada. The Sharon Star is found online at: www.globalmissionsinc.org/sharon-star Publications Mail Agreement 40012206 Subscribe by mail or online. GLOBAL MISSIONS INC. Global Missions Inc. was founded in 1944, as a Christian mission to promote and encourage the preaching of the gospel to every creature. Global Missions reaches into many countries in Africa, India, the Caribbean, the United States of America, South America and the Philippines. These local churches are established on the foundational truths revealed in God’s word and through His unfolding revelation. Local churches are governed by local residents who are referred to as elders. Global Missions is a nondenominational Christian church. Headquarters: 802 Airport Road North Battleford, SK S9A 2Z3 Canada Mailing Address: P.O. Box 934 North Battleford, SK S9A 2Z3 Canada Telephone: (306) 445-2733 Email: info@globalmissionsinc.org Online: www.globalmissionsinc.org Traveling Ministry Contact List: www.globalmissionsinc.org/about Shall abide under the shadow of the Almighty.   I will say of the LORD, ‘He is my refuge and my fortress;   My God, in Him I will trust.’   Surely He shall deliver you from the snare of the fowler   And from the perilous pestilence.   He shall cover you with His feathers,   And under His wings you shall take refuge;   His truth shall be your shield and buckler.   You shall not be afraid of the terror by night,   Nor of the arrow that flies by day,   Nor of the pestilence that walks in darkness,   Nor of the destruction that lays waste at noonday.” Psalm 23:1, 4 & 6: “The LORD is my shepherd;   I shall not want.   Yea, though I walk through the valley of the shadow of death,   I will fear no evil;   For You are with me;   Your rod and Your staff, they comfort me.   Surely goodness and mercy shall follow me   All the days of my life;   And I will dwell in the house of the LORD   Forever.” Philippians 4:19: “And my God shall supply all your need according to His riches in glory by Christ Jesus.” Hebrews 13:5: “Let your conduct be without covetousness; be content with such things as you have. For He Himself has said, ‘I will never leave you nor forsake you.’” Isaiah 41:10: “Fear not, for I am with you; Be not dismayed, for I am your God. I will strengthen you, Yes, I will help you, I will uphold you with My righteous right hand.” Isaiah 43:1-2: “But now, thus says the LORD, who created you, O Jacob, And He who formed you, O Israel: ‘Fear not, for I have redeemed you; I have called you by your name; You are Mine. When you pass through the waters, I will be with you; And through the rivers, they shall not overflow you. When you walk through the fire, you shall not be burned, Nor shall the flame scorch you.’” 1 Peter 5:6-7: “Therefore humble yourselves under the mighty hand of God, that He may exalt you in due time, casting all your care upon Him, for He cares for you.” Psalm 27:5: “For in the time of trouble   He shall hide me in His pavilion;   In the secret place of His tabernacle   He shall hide me;   He shall set me high upon a rock.” Romans 8:35, 37-39: “Who shall separate us from the love of Christ? Shall tribulation, or distress, or persecution, or famine, or nakedness, or peril, or sword? Yet in all these things we are more than conquerors through Him who loved us. For I am persuaded that neither death nor life, nor angels nor principalities nor powers, nor things present nor things to come, nor height nor depth, nor any other created thing, shall be able to separate us from the love of God which is in Christ Jesus our Lord.” As you can read in the scriptures above, God deeply cares for and loves His people. We need not be afraid or worried because He is watching over us, watching out for us, and looking after us. He never sleeps but constantly keeps His eye on us and provides for our needs.   I have recognized in my own heart that when I am afraid or worried, it is because I am not fully trusting God. I have also realized that it is far better to let God take care of me than to try to take care of myself. His resources are so vast and limitless. His love is so unconditional and generous. His understanding of what we need and when we need it is so accurate.   We are His sheep, and He is our Shepherd. Let us allow Him to take care of us as we trust and obey Him. Let us follow His leading, as He is our provider and protector.   May you know beyond a shadow of a doubt that God WILL take care of YOU today and every day, over ALL the way that you walk.`, subtitle: 'God Will Take Care of You: Steven Levson', author: 'Dave Levson', year: 2025, month: 'March', volume: 'Vol. LXXVIII, No. 03', title: 'Many Convincing Proofs', topics: ['Scripture','Apologetics','Youth & Family'], excerpt: "Dave Levson addresses young people with evidence for God's existence, examining why youth leave the faith and presenting proofs including the resurrection of Jesus witnessed by over 500 people, cold-case detective J. Warner Wallace's investigation, and 300 fulfilled Old Testament prophecies. Steven Levson shares a personal testimony about God's promise I will take care of you, illustrated through Psalms 121, 91, 23, and Isaiah 41.", pdf: '03%20-%20Sharon%20Star%20-%20March%202025.pdf', fileName: '03_-_Sharon_Star_-_March_2025.pdf'  },
  { id: 4, articleText: `Volume LXXVIII | Issue 04 | April/May 2025 “Now when Mary came to where Jesus was and saw him, she fell at his feet, saying to him, ‘Lord, if you had been here, my brother would not have died.’When Jesus saw her weeping, and the Jews who had come with her also weeping, he was deeply moved in his spirit and greatly troubled. And he said, ‘Where have you laid him?’ They said to him, ‘Lord, come and see.’ Jesus wept” (John 11:32-35, ESV). The humanity of Jesus is shown clearly in the short but powerful verse, “Jesus wept.” These two words remind us that Jesus wasn’t just a distant or untouchable figure—He lived a truly human life. He was born to a mother, grew up as a child, obeyed His parents, and grew in wisdom and strength. As an adult, He walked the dusty roads of Judea, Galilee, and Samaria. He worked with His hands as a carpenter. He got hungry, thirsty, and tired. Sometimes He looked for solitude when burdened. Even though Jesus never sinned, He lived a fully human life. He showed us what it really means to be human—in body, mind, and spirit. He was the perfect example of a real person, with a physical body just like ours. In Jesus Christ, we see both God and man. He is fully divine and fully human. This is shown in a touching way when He wept at Lazarus’ tomb. Jesus didn’t just watch human pain from a distance—He entered into it. He shared in our weakness, our grief, and our sorrow. We see this clearly in the verse, “He took our illnesses and bore our diseases” (Matthew 8:17, ESV). Before this moment, Martha, Mary’s sister, had already met Jesus, telling Him,. “Lord, if you had been here, my brother would not have died. But even now I know that whatever you ask from God, God will give you” (John 11:21-22, ESV). Her words carry both faith and sorrow as she mourns the loss of her brother, Lazarus. They also speak to our own struggles to trust in the midst of what seems like an ending. Martha’s words show a heart caught between faith and doubt, hope and despair. She believes in Jesus as the Messiah, but her faith is shaped by her understanding of both the earthly and heavenly worlds. She can’t grasp that the One standing before her isn’t limited by those boundaries. In this, we see reflections of our own spiritual journey. Like Martha, we believe in God’s power, but often only within the limits of what we can understand Jesus responded with a reassurance that went beyond Martha’s immediate understanding: “Your brother will rise again” (John 11:23, ESV). Martha, thinking He was referring to a distant future, answered, “I know that he will rise again in the resurrection on the last day” (John 11:24, ESV). While her faith was sincere, it was still bound by human expectations. Here, we see the contrast between the present reality and the future promise of God’s kingdom. Martha believes in the resurrection to

come but struggles to apply that belief to her current situation. This is something many of us face in our Christian journey. We believe in God’s ultimate victory, but sometimes find it hard to trust in His power for our present struggles. Still, Jesus calls us to a faith that goes beyond time, a faith that sees God’s kingdom at work in our lives today. “Now when He was asked by the Pharisees when the kingdom of God would come, He answered them and said, “The kingdom of God does not come with observation; nor will they say, ‘See here!’ or ‘See there!’ For indeed, the kingdom of God is within you” (Luke 17:20-21, NKJV). When Jesus stood before Lazarus’ tomb, we saw the depth of His compassion. Seeing the tears of Mary and the others, He wasn’t just a bystander; He truly shared in their grief. His tears weren’t only for Lazarus, but for all of humanity—every sorrow, every loss, and every moment of doubt. At this moment, Jesus groaned in the Spirit again (John 11:38). Even though the Messiah was standing right before Mary and the other mourners, their hearts remained clouded by unbelief, stopping them from fully recognizing Him as the Son of God. Their struggle to see beyond their grief and doubt deeply troubled Him. In this moment of deep emotion, we see a powerful truth: God is not indifferent to our pain. Through His tears, Jesus shows a heart that breaks alongside ours. He truly is “a man of sorrows, and acquainted with grief” (Isaiah 53:3, ESV). His tears are a testament to His love for God’s children. They are not a sign of weakness, but a display of great strength. In His tears, we see the love of a Savior who steps into our deepest pain. He doesn’t stand apart from our suffering but enters fully into it, sharing in it with us and for us. This reveals an important aspect of faith. Jesus said, “I am the resurrection and the life. Whoever believes in me, though he die, yet shall he live, and everyone who lives and believes in me shall never die” (John 11:25, ESV). This promise wasn’t just for the distant future, but for the present. Jesus was inviting Martha—and all of us—to trust in His power right now. Too often, like Martha, we tend to place God’s promises in the future, believing in His ultimate victory while doubting His power in the present. Yet, the same Christ who will one day wipe away every tear is here with us now, offering life and hope even in our current struggles. “Then Jesus, again groaning in Himself, came to the tomb. It was a cave, and a stone lay against it. Jesus said, ‘Take away the stone.’ Martha, the sister of him who was dead, said to Him, ‘Lord, by this time there is a stench, for he has been dead four days.’ Jesus said to her, ‘Did I not say to you that if you would believe you would see the glory of God?’ Then they took away the stone from the place where the dead man was lying. And Jesus lifted up His eyes and said, ‘Father, I thank You that You have heard Me. And I know that You always hear Me, but because of the people who are standing by I said this, that they may believe that You sent Me.’Now when He had said these things, He cried with a loud voice, ‘Lazarus, come forth!’ And he who had died came out bound hand and foot with graveclothes, and his face was wrapped with a cloth. Jesus said to them, ‘Loose him, and let him go’” (John 11:38-44, NKJV). When Jesus spoke to Martha, saying, “Did I not tell you that if you believed, you would see the glory of God?” He boldly declared His identity and authority. He wasn’t just a teacher or prophet— He was the very source of life. His words invite us to have faith that goes beyond our circumstances, a faith that sees past death to the power of His resurrection We should ask ourselves: When God speaks, will I believe? Do I truly trust that God can transform my life, even with all my weaknesses and failures? Many of us hear God’s call but dismiss it due to doubts or busyness. In our daily lives, even with all the good things we do, it’s easy to get caught up in a whirlwind of activities that distract us from truly hearing and believing God’s voice. The Christian life isn’t meant to be just a routine without divine power. When we recognize this and seek to align with God’s will, we open ourselves up to be transformed. Martha’s encounter with Jesus challenges us to reflect on our own faith. Do we really believe that Jesus is the resurrection and the life? Do we trust Him to bring life out of death, hope out of despair, and light out of darkness? These are not just theological ideas—they are the heart of our faith. They call us to trust Jesus more deeply, the One who holds authority over both life and death. To truly embrace and believe in the words of Jesus, we need to invite Him to cleanse our hearts. Just as He cleansed the temple in Jerusalem, driving out those who had turned His Father’s house into a marketplace, He declared, “My house shall be called a house of prayer, but you have made it a den of thieves” (Matthew 21:12-13, NKJV). In the same way, we need to ask Jesus to remove all distractions from our lives—anything that prevents us from fully trusting in Him. This cleansing is not a one-time event but a continual process of repentance and renewal. Has God been speaking to you, but you’ve been pushing Him away with busyness and doubt? Our walk lacks spiritual authority until we say, “Lord God, I believe. I won’t drown out Your voice or the Holy Spirit with worldly distractions. I will trust You to guide my steps every day. Thank You, Holy Spirit, for interceding for me. Bring me in line with God’s will. Not my will, but Yours be done, Lord Jesus!” When we allow Jesus to cleanse our hearts, our testimony becomes a living proof of a real, living God, and we can’t help but share with others the incredible things He has done for us. All things are possible—not just in the future, but right here, right now. The love of Jesus is not a passive sentiment. It’s a love that enters

into our suffering, carries our burdens, and transforms us. This love is most clearly displayed in the tears of Jesus at Lazarus’s tomb. His tears show His deep compassion and His love for us. This love moves Him to heal the sick, feed the hungry, and raise the dead. It is the same love that drove Him to the cross, where He took on our sins. It’s the love that conquered death and brought new life. We are called to live with the hope and certainty of what the resurrection of Jesus brings. We are to live with the assurance that His power is working in our lives, bringing new life. Our mission is to bring hope and healing to those around us, sharing the love and compassion of Jesus with a hurting world. This is the calling of the church—to be a living testimony to the resurrection power of Jesus Christ. The resurrection of Jesus points us to the ultimate hope of glory. It reminds us that death is not the end, but a passage to a new and glorious life. The hope of glory is a key theme in the New Testament. It is the hope that we will one day be fully united with Christ. This hope gives us the strength to endure life’s trials, knowing that our present suffering is nothing compared to the glory that will be revealed in us. “For I consider that the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us. For the earnest expectation of the creation eagerly waits for the revealing of the sons of God. For the creation was subjected to futility, not willingly, but because of Him who subjected it in hope; because the creation itself also will be delivered from the bondage of corruption into the glorious liberty of the children of God” (Romans 8:18, ESV). This also means that we are called to trust in God’s promises and live in obedience to His will. We are to “...seek first the kingdom of God and His righteousness, and all these things shall be added to you” (Matthew 6:33, NKJV). Faithfulness is not only about believing the right things but also about living in a way that reflects Christ within us. It involves being faithful in our relationships, our work, and our service to others. It means being people of integrity who live out our faith in every area of life and who love our neighbors as ourselves. The Holy Spirit plays a vital role in helping us live lives of faithfulness. He is the one who guides us in truth and transforms us into the image of Christ. The Holy Spirit is the presence of Jesus within us, and He intercedes for us, praying when we do not know how to pray. He is our helper, comforter, and advocate. This is not something we do on our own. We are called to walk alongside other believers. The church is the body of Christ, and we are each members of that body. We need one another for support, encouragement, and accountability. The church is crucial to our spiritual growth. It is through the church that we learn to love and serve one another, bear each other’s burdens, and deepen our faith. The church is where we experience the love and grace of God in practical ways. The church is also meant to be a witness to the resurrection power of Jesus Christ. This means we are to share the good news of Jesus’ death and resurrection, make disciples of all nations, and teach them to follow everything He has commanded us (Matthew 28:19-20). The resurrection of Jesus points us to the hope of the new creation. It is the promise that one day, God will make all things new. There will be a new heaven and a new earth, where there will be no more death or mourning or crying or pain. “Now I saw a new heaven and a new earth, for the first heaven and the first earth had passed away. Also there was no more sea. Then I, John, saw the holy city, New Jerusalem, coming down out of heaven from God, prepared as a bride adorned for her husband. And I heard a loud voice from heaven saying, “Behold, the tabernacle of God is with men, and He will dwell with them, and they shall be His people. God Himself will be with them and be their God. And God will wipe away every tear from their eyes; there shall be no more death, nor sorrow, nor crying. There shall be no more pain, for the former things have passed away” (Revelation 21:1-4, NKJV). The tears of Jesus at Lazarus’s tomb invite us to trust in His love for us and His promise to us. They offer an invitation to experience the transformation that comes from truly having a relationship with Him. The raising of Lazarus and the resurrection of Jesus were both powerful miracles, but they are not the same. When Jesus called Lazarus out of the tomb, Lazarus came back to life in his same physical body. He was still a mortal man who would one day die again. This was a temporary return to life—a sign of Jesus’ authority over death. But when Jesus rose from the dead, it was entirely different. His resurrection was permanent and victorious. He rose with a glorified body (Luke 24:6), never to die again (Romans 6:9). His resurrection broke the power of death and opened the door to eternal life for all who believe (1 Corinthians 15:20). Lazarus came back to this life, but Jesus rose into a new kind of life that will never end. “Lazarus, come forth” (John 11:43, ESV). These words, spoken so long ago, still resonate today, reaching beyond the tomb to speak to our hearts. Perhaps you feel overwhelmed by sin, shame, or spiritual emptiness, as though life has passed you by. But Jesus is still calling, still offering hope to what seems hopeless. He beckons you out of the darkness, offering the chance for a fresh beginning and a new life in Him. No matter how lost you may feel, it’s never too late to hear God’s call and start anew. In Christ, there is always the hope of transformation. As we reflect on this, let us be encouraged to believe in the power of Jesus. Let us open our hearts to His love and grace, allowing Him to cleanse and renew us. Let us be a people of faith, hope, and love, sharing the good news of Jesus with a world in need. Let us live in the promise of the resurrection, knowing that with God, all things are possible and the gift of eternal life is for us. He’s calling you today. Don’t stay buried in the tomb—step into life.

The Sharon Star is a monthly publication and mailed as a free-will offering plan. The articles within are intended for inspiration and information to those who are interested in the unfolding revelation of the Word of God. Published by: Global Missions Inc. in North Battleford, Saskatchewan, Canada. The Sharon Star is found online at: www.globalmissionsinc.org/sharon-star Publications Mail Agreement 40012206 Subscribe by mail or online. GLOBAL MISSIONS INC. Global Missions Inc. was founded in 1944, as a Christian mission to promote and encourage the preaching of the gospel to every creature. Global Missions reaches into many countries in Africa, India, the Caribbean, the United States of America, South America and the Philippines. These local churches are established on the foundational truths revealed in God’s word and through His unfolding revelation. Local churches are governed by local residents who are referred to as elders. Global Missions is a nondenominational Christian church. Headquarters: 802 Airport Road North Battleford, SK S9A 2Z3 Canada Mailing Address: P.O. Box 934 North Battleford, SK S9A 2Z3 Canada Telephone: (306) 445-2733 Email: info@globalmissionsinc.org Online: www.globalmissionsinc.org Traveling Ministry Contact List: www.globalmissionsinc.org/about Watch Therefore and Pray Markus Hansen “And as it was in the days of Noah, so it will be also in the days of the Son of Man: They ate, they drank, they married wives, they were given in marriage, until the day that Noah entered the ark, and the flood came and destroyed them all. Likewise as it was also in the days of Lot: They ate, they drank, they bought, they sold, they planted, they built; but on the day that Lot went out of Sodom it rained fire and brimstone from heaven and destroyed them all. Even so will it be in the day when the Son of Man is revealed” (Luke 17:26-30). This is what we witness today. We, along with our neighbours, are doing all the activities listed in this scripture. Is our
