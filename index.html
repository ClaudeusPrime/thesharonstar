lives. “We then, as workers together with him, (Christ), beseech you also that ye receive not the grace of God in vain” (2 Corinthians 6:1). It has been ministered by the brethren that we can easily envision how Christ laboured with His Heavenly Father. However, we have a hard time envisioning how we can labour with Christ. Why? Because we focus on our failings! We don’t focus on His promises! As we have discussed, the Old Testament speaks of God never forsaking Israel, regardless of their failures, because His covenant was one way. God always makes a way for the restoration of His people. They just had to stop doubting His promises to them. God had shown them that He had the power and love to fulfill them. How much greater than, through Christ’s death on the cross, is the power of His resurrection, and Christ as the testator of a better covenant (Hebrews 9). God’s Word promises that He will never forsake His sons and daughters. “Let your conversation be without covetousness; and be content with such things as ye have: for he hath said, I will never leave thee, nor forsake thee” (Hebrews 13:5, Joshua 1:5, Psalms 37:25, 2 Corinthians 4:9–10). “Be ye not unequally yoked together with unbelievers: for what fellowship hath righteousness with unrighteousness? and what communion hath light with darkness” (2 Corinthians 6:14) Also see John 1:5. The Old Testament type of being unequally yoked is found in the time of Noah (for context, please read Genesis 6:1–5). Where was the unequal yoke? The sons of God, incorruptible seed, and the daughters of men, corruptible seed. “That the sons of God saw the daughters of men that they were fair; and they took them wives of all which they chose” (Genesis 6:2). Continuing in 2 Corinthians: “And what concord hath Christ with Belial? or what part hath he that believeth with an infidel? And what agreement hath the temple of God with idols? for ye are the temple of the living God; as God hath said, I will dwell in them, and walk in them; and I will be their God, and they shall be my people” (2 Corinthians 6:15–16). Also see Leviticus 26:12. Paul continues writing through, what I believe to be, the gift of prophecy. Notice the words and phraseology: “Wherefore come out from among them, and be ye separate (set apart for a purpose, sanctified), saith the Lord, and touch not the unclean thing; and I will receive you, And will be a Father unto you, and ye shall be my sons and daughters, saith the Lord Almighty” (2 Corinthians 6:17–18). When Paul spoke prophetically, what did he speak? The Word of God! God gave him these words to say. They are as true as if God said them Himself. When you enter into the Spirit of prophecy, by the Spirit, this same fact is true and His Word will not return to Him void. It will be fulfilled. What a vision. What a promise. Let us remember and believe Paul in his encouragement to the believers in Philippi: “Being confident of this very thing, that he which hath begun a good work in you will perform it until the day of Jesus Christ” (Philippians 1:6). His Word will be fulfilled. I will be a Father unto you, and ye shall be my sons and daughters. I would like to conclude with John’s vision from God as recorded in the Book of Revelation. In Revelation chapters 2 and 3, John recorded what God was saying to the seven churches. There is a shared phrase used to each of the churches that includes wording to the effect of “he/him that overcometh.” The word overcometh in our modern vocabulary sometimes gives an image of a task that has to be endured, or of being overpowered or incapacitated (like enduring another long sermon). In looking up the meaning of overcometh, translated from the Greek word nikaō, it means one who is victorious. The feeling of enduring, although in a sense a long process, is swallowed up by the wonderful elation of victory. I pray that the Spirit of the Lord fills your heart with joy and hope with this vision. We have been assured that the battle is the Lord’s and we will be victorious through Christ. • The Church of Ephesus: “He that hath an ear, let him hear what the Spirit saith unto the churches; To him that overcometh will I give to eat of the tree of life, which is in the midst of the paradise of God” (Revelation 2:7). • The Church in Smyrna: “He that hath an ear, let him hear what the Spirit saith unto the churches; He that overcometh shall not be hurt of the second death” (Revelation 2:11). • The Church in Pergamos: “He that hath an ear, let him hear what the Spirit saith unto the churches; To him that overcometh will I give to eat of the hidden manna, and will give him a white stone, and in the stone a new name written, which no man knoweth saving he that receiveth it” (Revelation 2:17). • The Church in Thyatira: “And he that overcometh, and

The Sharon Star is a monthly publication and mailed as a free-will offering plan. The articles within are intended for inspiration and information to those who are interested in the unfolding revelation of the Word of God. Published by: Global Missions Inc. in North Battleford, Saskatchewan, Canada. The Sharon Star is found online at: www.globalmissionsinc.org/sharon-star Publications Mail Agreement 40012206 Subscribe by mail or online. GLOBAL MISSIONS INC. Global Missions Inc. was founded in 1944, as a Christian mission to promote and encourage the preaching of the gospel to every creature. Global Missions reaches into many countries in Africa, India, the Caribbean, the United States of America, South America and the Philippines. These local churches are established on the foundational truths revealed in God’s word and through His unfolding revelation. Local churches are governed by local residents who are referred to as elders. Global Missions is a nondenominational Christian church. Headquarters: 802 Airport Road North Battleford, SK S9A 2Z3 Canada Mailing Address: P.O. Box 934 North Battleford, SK S9A 2Z3 Canada Telephone: (306) 445-2733 Email: info@globalmissionsinc.org Online: www.globalmissionsinc.org Traveling Ministry Contact List: www.globalmissionsinc.org/about keepeth my works unto the end, to him will I give power over the nations: And he shall rule them with a rod of iron; as the vessels of a potter shall they be broken to shivers: even as I received of my Father. And I will give him the morning star. He that hath an ear, let him hear what the Spirit saith unto the churches” (Revelation 2: 26-29). • The Church in Sardis: “He that overcometh, the same shall be clothed in white raiment; and I will not blot out his name out of the book of life, but I will confess his name before my Father, and before his angels. He that hath an ear, let him hear what the Spirit saith unto the churches” (Revelation 3:5-6). • The Church in Philadelphia: “Him that overcometh will I make a pillar in the temple of my God, and he shall go no more out: and I will write upon him the name of my God, and the name of the city of my God, which is new Jerusalem, which cometh down out of heaven from my God: and I will write upon him my new name. He that hath an ear, let him hear what the Spirit saith unto the churches” (Revelation 3:12-13). • The Church of the Laodiceans: “To him that overcometh will I grant to sit with me in my throne, even as I also overcame, and am set down with my Father in his throne. He that hath an ear, let him hear what the Spirit saith unto the churches” (Revelation 3:21-22). But Finally, to God’s Sons and Daughters, the Church, the Body of Christ, the Bride of Christ “And I saw a new heaven and a new earth: for the first heaven and the first earth were passed away; and there was no more sea. And I John saw the holy city, new Jerusalem, coming down from God out of heaven, prepared as a bride adorned for her husband. And I heard a great voice out of heaven saying, Behold, the tabernacle of God is with men, and he will dwell with them, and they shall be his people, and God himself shall be with them, and be their God. And God shall wipe away all tears from their eyes (promise); and there shall be no more death (promise), neither sorrow (promise), nor crying (promise), neither shall there be any more pain (promise): for the former things are passed away”(Revelation 21:1–4). Do we believe that His promises will be fulfilled? Because until we believe in His faithfulness to fulfill, we can’t enter into the fullness of His promises. If we keep allowing doubt to fill our hearts and minds, then we will continue to wander through the wilderness, inhibiting our entering into the fullness of His promises. “And he that sat upon the throne said, Behold, I make all things new. And he said unto me, Write: for these words are true and faithful (i.e., He is faithful to fulfill His words). And he said unto me, It is done. I am Alpha and Omega, the beginning and the end. I will give unto him that is athirst of the fountain of the water of life freely. He that overcometh shall inherit all things; and I will be his God (Heavenly Father), and he shall be my son (and daughter)” (Revelation 21:5–7). We are not there yet. If God says it will be done, there is a time, there is a day—that time of Jesus Christ (see Philippians 1:6)—that will come. I pray that we believe that God is able to fulfill His promises through us, be manifested by us, and that we will give all the glory to God. Fulfilling the Word “And God said, Let us make man in our image, after our likeness:… So God created man in his own image, in the image of God created he him; male and female created he them” (Genesis 1:26–27). This magnificent vision that John saw will be fulfilled because His sons and daughters will have chosen to walk unencumbered, unimpaired, and with full integrity, by the leading of the Spirit. This article has presented many promises by God’s Word, and I pray that we believe He will be faithful to fulfill each and every one. However, I want to emphasize one specific promise: I will be their God, and they will be my people—as recorded in the Old Testament with regard to the descendants of Abraham—but even more so: I will be their Heavenly Father, and they shall be my sons and daughters—in the New Testament with regard to the body of Christ, the Church.`, author: 'Kelvin Martin', year: 2025, month: 'September', volume: 'Vol. LXXVIII, No. 08', title: "God's Promises — Part Two", topics: ['Scripture','Holy Spirit','Prophecy'], excerpt: "Kelvin Martin concludes the study on God's promises, moving from the Old Testament tabernacle to the New Testament fulfillment of the Holy Spirit dwelling in believers. Examines the promise I will be a Father unto you and ye shall be my sons and daughters through 2 Corinthians 6, the born-again covenant of John 3, and the overcomers of Revelation 2-3. Paul's vision in Romans 8 of creation waiting for the manifestation of the sons of God.", pdf: '08%20-%20Sharon%20Star%20-%20September%202025.pdf', fileName: '08_-_Sharon_Star_-_September_2025.pdf'  },
  { id: 9, articleText: `Volume LXXVIII | Issue 09 | October/November 2025 I have often thought about how differently people respond to the words of Jesus. Some are comforted, others are unsettled, and many are left with an inner conflict they cannot resolve. His words expose the wounds people carry from religion. Some were crushed under a message of perfection they could never reach. Others believe their past choices have marked them forever, leaving them disqualified from being saved and hidden in Christ. For some, what should bring hope instead stirs despair, leaving them feeling unworthy of salvation. But the gospels show something deeper. Jesus embraced sinners but never condoned sin. He loved mankind, even in rebellion against God. Since the fall of Adam, we have been born into sin and bound by selfishness, corruption, and blindness. Yet God loved us anyway. His compassion was not indulgence, but mercy reaching into ruined humanity to restore what was lost. At the same time, His words pierce with clarity about the cost of discipleship. Both truths stand together. His mercy opens the door, His call defines the way. This is not an easy message. If you are looking for Jesus to bless your comfort, you will not find it. If you expect Him to turn you away because of your failures, you will not find that either. What you will find is a Shepherd who calls you as you are, but who loves you too much to leave you unchanged. When Jesus invited people to follow Him, His words were not softened to avoid offense. He told one man that foxes have dens and birds have nests, but the Son of Man had nowhere to rest His head (Luke 9:58). To another who asked for time to bury his father, He said the call of the kingdom must take precedence (Luke 9:60).And when a third wished to follow after saying farewell to his family, Jesus answered that no one who puts a hand to the plow and looks back is fit for service in the kingdom of God (Luke 9:62). These words confront us with the demand that the kingdom be placed above all else, even family. Such words strike us as severe. They seem to pull us out of the ordinary duties of life and press us into something impossible. Yet what Jesus reveals is not cruelty but clarity. He is not calling for admirers who balance Him alongside everything else. He is calling for men and women who will enter into His own way of life. The invitation is not simply to follow Him at a distance, but to be as He is. The life of Jesus was marked by surrender to the Father’s will. He owned no property and sought no position of power. He gave freely to those who came to Him, whether through teaching, healing, or mercy. In the end He gave His life itself, saying, “The good shepherd lays down his life for the sheep” (John 10:11). To be His disciple is to walk the same path of self-giving love. This raises a question many feel but do not voice. How does such a holy call meet the realities of ordinary life? Most of us work jobs, raise families, care for homes, and live in communities where there are bills to pay and duties to meet. Surely Jesus does not intend His people to abandon all of this. The answer lies not in retreating from life but in reordering it. The call of God begins with allegiance. Jesus said, “Seek first the kingdom of God and His righteousness” (Matthew 6:33). This is the decisive step. The kingdom becomes the center, and work, family, and community are understood as places where that kingdom is lived out.Aperson may still labor in a trade, raise children, or serve neighbors, but now all is done for God rather than for self.

This leads naturally to simplicity. Jesus warned that the adoration of wealth chokes out the life of the Spirit (Mark 4:19). The earliest Christians often sold possessions and shared with those in need (Acts 2:44–45). This was not poverty for its own sake but freedom from slavery to wealth. In an ordinary life, this might mean living within one’s means, refusing to measure success by possessions, and choosing generosity over accumulation. Sacrifice also takes the form of daily obedience. It is rarely grand or dramatic. More often it looks like telling the truth when lying would be easier, forgiving someone who does not deserve it, or showing patience when provoked. Jesus said, “Whoever is faithful with little will also be faithful with much” (Luke 16:10). The cross is carried step by step, often in the quiet places of life. Prayer and Scripture are the anchors that keep this life from becoming toil. Jesus, Himself, often withdrew to pray, even in the busiest seasons: “So He Himself often withdrew into the wilderness and prayed” (Luke 5:16). Without communion with the Father, His sacrifice would have been drudgery. Prayer gave Him strength and confidence in the Father’s plan. The same is true for His disciples. Daily prayer and time in the Word align the heart with Him and give strength for obedience. The sacrificial life is not solitary. The church was formed as a community where believers bore one another’s burdens: “Bear one another’s burdens, and so fulfill the law of Christ” (Galatians 6:2). They shared meals, prayed together, and cared for each other’s needs. Even today, it is within the Christian community that the call of Jesus becomes joyful rather than heavy. Service shared together guards us from turning sacrifice into lonely martyrdom. At the heart of it all is love. Jesus said, “By this everyone will know that you are my disciples, if you love one another” (John 13:35). The love of God is made visible in simple, tangible acts: hospitality, listening, kindness, forgiveness. These are not spectacular gestures, but they make the kingdom visible in daily life. When plagues struck Roman cities in the second century, many fled. Christians stayed behind to care for the sick, often at the cost of their own lives. Outsiders noticed and said of them, “See how they love one another.” It was not power or prestige that spread the gospel, but love embodied in sacrifice. This is the higher purpose of the Christian life. We are not called merely to admire Jesus or attach His name to our pursuits. We are called to be like Him, reflecting His humility, obedience, and love. This does not remove us from the world but sends us deeper into it, carrying His light into homes, workplaces, and neighborhoods. Paul expressed it clearly: “I beseech you therefore, brethren, by the mercies of God, that you present your bodies a living sacrifice, holy, acceptable to God, which is your reasonable service” (Romans 12:1). The call of God is not to withdraw from the daily grind or to parade suffering as if it were an achievement. It is to live faithfully in the ordinary, shaped by allegiance to Christ, grounded in prayer, freed from the love of riches, and marked by love. This is how the command to take up the cross becomes real. It is not the life of a zealot chasing suffering. It is the life of a disciple who has discovered that in surrendering to Christ, one finds a life that can never be taken away. “Now it happened in the process of time that the king of Egypt died. Then the children of Israel groaned because of the bondage, and they cried out; and their cry came up to God because of the bondage” (Exodus 2:23, NKJV). This verse describes the situation the Israelites found themselves in while they were enslaved in Egypt. They had grown in number since the time of Joseph and became a threat to the Egyptians, which resulted in being forced into slavery. Finding themselves under bondage, pressed into forced labourers by the Egyptians, they cried out to God for His help. There is a lesson in this scripture for us today. Consider your human body. It is comprised of many distinct and unique parts. When our human body is physically healthy, all the individual parts of our body are functioning in complete harmony according to what they have been designed to do. Watching top-ranked athletes, we see that they are able to perform amazing feats because every part of their body is doing what it is meant to do. The Apostle Paul uses the human body as an object lesson to help us understand the body of Christ. Paul writes in Romans 12:4–5: “For as we (humans) have many members in one body, but all the members do not have the same function, so we (God’s chosen people), being many, are one body in Christ, and individually members of one another.” In 1 Corinthians 12:27 Paul continues: “Now you are the body of Christ, and members individually.” We, you and I, as members of the church of God, are the body of Christ. We are Christ’s body here on this earth, this planet. Therefore, can we not conclude that if we are all functioning according to the gifts and ministries bestowed upon us when we were prophesied over by a presbytery, and there is no discord, enmity, or ill feelings among

us and all other individual members, then the Body of Christ should be healthy both spiritually and physically? Looking over the body of Christ today, what do we see? Are we spiritually healthy? Is there a lack of unity because of strife or disagreement between members? Are we seeing Christ in each member of the body of Christ, or are there still irksome personality quirks which annoy us and stand in the way of us functioning in our ministry? Also, are we physically healthy?Through prophecy at the beginning of this move of the Holy Spirit, God promised us: “divine health and divine life.” Looking over the church in this present day, we see many individuals suffering with various physical ailments and diseases: cancer, diabetes, weakening eyesight and even blindness, loss of hearing, memory loss, mobility issues—to mention a few. This raises the question: “Are we in bondage?” If we agree that we, as the body of Christ, are unhealthy and in bondage to the ravages of this age and time, then have faith—there is a solution. The solution is to repent of our shortcomings and sins, cry out to God as a corporate body, and ask the Holy Spirit to come to our rescue. God heard the Israelites cry out to Him when they were in bondage in Egypt, and He delivered them. Glory to God! God even promised to: “take away from you all sickness, and will afflict you with none of the terrible diseases of Egypt which you have known” (Deuteronomy 7:15). And after wandering in the desert for 40 years, God reminded them, “Your garments did not wear out on you, nor did your foot swell these forty years” (Deuteronomy 8:4). When Moses finished his tenure here on this earth, consider his health: “And Moses was an hundred and twenty years old when he died: his eye was not dim, nor his natural force abated” (Deuteronomy 34:7). Clearly, the ravages of time and old age did not negatively affect Moses physically! Reading further through the Old Testament, we read over and over again that when the Israelites were in trouble or had turned their back on God, when they repented and cried out to God, He came to their rescue. Is not God able in this day and this hour to answer our prayers if we cry out to Him? It may seem to our natural human thinking that divine health is beyond the realm of possibility, but the Apostle Paul wrote: “For all the promises of God in Him are Yes, and in Him Amen, to the glory of God through us” (2 Corinthians 1:20). And Jesus said: “With God all things are possible” (Matthew 19:26). Also, in Hebrews 13:8 we read: “Jesus Christ is the same yesterday, today, and forever.” Jesus proved beyond doubt that we serve a living God that is able and willing to heal. “And Jesus went about all the cities and villages, teaching in their synagogues, and preaching the gospel of the kingdom, and healing every sickness and every disease among the people” (Matthew 9:35). In addition, the disciples were given the power to deliver and heal: “And when he had called unto him his twelve disciples, he gave them power against unclean spirits, to cast them out, and to heal all manner of sickness and all manner of disease” (Matthew 10:1). Saints of God, let us ask the Holy Spirit to help us set aside the cares of life (Luke 10:38–42) and overcome our shortcomings of living a Christlike life. Let us cry out and seek God with all our hearts for the fulfillment of His promises for divine health and healing, and that His kingdom will come in its fullness here on this earth. “If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land” (2 Chronicles 7:14). Oh Lord, let“Thy kingdom come, Thy will be done in earth, as it is in heaven” (Matthew 6:10). Amen. Greetings to the children of the Church! With the help of your dads and moms, I would like you to learn more about God, about how wonderful He is, about how much he loves us. Today I would like us to talk about an important part of God’s nature, namely: God’s sovereignty. God Is Sovereign God is sovereign. This means that God is in charge. God does what He wants. From ChatGPT the word ‘sovereign’ refers to God’s authority. God rules over everything in the heavens and on earth. His plans and His purposes have always and will always be accomplished.   We sing these words in the song, “Holy Forever”; ‘Jesus, Your Name is the highest,…All thrones and dominions, all powers and positions, Your name stands above them all.’ God is sovereign. He rules over everything.

ority, because He only uses His love to be helpful. We can trust that the most powerful Being in the universe is devoted to helping us. Did You Know That All Humans are Sovereign? You children also have a measure of sovereignty! When God made Adam and Eve in His image as recorded in Genesis chapter 1, God says He made us in His image. We all have some of God’s nature. He gave you and me sovereignty! That means we can, like God, make plans and have purposes to do what is possible for humans.   One Big Problem With Us Humans There is one major, huge, gigantic difference between us and God! Sin! We are not pure and holy like God is.   When humans try to live without having Jesus in their hearts, they make lots of bad decisions. The problems facing the world today are not caused by God, but by a lack of God! Sometimes we demand our own way for all the wrong reasons. We disobey our parents. We use words that we know are wrong. Sometimes we even hate and hurt other people. Sin! It is in all of us from the time we were born. Sin makes us stubborn. Sin even causes us to refuse to obey. We refuse to apologize. We refuse to forgive.   Open your Bibles and read Jeremiah 17:9-10 Can you see in this scripture how sin deceives us so that we don’t know the condition of our own heart? Can you see that the only way we can understand the condition of our heart is to have God help us? Remedy Do you see how God has given us sovereignty? He has given us the right to do what we want? But, we cannot make good choices without God’s help.   Here are a couple of questions that you already know the answers to:   • Is Jesus God? Yes! When Jesus was on earth He was both God and man.   • Is Jesus sovereign? Does He have all power and dominion to do what He wants? Yes! • Did Jesus lay down His sovereignty to His Father? Did He give up His privilege and His rights to do what He wanted? Yes! Read Mark 14:36 God helps children through their dad and mom. “Children, obey your parents in the Lord, for this is right” (Ephesians 6:1). Children learn to obey God by obeying their parents. “Obedience is the very best way to show that you believe and by doing exactly what the Lord commands and doing it happily.” Prayer Dear Lord, help me to lay down my sovereignty, my will. I’m sorry for demanding to have my way, Forgive my sins. Jesus, come into my heart today. Lord Jesus, You will always be holy. Help me to become more like You by having your obedient heart. Amen.`, subtitle: 'Cry Out to God: Markus Hansen', author: 'Darren Olson', year: 2025, month: 'October/November', volume: 'Vol. LXXVIII, No. 09', title: 'To Be As He Is', topics: ['Discipleship','Scripture','Faith'], excerpt: "Darren Olson examines the cost of following Jesus — His call to place the kingdom above all else including family, property, and comfort — and how this sacrificial life is lived through simplicity, daily obedience, prayer, and love within the Christian community. Markus Hansen contributes Cry Out to God, using the body of Christ as a health metaphor, calling the church to repent and believe God's promise of divine health and healing. Brian Hannigan writes on God's sovereignty for children.", pdf: '09%20-%20Sharon%20Star%20-%20October-November%202025.pdf', fileName: '09_-_Sharon_Star_-_October_November_2025.pdf'  },
  { id: 10, articleText: `Volume LXXVIII | Issue 10 | December 2025 “But when the fullness of time had come, God sent forth His Son” (Galatians 4:4). For about four hundred years, heaven seemed silent. From the last words of the prophet Malachi to the beginning of the Gospel of Matthew, Israel lived with no new prophets, no new scriptures, and no direct voice from God. It felt as if the heavens had become completely still. Yet even in that silence, God’s plan was still moving forward. Kingdoms rose and fell, just as the prophet Daniel had predicted long before. The Persians, the Greeks, and finally the Romans ruled over the Jewish people—each empire shaping the world in ways that prepared for the coming of the Messiah. When Alexander the Great conquered much of the known world, Greek became the common language. This made communication easier across many nations. Later, this same language—Koine Greek—became the language of the New Testament, allowing the message of Christ to spread widely when “the fullness of time had come.” After Greece, Rome took control. The Romans built a vast empire known for its long period of peace, called the Pax Romana. With peace came well-built roads that connected cities across the empire. These roads worked like the “internet” of the ancient world, making travel and communication fast for their time. I have walked on some of these old Roman roads in Rome, Corinth, Athens, and Philippi, and even after two thousand years, they still hold strong. It is easy to imagine how impressive they were when they were first built. Daniel’s prophecy continued to unfold through history. In 167 BC, the Seleucid king Antiochus IV Epiphanes dishonored the Jewish Temple, which led to the Maccabean Revolt. His cruelty earned him the nickname “the Antichrist of the Old Testament,” hinting at the futureAntichrist still to come. Under the leadership of the Maccabee family, the Jewish people won back some freedom—a victory still remembered today in the celebration of Hanukkah. During times when the Temple was defiled or could not be reached, synagogues became important places for worship,

teaching, and community. These local gatherings would later be the first places where the apostles preached the message of the risen Christ. Everything was being set in place—quietly and perfectly—for the right moment in history. And then, the silence finally ended. The world, prepared over centuries, stood ready. The prophets had pointed to this moment. Heaven, still for so long, began to move again. Angels appeared—not to rulers or the powerful, but to simple shepherds watching their flocks at night. Into the quiet fields of Bethlehem, the voice of heaven returned. “Do not be afraid, for behold, I bring you good tidings of great joy which will be to all people. For there is born to you this day in the city of David a Savior, who is Christ the Lord. And this will be the sign to you: You will find a Babe wrapped in swaddling cloths, lying in a manger.” And suddenly there was with the angel a multitude of the heavenly host praising God and saying: “Glory to God in the highest, and on earth peace, goodwill toward men!” (Luke 2:10–14, NKJV). The silence was finally broken. The Savior had arrived. On this holy night, the first people to hear the message were shepherds out in the fields. Through them, the news began to spread to everyone who was willing to listen. The good news was never meant for only a few—it was for anyone with an open heart. The long quiet from heaven had ended, and the way of salvation was beginning to open for the entire world. “But when the fullness of time had come, God sent forth His Son” (Galatians 4:4). The moment finally came. Perfect and exactly on time. Jesus arrived not a second too early or too late. God’s timing is never rushed and never delayed. In that sacred moment, eternity entered human history. That night was the first time in centuries that God publicly spoke again through His angels. His voice was once more heard on the earth. From that first Christmas night until today, God has continued to speak in many different ways. The age of silence is gone forever. Scholars say the opening verses of Hebrews are some of the most powerful words ever written. So beautiful in the original Greek that no translation can fully capture their greatness, even though their meaning and truth remain clear. “God, who at various times and in various ways spoke in time past to the fathers by the prophets, has in these last days spoken to us by His Son, whom He has appointed heir of all things, through whom also He made the worlds; who being the brightness of His glory and the express image of His person, and upholding all things by the word of His power, when He had by Himself purged our sins, sat down at the right hand of the Majesty on high, having become so much better than the angels, as He has by inheritance obtained a more excellent name than they” (Hebrews 1:1–4). Mary knew this moment would come. The angel Gabriel, God’s messenger, had visited her with incredible news: even though she was a virgin, she would become pregnant with the Son of God and name Him Jesus. She was probably only fifteen to nineteen years old, which was normal in a time when people didn’t live long and adulthood began early. Yet this young woman was given the greatest honor in human history. Jesus would be born of a virgin. Truly the Son of Man and fully the Son of God. “Now in the sixth month the angel Gabriel was sent by God to a city of Galilee named Nazareth, to a virgin betrothed to a man whose name was Joseph, of the house of David. The virgin’s name was Mary. And having come in, the angel said to her, “Rejoice, highly favored one, the Lord is with you; blessed are you among women!” But when she saw him, she was troubled at his saying, and considered what manner of greeting this was. Then the angel said to her, “Do not be afraid, Mary, for you have found favor with God. And behold, you will conceive in your womb and bring forth a Son, and shall call His name JESUS. He will be great, and will be called the Son of the Highest; and the Lord God will give Him the throne of His father David. And He will reign over the house of Jacob forever, and of His kingdom there will be no end.” Then Mary said to the angel, “How can this be, since I do not know a man?” And the angel answered and said to her, “The Holy Spirit will come upon you, and the power of the Highest will overshadow you; therefore, also, that Holy One who is to be born will be called the Son of God” (Luke 1:26–35, NKJV). Joseph was not surprised when heaven’s message filled the fields that night. Long before the angels lit up the sky, God had already told him the truth in a dream. Gabriel had appeared to Mary in person, but to Joseph, who was quiet, fair, and careful. God sent an angel during the calm of the night. In that dream, God prepared Joseph’s heart before the four hundred years of silence finally ended in a public way. “Now the birth of Jesus Christ was as follows…” Mary, though engaged to Joseph, was discovered to be pregnant through the Holy Spirit. Joseph, being an honorable man, struggled quietly with what he should do. But while he was thinking about all of this, heaven entered his dreams: “Joseph, son of David, do not be afraid to take Mary as your wife, for that which is conceived in her is of the Holy Spirit. And she will bring forth a Son, and you shall call His name JESUS, for He will save His people from their sins.” The ancient prophecy began to come true: “Behold, the virgin shall be with child and bear a Son, and they shall call His

name Immanuel”—“God with us” (Matthew 1:18-23). Joseph woke with a calm heart and did as he was told. Faithful. Quiet. Willing. A man ready for a sacred task. I often think of Joseph during the Christmas season. Much is rightly said about Mary, chosen and honored to carry the Savior into the world. But Mary is not our mediator, nor the way to God, as Scripture makes clear: “For there is one God and one Mediator between God and men, the Man Christ Jesus, who gave Himself a ransom for all” (1 Timothy 2:5–6). “I am the way, the truth, and the life. No one comes to the Father except through Me” (John 14:6). Yet Joseph, though often quiet in our stories, lived a life worth noticing. He was chosen to be the earthly, adoptive father of Jesus, a humble carpenter, poor by worldly standards but rich in obedience. His life was short, but his role was important. After the incident at the temple when Jesus was twelve, Joseph disappears from Scripture, leading many to believe he died before Jesus began His ministry. Perhaps this was part of God’s plan: when Jesus spoke of “My Father,” it would be clear He meant the Father in heaven. Michael Card captures Joseph’s heart in the tender lyrics of Joseph’s Song: How could it be, this baby in my arms, Sleeping now so peacefully? The Son of God, the angel said— How could it be? Lord, I know He’s not my own, Not of my flesh, not of my bone. Still, Father, let this baby be The son of my love. Father show me where I fit, Into this plan of yours. How can a man be father to the Son of God? Lord, for all my life, I’ve been a simple carpenter. How can I raise a King? How can I raise a King? These words make my eyes well with tears. I imagine Joseph and Mary whispering in the dark, “How can we raise a King?” How could two poor, unknown young people carry the weight of such glory? The truth for them and for us is the same: We walk by trust, one day at a time, under the faithful leading of the Lord. “Do not worry about tomorrow… Each day has enough trouble of its own” (Matthew 6:34). “Give us today our daily bread” (Matthew 6:11). Daily dependence, like manna in the wilderness. “Praise be to the Lord… who daily bears our burdens” (Psalm 68:19). “His mercies… are new every morning; great is Your faithfulness” (Lamentations 3:22–23). “Trust in the Lord with all your heart… and He will make your paths straight” (Proverbs 3:5–6). “Commit your way to the Lord; trust in Him…” (Psalm 37:5). “You will keep in perfect peace those whose minds are steadfast, because they trust in You” (Isaiah 26:3–4). Day by day. Step by step. The same God who led Joseph leads us still. Both Matthew and Luke understood how important it was to record the family line of Jesus Christ, a line that stretches through the course of history itself. For more than two thousand years, scholars have studied these names, finding meaning and wonder in each one. Found in Matthew 1 and Luke 3, these genealogies are more than simple lists; they are living proof of God’s faithful plan. The Fulfillment of God’s Promises to Israel Both genealogies go back to Abraham, the father of faith, showing Jesus as the promised descendant through whom all nations would be blessed (Genesis 12:1–3). Matthew also emphasizes that Jesus is a direct descendant of David, the rightful heir to an eternal throne (2 Samuel 7:12–16). Here is the promised Messiah—the Son of David—the King people had waited for through the ages. Truly Human, Truly Divine The genealogy places Jesus firmly in real history. He did not come from myth or legend but was born into a real human family. Paul says He was “made of the seed of David according to the flesh” (Romans 1:3). Fully human, yet divinely conceived, Jesus connects heaven and earth. A Story of Grace and Redemption Jesus’ family includes people whose lives were full of struggle and redemption: Tamar, who fought for justice; Rahab, once a woman of Jericho’s streets; Ruth, a foreigner who found a home; Bathsheba, caught in David’s failings; and Manasseh, a wicked king. This family tree shows a powerful truth: God’s grace works through flawed, unexpected people. No past is too broken for His love to redeem. Different Perspectives, One Truth Matthew traces Jesus through Joseph, highlighting His legal right to David’s throne and presenting Him as the MessiahKing to a Jewish audience. Structured in three sets of fourteen generations, it shows His royal heritage. Luke’s genealogy, likely through Mary, goes all the way back to Adam, emphasizing Jesus as the Savior of all humanity—the Son of Man. Together, these accounts declare: Jesus is both King of the Jews and Savior of the world.

The Sharon Star is a monthly publication and mailed as a free-will offering plan. The articles within are intended for inspiration and information to those who are interested in the unfolding revelation of the Word of God. Published by: Global Missions Inc. in North Battleford, Saskatchewan, Canada. The Sharon Star is found online at: www.globalmissionsinc.org/sharon-star Publications Mail Agreement 40012206 Subscribe by mail or online. GLOBAL MISSIONS INC. Global Missions Inc. was founded in 1944, as a Christian mission to promote and encourage the preaching of the gospel to every creature. Global Missions reaches into many countries in Africa, India, the Caribbean, the United States of America, South America and the Philippines. These local churches are established on the foundational truths revealed in God’s word and through His unfolding revelation. Local churches are governed by local residents who are referred to as elders. Global Missions is a nondenominational Christian church. Headquarters: 802 Airport Road North Battleford, SK S9A 2Z3 Canada Mailing Address: P.O. Box 934 North Battleford, SK S9A 2Z3 Canada Telephone: (306) 445-2733 Email: info@globalmissionsinc.org Online: www.globalmissionsinc.org Traveling Ministry Contact List: www.globalmissionsinc.org/about Anchored in Real History Ancient genealogies were legal records. By including Jesus’ lineage, Scripture shows He is not a legend but a real person, born into real families and cultures. Christianity is built on historical truth, not myth. God’s Patient, Unfolding Plan Generation by generation, empire by empire, and covenant by covenant, God’s faithfulness moves through time. The genealogy is a timeline of His preparation, leading to “the fullness of time” (Galatians 4:4) when Jesus came. It shows that nothing—sin, failure, or centuries of waiting—can stop God’s promises. Prophetic Confirmation The Messiah was foretold to come from Judah, the house of David, the family of Abraham, born of a virgin (Isaiah 7:14), and in Bethlehem (Micah 5:2). Jesus’ genealogy fulfills these prophecies, proving that He alone is the promised One. In Summary: The Meaning of the Genealogy This family line shows who Jesus really is: the Messiah, the rightful heir to David’s throne, the fulfillment of God’s promise to Abraham, fully human, and the Savior for the whole world. It also shows God’s grace at work through imperfect people and His faithfulness across all generations. Through this genealogy, God quietly speaks to us: “This is the One. This is My Son. This is your Savior.” Often overlooked in the Christmas story, the genealogy reminds us that Jesus came “in the fullness of time.” It is more than a list of names—it is a tapestry of grace, a thread of promises woven through centuries of waiting. Each ancestor is like a light in the darkness of history, showing the way to the One who would come. It tells us that God works through ordinary people— shepherds and kings, wanderers and widows, the faithful and the flawed— moving His plan forward, not through perfection, but through His unchanging mercy. From Abraham walking under desert stars, to David’s songs from the fields, to Mary’s quiet courage—this family line forms a path of hope. It reminds us that God keeps every promise He makes. It also shows that Jesus entered a real story—blood, breath, and brokenness— into a family much like ours. Redemption grows from human history, fulfilling ancient words with living truth. The genealogy stands as an invitation: God’s plan was never rushed or forgotten. It unfolded patiently until the Light Himself entered the world, carrying the weight of every name before Him and offering grace to every name that would follow. This Christmas, as we celebrate the Son of God—born to bring light to our darkness and hope to our hearts—let us remember the greatest gift: Jesus gave His all for us. The question now is yours—will you give your all to Him? Make this Christmas the moment you open your heart fully to the One who came to save, heal, and restore. Let His love change your life today and forever. “For God so loved the world that He gave His only begotten Son, that whoever believes in Him should not perish but have everlasting life” (John 3:16, NKJV).`, author: 'Andy Snoke', year: 2025, month: 'December', volume: 'Vol. LXXVIII, No. 10', title: 'A Christmas Message', topics: ['Scripture','Christmas','Prophecy'], excerpt: "Andy Snoke delivers a Christmas message on the fullness of time from Galatians 4:4, tracing how God prepared the world through Alexander's Greek language, Rome's Pax Romana roads, Daniel's prophecies, and 400 years of prophetic silence before angels announced Christ's birth to shepherds. Reflects on the genealogies of Matthew and Luke showing Jesus as Messiah-King and Savior of all nations, and the quiet faithfulness of Joseph who raised the Son of God one day at a time.", pdf: '10%20-%20Sharon%20Star%20-%20December%202025.pdf', fileName: '10_-_Sharon_Star_-_December_2025.pdf'  },
  { id: 11, articleText: `Volume LXXIX | Issue 01 | January 2026 There is something stirring in my mind that I would like to share. It is not complex, new or some deep thing. First of all, I wish for all of God’s people to realize just how important each member is. We are members of a body, a family that has by far the most interest, influence and authority in all creation. In our natural lives we often measure by scale our success or position in society by our relative association with prominent, influential or powerful people or organizations. There was a commercial in the 80’s for a financial institution that went like this, “When EF Hutton talks, people listen.” It played into our need to have influence or to know someone with influence. At work, when we look at a resume for a new hire, we look for past experience with companies that are respected for their expertise. We have a worker who once worked for SpaceX. I think it is cool that he met Elon Musk who is expected to become the world’s first trillionaire and has built companies ranging from electric cars to space ships. I offer the fact that each of us here, youngest to oldest, has rubbed shoulders with the most influential, powerful organization and leader, not only of the world, but all creation. Consider This Conversation Between God and Job “Then the LORD answered Job out of the whirlwind, and said, Who is this that darkeneth counsel by words without knowledge? Gird up now thy loins like a man; For I will demand of thee, and answer thou me. Where wast thou when I laid the foundations of the earth? Declare, if thou hast understanding. Who hath laid the measures thereof, if thou knowest? Or who hath stretched the line upon it? Whereupon are the foundations thereof fastened? Or who laid the corner stone thereof; When the morning stars sang together, And all the sons of God shouted for joy? Or who shut up the sea with doors, When it brake forth, as if it had issued out of the womb? When I made the cloud the garment thereof, And thick darkness a swaddling band for it, And brake up for it my decreed place, And set bars and doors, And said, Hitherto shalt thou come, but no further: And here shall thy proud waves be stayed?” (Job 38:1-11, KJV).

God said that Job was a perfect man, but a man nevertheless. This Creator, our God who spoke to Job, has the eminent power over his creation and created all things with a plan. This is the God, our God, who we serve and worship in an intimate way. We don’t brag that we once saw Him walk down the factory floor at SpaceX and shook His hand, in fact we don’t brag at all. We proclaim that we know our Lord and His Son Jesus our Savior in a close way, talking to Him everyday. Our Lord whom we serve has power over all of man’s governments, all nations, all CEO’s, all mankind and the creation. How much more clout can you ask for than saying you know Jesus, the Son of God? This is the cool part, God has a project he is working on that includes and requires our participation. This project is far bigger and more important than getting a presidential candidate to the White House or sending men to Mars, it is rivaled only by the event of creation itself. God Is Building His Church We may say,”He already has a church, several in fact.” But He is still building His church! “Wives, submit yourselves unto your own husbands, as unto the Lord. For the husband is the head of the wife, even as Christ is the head of the church: and he is the saviour of the body. Therefore as the church is subject unto Christ, so let the wives be to their own husbands in every thing. Husbands, love your wives, even as Christ also loved the church, and gave himself for it; that he might sanctify and cleanse it with the washing of water by the word, that he might present it to himself a glorious church, not having spot, or wrinkle, or any such thing; but that it should be holy and without blemish. So ought men to love their wives as their own bodies. He that loveth his wife loveth himself. For no man ever yet hated his own flesh; but nourisheth and cherisheth it, even as the Lord the church: for we are members of his body, of his flesh, and of his bones. For this cause shall a man leave his father and mother, and shall be joined unto his wife, and they two shall be one flesh. This is a great mystery: but I speak concerning Christ and the church” (Ephesians 5:22-32, KJV). God Is Bringing Together His Church, From Other Parts “As the Father knoweth me, even so know I the Father: and I lay down my life for the sheep. And other sheep I have, which are not of this fold: them also I must bring, and they shall hear my voice; and there shall be one fold, and one shepherd” (John 10:15-16, KJV). Our Lord, who we know, has a plan that includes us and requires us to be responsible with the gifts and opportunities he has given us. God Is Building A Kingdom “And he said, So is the kingdom of God, as if a man should cast seed into the ground; and should sleep, and rise night and day, and the seed should spring and grow up, he knoweth not how. For the earth bringeth forth fruit of herself; first the blade, then the ear, after that the full corn in the ear. But when the fruit is brought forth, immediately he putteth in the sickle, because the harvest is come” (Mark 4:26-29, KJV). God Needs Every Member “Now concerning spiritual gifts, brethren, I would not have you ignorant. Ye know that ye were Gentiles, carried away unto these dumb idols, even as ye were led. Wherefore I give you to understand, that no man speaking by the Spirit of God calleth Jesus accursed: and that no man can say that Jesus is the Lord, but by the Holy Ghost. Now there are diversities of gifts, but the same Spirit. And there are differences of administrations, but the same Lord. And there are diversities of operations, but it is the same God which worketh all in all. But the manifestation of the Spirit is given to every man to profit withal. For to one is given by the Spirit the word of wisdom; to another the word of knowledge by the same Spirit; to another faith by the same Spirit; to another the gifts of healing by the same Spirit; to another the working of miracles; to another prophecy; to another discerning of spirits; to another divers kinds of tongues; to another the interpretation of tongues: but all these worketh that one and the selfsame Spirit, dividing to every man severally as he will. For as the body is one, and hath many members, and all the members of that one body, being many, are one body: so also is Christ. For by one Spirit are we all baptized into one body, whether we be Jews or Gentiles, whether we be bond or free; and have been all made to drink into one Spirit. For the body is not one member, but many. If the foot shall say, Because I am not the hand, I am not of the body; is it therefore not of the body? And if the ear shall say, Because I am not the eye, I am not of the body; is it therefore not of the body? If the whole body were an eye, where were the hearing? If the whole were hearing, where were the smelling? But now hath God set the members every one of them in the body, as it hath pleased him. And if they were all one member, where were the body? But now are they many members, yet but one body. And the eye cannot say unto the hand, I have no need of thee: nor again the head to the feet, I have no need of you. Nay, much more those members of the body, which seem to be more feeble, are necessary: and those members of the body, which we think to be less honourable, upon these we bestow more abundant honour; and our uncomely parts have more abundant comeliness. For our comely parts have no need: but God hath tempered the body together, having given more abundant honour to that part which lacked: that there should be no schism in the body; but that the members should have the same care one for another. And whether one member suffer, all the members suffer with it; or one member be honoured, all the members rejoice with it. And God hath set some in the church, first apostles, secondarily prophets, thirdly teachers, after that miracles, then gifts of healings, helps, governments, diversities of tongues. Are all apostles? are all prophets? are all teachers? are all workers of miracles? Have all the gifts of healing? do all speak with tongues? do all interpret? But covet earnestly the best gifts: and yet shew I unto you a more excellent way” (1 Corinthians 12:1-26, 28-31, KJV). Whenever there is a construction project in this world, there is also on that construction site many materials, separated by item or type. For the foundation, material is excavated and sorted by size, sand here, gravel there, everything is sorted. The foundation is then first stabilized by specific size sand or gravel at just the right mixture and compacted. Next, cement is poured into forms. Cement is made of aggregate and minerals extracted from the soil and separated, then combined at just the right mixture.

The rest of a building is the same, you will see a pile of 2 x 4s here, plywood there, everything separated in their groups. Next, the builder constructs the house, using this material in the exact location indicated by the blueprint, combining all of the various materials to make a beautiful house. God does similarly. He has various materials for His Church, various gifts and ministries, and He combines them to one day complete a beautiful house, the bride of Christ, without spot or wrinkle. What God does differently than a man-made construction project, is that He leaves all the variety of material intermingled with one another. You will see in one family a nail and cement, in another family a sheet of plywood, gravel and 2 x 4’s, all intermingled. He doesn’t need to sort in nice neat piles. In fact, his piles can look a little messy, but He is the master builder with His blueprint memorized, and He will complete His work in a perfect way. Amen “Cast all your anxiety on him because he cares for you.” (1 Peter 5:7, NIV). The Apostle Peter exhorts the universal church scattered throughout the then-known world to throw away all anxieties on Jesus Christ because he cares for you. “You can throw the whole weight of your anxieties upon him, for you are his personal concern” (1 Peter 5:7, PHILLIPS). This instruction is relevant and applicable even today in our lives. Anxiety is a feeling of worry, nervousness or unease typically about an imminent event or something with an uncertain outcome. It is very clear through our own experiences that anxieties have played a dominant role in weakening our faith as the children of God. Anxiety causes fear, doubt and diffidence in our spiritual and natural lives.. In this short meditation, we will analyze how we can treat anxiety from a biblical and spiritual perspective. First of all, we have to unburden all our anxiety on Jesus Christ In order to do that, we have to believe in Jesus Christ as our personal Savior and trust that he has made us more than conquerors of all situations. “Who can separate us from the love of Christ? Can trouble, pain or persecution? Can lack of clothes and food, danger to life and limb, the threat of force of arms? Indeed some of us know the truth of that ancient text: For thy sake we are killed all the day long; We were accounted as sheep for the slaughter. No, in all these things we win an overwhelming victory through him who has proved his love for us” (Romans 8:35-37, PHILLIPS). All these things which the apostle Paul mentioned cause internal timidity and lead to a stressful life. However, again the apostle Paul encouraged us that our Lord Jesus has given us an overwhelming victory through His love. In Psalms we read, “This poor man called, and the Lord heard him; he saved him out of all his troubles” (Psalm 34:6, NIV). Secondly, seek first the kingdom of God and His righteousness Jesus taught this important truth to the people during the sermon on the Mount. A huge crowd was following him. (Matthew 5:1) Many of them were in need of physical necessities such as food and clothing and very anxious about their future life. Knowing the heart of the people, Jesus addressed their physical needs (see Matthew 6:25- 31). Jesus said, “Who of you by worrying can add a single hour to his life?” (Matthew 6:27, NIV). Clearly, Jesus exhorts the people about the negative impact of worrying. It achieves nothing but sorrow and depression. Worrying is not a positive confidence builder, instead it drains all your enthusiasm and leads to a gloomy outlook. Eventually, a worrier will always be unable to see the hand of God moving because of the thick veil of fear and nervousness covering

The Sharon Star is a monthly publication and mailed as a free-will offering plan. The articles within are intended for inspiration and information to those who are interested in the unfolding revelation of the Word of God. Published by: Global Missions Inc. in North Battleford, Saskatchewan, Canada. The Sharon Star is found online at: www.globalmissionsinc.org/sharon-star Publications Mail Agreement 40012206 Subscribe by mail or online. GLOBAL MISSIONS INC. Global Missions Inc. was founded in 1944, as a Christian mission to promote and encourage the preaching of the gospel to every creature. Global Missions reaches into many countries in Africa, India, the Caribbean, the United States of America, South America and the Philippines. These local churches are established on the foundational truths revealed in God’s word and through His unfolding revelation. Local churches are governed by local residents who are referred to as elders. Global Missions is a nondenominational Christian church. Headquarters: 802 Airport Road North Battleford, SK S9A 2Z3 Canada Mailing Address: P.O. Box 934 North Battleford, SK S9A 2Z3 Canada Telephone: (306) 445-2733 Email: info@globalmissionsinc.org Online: www.globalmissionsinc.org Traveling Ministry Contact List: www.globalmissionsinc.org/about him or her. That’s why Jesus taught his disciples not to worry over things because, “the pagans run after all these things, and your heavenly Father knows that you need them. But seek first the kingdom and his righteousness, and all these things will be given to you as well. Therefore, do not worry about tomorrow, for tomorrow will worry about itself. Each day has enough trouble of its own” (Matthew 6:32-34, NIV). Worrying or being extremely anxious over something, gives a foothold for the enemy to exacerbate doubt and fear. Also, it makes us forget the goodness of the Lord in our lives. Thirdly, put on Jesus’ yoke and learn from him “Come to me, all you who are weary and burdened, and I will give you rest” (Matthew 11:28, NIV). Jesus knew very well that the people of the time (Jews) were overburdened with the laws and regulations of the Torah. To the Jews, religion was a thing of endless rules. People lived in a forest of regulations which dictated every action. They must listen forever to a voice which says, “You shall not.” The Torah identifies 613 commandments (mitzvot). The conditions of Sabbath rules, dietary laws, religious laws and the types of sacrifices were simply too much for the people to endure. It was very timely when Jesus gave this message of hope and deliverance to unburden the people from this legalism. Temple worship, types of sacrifices, and different modes of offerings caused the people to be circumscribed to a huge fiscal burden which they could not carry by themselves. Even after having done all these rituals for the forgiveness of sins, it was only for a time. They had to repeat all over again, the following year.. This was the backdrop of the conditions of Jewish people when Jesus invited them to come to Him so that He could give them rest (spiritual) from all the religious suppression of Judaism. The yoke of Jesus is easy and His burden is light (Matthew 11:30). Fourthly, cast your cares on the Lord “Cast your cares on the Lord and he will sustain you; he will never let the righteous fall” (Psalm 55:22, NIV). The psalmist, David, experienced trials and temptations throughout his lifetime. He is advising us to throw all our cares or worries on Him who sustains us in our life. David has often referred to God as his refuge and fortress. When enemies surrounded him, he would not be afraid but have confidence in the Lord. “He who dwells in the shelter of the Most High will rest in the shadow of the Almighty. I will say of the Lord, ‘He is my refuge and my fortress, my God in whom I trust’” (Psalms 91:1-2, NIV). David’s words suggest that we must fully entrust all our worries, burdens or anxieties to God, rather than trying to carry them on ourselves. Regardless of the situation, God is more capable than any human being could ever be. David realized the victory when he released all his worries and fears into the care of the Lord. The weight of our anxieties is completely transferrable into His (Jesus’) hands. In conclusion, we live in a world of stress, worries and uncertainties. We are choked like the one who heard the word, but the worries of this life and the deceitfulness of wealth choked it, making it unfruitful (Matthew 13:22). It is characteristic of modern life that it becomes increasingly crowded and fast. We are too busy to pray and study the word of God. In the busy world that we are living in, we must not forget to pray both privately and at the family altar. One of the ways of reducing stress in our life is by spending some time each day in prayer and Bible study. That is how we can cast our burdens on the Lord. Jesus tells us to to take his yoke us and He will help us carry the load. The burden will become light and easy when we are yoked with Him. “For my yoke is easy, and my burden is light” (Matthew 11:30, NIV).`, subtitle: 'Cast All Your Anxiety on Him: PJ Mathew', author: 'Brandon Snoke', year: 2026, month: 'January', volume: 'Vol. LXXIX, No. 01', title: "God's Construction Site", topics: ['Scripture','Church','Holy Spirit'], excerpt: "Brandon Snoke reflects on the privilege of knowing the body of Christ and God's ongoing project of building His church without spot or wrinkle. Uses a construction site analogy from 1 Corinthians 12 to show how God combines diverse spiritual gifts into a beautiful bride for Christ. PJ Mathew adds Cast All Your Anxiety on Him from 1 Peter 5:7, with four biblical steps to overcoming anxiety through Christ, prayer, and seeking first the kingdom of God.", pdf: '01%20-%20Sharon%20Star%20-%20January%202026.pdf', fileName: '01_-_Sharon_Star_-_January_2026.pdf'  },
  { id: 12, articleText: `Volume LXXIX | Issue 02 | February/March 2026 There have been many messages given throughout time about the thief on the cross. This will not be the first or the last. My recalling of this beautiful story will not be unique. The true story of the thief on the cross remains an amazing account that often baffles the spiritual theologians of the day. It is a story of the gospel in the simplest form. When Jesus Christ was condemned to death on the cross, he was placed between two criminals - two thieves. Jesus was in the middle. The Bible does not tell us what their crimes were, but in the words of one of the criminals himself, we find that it was for crimes worthy of death. They were taken to a place called Calvary, also translated in the ESV as “The Skull.” “There were also two others, criminals, led with Him to be put to death. And when they had come to the place called Calvary, there they crucified Him, and the criminals, one on the right hand and the other on the left” (Luke 23:32-33, NKJV). “Do you not fear God, since you are under the same sentence of condemnation? And we indeed justly, for we are receiving the due reward of our deeds; but this man has done nothing wrong” exclaimed the thief on the cross to the other criminal in Luke 23:40. The thief acknowledged that his crimes were worthy of death. At about 9 a.m. that morning, Jesus and the two thieves were led to their place of crucifixion. Three crosses were prepared. We know that Jesus was mocked. He was scourged. Nails were driven through his hands and feet before being hoisted up on the cross. The two thieves would have had a similar fate. I can imagine in my mind that the thieves, at 9 am that morning, were expecting to do no more than suffer and die for their crimes on that fateful day. Going to heaven was not on their list of objectives for the day. Only death faced them. Most likely their language was filled with curses for the Romans, their captors and executioners. There probably was not much virtue flowing from the hearts of the two thieves. As the hours slowly passed and the excruciating drama of slow suffocation set in, the Roman guards gambled for Jesus garments

at the foot of the cross. The crowd mocked Jesus. The rulers shouted, “He saved others, let him save himself: If he is the Christ of God, His chosen one” (Luke 23:35)! The drama that played out at the foot of the cross had been foretold 1,000 years earlier in Psalm 22. 1. All who see me mock me (Psalms 22:7). 2. They have pierced my hands and feet (Psalms 22:16). 3. I can count all of my bones (Psalms 22:17). 4. They divide my garments among them, and for my clothing, they cast lots. This is amazing because it was illegal for the Roman soldiers to gamble at the foot of the cross, and yet they did fulfill a 1,000-year-old prophecy (Psalms 22:18). In the midst of the scoffers, the slow death, the humiliation, the blood loss, Jesus exclaimed, “Father, forgive them, for they know not what they do” (Luke 23:34a, NKJV)! We will never know, but was this the moment that brought mental and spiritual clarity to one of the two criminals? When he saw an innocent man call out to God to forgive those who placed Him on the cross? All we know is that something sincere and genuine suddenly sparked in the heart of one of the thieves. Inafewshorthours,eventheRomancenturionsoldier,thecaptain over 100 soldiers would exclaim, ”Now when the centurion saw what had taken place, he praised God saying, “Certainly this man was innocent” (Luke 23:47, NKJV). In a few short years, another follower of Jesus, Stephen, a deacon mightily used by God, would be falsely accused and would die a horrific death by stoning. As Stephen’s life was slipping away, Stephen would fall to his knees and echo the words that Jesus said on the cross: “Father, forgive them.” “Then they cried out with a loud voice, stopped their ears, and ran at him with one accord; and they cast him out of the city and stoned him. And the witnesses laid down their clothes at the feet of a young man named Saul. And they stoned Stephen as he was calling on God and saying, ‘Lord Jesus, receive my spirit.’ Then he knelt down and cried out with a loud voice, ‘Lord, do not charge them with this sin.’And when he had said this, he fell asleep’” (Acts 7:57-60, NKJV). “Then, one of the two criminals who were hanged, blasphemed Him, saying, “If You are the Christ, save Yourself and us” (Luke 23:39, NKJV). But the other, answering, rebuked him, saying, “Do you not even fear God, seeing you are under the same condemnation? And we indeed justly, for we receive the due reward of our deeds; but this Man has done nothing wrong. Then he said to Jesus, ‘Lord, remember me when You come into Your kingdom.’ And Jesus said to him, ‘Assuredly, I say to you, today you will be with Me in Paradise’” (Luke 23:39-43, NKJV). In this short narrative, we see that Jesus opened a door to heaven for one of the two thieves, the repentant thief, that very day. At about 9 a.m. that very morning, the criminal had anticipated a painful death, nothing more, just the end of his miserable and failed life. By 6 p.m. that evening, he was ushered into Paradise, or heaven. Don’t get caught up as a reader in the choice of words. This was a miracle. We rejoice in the simplicity of this salvation experience. This experience, recorded by Dr. Luke, the great Gentile writer who wrote about 30% of the New Testament, has brought great joy to us all and has also raised many questions for the legalists. Jesus’ answer to the unnamed, but repentant, criminal was too simple, some might say. “Today you will be with ME in Paradise.” Some might imagine the thief trying to make his way into heaven, and perhaps being stopped at the gate (as if there were one!). The skeptic might say, “Where are your credentials, Mr. Thief?” Did you understand the doctrine of justification? Were you baptised in water? Were you filled with the Spirit? What Church did you go to? Did you prophesy? Did you tithe? Did you go to church camp? Were you a good man? A good father? A good husband? Did you partake of communion? Did you read your Bible through in a year? Did you memorize scripture? One can imagine Mr.Thief explaining to the skeptics, as he makes his grand entrance into heaven, that “The Man in the Middle said I could be with Him.” How can this be true? Jesus had said this very thing to the disciples in John 14: ““Let not your heart be troubled; you believe in God, believe also in Me. In My Father’s house are many mansions; if it were not so, I would have told you. I go to prepare a place for you. And if I go and prepare a place for you, I will come again and receive you to Myself; that where I am, there you may be also. And where I go you know, and the way you know.” Thomas said to Him, “Lord, we do not know where You are going, and how can we know the way?” Jesus said to him, “I am the way, the truth, and the life. No one comes to the Father except through Me’” (John 14:1-6, NKJV). Let me pause for a moment, my friends, and say something that is not pleasant to the ears, but has eternal implications. There is only ONE WAY into heaven. Jesus is the way. Noah’s ark only had ONE door as a symbol that there was only one way into safety. The blood during the passover was applied to ONE DOOR of the home. Jesus is the only way. The two thieves, the two criminals, were hung on their respective crosses unknowingly beside the only way into heaven that fateful morning. So close, and at the same time, so far. One was close to salvation. He recognized it and embraced it. We don’t know about the other one.

“But what does it say? “The word is near you, in your mouth and in your heart” (that is, the word of faith which we preach): that if you confess with your mouth the Lord Jesus and believe in your heart that God has raised Him from the dead, you will be saved. For with the heart one believes unto righteousness, and with the mouth confession is made unto salvation. For the Scripture says, “Whoever believes on Him will not be put to shame.” For there is no distinction between Jew and Greek, for the same Lord over all is rich to all who call upon Him. For “whoever calls on the name of the LORD shall be saved” (Romans 10:8-13, NKJV). Let’s take a look at what happened to the thief, for truly all the elements of salvation took place in a few flashing moments on the cross. 1. The thief perceived his own guilt; he repented: “We receive the due reward of our deeds; but this man has done nothing wrong” (Luke 23:41). 2. He acknowledged Christ and prayed for forgiveness: “Do you not even fear God…. Lord, remember me when You come into Your kingdom” (Luke 23:40,42). It is not through many and mighty words that we are saved. “For by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, lest anyone should boast. For we are His workmanship, created in Christ Jesus for good works, which God prepared beforehand that we should walk in them” (Ephesians 2:8-10, NKJV). The thief may not have used the proper words that we often use when leading souls to Christ. He did not have time or opportunity to be water baptized. He did not have time or opportunity to be part of a local church. His life was quickly dripping away on the cross with no time to spare to make things right with God. “And as it is appointed for men to die once, but after this the judgment, so Christ was offered once to bear the sins of many. To those who eagerly wait for Him He will appear a second time, apart from sin, for salvation.” (Hebrews 9:27-28, NKJV). The proverbial clock was ticking. He had run out of time, but in the last 3 or 4 hours of his physical life, he made a decision that affected him for eternity. He met “The Man in the Middle; the Lord Jesus Christ.” The sad part of the story is that we do not hear the same testimony from the other thief. Both had the same opportunity, only one repented. At the cross, a new door was opened by the shedding of blood by the Lamb of God. No longer would it be necessary to go to a high priest to intercede on behalf of God’s people. Animal sacrifices were no longer needed. A brand new door and a brand new way were opened for all of mankind into heaven, for all who would make the choice. And it is a choice, a conscious, decisive choice. I find it so ironic and yet such a grand display of the grace of God, that when this new door of salvation was opened by the work of the cross, perhaps the first human soul to make their way to “Paradise” was not a Rabbi, not a Pharisee, not even one of the Apostles, but an unnamed, repentant thief on the cross. How fitting that Jesus died for sinners! Permit me to reprint a short write-up I prepared some time ago on the last words of Jesus, “It is finished.” Tetelestai (Gk), a Greek word meaning “paid in full” is also translated as “It is finished.” Business documents unearthed from the days of Christ would often show a bill with the word tetelestai written across the top meaning, this bill has been “paid in full.” It is finished. There is no more debt to be paid. There are only two times that this word is used in the New Testament. In John 19:28 and in John 19:30. “Then when he received the sour wine, Jesus said, “It is finished (Tetelestai), and he bowed His head and gave up the Spirit” (John 19:30). Those who heard those words ring through the air from our suffering Christ must have been very familiar with that term. “Testelestai!” “It is finished.” It is complete. It is paid in full. No more debt! 2 Corinthians 5:21, “For our sake he made him to be sin who knew no sin, so that in him we might become the righteousness of God.” All of creation, past, present, and future, was, is, and will be affected by those three powerful words! “It is finished!” (testelestai!). You can almost visualize the angels falling before the throne in celestial awe of those magnificent words. God planned for this very moment from before the foundation of the world.All of God’s plans for creation, for the kingdom, for the eternities beyond the eternities, all pivoted on that great payment for sin when Jesus exclaimed, “It is finished!” What was the thief’s name? Who was that criminal? He was me. He was you. It was our dark sins that were nailed to the cross, on Jesus’ cross. It was I who said, “ I deserve to be here, but you don’t.” It was you who said the same. There is no sin too great that cannot be nailed to that cross. It was you and me that Jesus spoke to, saying, “You will be with me.” “ I have been crucified with Christ; it is no longer I who live, but Christ lives in me; and the life which I now live in the flesh I live by faith in the Son of God, who loved me and gave Himself for me” (Galatians 2:20, NKJV). I have been blessed, very blessed, embarrassingly blessed! I grew up in a home with two parents who took us to church as children. Parents who loved one another, and I learned to love my wife, by what I saw in my home. I met the “Man in the Middle” when I
