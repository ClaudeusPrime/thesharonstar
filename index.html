sin who knew no sin, so that in him we might become the righteousness of God.” All of creation, past, present, and future, was, is, and will be affected by those three powerful words! “It is finished!” (testelestai!). You can almost visualize the angels falling before the throne in celestial awe of those magnificent words. God planned for this very moment from before the foundation of the world.All of God’s plans for creation, for the kingdom, for the eternities beyond the eternities, all pivoted on that great payment for sin when Jesus exclaimed, “It is finished!” What was the thief’s name? Who was that criminal? He was me. He was you. It was our dark sins that were nailed to the cross, on Jesus’ cross. It was I who said, “ I deserve to be here, but you don’t.” It was you who said the same. There is no sin too great that cannot be nailed to that cross. It was you and me that Jesus spoke to, saying, “You will be with me.” “ I have been crucified with Christ; it is no longer I who live, but Christ lives in me; and the life which I now live in the flesh I live by faith in the Son of God, who loved me and gave Himself for me” (Galatians 2:20, NKJV). I have been blessed, very blessed, embarrassingly blessed! I grew up in a home with two parents who took us to church as children. Parents who loved one another, and I learned to love my wife, by what I saw in my home. I met the “Man in the Middle” when I

 was quite young. Then I drifted a little, as many do. And then, as a young teenager, the “Man in the Middle,” the Lord Jesus Christ, asked again for my all. Though on one hand I gave up much, on the other, looking back over the decades, I can see that I only gained. I gained so much. I never lost. “Repent therefore and be converted, that your sins may be blotted out, so that times of refreshing may come from the presence of the Lord” (Acts 3:19, NKJV). Do you know this Jesus? You can. Both men who were hung on adjacent crosses beside Jesus had the same opportunity to have their sins washed away, and an entrance to heaven made for them. Only one made the choice. The choice is yours. Don’t wait.`, author: 'Andy Snoke', year: 2026, month: 'February/March', volume: 'Vol. LXXIX, No. 02', title: 'The Man in the Middle', topics: ['Salvation','Scripture','Evangelism'], excerpt: "Andy Snoke tells the story of the repentant thief crucified beside Jesus, who in his final hours recognized Christ's innocence, confessed his own guilt, and received the promise Today you will be with Me in paradise. Examines all the elements of salvation: repentance, faith, confession. Reflects on tetelestai — It is finished, paid in full — as the declaration that sin's debt is fully cancelled. Also includes the 2026 camp schedule for  ", pdf: '02%20-%20Sharon%20Star%20-%20February-March%202026.pdf', fileName: '02_-_Sharon_Star_-_February-March_2026.pdf'  },
  { id: 13, articleText: `Volume LXXIX | Issue 03 | April/May 2026 Outside the walls of ancient Jerusalem stood Golgotha (also known as Calvary), the Place of the Skull. A barren, stony ridge with holes hewn from the rock where men were hoisted upon crosses and forced upright into the stone. A place of hopelessness, a stark reminder of mortality. Yet it was here that the wickedness of the world met its most remarkable defeat. On that day, two thousand years ago, as Christ hung upon the cross, Golgotha became the stage for a victory far greater than any earthly triumph. There, in the shadows of the city walls, one Man bore the weight of the world’s sin, and the earth itself stood witness. The Scriptures testify to the depth of His suffering. As the prophet Isaiah declared seven centuries before, “His appearance was so disfigured beyond that of any human being and his form marred beyond human likeness” (Isaiah 52:14, NIV). Yet in the midst of those terrible hours, He spoke words that changed the course of history and created a new covenant between God and man. They were not cries of defeat, but the enduring words of the Son of God. Words that revealed true victory. The death of Christ on that rough and blood-stained tree, which to the world looked like the end of a failed cause, became the very means by which sin was conquered, death undone, and eternal hope secured for all who believe. Unlike those early disciples, we are granted the privilege of knowing the whole account, complete and unbroken from beginning to end. But even still, we do not see everything clearly. Much of eternity remains veiled; we sense its nearness, we catch glimpses and shadows, but our grasp remains partial and our understanding is dimmed. Faith, then, remains our steadfast anchor. It is not because of what our eyes see, but by faith in the One who has spoken, who has promised, and whose word will not fail. We do not believe because we perceive all, but because we know Him and in His hands is the destiny of all things. Before we hear His words from the cross, let us walk with Him along the path that led to that dreadful place, Golgotha, where the destiny of the world was sealed by God’s love and grace. The Garden of Gethsemane In the quiet shadow of olive trees, Jesus withdrew to pray, His heart heavy with the weight of what was to come. He fell upon His face, beseeching the Father: “O my Father, if it be possible, let this cup pass from me: nevertheless not as I will, but as thou wilt” (Matthew 26:39, KJV). Despite being told to watch, His disciples slept, unable to grasp

the gravity of the moment. Sweat fell from Him like drops of blood, a testimony to His anguish and resolve: “And being in agony, He prayed more earnestly. Then His sweat became like great drops of blood falling down to the ground” (Luke 22:44, NKJV). In obedience and love, He rose, accepting the path that would lead to the cross. Judas and the Kiss Judas approached with a band of soldiers, identifying Jesus with a kiss: “Now His betrayer had given them a sign, saying, “Whomever I kiss, He is the One; seize Him.” Immediately he went up to Jesus and said, “Greetings, Rabbi!” and kissed Him.” (Matthew 26:48-49, NKJV). In that moment of betrayal, Peter drew his sword and attacked the soldiers but Jesus intervened to prevent further harm: “And one of them smote the servant of the high priest, and cut off his right ear. But Jesus answered and said, Suffer ye thus far. And he touched his ear, and healed him”(Luke 22:50–51, KJV). Even Judas, stricken with remorse, sought to undo his treachery, but the path to the cross could not be turned aside. Pilate and Jesus Before the Roman governor, Jesus stood. Silent and unyielding amid a fury of accusations: “And Jesus stood before the governor: and the governor asked him, saying, Art thou the King of the Jews? And Jesus said unto him, Thou sayest” (Matthew 27:11, KJV). Though the chief priests and elders clamored loudly, Jesus’silence was thunderous: “But when he was accused of the chief priests and elders, he answered nothing” (Matthew 27:12, KJV). At the feast, custom dictated one prisoner would be released. Pilate offered the crowd a choice: Barabbas, a notorious criminal, or Jesus, the innocent Christ: “And at that feast the governor was wont to release unto the people one prisoner, whom they would. And they had then a notable prisoner, called Barabbas” (Matthew 27:15–16, KJV). Pilate’s wife, troubled by a dream, sent a word of warning: “Have thou nothing to do with that just man: for I have suffered many things this day in a dream because of him” (Matthew 27:19, KJV). Yet the crowd was not deterred: “But the chief priests and elders persuaded the multitudes that they should ask for Barabbas and destroy Jesus. The governor answered and said to them, “Which of the two do you want me to release to you?”They said, “Barabbas!”” (Matthew 27:20-21, NKJV). Pilate, seeking justice, asked: “Why, what evil hath he done?” (Matthew 27:23). Pilate washed his hands before the multitude: “I am innocent of the blood of this just person: see ye to it” (Matthew 27:24, KJV). The crowd replied: “His blood be on us, and on our children” (Matthew 27:25, KJV). So Jesus was scourged and sent to the cross. Barabbas, the notorious murderer, was set free. The Soldiers’ Mockery The soldiers spat upon Jesus, struck Him, and mocked Him with cruel laughter. They clothed Him in a robe of scorn and pressed a crown of thorns upon His brow: “And they platted a crown of thorns, and put it on his head, and a reed in his right hand: and they bowed the knee before him, and mocked him, saying, Hail, King of the Jews! And they spit upon him, and took the reed, and smote him on the head. And after that they had mocked him, they took the robe off from him, and put his own raiment on him, and led him away to crucify him” (Matthew 27:29–31, KJV). The King on the Cross Simon of Cyrene was compelled to bear the cross: “And they compel one Simon a Cyrenian, who passed by, coming out of the country, the father of Alexander and Rufus, to bear his cross” (Mark 15:21, KJV). At Golgotha, bitter wine mingled with gall was offered, but Jesus refused: “They gave him vinegar to drink mingled with gall: and when he had tasted thereof, he would not drink” (Matthew 27:34, KJV). The vinegar itself was a common, low grade sour wine, but when mixed with this bitter element it functioned as a crude pain dulling drink. Jesus tastes it but refuses to drink, indicating a deliberate choice to endure the suffering fully. Nails were driven through His hands and feet. His garments were divided and cast by lot, fulfilling the words of Scripture: “They part my garments among them, and cast lots upon my vesture” (Psalm 22:18, KJV; John 19:23–24). Above Him, a sign proclaimed: “JESUS OF NAZARETH THE KING OF THE JEWS” (John 19:19, KJV). Two criminals hung beside Him. One mocked, but the other believed and to that penitent thief He gave the promise of paradise: “And he said unto Jesus, Lord, remember me when thou comest into thy kingdom. And Jesus said unto him, Verily I say unto thee, Today shalt thou be with me in paradise” (Luke 23:42-43, KJV). The crowd taunted Him: “If thou be the Son of God, come down from the cross” (Matthew 27:40, KJV). The Turning Point of History After Christ died, darkness fell from noon till three: “And when the sixth hour was come, there was darkness over all the land until the ninth hour” (Mark 15:33, KJV). In Jewish timekeeping, the sixth hour is about noon and the ninth hour about 3 p.m. The temple veil tore, the earth trembled, and rocks were split: “Then, behold, the veil of the temple was torn in two from top to bottom; and the earth quaked, and the rocks were split” (Matthew 27:51, NKJV). Saints rose from the grave: “And the graves were opened; and many bodies of the saints who had fallen asleep were raised; and coming out of the graves after His resurrection, they went into the holy city and appeared to many” (Matthew 27:52, NKJV). The centurion and those around him were suddenly convinced of who Jesus was: “So when the centurion and those with him, who were guarding Jesus, saw the earthquake and the things that had happened, they feared greatly, saying, “Truly this was the Son of God!” (Matthew 27:54, NKJV). Let us now consider together the final words spoken by Christ from the cross. These words, spoken in suffering yet with clarity and purpose, draw together all that has led to this moment and reveal forgiveness, fulfillment, trust, and victory as He completes His work.

The Testament Of Golgotha “Father, forgive them, for they do not know what they do” (Luke 23:34, NKJV). His first words from the cross were not a cry for relief, not a protest of innocence but a prayer for the forgiveness of others. Even in the grip of agony, His thoughts were not of Himself, but of us. He gazed on those who had driven the nails, who mocked and reviled Him, yet His divine love did not demand justice, but grace. When Jesus teaches the disciples to pray, He immediately follows the prayer with this reminder. “For if you forgive men their trespasses, your heavenly Father will also forgive you. But if you do not forgive men their trespasses, neither will your Father forgive your trespasses” (Matthew 6:14-15, NKJV). He then embodied those words on the cross when he prayed, “Father, forgive them; for they know not what they do” No guilt can be so heavy, no past so dark, that the first words from Calvary cannot cover it. Forgiveness spoken in suffering is a mercy made all the more powerful, all the more complete. “Assuredly, I say to you, today you will be with Me in Paradise” (Luke 23:43, NKJV). Jesus speaks words of hope to a man weighed down by a lifetime of failure and crime. To the thief who confessed his guilt and turned in faith, the Lord offers not condemnation, but the promise of eternity. Though the thief’s mortal life remained and he died on the cross, his faith rewarded him with life everlasting. This is a declaration that no past is beyond redemption, no sin beyond pardon, when met with repentance and trust. “Woman, behold thy son!” and “Behold thy mother!” (John 19:26–27, KJV). Amid His own suffering, Jesus turns His gaze not inward, but outward, attending to the needs of those He loved. With these words, He entrusts the care of His mother to His beloved disciple. This act speaks to a greater truth: even in the midst of agony, love commands attention; duty calls forth sacrifice. It is a solemn reminder that the bonds of human care endure beyond death, and that in Christ’s kingdom, we are called to bear one another’s burdens, to carry one another’s hopes. “My God, my God, why hast thou forsaken me?” (Matthew 27:46 KJV). This is not the cry of a man merely suffering but of Christ shouldering the unfathomable weight of the world’s sin. Jesus was fully human and experienced the depth of abandonment and suffering. In that moment, He bore the full separation from God that sin causes. Spiritually, God was not abandoning the Son but the separation was necessary for Jesus to fulfill His role as the sin-bearer for humanity. “For He made Him who knew no sin to be sin for us, that we might become the righteousness of God in Him” (2 Corinthians 5:21, NKJV). This is the voice of prophecy fulfilled, a purpose pursued through suffering. In these words, we witness the meeting of the divine and the broken. The hour when the price of salvation was measured and fully paid. “I thirst” (John 19:28) — Fully Human The words here reach back to Jesus’ encounter with the woman at the well in John 4, revealing a striking contrast and an even greater fulfillment. In John 4:7, Jesus begins the conversation with the Samaritan woman by saying, “Give me to drink.” His physical thirst becomes the doorway to a deeper truth: the soul’s longing for eternal life. He tells her in John 4:14, “Whosoever drinketh of the water that I shall give him shall never thirst.” Jesus presents Himself as the source of living water, able to satisfy the soul forever. Now, on the cross, Jesus says, “I thirst.” It is not merely physical agony, it is the echo of spiritual desolation. He who once offered the water of life now suffers thirst, emptied and forsaken, bearing the full weight of sin. • At the well, Jesus offers to quench the thirst of the soul. • On the cross, He endures thirst Himself, so we never have to. This offers an incredibly vivid glimpse of His true humanity: He endured pain, He bled, He thirsted. The words “I thirst” remind us that Jesus did not hover above suffering, He entered into it. This was no shadow of reality, God became man and endured everything for us. “It is finished” (John 19:30) — Fully God This marks the completion of the work of salvation. With this declaration, the debt of sin is paid, death is defeated, and God’s plan of redemption is fulfilled. Nothing more needs to be added; Christ’s atonement was perfect, complete, and final.This statement comes from the one person of Christ, who is both fully God and fully man, proclaiming that the divine mission entrusted to Him was perfectly accomplished. He fulfilled the eternal plan of salvation set before the foundation of the world (Revelation 13:8), and His sacrifice is sufficient for all sin for all time (Hebrews 10:12-14). By declaring, “It is finished,” He spoke with divine authority, sealing the work of redemption. As the Son of Man, He lived in perfect obedience under the Law (Galatians 4:4), enduring suffering, temptation, and death without sin (Hebrews 4:15). In His humanity, He bore our griefs and carried our sorrows (Isaiah 53:4-6), completing the human side of His mission. Christ’s words on the cross are a declaration that all prophetic requirements were fulfilled. “Father, into thy hands I commend my spirit” (Luke 23:46). In these final words, the Savior places His trust entirely in the hands of the Father. With calm and resolute faith, He surrenders His life, yielding to death, but unyielding in purpose. He did not fall into death; He stepped into it, not as a victim overtaken, but as a Son obedient to the very end. This was no collapse, no cry of defeat, but the deliberate yielding of a life wholly given. It is the ultimate act of obedience, surrender and faith, and a demonstration of perfect confidence in His loving Father, who would raise Him from the dead. From the prayer of forgiveness for those who harmed Him, to the promise of paradise given to a repentant thief and from the tender

 care for His mother to the cry of forsakenness that bore our sin, each word speaks of a purpose greater than pain. The declaration of thirst, the solemn announcement that “It is finished,” and the final surrender into the Father’s hands, all proclaim the completion of a journey that conquers death and opens the door to eternal life. The Triumph Of Calvary Underpinning it all was prayer, the lifeline to the Father that sustained the Son in His darkest hours. From Gethsemane to Calvary, Jesus’ communion with God was the source of His strength and the resolve to fulfill the redemptive plan. His prayers were not merely pleas but acts of obedience and trust, shaping the very path to victory. For those who believe, the cross is not an end, it is the beginning of a new covenant, a new creation, and the promise of everlasting life. The crucifixion of Jesus stands as the solemn fulfillment of prophecies spoken centuries before His birth, realized through the steadfast prayers and obedience of God’s own Son. He calls us to be people of prayer, for just as prophecy reached its fulfillment on Calvary, so too shall the promises of His return and the gift of eternal life be realized through the prayers of the faithful. The resurrection of Jesus is the ultimate declaration of hope and renewal. Death could not hold Him; the grave could not contain Him. In rising from the dead, Christ reveals that God’s power transcends all fear, overcomes every failure, triumphs over every sorrow, and stretches far beyond human understanding. The resurrection proves that life conquers death, light dispels darkness, and God’s love endures unshakably. For those who believe, it is not merely a historical event, it is a living reality. “For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord” (Romans 8:38-39). Christ rose from the grave, speaking beyond His disciples to every generation: repent and receive forgiveness. Walk in the light of God’s kingdom, bear witness, and carry His truth to the ends of the earth. In Him, Scripture is fulfilled, hope is revealed, and death is defeated. The grave could not hold Him, and His message of salvation continues until all have heard. We are called to readiness under the covenant sealed by His blood, shaped by the cross, once a symbol of death but now the sign of salvation and hope. Strengthened in endurance, we press on until our lives reflect Jesus Christ alone. “I have been crucified with Christ; it is no longer I who live, but Christ lives in me; and the life which I now live in the flesh I live by faith in the Son of God, who loved me and gave Himself for me.” (Galatians 2:20, NKJV). The Church stands at the threshold of history, called to proclaim the crucified Savior in steadfast unity. We live in joyful hope of His return, awaiting the day when we will dwell forever in the splendor of God’s eternal Kingdom: “Even so, come, Lord Jesus” (Revelation 22:20, KJV). “Then I looked, and I heard the voice of many angels around the throne, the living creatures, and the elders; and the number of them was ten thousand times ten thousand, and thousands of thousands, saying with a loud voice: ‘Worthy is the Lamb who was slain to receive power and riches and wisdom, and strength and honor and glory and blessing!’ And every creature which is in heaven and on the earth and under the earth and such as are in the sea, and all that are in them, I heard saying: ‘Blessing and honor and glory and power be to Him who sits on the throne, and to the Lamb, forever and ever!’” (Revelation 5:11-13, NKJV).`, author: 'DJ Olson', year: 2026, month: 'April/May', volume: 'Vol. LXXIX, No. 03', title: 'The Golgotha Testament', topics: ['Salvation','Scripture','Prophecy'], excerpt: "DJ Olson walks through the final hours of Christ from Gethsemane to Calvary — the betrayal by Judas, Pilate's judgment, the soldiers' mockery, and the crucifixion — then examines each of the seven last words of Jesus from the cross. Father forgive them, the promise to the thief, care for Mary, the cry of forsakenness, I thirst, It is finished, and Into thy hands I commend my spirit — a complete testament of forgiveness, redemption, and resurrection hope.", pdf: '03%20-%20Sharon%20Star%20-%20April-May%202026.pdf', fileName: '03_-_Sharon_Star_-_April-May_2026.pdf'  },

  { id: 22, articleText: `I have a United States of America passport. I am a United States
citizen. Through the years I have had the great blessing and privilege
to visit friends, family, and saints all over the world. This includes
places in India, South America, Africa, the beautiful Islands of the
Caribbean, the Philippines, and the UK. As I enter each of these
countries I promise to abide by the laws of that particular land while
I am visiting.
However, at all times I am a temporary visitor. At all times, I remain
a citizen of the United States of America. I have a blue colored
passport to prove my citizenship. I am a visitor, a sojourner in these
foreign lands, but I always remain a citizen of my home country
the USA.
In a similar sense, I am a citizen of the kingdom of God as quoted
in Philippians 3:20 “For our citizenship is in heaven, from which
we also eagerly wait for the Saviour, the Lord Jesus Christ.” I
abide by the rules and truths and promises of the kingdom of God.
I partake in the glory of the coming kingdom of God, to a degree,
while I am still here in this earthly realm. In a real sense, I can say
that this earthly kingdom is not my home. It is as if I am visiting a
foreign land, this earth, while my true citizenship remains in heaven.
It is almost as if I were carrying a Kingdom of God passport.
When Pilate was passing judgment on Jesus, the Lord proclaimed
that His kingdom was not of this world. If His kingdom was not of
this world, and we are followers of Christ and His kingdom, then
neither is our kingdom of this world.
Volume LXXVII | Issue 01 | January 2024
John 18:36 (NKJV), “Jesus answered, “My kingdom is not of this
world. If My kingdom were of this world, My servants would fight,
so that I should not be delivered to the Jews; but now My kingdom
is not from here.”
After the resurrection of Christ, just before He ascended into Heaven,
the disciples must have thought that His kingdom would soon be an
earthly kingdom. The disciples were anxious to see the foreign rule of
Rome come to an end in Israel. They were ready for the Jews to once
again have ownership over their land. It is no wonder they asked the
Lord about when His kingdom would be set up.
Acts 1:4-8 (NKJV), “And being assembled together with them, He
commanded them not to depart from Jerusalem, but to wait for the
Promise of the Father, “which,” He said, “you have heard from
Me; 5 for John truly baptized with water, but you shall be baptized
with the Holy Spirit not many days from now.” 6 Therefore, when
they had come together, they asked Him, saying, “Lord, will You
at this time restore the kingdom to Israel?” 7 And He said to
them, “It is not for you to know times or seasons which the Father
has put in His own authority. 8 But you shall receive power when
the Holy Spirit has come upon you; and you shall be witnesses to
Me in Jerusalem, and in all Judea and Samaria, and to the end of
the earth.”
To the dismay of the disciples, the Lord made it clear that He would
rule not only Israel but all of this earthly domain, and that it was not
their right to know the times or the seasons.
I am writing this article in the infamous year of 2020. As I write
these words, we are in the midst of a worldwide pandemic and an
economic decline not seen in modern times. I wonder sometimes
if we may be seeing some fulfillment of Jesus’ words in Matthew
24:8 when he exclaimed, “These are the beginning of sorrows”
(literally birth pains).
Our great peace and confidence come from knowing that we belong
to a heavenly realm. We belong to the kingdom of God and not to
the kingdom of the earth and of men. Even as it was in the days of
Noah, as the rains fell from heaven, Noah belonged to that heavenly
kingdom as he boarded the ark of safety. The same rain and floods
that destroyed the earth caused the Ark of Noah to rise above the
waters.
In this day and hour, the call of God is still the same. Come. Come
and board the ark. Come. Safety and security and salvation are
available to all who will answer Him. The door is still open, for
now. But the day will come when the door will shut for many.
Today is the day of salvation. We cry as the angels declared in the
last chapter of the Bible:
Revelation 22:20 (ESV), “He who testifies to these things says,
“Surely I am coming soon.” Amen. Come, Lord Jesus!”
Hebrews 3:7-8 (NKJV), “Therefore, as the Holy Spirit says:
“Today, if you will hear His voice, Do not harden your hearts as in
the rebellion, In the day of trial in the wilderness.”
Matthew 24:36-39 (NKJV), “But of that day and hour no one
knows, not even the angels of heaven, but My Father only. But as
the days of Noah were, so also will the coming of the Son of Man be.
For as in the days before the flood, they were eating and drinking,
marrying and giving in marriage, until the day that Noah entered
the ark, and did not know until the flood came and took them all
away, so also will the coming of the Son of Man be.”
The Bible promises us that the entire world system will be shaken
to its very foundation. Everything that can possibly be shaken, will
be shaken. This must mean multiple physical shakings such as
earthquakes, pestilences, economic downturns, and much more. The
shaking of the powers of the heavenlies will ultimately be so great
that even our satanic enemies will ultimately be cast to the earth.
Revelation 12:1-11 (NKJV), “Now a great sign appeared in heaven:
a woman (most likely representing the church) clothed with the
sun, with the moon under her feet, and on her head a garland of
twelve stars. Then being with child, she cried out in labor and in
pain to give birth. And another sign appeared in heaven: behold,
a great, fiery red dragon having seven heads and ten horns, and
seven diadems on his heads. His tail drew a third of the stars of
heaven and threw them to the earth. And the dragon stood before the
woman who was ready to give birth, to devour her Child as soon as
it was born. She bore a male Child who was to rule all nations with
a rod of iron. And her Child was caught up to God and His throne.
Then the woman fled into the wilderness, where she has a place
prepared by God, that they should feed her there one thousand two
hundred and sixty days. And war broke out in heaven: Michael and
his angels fought with the dragon; and the dragon and his angels
fought, but they did not prevail, nor was a place found for them in
heaven any longer. So the great dragon was cast out, that serpent of
old, called the Devil and Satan, who deceives the whole world; he
was cast to the earth, and his angels were cast out with him. Then I
heard a loud voice saying in heaven, “Now salvation, and strength,
and the kingdom of our God, and the power of His Christ have
come, for the accuser of our brethren, who accused them before our
God day and night, has been cast down. And they overcame him by
the blood of the Lamb and by the word of their testimony, and they

the things which cannot be shaken may remain. Therefore, since
we are receiving a kingdom which cannot be shaken, let us have
grace, by which we may serve God acceptably with reverence and
godly fear.”

kingdom of God:

When Daniel interpreted Nebuchadnezzar’s dream in Daniel

worldwide kingdoms.

  { id: 24, articleText: `All scriptures are from the New King James Version unless otherwise
noted.
Recently, I have been asking the Lord, what is hindering the gifts
of healing and miracles from being fully manifested in the Church?
There are currently many dire needs in the body of Christ; many are
seeking the Lord for divine intervention so that they may be healed.
During a recent Sunday meeting we sang, “There is a Redeemer.”
“Thank You, oh my Father, for giving us your Son, and leaving Your
Spirit ‘til the work on earth is done.” We are in a crucial hour in the
church and we desperately need the Holy Spirit’s help to inherit the
many promises that God has promised us since this precious move of
the Holy Spirit began.
The book of John, chapters 13 through 17, describes Jesus spending
personal time with His disciples before being crucified. Interestingly,
reading through the four Gospels it becomes apparent that the twelve
disciples were human and different from each other in character
just as we are. Peter, loudly proclaiming he would not allow Christ
to wash his feet was the most outspoken, being quick to speak and
express his personal views. He could be labelled as an extrovert.
Thomas, often referred to as ‘Doubting Thomas,’ needed proof in
order to believe. Jesus had explained to the disciples that He was
going to be crucified and after the third day, He would rise again.
Jesus also said that He was going to prepare a home for them in
heaven. Thomas spoke up and said, “We do not know where you are
going, and how can we know the way” (John 14:5)? Jesus answered
him and said, “I am the way, the truth and the life. No one comes to
Volume LXXVII | Issue 03 | March 2024
the Father, except through Me” (John 14:6). There are seven “I am”
statements in the New Testament and examining these statements
we understand that Jesus is explaining who He really is; “If you had
known Me, you would have known My Father also; and from now
on you know Him and have seen Him” (John 14:7). Philip spoke up
and said, “Lord, show us the Father, and it is sufficient for us” (John
14:8). Philip was one who had difficulty accepting what was said
before gathering all the details. He is like an engineer or accountant
who typically needs all the details filled in before reaching a decision.
Jesus was astounded by Philip’s statement and replied, “Don’t you
know Me, Philip, even after I have been among you such a long
time? Anyone who has seen Me has seen the Father. How can you
say, ‘Show us the Father’? Don’t you believe that I am in the Father,
and that the Father is in Me” (John 14:9-10, NIV)? From Philip’s
question, we can surmise that he, along with the other disciples, still
saw Jesus as a human being. Jesus was born of a human mother, but
He was conceived by the Holy Spirit and consequently inherited His
Heavenly Father’s divine nature. It was Christ’s divine nature that the
disciples were not recognizing.
The disciples heard Jesus teach and expound the truths of God many
times, for they travelled with Him for about three years. The Bible
records that Jesus was a gifted teacher for “the people were astonished
at His teaching, for He taught them as one having authority, and not
as the scribes” (Matthew 7:28-29). The disciples had also witnessed
with their own eyes, restored hearing to the deaf, blind eyes made
to see, the lame made to walk again, the dead raised back to life
and Jesus demanding even the winds to cease blowing. Yet they
didn’t recognize who Jesus really was, so He expounded and said
in John 14:11, “Believe Me when I say that I am in the Father and
the Father is in Me; or at least believe on the evidence of the works
themselves” (NIV). Though Jesus was admonishing the disciples, He
is speaking to us as well. Jesus then says in verses 12-14,“Very truly I
tell you, whoever believes in Me will do the works I have been doing,
and they will do even greater things than these, because I am going
to the Father. And I will do whatever you ask in My name, so that
the Father may be glorified in the Son. You may ask Me for anything
in My name, and I will do it” (NIV). Jesus makes a similar statement
in John 15:7, “If you abide in Me, and My words abide in you, you
will ask what you desire, and it shall be done for you” (NKJV). This
has to be one of the most astonishing statements that Jesus declared,
that we, you and I, will perform even greater miracles than Jesus and
that He will do what we ask of Him. Saints of God, this is Christ’s
promise to us. Why are we not seeing these promises being fulfilled?
The key to God answering our prayers, seeing the blind eyes restored,
the lame to walk and even the dead to rise again, is contained in
God’s word. We are required to not only believe and abide in
Christ; we must see Christ in each other and be of ONE mind
with each other. When we abide in Christ we will also abide in God,
our Heavenly Father, and therefore will be ONE with Christ and
God, our Father. In apostle Paul’s letters to the churches, he uses the
term, “in Christ,” approximately 85 times. “There is therefore now
no condemnation to those who are in Christ Jesus, who do not walk
according to the flesh, but according to the Spirit (Romans 8:1). He
also clearly states that Christ dwells in us; “To them God willed to
make known what are the riches of the glory of this mystery among
the Gentiles: which is Christ in you, the hope of glory” (Colossians
1:27). If Christ abides in you and in me, then we are required to see
Christ in each other.
Approximately a year ago, I cycled one of my favourite routes up to
the Seymour Reservoir Dam. This route is paved for hikers, runners
and cyclists with no vehicular traffic allowed. The trail follows the
contours of the valley wall, generally climbing uphill all the way to
the dam, a tough steep, hilly, ride. When I reached the dam, a group
of cyclists caught up to me. As they turned around to cycle back I fell
in behind them. The return was a very fast and exhilarating downhill
ride featuring long steep descents and sweeping curves. As we were
descending, my legs were pedalling as fast as they could. When we
reached the bottom of the trail, we all stopped by a water fountain to
fill our water bottles and were all excitedly chatting and sharing our
cycling experience.
As I left the other riders to head home, the Lord asked me a question,
“What was the most important part of your human body when you
were cycling at neck break speed down the hill?” It was an interesting
question and it made me think of Corinthians chapter twelve where
the apostle Paul used the human body as an object lesson about how
the body of Christ functions. Thinking of my ride, I could not think
of one single part of my body that was more important than any other
except my head. Yes, my eyes, legs, arms, and all my inner parts all
played a critically essential role in biking down the hill successfully.
My heart needed my lungs to function at their fullest capacity in order
to pump enough blood to supply fuel to the rest of my body, etc. This
is a beautiful picture of how the church, the body of Christ, should
function with Christ the head and every member doing the part God
designed them to do; contributing as a whole to the body of Christ so
it can mature and grow to full perfection in Christ. Not one member
is more important than any other; the only chief is Jesus Christ. Every
member of the body of Christ has an essential part to play and with
God’s help to fulfil their ordained duty or function. David recognized
this in Psalms 18:32, “It is God who arms me with strength, And
makes my way perfect.”
Thinking of individual members of the church caused me to realize
how careful we must be when considering our fellow brothers
and sisters in the Lord. Jesus warned us in the seventh chapter of
Matthew about being especially careful that we don’t judge one
another “for with the same measure we judge others, we will likewise
be judged” (Matthew 7:2). Let us be reminded that God made
each one of us as HE wanted and we are different from each other
by HIS design. We all have different personalities and come from
different cultural backgrounds. Some people are very outgoing and
talk a lot and loudly while others are quiet and soft-spoken and speak
little. Others are always thinking of others while some only think of
themselves before considering others. It was God who determined
our personality traits. I have no right to judge you because you are
different from me.
The body of Christ is a close-knit community and unfortunately,
familiarity with each other can lead to loss of respect for each other
through differences in upbringing, culture and personalities. The
expression “familiarity breeds contempt” was first used in England in
the 1300’s by author Geoffrey Chaucer. It describes a human nature
(carnal) trait that sometimes arises in close relationships. If we are
truly being led by the Holy Spirit, this should not be the case. Paul
writing in 2 Corinthians 5:16 wrote, “Therefore, from now on, we
regard no one according to the flesh. Even though we have known
Christ according to the flesh, yet now we know Him thus no longer.”
Paul had reached the point in his walk with Christ that he no longer
saw individuals in the flesh but he saw Christ in them. “Do you
look at things according to the outward appearance? If anyone is
convinced in himself that he is Christ’s, let him again consider this
in himself, that just as he is Christ’s, even so we are Christ’s” (2
Corinthians 10:7). Paul saw beyond fellow members’ human nature
and recognized God’s given gifts and ministries of every individual
in the body of Christ, the Church.
A while ago upon returning from cycling the Seymour Valley trail,
the Lord asked me another question. “When you were biking down
the valley, spinning your legs as fast as they could go, were all the
individual parts of your body in complete harmony with each other?”
I had to say “yes.” There was not one of my body parts that was
conflicting with another. Not one body part stood out above another.
There was no competition between any of my body parts; they were
all in ONE accord. Every member of my body was functioning in
complete harmony with all other parts, just as Jesus described in
John 10:30, “I and my Father are ONE.”
Jesus used the same expression of being ONE with His Father when
He prayed for His disciples before going to the cross of Calvary.
“That they all may be ONE, as You, Father, are in Me, and I in You;
that they also may be ONE in Us, that the world may believe that You
sent Me” (John 17:21).
After reading these scriptures I felt very convicted, realizing as
never before that our heavenly Father’s desire is that we, members
of the body of Christ must be ONE with each other. GOD WANTS
US TO BE OF ONE MIND, RECOGNIZING EACH OTHER
FOR THE IMPORTANT, VITAL PART THAT EACH MEMBER
CONTRIBUTES!
If we do not recognize Christ in each other, then we fall under the
same accusation as the Corinthian church where Paul admonished the
members for partaking of the Lord’s Supper unworthily; “For he who
eats and drinks in an unworthy manner eats and drinks judgement to
himself, not discerning the Lord’s body. For this reason many are weak
and sick among you, and many sleep (are dead)” (1 Corinthians 11:29-
30). The words “discerning the Lord’s body” means recognizing or
honouring Jesus Christ in EVERY member of the body of Christ and
subsequently, the essential role that every member contributes for,
“ye are the body of Christ, and members in particular” (1 Corinthians
12:27, KJV).
QUESTION: Is it possible to see Christ in an individual who is
100% diametrically opposed to oneself in character, personality and
disposition? ANSWER: Yes, with the help of the Holy Spirit. “I can
do all things through Christ who strengthens me” (Philippians 4:13).
“If you abide in Me, and My words abide in you, you will ask what
you desire, and it shall be done for you” (John 15:7). Let us not allow
the enemy of our soul to rationalize our human reasoning to deter us
from receiving the many promises of God.
It is clear from God’s Word that to do; “even greater things than
these” and for Jesus to “do whatever you ask in His name,” we must
recognize that Christ dwells in each other. This will result in us being
ONE with Jesus and our Heavenly Father. When we, as a corporate
body, reach this point, we will begin to witness miracles, healings and
divine life being manifested.
Though the Israelites were given God’s Ten Commandments, His
statutes and His blueprint for establishing a righteous nation as well
as the opportunity to experience divine life (Deuteronomy 32:45-
47) they could not grasp it because of the weakness of their human
nature. The cycle of God revealing His plan to the Israelites and they,
in turn, failing to follow His instructions continues throughout the
Old Testament. They repeatedly turned their back on God. They
were defeated by neighbouring nations and then called for help. God
heard their prayers and rescued them, but over and over again we see
the same cyclical pattern occurring throughout the Old Testament.
Clearly, this indicates that man cannot obey God or appropriate His
promises by self-effort, human will or determination. The Israelites
could not and neither can we. We need help.
Help is what Jesus promised before ascending to be with His
heavenly Father. Jesus committed to sending the Holy Spirit to live
within us and help us overcome our human weakness and inability
to obey Him (John 14:15-18). Though, “The law of Moses was
unable to save us because of the weakness of our sinful nature. So
God did what the law could not do. He sent his own Son in a body
like the bodies we sinners have. And in that body God declared an
end to sin’s control over us by giving his Son as a sacrifice for our
We might think our lives are long, but to God, a thousand
years feel like a moment. Right now, we should let go of
distractions and be ready to respond to God’s call quickly—
that’s what urgency is all about.
sins. He did this so that the just requirement of the law would be
fully satisfied for us, who no longer follow our sinful nature but
instead follow the Spirit” (Romans 8:3-4, New Living Translation).
What is the “just requirement of the law?” Jesus said, “‘You shall
love the Lord your God with all your heart, with all your soul, and
with all your mind.’ This is the first and great commandment. And
the second is like it: ‘You shall love your neighbour as yourself’”
(Matthew 22:37-39). If we truly love God with all our hearts and our
neighbours (brothers and sisters in the body of Christ, the Church)
as ourselves, then the Holy Spirit WILL help us to forgive each
other for our shortcomings of not walking perfectly before Christ.
He WILL also help us to be unaware of personality quirks or
idiosyncrasies that blind us from recognizing Christ in each other. Let
us also pray that the Holy Spirit will help us to overcome anything
that we personally do that is not pleasing to God!
If we sincerely pray and ask the Holy Spirit to help us see Christ in
each other, HE WILL. Hallelujah!
Seeing Christ in each other will result in us becoming ONE in Christ
and in our Heavenly Father.
I believe with all my heart that if we can reach the same point that
the apostle Paul reached where he was able to see Christ in every
individual member of the church, then we will begin to see divine
life flow freely in the body of Christ, and, we will “do even greater
things than these.” Let us pray earnestly and ask the Holy Spirit to
help us recognize Christ in our spouses, families, and every member
in our local church, in our local elders and deacons and travelling
elders and deacons.
Sister Grace Smith mentioned she was thinking of the second verse of
the hymn ‘Open My Eyes Lord’ while I was presenting this message:
If you would see Jesus and reach out and touch him,
If you would hear Him and the words He is saying,
Then look at your brother thru the eyes of the Spirit,
Then you will see Jesus and know Him and love him.
God Bless you.

  { id: 25, articleText: `In Matthew 6:9-13 (NKJV), Jesus taught His disciples how
to pray, and His teaching applies to us today.
There are six levels I want us to look at.
1. Praise
2. Priorities
3. Provision
4. Pardon
5. Protection
6. Praise Again
Praise - Matthew 6:9
When Jesus taught His disciples how to pray, His first
focus was on entering the presence of His Father with His
praise. “Our Father in heaven, Hallowed (to make holy,
reverenced as holy) be Your name.”
Volume LXXVII | Issue 04 | April 2024
He drew attention to His Father by saying, “Our Father.”
You realize that He didn’t say My Father. We must begin by
praising God for being our Father, Jehovah-Jireh (Provider),
Jehovah-Shalom (Peace), Jehovah-Rophe (Healer),
Jehovah-Rohi (Shepherd), and we can go on and on. We
come to our Father with the sacrifice of praise.
Priorities - Matthew 6:10
“Your kingdom come. Your will be done on earth as it is
in heaven.” We must focus on priorities, His priorities. We
must set ourselves in agreement that His will be done today,
in our homes, our families, our church family, and our job.
Our prayer should be, Our Father, Your priorities are mine.
Your will shall be done, whether I like it or not. I am led
by Your peace, filled with Your joy and controlled by Your
Holy Spirit.
Provision - Matthew 6:11
“Give us this day our daily bread.” Our Father, You are our
Jehovah-Jirah, our provider. Don’t be ashamed to talk to our
Father to tell Him, everything we have comes from You. I
don’t have a thing You did not give me. You are a miracle-
working God who provides all I need for today. Thank You
for bringing the provision I need.
Pardon - Matthew 6:12
“And forgive us our debts, as we forgive our debtors.” Focus
on God’s pardon. Our Father, thank You for pardon, mercy
and forgiveness. Because of You, I can gladly pardon and
forgive all those who hurt and cause me harm in any way.
Thank You also for allowing me to walk in love, and forgive
in advance anyone who might have done anything wrong to
me today, in Jesus’ name.
Protection - Matthew 6:13
“And do not lead us into temptation, but deliver us from
the evil one. For Yours is the kingdom and the power and
Proverbs 9:10, “The fear of the Lord is the beginning of wisdom,
and the knowledge of the Holy One is understanding.” This
wisdom is not an ingenious plan but a heavenly plan for
mankind. It is not a fear like a danger or anything like that,
but a holy reverence for God. It is a hallowed fear of God.
When we are overwhelmed with the fear of God, we say, I
fear God and I will not do such a thing. This heavenly wisdom
gives you inspiration for your faith and leads you to be
steadfast in your walk with God. Apostle Paul prayed for the
Ephesian church that they may receive the spirit of wisdom
and revelation so that they may know Him (Christ) better
(ref. Ephesians 1:17). Jesus exercised the gift of heavenly
wisdom in many situations. In Matthew 21:23-27, we read
how the chief priests and elders of the people came to Him
and questioned His authority. Jesus answered using a word
of wisdom and asked them a question. In Verse 24, He asked
them whether the baptism of John was from heaven or of
men. This word of wisdom stopped them from asking further
questions. If they answered, “from heaven,” He would ask
why they didn’t believe him. If they said, “It was from men,”
the glory forever. Amen.” Focus on God’s protection. Our
Father, guide us away from temptation and any trap planned
to destroy our lives. Deliver us from the strategies designed
to harm us in any way. Thank You for Your divine and
angelic protection, in Jesus’ name.
Praise Again - Matthew 6:13
Our Father, we praise You again for influencing our
priorities, for Your provisions, for Your pardon of every
sin, for Your protection from every evil work. Your praise
shall continually be in our mouth. You are our Healer, our
Deliver, our Savior, and Miracle-Worker. We know we
can trust You completely, for You will not disappoint us.
You have everything under Your control. The kingdom,
the power and the glory, they all belong to You forever. In
Jesus’ name. Amen.
then the people would rise up against them because people
believed that he was a prophet. Again in Matthew 22:15-
22, Jesus answered the Herodians (Jewish supporters of the
Herodian dynasty) with a word of wisdom. They asked Jesus
whether it was lawful to give tribute to Caesar or not. Jesus
asked them whose image and superscription is on the money.
They answered, “Caesar’s. Then He said unto them, “Render
therefore unto Caesar the things which are Caesar’s and unto
God the things which are of God” (Matthew 22:21, KJV).
James 1:5, “If any of you lacks wisdom, he should ask God,
who gives generously to all without finding fault, and it will
be given to him”(NIV). Wisdom is entirely practical. It is
not philosophical speculation and intellectual knowledge; it
is concerned with the business of living. The stoics defined
wisdom as “knowledge of things human and divine.” J.H.
Ropes defines this Christian wisdom as “the supreme and
divine quality of the soul whereby man knows and practices
righteousness.” In Christian wisdom, there is, of course,
knowledge of the deep things of God, but it is essentially
practical. It is such knowledge turned into action regarding
the decisions and personal relationships of everyday life.
James 3:17-18, “But the wisdom that comes from heaven is first
of all pure; then peace loving, considerate, submissive, full of
mercy and good fruit, impartial and sincere. Peacemakers
who sow in peace raise a harvest of righteousness.”
Purity: True wisdom thinks holy thoughts. It is cleansed from
all ulterior motives. Such wisdom is so pure that we see God
through purity. “Blessed are the pure in heart for they shall
see God” (Matthew 5:8, NKJV).
Peace-loving: The true wisdom is eirenikos in Greek,
which means peaceable. It is the right relationship between
individuals and between individuals and God. There is a kind
of clever and arrogant wisdom that separates people from one
another, and which makes them look with superior contempt
on others. At all times true wisdom brings people closer to
one another and closer to God.
True wisdom is epiekes (gentle). The person who
has epiekes speaks of someone who knows when it is
actually wrong to apply the strict letter of the law. Such a
person knows to forgive when strict justice dictates that there
is a perfect right to condemn. Such a person knows when to
make allowances, when not to stand upon individual rights,
and how to soften justice with mercy and always remembers
that there are greater things in the world than rules and
regulations. It is the ability to extend the kind consideration
we would ourselves wish to receive.
Submissive, eupeithes in Greek, means always ready to obey.

A question was raised at the Pinelow, Washington camp,
in 2023 about heads covered and uncovered in our church
services. It was a good question that went something like
this: “Why are men’s heads uncovered and women’s heads
covered from the beginning of a service until the end? Why
voice. It also means easy to persuade, not in the sense of being
pliable and weak, but in the sense of not being stubborn. It
is being willing to listen to reason and wise counsel. True
wisdom is not rigid but is willing to listen and skilled in
knowing when wisely to yield.
Full of mercy, eleos in Greek, and good fruits: Here, wisdom
is showing pity to those who are in trouble. Christian pity is
the reflection of God’s pity that is shown to men and women
not only when they were suffering unjustly, but also when
they were suffering through their own fault. From a Christian
perspective, eleos or pity produces good fruits which result in
practical help. It is the Good Samaritan’s example (ref. Luke
10:30-35). Christian pity is not an emotion; it is an action.
Impartial or undivided, adiakritos in Greek, means not
swaying or wavering. It knows its own mind, chooses
its course and abides by it. Christian wisdom is based on
Christian certainties which come to us from God through
Jesus Christ.
Sincere, anupokritos in Greek, means without hypocrisy. That
is to say, it is not a pretense and does not deal in deception. It
is honest; it never pretends to be what it is not; and it never
acts deceitfully to gain its own ends.
Finally, in the RSV translation, “The harvest of righteousness

  { id: 26, articleText: `Marriage is a lifelong contract between a man, and a woman and
is most notably one of the most important decisions one will make
in their lifetime. A Christian marriage is a three-part covenant. It
is a covenant made between a male husband, a female wife, and
God to “love, honor and respect, to remain faithful to one another
in sickness and health until death do us part.”
Marriage is the first institution in the Word of God. It is a social
construct or arrangement with a legal connection, a blessed
and privileged sexual contract, a symbol of full commitment,
and the foundation of the family, the home, the church, and the
nations.
When “man” was initially created “alone” it was the first thing in
all of God’s creation that the Bible says was “not good.”
“And the LORD God said, “It is not good that man should be
alone; I will make him a helper comparable to him” (Genesis
2:18, NKJV).
God soon presented a beautiful helper to Adam. An equal so
close she was created from his own flesh. “And the LORD God
caused a deep sleep to fall on Adam, and he slept; and He took
one of his ribs, and closed up the flesh in its place. Then the
rib which the LORD God had taken from man He made into a
Volume LXXVII | Issue 05 | May 2024
woman, and He brought her to the man. And Adam said: ‘This is
now bone of my bones and flesh of my flesh; She shall be called
Woman, because she was taken out of Man.’ Therefore a man
shall leave his father and mother and be joined to his wife, and
they shall become one flesh. And they were both naked, the man
and his wife, and were not ashamed” (Genesis 2:21-25, NKJV).
This speaks of the intimacy a husband and wife enjoy with one
another.
As believers, we can have a blessed little slice of heaven in our
marriage all of our earthly days. If we are willing to work for it,
and if we are willing to follow the pattern of the Scriptures. Or,
with neglect, our marriages can easily deteriorate slowly around
us. However, it is a choice we make.
We either “choose” to make marriage work or “do not” choose to
make it work. To “not choose” is to have made a choice already. I
am a firm believer that God has given us the ability and the power
of “choice.”
“And if it seems evil to you to serve the LORD, choose for
yourselves this day whom you will serve, whether the gods which
your fathers served that were on the other side of the River, or the
gods of the Amorites, in whose land you dwell. But as for me and
my house, we will serve the LORD” (Joshua 24:15, NKJV).
God has created us with the ability to make choices, even when
we do not have the emotional strength to make that choice. There
are weak-hearted married men and women who allow themselves
to fall into temptation by flirting with members of the opposite sex
at work, or perhaps through a gym membership, and may say that
they could not help themselves from falling in love with someone
else! We will discuss this more in-depth later.
The answer to that nonsense is: “Yes, you could.” Love is so much
more than an emotion. It is a promise, a commitment, a covenant.
Love is not just a surge of oxytocin temporarily surging through
your bloodstream. It is a conscious choice to have and to hold,
to honor and respect, to be faithful until death do us part. It is a
promise made before God and many witnesses.
On that infamous day in history known as 911, Sept 1, 2001, the
Twin Trade Center Towers in Lower Manhattan, New York were
attacked by two passenger jets. Thousands fled the crumbling,
burning building as flames entered the sky. However, the heroic
firefighters and police officers ran into the building as people
were running out of the building. Their natural instinct was
to run away from fire and danger, but their commitment to
public service and safety caused them to make a choice to run
into danger with the hope of saving a few.
The underlying message of this article to all men and women is:
Make a choice! Don’t be led by fickle emotions. Stand for what is
right in a marriage and make a choice. We all have this God-given
ability to make good choices!
Let’s talk about how to have a beautiful marriage!!
Start On The Right Foundation.
Before we talk about the beautiful subject of marriage, we need to
start with a good foundation. When I built my house many years
ago, I first got a soil test to determine how good the earth was for
a foundation. Then, a proper foundation was built that would be
more than adequate for the home that we would build upon that
foundation. Once the house was built, I would not be able to go
back and change the foundation, so time had to be spent making
sure the foundation was right.
The good soil for our marriage was Christ. And the good soil for
our home was that we were two believers together with a common
faith. It was not just a part of it, it was everything.
I did not give a fleeting thought to building our house on a swampy
marsh that would not hold the weight of our house. I did not give
even a hint to marrying an unbeliever who would not be able to
support their weight in a godly marriage.
“Do not be unequally yoked together with unbelievers.
For what fellowship has righteousness with lawlessness?
And what communion has light with darkness?”
(2 Corinthians 6:14, (NKJV).
“For no other foundation can anyone lay than that which is laid,
which is Jesus Christ” (1 Corinthians 3:11, NKJV).
The Gift Of Sex
Within the confines of marriage, God has placed the gift of sexual
intimacy for procreation and mutual enjoyment and fulfillment.
Yes, that’s right. God created it! For married people! And that is
where it is blessed. Outside of marriage, it is simply wrong and
sinful according to the Bible.
“Marriage is honorable among all, and the bed
undefiled; but fornicators and adulterers God will judge”
(Hebrews 13:4, NKJV).
You simply cannot justify “living together” outside of marriage
according to the Word of God. You can say, “Well, we are going to
eventually get married,” or “We are trying to see if we love each
other first.” Living in fornication in the meantime does not justify
anything. If you are living together, I suggest that you ask your
partner for a ring and a date for a wedding, or leave.
The Lord wants the absolute best for you! A child of God should
not cheapen the marriage experience by living the way that
worldly people live. A soul should set high expectations and
standards, not compromise.
Maintenance
Not as much now, but when I first started owning an automobile, it
required regular maintenance. My Dad, like all good dads, taught
me the basics of maintenance. I learned how to regularly change
the spark plugs when they needed to be changed. Sometimes, I
had to change the spark plug wires. There was a thing called a
rotor that I would regularly change. The rotor gave spark, or life,
to the spark plugs. Then there were the points that needed to be
changed. And don’t forget about changing the oil!
Ships at sea always need constant maintenance. On March 26,
2024, the MV Dali, a Singaporean-flagged container vessel
almost 1,000 feet long lost power and crashed into the Francis
Scott Key Bridge in Baltimore,MD sending the 1.6-mile-long
bridge into the frigid water of the Patapsco River with the tragic
loss of life.
“This charge I commit to you, son Timothy, according to the
prophecies previously made concerning you, that by them you
may wage the good warfare, having faith and a good conscience,
which some having rejected, concerning the faith have suffered
shipwreck” (1 Timothy 1:18-19, NKJV). Paul in using this term,
I wondered if what he meant was that these people quit their
“maintenance program” and the result was shipwreck.
Everything worth keeping needs maintenance, constant
maintenance; your car, your home, your body, and your marriage.
Nothing is on autopilot.
All marriages need a “tune-up.” I learned that the best time to
“tune-up” my automobile was before it needed a tune-up! The
best time to tune-up our marriages is before they need a tune-up!
Marriages need a regular maintenance schedule if you will. Your
tune-up, or maintenance schedule will be unique to your situation.
It need not be expensive, but it needs to be planned and prioritized
for you. It should be an important part of your life.
Here are some random ideas:
• Walks together, holding hands.
• Conversations, actively listening.
• Coffee dates. Ice cream dates.
• Bicycle rides together.
• Physical touch of all kinds. (Massages, enjoy your
married privileges)
• Playing games together.
• Overnighting together.
Active Listening
Listening to one another, actively listening, is a learned skill. It
does not come naturally. In many cases, men have trouble hearing
beyond the words. Yes, we often make jokes about men having
selective hearing, but this is rooted in some truth. Men tend to
discount what they hear, in some cases, when it involves their
spouses.
When Jesus was resurrected, Mary Magdalene, Joanna, and Mary
the mother of James, and other women met an angel at the tomb.
The angel said to them, “Why do you seek the living among the
dead? He is not here, but is risen” (Luke 24:5-6)! These dear
ladies then ran to the eleven and told the disciples that they found
an empty tomb and had just met an angel who had, “told these
things to the eleven and to all the rest” (Luke 24:9). Luke 24:11
says, “And their words seemed to them like idle tales, and they did
not believe them.”
Think how sad this is. These women were the first witnesses on
earth that Jesus was resurrected as He said He would be. They
had met an angel, and the apostles did not believe them. Why?
We cannot say for sure, but they certainly were not “actively
listening.” When I read this scripture over Easter Sunday, I was
sad. I wanted to shout back over time if I could and say, “Mary -
we believe you now!!!”
I cannot do that, but there is something that I can do. Whenever
my sweet wife has something to say, I vow to not discount her
words for any reason. I choose to actively listen. I vow to attempt
with all of the limited ability I have, as a man, to “listen beyond
the words” to what she is saying. This may mean that I listen to
the words, read her facial expressions, watch her body language,
and take in the whole picture, actively listening.
Being In Agreement
Husbands and wives need to agree on all major issues of life in
their household. Yes, there are minor issues that do not require
them to consult with one another, but major issues should be
agreed upon together. Always remember, marriage is a lifelong
commitment and partnership. It is much more than just two people
living together under the same roof. It is an equal partnership.
Avoiding Temptation
“Therefore submit to God. Resist the devil and he will flee from
you. 8 Draw near to God and He will draw near to you. Cleanse
your hands, you sinners; and purify your hearts, you double-
minded” (James 4:7-8, NKJV).
There are many examples we could present from the scriptures
regarding temptation such as David and Bathsheba, where David
was looking for trouble. He was not in the wrong place at the
wrong time; he was almost actively looking for the wrong thing
at the wrong time.
Sometimes there is nothing more risky than a bored married man
or woman with too much leisure time on their hands, with too
much social media screen time in front of them. A bored soul no
longer has to search for pornography; pornography now finds
them!
Instead of constantly resisting temptation I encourage the married
spouse to avoid temptation. For instance, married men should
have male friends. Married women should have female friends.
Married men should not be chumming with single or other married
women. Married women should not be socializing with other
married men. There should be clear lines of demarcation drawn
so that there is no possibility of temptation or misunderstandings.
Married men and women should have a personal code of ethics
that they live by. For example, when I worked in a large industrial
office in my youth with many men and women, I had a personal
code that I always followed. Here are some of my rules at work:
1. I would never go out to lunch with another woman, even
for a sales meeting.
2. I would never ride in a car with another woman.
3. I would never shut the door to my office with another
woman in the office (It was always open for all to see).
4. When working with another woman at work, I frequently
referenced my wife by name in my conversation.
5. I never had any after-work social activities.
6. After work, it was “home time.”
7. My wife always knew where I was by my phone calls.
No secrets.
8. I always proudly displayed my wedding ring.
I suggest that all married men and women write out their rules of
conduct for work and their social life.
The Apostle Paul presented some of the best marriage advice in
the New Testament. It is deep. The following scriptures are full of
meaning regarding the relationship between a husband and a wife
and between Christ and the Church. The two are so completely
intertwined. If we can somehow understand the mystery of
marriage, we can somehow appreciate the relationship of Christ
to His church.
To better understand these scriptures, I will present them in the
NIV version. My apologies in advance to those who may not
appreciate the NIV so much. In this case, I find that it is a little
easier to understand, and I mean no offense in using this version.
“Wives, submit yourselves to your own husbands as you do to
the Lord. For the husband is the head of the wife as Christ is
the head of the church, his body, of which he is the Savior. Now
as the church submits to Christ, so also wives should submit to
their husbands in everything. Husbands, love your wives, just
as Christ loved the church and gave himself up for her to make
her holy, cleansing her by the washing with water through the
word, and to present her to himself as a radiant church, without
stain or wrinkle or any other blemish, but holy and blameless.
In this same way, husbands ought to love their wives as their
own bodies. He who loves his wife loves himself. After all, no
one ever hates their own body, but they feed and care for their
body, just as Christ does the church— for we are members of his
body. “For this reason a man will leave his father and mother
and be united to his wife, and the two will become one flesh.”
This is a profound mystery—but I am talking about Christ and
the church. However, each one of you also must love his wife
as he loves himself, and the wife must respect her husband”
(Ephesians 5:22-33, NIV).
Code Of Conduct
Many institutions have a strict code of conduct that is required of
their employees. The military has a code of conduct. The police
have a code of conduct. Academia has a code of conduct that is
required.
Marriage has a code of conduct that should be expected. In each
