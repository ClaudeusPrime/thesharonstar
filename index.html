  { id: 6, subtitle: 'Loss: Good Thing or Bad Thing?: Andy Snoke', author: 'David Luff', year: 2025, month: 'July', volume: 'Vol. LXXVIII, No. 06', title: 'Faith and the Kingdom of God — Part Two', topics: ['Scripture','Faith','Discipleship'], excerpt: "David Luff continues exploring faith and the kingdom, focusing on the Sermon on the Mount in Matthew 5-7 as the character blueprint for citizens of the kingdom. Discusses cooperation with the Holy Spirit: seeking righteousness, recognizing spiritual need, meditating on Scripture, unceasing prayer, and bearing suffering of the flesh. Andy Snoke reflects on spiritual gains and losses from Philippians 3, examining Paul's balance sheet of earthly achievements counted as rubbish for Christ.", pdf: '06%20-%20Sharon%20Star%20-%20July%202025.pdf', fileName: '06_-_Sharon_Star_-_July_2025.pdf' , fullText: `Faith and the Kingdom of God Part Two David Luff July 2025 Volume LXXVIII Issue 06 Matthew 13 kingdom heaven wheat tares leaven loaf treasure field good fish bad fish wicked just mixture good evil born again Holy Spirit fleshly natures submission leading Holy Spirit flesh put to death full control power cross deliver bondage sin Romans 6:11 reckon dead sin alive God Christ Jesus resurrection sharing sufferings Philippians 3:10 mind Christ Jesus form God no reputation bondservant obedience death cross He must increase I must decrease John 3:30 Matthew 4:17 repent kingdom heaven at hand Isaiah 9:6-7 11:6-9 35:5-7 Amos 9:13-14 Micah 4:2-4 Romans 8:19-21 sons of God creation tiptoe magnificent liberty children God Matthew 5:7 Sermon on the Mount poor in spirit blessed kingdom heaven character people administrative body overcomers Mosaic law thoughts motives most demanding expectations human behavior saints take kingdom behavior conform Sermon on the Mount rich young man camel eye needle impossible with God all things possible Matthew 19:24-26 seek first kingdom God righteousness Matthew 6:33 hunger thirst righteousness filled po // Find matching sentence from fullText
function getMatchSnippet(text, query) {
  if (!text || !query) return '';
  var ql = query.toLowerCase();
  var words = text.split(/[.!?]+/);
  for (var i = 0; i < words.length; i++) {
    if (words[i].toLowerCase().indexOf(ql) !== -1) {
      var sentence = words[i].trim();
      if (sentence.length > 20) {
        // Highlight the match
        var re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        return sentence.replace(re, '<mark>$1</mark>');
      }
    }
  }
  return '';
}

// Event delegation for expand
document.addEventListener('click', function(e) {
  if (e.target.closest('.item-dl') || e.target.closest('.topic-btn') || e.target.closest('.topic-clear')) return;
  var row = e.target.closest('.item-row');
  if (!row) return;
  var item = row.closest('.item');
  if (!item) return;
  var isOpen = item.classList.contains('open');
  document.querySelectorAll('.item.open').forEach(function(el) { el.classList.remove('open'); });
  if (!isOpen) item.classList.add('open');
});

// Download button delegation
document.addEventListener('click', function(e) {
  var btn = e.target.closest('.item-dl');
  if (!btn) return;
  var pdf = btn.getAttribute('data-pdf');
  if (pdf) window.open(pdf, '_blank');
});

// Topic button delegation
document.addEventListener('click', function(e) {
  var btn = e.target.closest('.topic-btn');
  if (!btn) return;
  renderTopics(btn.getAttribute('data-topic'));
});

// Build item HTML
function makeItems(list, query) {
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var issue = list[i];
    var tags = '';
    if (issue.topics) {
      for (var t = 0; t < issue.topics.length; t++) {
        tags += '<span class="topic-tag">' + issue.topics[t] + '</span>';
      }
    }
    var matchHtml = '';
    if (query && issue.fullText) {
      var snippet = getMatchSnippet(issue.fullText, query);
      if (snippet) {
        matchHtml = '<div class="item-match"><div class="item-match-label">Match found in article</div>' + snippet + '</div>';
      }
    }
    html += '<div class="item">';
    html += '<div class="item-row">';
    html += '<div class="item-num">' + String(i+1).padStart(2,'0') + '</div>';
    html += '<div class="item-info">';
    html += '<div class="item-title">' + issue.title + ': ' + issue.author + '</div>';
    if (issue.subtitle) {
      html += '<hr class="item-divider"><div class="item-sub">' + issue.subtitle + '</div>';
    }
    html += '<div class="item-topics">' + tags + '</div>';
    html += '</div>';
    html += '<div class="item-meta">';
    html += '<div class="item-date">' + issue.month + ' ' + issue.year + '</div>';
    html += '<div class="item-chevron">▼</div>';
    html += '</div>';
    html += '</div>';
    html += '<div class="item-panel">';
    if (matchHtml) html += matchHtml;
    if (issue.excerpt) html += '<div class="item-synopsis">' + issue.excerpt + '</div>';
    html += '<button class="item-dl" data-pdf="' + (issue.pdf||'') + '">↓ Download PDF</button>';
    html += '</div>';
    html += '</div>';
  }
  return html;
}

// BROWSE
function renderBrowse() {
  var years = [];
  ISSUES.forEach(function(i) { if (years.indexOf(i.year) === -1) years.push(i.year); });
  years.sort(function(a,b) { return b-a; });
  var html = '';
  years.forEach(function(y) {
    var issues = ISSUES.filter(function(i) { return i.year === y; });
    html += '<div class="year-section"><div class="year-label">' + y + '</div>' + makeItems(issues, '') + '</div>';
  });
  document.getElementById('page-browse').innerHTML = html;
}

// TOPICS
function renderTopics(filterTopic) {
  var page = document.getElementById('page-topics');
  if (!filterTopic) {
    var topics = [];
    ISSUES.forEach(function(i) {
      (i.topics||[]).forEach(function(t) { if (topics.indexOf(t) === -1) topics.push(t); });
    });
    topics.sort();
    var html = '<div class="topic-grid">';
    topics.forEach(function(t) {
      var count = ISSUES.filter(function(i) { return (i.topics||[]).indexOf(t) !== -1; }).length;
      html += '<button class="topic-btn" data-topic="' + t + '">';
      html += '<div class="topic-name">' + t + '</div>';
      html += '<div class="topic-count">' + count + ' issue' + (count !== 1 ? 's' : '') + '</div>';
      html += '</button>';
    });
    html += '</div>';
    page.innerHTML = html;
  } else {
    var filtered = ISSUES.filter(function(i) { return (i.topics||[]).indexOf(filterTopic) !== -1; });
    var html = '<div class="topic-filter-header">';
    html += '<div class="topic-filter-title">Topic: <span>' + filterTopic + '</span></div>';
    html += '<button class="topic-clear" id="topicClearBtn">← All Topics</button>';
    html += '</div>';
    html += makeItems(filtered, '');
    page.innerHTML = html;
    document.getElementById('topicClearBtn').addEventListener('click', function() { renderTopics(null); });
  }
}

// SEARCH
function doSearch() {
  var q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  var ql = q.toLowerCase();
  var results = ISSUES.filter(function(i) {
    return (i.title + ' ' + i.author + ' ' + (i.subtitle||'') + ' ' + (i.excerpt||'') + ' ' + i.month + ' ' + i.year + ' ' + (i.topics||[]).join(' ') + ' ' + (i.fullText||'')).toLowerCase().indexOf(ql) !== -1;
  });
  var btn = document.getElementById('nav-search');
  btn.style.display = 'block';
  btn.textContent = 'Search Results';
  var html = '<div class="results-header">';
  html += results.length > 0
    ? '<b>' + results.length + '</b> result' + (results.length !== 1 ? 's' : '') + ' for "<b>' + q + '</b>"'
    : 'No results for "<b>' + q + '</b>"';
  html += '</div>';
  html += results.length > 0 ? makeItems(results, q) : '<div class="no-results">Try a different search term</div>';
  document.getElementById('page-search').innerHTML = html;
  showPage('search');
}

// NAV
function showPage(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
}

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});

renderBrowse();
renderTopics(null);
</script>
