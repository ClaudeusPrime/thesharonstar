The apostle Paul wrote about his vision for the church, the body of Christ. "For as the body is one and has many members, but all the members of that one body, being many, are one body, so also is Christ. For by one Spirit we were all baptized into one body — whether Jews or Greeks, whether slaves or free — and have all been made to drink into one Spirit" (1 Corinthians 12:12-14, NKJV). Yes, many individual members but joined together as one body.

Jesus is going to return to this earth because it is God\'s intention "that in the dispensation of the fullness of the times He might gather together in one all things in Christ, both which are in heaven and which are on earth — in Him" (Ephesians 1:10, NKJV). It is God\'s intention to bring an elect, remnant company of people to full maturity, or to perfection in Christ, to become the bride of Christ on His return to earth. Then, and only then, will the process begin in earnest of restoring the earth to its former glory as it was before it fell into sin and decay.

World-renowned scientists are ringing the warning bells that the earth is on a downhill slide into extinction through self destruction. But be assured that God has a plan to restore and to stop this downhill slide and will bring all creation back to its original state, for God is a God of hope and fulfilled promises. The prophet Micah spoke of this hope for all mankind: "Many nations shall come and say, Come, and let us go up to the mountain of the Lord, To the house of the God of Jacob; He will teach us His ways, And we shall walk in His paths... He shall judge between many peoples, And rebuke strong nations afar off; They shall beat their swords into plowshares, And their spears into pruning hooks; Nation shall not lift up sword against nation, Neither shall they learn war anymore" (Micah 4:2-4, NKJV).

God is restoring the offices of traveling elders and deacons (apostolic brethren) who are functioning in the five fold ministries of apostles, prophets, evangelists, pastors and teachers (Ephesians 4:11). Apostolic brethren are establishing local churches and setting local elders and deacons. Local elders and deacons are shepherding the local assemblies not as lords, but by example. The home is being established according to God\'s order.

If we stay under the covering of the order of God and fit into the places God has for us as individuals, we can be assured that God will finish the work He has begun. In His time He will bring the body of Christ together as one and restore all creation unto Himself. Let us keep our focus on the vision of going on to sonship so we can witness the coming together of the body of Christ.`, subtitle: '', author: 'Markus Hansen', year: 2017, month: 'September', volume: 'Vol. LXX, No. 09', title: 'Our Vision, Our Focus', topics: ['Sonship','Church','Scripture','Faith'], excerpt: 'Markus Hansen calls believers to stay focused on the foundational vision of this present move of the Holy Spirit — entering into sonship culminating in the coming together of the body of Christ — outlining God\'s plan to restore all creation through an elect company perfected in Christ, despite the pressures to conform to modern church culture.', pdf: '09%20-%20Sharon%20Star%20-%20September%202017.pdf', fileName: '09_-_Sharon_Star_-_September_2017.pdf' },
  { id: 112, articleText: `Resisting Temptation: Andy Snoke

"No temptation has overtaken you except such as is common to man; but God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also make the way of escape, that you may be able to bear it" (1 Corinthians 10:13, NKJV).

Temptation comes to all of us in a variety of forms. It can come in ways that are simply unwise choices such as unhealthy eating habits. Or it may come in ways that are devastating, that leave broken families in the wake, as in the case of immoral choices. One of the attributes of the "fruit of the Spirit" is "self-control," or the ability to resist temptation and walk a path of temperance.

It appears that all temptation and sin tends to fall into three categories: the lust of the flesh (eating, sexual, drug, and alcohol addictions), the lust of the eyes (greed, covetousness, selfishness, envy, laziness), and the pride of life (craving for attention, position, authority, identity, appreciation).

"Do not love the world or the things in the world. If anyone loves the world, the love of the Father is not in him. For all that is in the world — the lust of the flesh, the lust of the eyes, and the pride of life — is not of the Father but is of the world. And the world is passing away, and the lust of it; but he who does the will of God abides forever" (1 John 2:15-17, NKJV).

Adam and Eve were tempted in all three areas. And Jesus was tempted in all three areas, yet never failed.

The way of escape is by learning to "avoid," "resist" and "flee." The first step would be to "avoid" sin and temptation — avoid situations and environments that promote temptation and sin. Then, "submit to God. Resist the devil and he will flee from you" (James 4:7-8, NKJV). And at the first time of temptation, a believer would do well to flee as quickly as possible. Lingering, and flirting with temptation can have devastating consequences.

God had blessed Joseph and he avoided, resisted, and fled from the advances of Potiphar\'s wife. He went to prison for this false charge, but ultimately God promoted him as almost an equal to Pharaoh. The next sad story is of King David, who did just the opposite. He did not avoid, resist, or flee, which ultimately led to very tragic consequences. The effects of temptation and sin, can be summed up in the following statement: "Sin will take you farther than you want to go, keep you longer than you want to stay, and cost you more than you want to pay."

Let the believer have faith in Paul\'s letter to the Church at Corinth. God provides a way of escape from temptation. It takes our effort, and a reliance on the power of the Holy Spirit.

---

Water Baptism: Haley Gray

I have gone to church my whole life. I was born and raised in a Christian family where God was the most important thing. One day when I was five years old, my mom dropped me off at the summer camp. At camp during our recess time, I decided I wanted to surrender and give my life to the Lord. So I quietly prayed and asked Jesus to come into my heart.

After I asked Jesus into my heart, I told my mom that I wanted to be baptized, as baptism is a very important part in our walk with God. We went to the summer camp in Spokane, Washington. After we had arrived at camp, I asked the elders and deacons in the church if I could be baptized, and of course they said "yes." The baptism ceremony was around two hours long in Deer Lake. As I walked out into the lake I was scared but reassured at the same time. I felt peace in my heart. The elders and deacons said a long prayer that ended with, "We baptize you in the name of the father, the son, and the Holy Spirit." At that moment, I said goodbye to the old me and hello to my new self.

Even though I was only six years old, this event still affects me today. It helps me to know that God is always with me and will help me, and protect me. The Bible verse that always helps me get through any difficult time is Isaiah 41:10, "So do not fear for I am with you, do not be dismayed for I am your God. I will strengthen you and uphold you with my righteous right hand."

After that first church camp, we have gone back every year and we have been faithful members of our church ever since. My baptism washed away my original sin and made me new. I am forgiven and saved. My baptism has given me a firm foundation for the rest of my walk with God, and I hope he will use me for great things.`, subtitle: 'Water Baptism: Haley Gray', author: 'Andy Snoke', year: 2017, month: 'October', volume: 'Vol. LXX, No. 10', title: 'Resisting Temptation', topics: ['Temptation','Discipleship','Faith','Testimony'], excerpt: 'Andy Snoke examines the three categories of sin and temptation — lust of the flesh, lust of the eyes, and pride of life — offering the practical strategy of avoid, resist, and flee illustrated by the contrasting examples of Joseph and King David, while young Haley Gray shares her moving testimony of water baptism at age six.', pdf: '10%20-%20Sharon%20Star%20-%20October%202017.pdf', fileName: '10_-_Sharon_Star_-_October_2017.pdf' },
  { id: 113, articleText: `Power Over the Enemy: Mike Greif

We have been given power over the enemy. The Bible tells us this. When Jesus died on the cross, was raised again, and seated at the right hand of the Father, in the place of authority in the heavenly places, we were seated there with Him! Since we are seated with Him in the heavenly places, He has given us authority over the enemy as well. Every born again Christian has authority over the enemy, but many don\'t realize it. It is like a bank account that someone left us, put it in our name, with a large sum of money in it, but we didn\'t know about it. The money was ours, and was for a long time, but if we don\'t know about something, it is hard to take advantage of it.

Ephesians has been called the "Alps" of the New Testament by some, because this book talks about us being "raised up with Christ in the heavenly realms." God has blessed us with every spiritual blessing in the heavenly places, in Christ; we have been chosen, in Christ, to be holy and blameless; we have been adopted as sons; His grace has been bestowed on us; in Him, we have redemption, through His blood; and we have been sealed with Him with the Holy Spirit of promise. We have been given a lot, in Christ!

We now have power and authority over the enemy because of what Jesus accomplished. Our authority is over the enemy\'s influence in our own lives, in the lives of our family, and in the lives of those in the church. The only way he has power over us is if we allow it. James 4:7 states, "Submit therefore to God. Resist the devil and he will flee from you."

The enemy is experienced in looking for opportunities to attack us. Some of his best tricks are to take advantage of us when we are down, tired, stressed, anxious, over-worked, feeling condemned, or simply not trusting God. When a situation arises where fear and anxiety confront us the enemy wants us to take our eyes off of Jesus. Then is our opportunity to confront him head on and to rebuke him, resist him, demand that he leave in the Name of Jesus.

Speaking in tongues is a good way to confound the enemy. It builds us up and confuses him at the same time. A direct line of communication is established between God and ourselves, and our spirit is communicating with God, according to the will of God.

Walk with God. Do the best you can to enter into the gifts and ministries that have been given you. When you feel condemnation don\'t accept it. Remember Romans 8:1-2, "There is therefore now no condemnation to those who are in Christ Jesus... For the law of the Spirit of life in Christ Jesus has set me free from the law of sin and death." Condemnation is from the enemy, and we have been set free from him, sin, and death.

Romans 8:28 says, "God works all things together for good to those who love the Lord, who are the called according to His purpose." We need to trust Him with all of our hearts and to believe His Word. Praise God, and may He help us to enter into and possess what has been given to us.

---

A Tribute to Brother David Gabruch

A pervasive sense of loss permeated the church universal when Brother David Gabruch passed from his earthly to his heavenly home on August 31, 2017. David Gabruch served as a local elder in Regina, Rosetown and Saskatoon churches and in later years traveled as an apostolic ministry for the universal church. His fatherly, pastoral ministry was a blessing to many in the local churches as well as to churches throughout Canada, the United States and many of the islands of the Caribbean.

David and Sonja were willing to travel wherever the brethren asked them to go to bring the gospel of the kingdom of God to those in need spiritually and physically. David was more than a colleague. He was a friend you could count on. He would go the extra mile. His selflessness was apparent in his concern for others more than for himself. He cared about people, whether young or old, rich or poor, educated or uneducated. He believed, as we all should, that people everywhere are in need of a Savior.

The universal church grieves with Sonja and the family during this time of deep sorrow, for this is a great loss to us all. But, as we read in 1 Thessalonians 4:13, we do not sorrow as others who have no hope, for our hope is in Christ and in the glorious reunion that will one day take place in the realm of the heavenlies. "Precious in the sight of the Lord is the death of His saints" (Psalm 116:15).`, subtitle: 'A Tribute to Brother David Gabruch', author: 'Mike Greif', year: 2017, month: 'November', volume: 'Vol. LXX, No. 11', title: 'Power Over the Enemy', topics: ['Scripture','Faith','Holy Spirit','Discipleship'], excerpt: 'Mike Greif unpacks the believer\'s God-given authority over the enemy through Christ\'s resurrection and our position seated with Him in heavenly places, offering practical guidance on how to resist the enemy\'s schemes through submission to God, speaking in tongues, and maintaining a grateful and trusting heart toward God in all circumstances.', pdf: '11%20-%20Sharon%20Star%20-%20November%202017.pdf', fileName: '11_-_Sharon_Star_-_November_2017.pdf' },
  { id: 114, articleText: `Holy Communion: Calvin James

Part One: Communion

Do you know what qualifies someone to be able to partake of the communion?

During one of our family devotions, our seven-year-old son indicated that he was interested in giving his heart to the Lord Jesus and desired to be baptised. Our five year old daughter also announced that she would like to be baptised as well. After our jubilation, I asked our daughter, "Why do you want to be baptised?" Her response was, "I want to eat the bread and drink the wine every Sunday with everyone else." Let me encourage parents to use the altar of the family devotions to lay the foundation of salvation for our children.

So, does being baptized truly qualify us to be partakers of the communion? Paul the Apostle came up against this very question in his ministry at the church which was at Corinth. The believers there had divisions, selfishness and a lack of appreciation for one another. Therefore, we can conclude that communion doesn\'t start when we bless the bread and the wine that we use and, it doesn\'t end when we\'ve eaten the sacraments. Communion is a way of life that climaxes every Sunday when we partake of the sacraments in celebration of what Jesus did for us on the cross. One needs to participate in communion in order to partake of the communion.

Discerning the Lord\'s body opens the door for us as believers to be true partakers of the Holy Communion. The body of Christ is you and it is me. When I don\'t discern, or love, or respect the Christ in you and; when you don\'t discern, nor appreciate nor respect the Christ in me, we disrespect Jesus Himself.

Part Two: Priest and Kings

Who are we? We are royal priests and members of the body of Christ. God said to Israel, "Now if you obey me fully and keep my covenant, then out of all nations you will be my treasured possession... you will be for me a kingdom of priests and a holy nation" (Exodus 19:4-6, NIV). The Scripture is telling us that the justified believer is a full adult heir in God\'s family, with all the attendant rights and privileges. Saints, you are a son. We are sons. How much sonship is revealed in us depends on how full our faith is and the degree of maturity in Christ that we have reached.

When we gather around the Lord\'s table to partake of the communion we gather to celebrate the honour given to us through Jesus to be counted as one of God\'s special and chosen people. Partaking of the communion is really the outcome of a genuine love and deep respect and appreciation for one another. It is a celebration of being a member of God\'s royal priesthood; a celebration of maturing into full sonship.

Part Three: Communion In The Home

Our children are special to us in many ways. First, they represent the heritage of the church and a sign that the work God has begun in our midst is destined to continue to the end. One of the responsibilities we have is to teach our children from a very young age to discern the body of Christ so that when they have come of age to be partakers of the holy communion they will have already been actively participating in the communion of discerning the Lord\'s body.

Communion in the Home applies equally to husbands and wives. If a man truly discerns the body of Christ he will treat his wife the same way Christ treats the church; with agape. Conversely, if a woman truly discerns the body of Christ she would respect her husband the same way the church respects Jesus; with submission.

By the Holy Spirit, we should appreciate the reality of the holy communion and be reminded that we ought not to view the partaking of the holy communion as a rite of passage or some Christian tradition. Instead, let us see the communion as central to our walk as Christians and, as such, let us always remember that "we cannot be partakers of the holy communion on Sundays if we are not participators in the holy communion everyday."`, subtitle: '', author: 'Calvin James', year: 2017, month: 'December', volume: 'Vol. LXX, No. 12', title: 'Holy Communion', topics: ['Communion','Sonship','Scripture','Family'], excerpt: 'Calvin James offers a rich three-part study of Holy Communion, arguing that true communion begins not with the bread and wine but with discerning the body of Christ in one another daily, establishing believers as royal priests and sons of God, and calling families to live out communion at home with children and spouses before gathering at the Lord\'s table.', pdf: '12%20-%20Sharon%20Star%20-%20December%202017.pdf', fileName: '12_-_Sharon_Star_-_December_2017.pdf' }

// Highlight search term in text
function highlight(text, query) {
  if (!query) return text;
  var words = query.trim().split(/\s+/).filter(Boolean);
  words.forEach(function(w) {
    var escaped = w.replace(/[-.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(' + escaped + ')', 'gi');
    text = text.replace(re, '<mark>$1</mark>');
  });
  return text;
}

// Event delegation for expand/collapse
document.addEventListener('click', function(e) {
  if (e.target.closest('.item-dl') || e.target.closest('.topic-btn') || e.target.closest('.topic-clear')) return;
  var row = e.target.closest('.item-row');
  if (!row) return;
  var item = row.closest('.item');
  if (!item) return;
  var isOpen = item.classList.contains('open');
  document.querySelectorAll('.item.open').forEach(function(el) { el.classList.remove('open'); });
  if (!isOpen) {
    item.classList.add('open');
    // Scroll to first highlight if in search mode
    setTimeout(function() {
      var mark = item.querySelector('mark');
      if (mark) mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
  }
});

// Download button
document.addEventListener('click', function(e) {
  var btn = e.target.closest('.item-dl');
  if (!btn) return;
  var pdf = btn.getAttribute('data-pdf');
  if (pdf) window.open(pdf, '_blank');
});

// Author issue row
document.addEventListener('click', function(e) {
  var row = e.target.closest('.author-issue-row');
  if (!row) return;
  var pdf = row.getAttribute('data-pdf');
  if (pdf) window.open(pdf, '_blank');
});

// Topic button
document.addEventListener('click', function(e) {
  var btn = e.target.closest('.topic-btn');
  if (!btn) return;
  renderTopics(btn.getAttribute('data-topic'));
});

// Build item HTML
function makeItems(list, query, showArticle) {
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var issue = list[i];
    var tags = '';
    if (issue.topics) {
      for (var t = 0; t < issue.topics.length; t++) {
        tags += '<span class="topic-tag">' + issue.topics[t] + '</span>';
      }
    }
    // Article text - only show on search results page
    var articleHtml = '';
    if (showArticle && issue.articleText) {
      var reflowed = issue.articleText
        .replace(/\r\n/g, '\n')
        .replace(/\n{2,}/g, '\u0000')
        .replace(/\n/g, ' ')
        .replace(/\u0000/g, '\n\n')
        .replace(/ {2,}/g, ' ');
      var displayText = query ? highlight(reflowed, query) : reflowed;
      articleHtml = '<div class="item-article">' + displayText + '</div>';
    } else if (issue.excerpt) {
      var displayExcerpt = query ? highlight(issue.excerpt, query) : issue.excerpt;
      articleHtml = '<div class="item-article">' + displayExcerpt + '</div>';
    }

    html += '<div class="item">';
    html += '<div class="item-row">';
    html += '<div class="item-num">' + String(i+1).padStart(2,'0') + '</div>';
    html += '<div class="item-info">';
    html += '<div class="item-title">' + issue.title + ': ' + issue.author + '</div>';
    if (issue.subtitle) {
      html += '<hr class="item-divider"><div class="item-sub">' + issue.subtitle + '</div>';
    }
    html += '<div class="item-topics">' + tags + '</div>';
    html += '</div>';
    html += '<div class="item-meta">';
    html += '<div class="item-date">' + issue.month + ' ' + issue.year + '</div>';
    html += '<div class="item-chevron">▼</div>';
    html += '</div>';
    html += '</div>';
    html += '<div class="item-panel">';
    html += articleHtml;
    html += '<button class="item-dl" data-pdf="' + (issue.pdf||'') + '">↓ Download PDF</button>';
    html += '</div>';
    html += '</div>';
  }
  return html;
}

// AUTHORS
function getLastName(name) {
  var parts = name.trim().split(' ');
  return parts[parts.length - 1];
}

// Authors excluded from the list (memorial mentions, not article authors)
var EXCLUDED_AUTHORS = ["Dickson Julius Olan'g"];

// Split an author field that may contain " & " into individual names
function splitAuthors(str) {
  if (!str) return [];
  return str.split(' & ').map(function(s) { return s.trim(); }).filter(Boolean);
}

function getAllAuthors() {
  var authors = [];
  function addAuthor(name) {
    if (name && authors.indexOf(name) === -1) authors.push(name);
  }
  ISSUES.forEach(function(i) {
    // Main author field (may be "A & B")
    splitAuthors(i.author).forEach(addAuthor);
    // Secondary author from subtitle (format "Article Title: Author Name")
    if (i.subtitle) {
      var colonIdx = i.subtitle.lastIndexOf(':');
      if (colonIdx !== -1) {
        var name = i.subtitle.substring(colonIdx + 1).trim();
        if (name) addAuthor(name);
      }
    }
  });
  // Remove excluded authors
  authors = authors.filter(function(a) {
    return EXCLUDED_AUTHORS.indexOf(a) === -1;
  });
  // Sort by last name, then first name as tiebreaker
  authors.sort(function(a, b) {
    var lastCmp = getLastName(a).localeCompare(getLastName(b));
    if (lastCmp !== 0) return lastCmp;
    return a.localeCompare(b);
  });
  return authors;
}

function getIssuesByAuthor(author) {
  return ISSUES.filter(function(i) {
    // Check main author field (may contain " & ")
    if (splitAuthors(i.author).indexOf(author) !== -1) return true;
    if (i.subtitle) {
      var colonIdx = i.subtitle.lastIndexOf(':');
      if (colonIdx !== -1) {
        var name = i.subtitle.substring(colonIdx + 1).trim();
        if (name === author) return true;
      }
    }
    return false;
  });
}

function renderAuthors(expandAuthor) {
  var page = document.getElementById('page-authors');
  var authors = getAllAuthors();

  // Group by first letter of last name
  var letters = {};
  authors.forEach(function(a) {
    var letter = getLastName(a)[0].toUpperCase();
    if (!letters[letter]) letters[letter] = [];
    letters[letter].push(a);
  });

  var html = '';

  Object.keys(letters).sort().forEach(function(letter) {
    html += '<div id="author-letter-' + letter + '" class="author-letter-group">';
    html += '<div class="author-letter-label">' + letter + '</div>';

    letters[letter].forEach(function(author) {
      var issues = getIssuesByAuthor(author);
      var isExpanded = expandAuthor === author;
      html += '<div class="author-row">';
      html += '<div class="author-name-row' + (isExpanded ? ' expanded' : '') + '" data-author="' + author + '">';
      html += '<div class="author-name-text' + (isExpanded ? ' active' : '') + '">' + author + '</div>';
      html += '<div class="author-name-meta">';
      html += '<span class="author-issue-count">' + issues.length + ' issue' + (issues.length !== 1 ? 's' : '') + '</span>';
      html += '<span class="author-chevron' + (isExpanded ? ' open' : '') + '">▼</span>';
      html += '</div></div>';

      if (isExpanded) {
        html += '<div class="author-panel">';
        issues.forEach(function(issue) {
          var contents = issue.title + ': ' + issue.author;
          if (issue.subtitle) contents += '<br>' + issue.subtitle;
          html += '<div class="author-issue-row" data-pdf="' + issue.pdf + '">';
          html += '<div>';
          html += '<div class="author-issue-date">' + issue.month + ' ' + issue.year + '</div>';
          html += '<div class="author-issue-title">' + contents + '</div>';
          html += '</div>';
          html += '<div class="author-issue-dl">PDF ↓</div>';
          html += '</div>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });

  page.innerHTML = html;

  // Add click handlers for author rows
  page.querySelectorAll('.author-name-row').forEach(function(row) {
    row.addEventListener('click', function() {
      var author = this.getAttribute('data-author');
      renderAuthors(expandAuthor === author ? null : author);
    });
  });

  // Hover effect
  page.querySelectorAll('.author-name-row').forEach(function(row) {
    row.addEventListener('mouseenter', function() { this.style.background = '#f0f6ff'; });
    row.addEventListener('mouseleave', function() { this.style.background = ''; });
  });
}

// BROWSE
function renderBrowse() {
  var years = [];
  ISSUES.forEach(function(i) { if (years.indexOf(i.year) === -1) years.push(i.year); });
  years.sort(function(a,b) { return b-a; });

  // Jump bar
  var jumpHtml = '<div class="year-jump-bar" id="year-jump-bar">';
  years.forEach(function(y) {
    jumpHtml += '<button class="year-jump-btn" onclick="jumpToYear(' + y + ')">' + y + '</button>';
  });
  jumpHtml += '</div>';

  // Year sections — most recent year open, rest collapsed
  var sectionsHtml = '';
  years.forEach(function(y, idx) {
    var issues = ISSUES.filter(function(i) { return i.year === y; });
    var collapsed = idx > 0 ? ' collapsed' : '';
    sectionsHtml += '<div class="year-section' + collapsed + '" id="year-' + y + '">'
      + '<div class="year-label" onclick="toggleYear(' + y + ')">'
      + '<span class="year-label-text">' + y + '<span class="year-issue-count">' + issues.length + ' issue' + (issues.length !== 1 ? 's' : '') + '</span></span>'
      + '<span class="year-chevron">▼</span>'
      + '</div>'
      + '<div class="year-items">' + makeItems(issues, '', false) + '</div>'
      + '</div>';
  });

  document.getElementById('page-browse').innerHTML = jumpHtml + sectionsHtml;
}

function toggleYear(y) {
  var section = document.getElementById('year-' + y);
  if (!section) return;
  section.classList.toggle('collapsed');
  // Update jump bar active state
  var btns = document.querySelectorAll('.year-jump-btn');
  btns.forEach(function(btn) { btn.classList.remove('active'); });
  if (!section.classList.contains('collapsed')) {
    var active = document.querySelector('.year-jump-btn[onclick="jumpToYear(' + y + ')"]');
    if (active) active.classList.add('active');
  }
}

function jumpToYear(y) {
  var section = document.getElementById('year-' + y);
  if (!section) return;
  // Collapse all, open this one
  document.querySelectorAll('.year-section').forEach(function(s) { s.classList.add('collapsed'); });
  section.classList.remove('collapsed');
  // Scroll to it (offset for sticky jump bar)
  var bar = document.getElementById('year-jump-bar');
  var barH = bar ? bar.offsetHeight : 0;
  var top = section.getBoundingClientRect().top + window.pageYOffset - barH - 8;
  window.scrollTo({ top: top, behavior: 'smooth' });
  // Update jump bar highlight
  document.querySelectorAll('.year-jump-btn').forEach(function(btn) { btn.classList.remove('active'); });
  var active = document.querySelector('.year-jump-btn[onclick="jumpToYear(' + y + ')"]');
  if (active) active.classList.add('active');
}

// TOPICS
function renderTopics(filterTopic) {
  var page = document.getElementById('page-topics');
  if (!filterTopic) {
    var topics = [];
    ISSUES.forEach(function(i) {
      (i.topics||[]).forEach(function(t) { if (topics.indexOf(t) === -1) topics.push(t); });
    });
    topics.sort();
    var html = '<div class="topic-grid">';
    topics.forEach(function(t) {
      var count = ISSUES.filter(function(i) { return (i.topics||[]).indexOf(t) !== -1; }).length;
      html += '<button class="topic-btn" data-topic="' + t + '">';
      html += '<div class="topic-name">' + t + '</div>';
      html += '<div class="topic-count">' + count + ' issue' + (count !== 1 ? 's' : '') + '</div>';
      html += '</button>';
    });
    html += '</div>';
    page.innerHTML = html;
  } else {
    var filtered = ISSUES.filter(function(i) { return (i.topics||[]).indexOf(filterTopic) !== -1; });
    var html = '<div class="topic-filter-header">';
    html += '<div class="topic-filter-title">Topic: <span>' + filterTopic + '</span></div>';
    html += '<button class="topic-clear" id="topicClearBtn">← All Topics</button>';
    html += '</div>';
    html += makeItems(filtered, '', false);
    page.innerHTML = html;
    document.getElementById('topicClearBtn').addEventListener('click', function() { renderTopics(null); });
  }
}

// SEARCH
function clearSearch() {
  var input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('searchClear').classList.remove('visible');
  document.getElementById('nav-search').style.display = 'none';
  showPage('browse');
  input.focus();
}

function doSearch() {
  var q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  var words = q.toLowerCase().split(/\s+/).filter(Boolean);
  var results = ISSUES.filter(function(i) {
    var haystack = (i.title + ' ' + i.author + ' ' + (i.subtitle||'') + ' ' + (i.excerpt||'') + ' ' + i.month + ' ' + i.year + ' ' + (i.topics||[]).join(' ') + ' ' + (i.articleText||'')).toLowerCase();
    return words.every(function(w) { return haystack.indexOf(w) !== -1; });
  });
  var btn = document.getElementById('nav-search');
  btn.style.display = 'block';
  btn.textContent = 'Search Results';
  var html = '<div class="results-header">';
  html += results.length > 0
    ? '<b>' + results.length + '</b> result' + (results.length !== 1 ? 's' : '') + ' for \"<b>' + q + '</b>\"'
    : 'No results for \"<b>' + q + '</b>\"';
  html += '</div>';
  html += results.length > 0 ? makeItems(results, q, true) : '<div class="no-results">Try a different keyword</div>';
  document.getElementById('page-search').innerHTML = html;
  showPage('search');
}

// NAV
function showPage(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  var navEl = document.getElementById('nav-' + name); if (navEl) navEl.classList.add('active');
}

document.getElementById('searchInput').addEventListener('input', function() {
  document.getElementById('searchClear').classList.toggle('visible', this.value.length > 0);
});
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});
